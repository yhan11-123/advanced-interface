<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Print &middot; Week 09 sketch</title>
  <!-- Print, after the user's reference: a riso / copier print on off-white paper. Lines of small
       typewriter text, and blocks of ink smeared sideways: scanlines, halftone dots at the edges,
       colour layers slightly out of register. Each place has its own ink: black, red, green, orange, blue.
       (User's idea: each colour is a different button; hovering and clicking shows paint texture
       motion that brings out the button's colour.)
       Motion:
       - hover: a test print. A few dry streaks touch the paper and stop short, light and broken
       - press: the ink pushes further and a misregistered pink layer shifts off to the side
       - click: the full print. Every scanline runs out at its own speed, left to right, the core packs
         into a solid block, the leading edge breaks into dashes and halftone dots, and the off-register
         layer slides back into line as the ink settles
       - the old place's ink lifts off but leaves a faint ghost, the way a print keeps its trace
       - the sidebar is the typewriter index, each entry with its ink block beside it; folded to a
         rail only the index letter and a small block stay. The tab bar is the scanline band across
         the page, one ink cell per place. -->
  <link rel="stylesheet" href="week-09-sketch.css" />
  <style>
    body { background: #eae6dc; font-family: "Courier New", Courier, ui-monospace, monospace; }
    :root { --paper: #efebe1; --ink: #161514; --type: #2c2a27; }
    .stage { background: var(--paper) radial-gradient(rgba(0,0,0,.035) .6px, transparent .9px) 0 0 / 3px 3px; }
    .ink { position: absolute; display: block; pointer-events: none; }
    .item { position: relative; color: var(--type); }
    .item:focus-visible { outline: 1px dashed var(--type); outline-offset: 3px; }

    /* sidebar: the typewriter index */
    .side { position: absolute; left: 22px; top: 22px; bottom: 22px; width: 300px; padding: 6px 10px; overflow: hidden; transition: width .36s var(--spatial); }
    .stage[data-side="open"] .side { transition: width .52s var(--spatial); }
    .stage[data-side="rail"] .side { width: 112px; }
    .top { display: flex; align-items: center; justify-content: space-between; height: 30px; font-size: 11px; white-space: nowrap; }
    .top > span { transition: opacity .15s; }
    .stage[data-side="rail"] .top > span { opacity: 0; width: 0; overflow: hidden; }
    .fold { display: grid; place-items: center; width: 28px; height: 28px; color: var(--type); font-size: 13px; transition: scale .3s var(--fast); }
    .fold:active { scale: .85; transition: scale .06s; }
    .fold [data-i] { width: 16px; height: 16px; transition: rotate .45s var(--fast); }
    .fold [data-i] svg { stroke-width: 1.3; }
    .stage[data-side="rail"] .fold [data-i] { rotate: 180deg; }
    .side h4 { margin: 16px 0 6px; font-size: 11px; font-weight: 400; letter-spacing: .02em; color: #6d6a63; white-space: nowrap; }
    .row { display: grid; grid-template-columns: 22px 84px 1fr 44px; align-items: center; height: 38px; font-size: 12px; white-space: nowrap; }
    .stage[data-side="rail"] .row { grid-template-columns: 22px 0 1fr 0; }
    .row .n { color: #6d6a63; }
    .row .lbl { overflow: hidden; transition: opacity .2s .1s; }
    .row[aria-current="page"] .lbl { font-weight: 700; }
    .row .well { position: relative; height: 26px; }
    .row .well .ink { inset: 0; width: 100%; height: 100%; }
    .row .trail { justify-self: end; font-size: 10px; color: #6d6a63; overflow: hidden; transition: opacity .2s .14s; }
    .stage[data-side="rail"] .row .lbl, .stage[data-side="rail"] .trail { opacity: 0; transition: opacity .1s; }
    .stage[data-side="rail"] .side h4 { color: transparent; }

    /* main: a page of type, the scanline band at the bottom */
    .main { position: absolute; left: 350px; right: 24px; top: 26px; bottom: 22px; transition: left .52s var(--spatial); }
    .stage[data-side="rail"] .main { left: 152px; transition: left .36s var(--spatial); }
    .view { font-size: 12px; color: var(--type); }
    .view b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 8px; }
    .garble { margin: 0; font-size: 10px; line-height: 1.35; color: #4b4842; white-space: pre; overflow: hidden; }
    .tabs { position: absolute; left: -10px; right: -10px; bottom: 0; height: 92px; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 6px;
      background: repeating-linear-gradient(180deg, rgba(40,38,34,.13) 0 1px, transparent 1px 4px) 0 8px / 100% 54px no-repeat; }
    .tab { display: grid; justify-items: center; gap: 8px; width: 92px; font-size: 11px; }
    .tab .cell { position: relative; width: 84px; height: 46px; }
    .tab .cell .ink { inset: 0; width: 100%; height: 100%; }
    .tab[aria-current="page"] .lbl { font-weight: 700; }
    .tb-badge { margin-left: 3px; color: #6d6a63; }
  </style>
</head>
<body>
  <div class="stage" data-side="open">
    <nav class="side" id="side" aria-label="Sidebar">
      <div class="top"><span>index ( 5 ) &nbsp;&nbsp;19 . 11 . 26</span><button type="button" class="fold" data-fold aria-controls="side"><span data-i="chevron"></span></button></div>
      <h4>1.&nbsp; reports &nbsp;( 3 )</h4>
      <ul>
        <li><a class="item row" href="#summary" data-place="summary" data-ink="#161514" aria-current="page"><span class="n">a.</span><span class="lbl">summary</span><span class="well"><canvas class="ink"></canvas></span><span></span></a></li>
        <li><a class="item row" href="#signals" data-place="signals" data-ink="#f03a3e"><span class="n">b.</span><span class="lbl">signals</span><span class="well"><canvas class="ink"></canvas></span><span class="trail"><span class="t-badge" aria-label="12 new">[12]</span><span class="t-icon" aria-label="rising">&nearr;</span><span class="t-text">12 new</span></span></a></li>
        <li><a class="item row" href="#growth" data-place="growth" data-ink="#1ea84a"><span class="n">c.</span><span class="lbl">growth</span><span class="well"><canvas class="ink"></canvas></span><span></span></a></li>
      </ul>
      <h4>2.&nbsp; layers &nbsp;( 2 )</h4>
      <ul>
        <li><a class="item row" href="#heat" data-place="heat" data-ink="#ff6a14"><span class="n">d.</span><span class="lbl">heat</span><span class="well"><canvas class="ink"></canvas></span><span class="trail"><span class="t-badge" aria-label="3 alerts">[03]</span><span class="t-icon" aria-label="warning">&#x2732;</span><span class="t-text">3 hot</span></span></a></li>
        <li><a class="item row" href="#depth" data-place="depth" data-ink="#1265c9"><span class="n">e.</span><span class="lbl">depth</span><span class="well"><canvas class="ink"></canvas></span><span></span></a></li>
      </ul>
    </nav>

    <div class="main">
      <div class="view" aria-live="polite"><b>summary</b></div>
      <pre class="garble" aria-hidden="true"></pre>
      <nav class="tabs" aria-label="Tab bar">
        <a class="item tab" href="#summary" data-place="summary" data-ink="#161514" aria-current="page"><span class="cell"><canvas class="ink"></canvas></span><span><span class="lbl">summary</span></span></a>
        <a class="item tab" href="#signals" data-place="signals" data-ink="#f03a3e"><span class="cell"><canvas class="ink"></canvas></span><span><span class="lbl">signals</span><span class="tb-badge" aria-label="12 new">[12]</span></span></a>
        <a class="item tab" href="#growth" data-place="growth" data-ink="#1ea84a"><span class="cell"><canvas class="ink"></canvas></span><span><span class="lbl">growth</span></span></a>
        <a class="item tab" href="#heat" data-place="heat" data-ink="#ff6a14"><span class="cell"><canvas class="ink"></canvas></span><span><span class="lbl">heat</span><span class="tb-badge" aria-label="3 alerts">[03]</span></span></a>
        <a class="item tab" href="#depth" data-place="depth" data-ink="#1265c9"><span class="cell"><canvas class="ink"></canvas></span><span><span class="lbl">depth</span></span></a>
      </nav>
    </div>
  </div>

  <script src="week-09-sketch.js"></script>
  <script>
    (() => {
      // seeded noise, so each block keeps its own grain from frame to frame
      const h = (x, y, s) => { const v = Math.sin(x * 12.9898 + y * 78.233 + s * 37.719) * 43758.5453; return v - Math.floor(v); };
      const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
      const PINK = [244, 150, 178];

      const items = [...document.querySelectorAll('.item')].map((el, i) => ({
        el, cv: el.querySelector('canvas.ink'), col: hex(el.dataset.ink), seed: i * 7.31 + 1.7, dark: el.dataset.ink === '#161514',
        p: { x: 0, v: 0 }, reg: { x: 0, v: 0 }, hover: false, down: false, ghost: false, drawn: -1,
      }));

      // one print of a block at progress p (0 bare paper, ~.3 test streaks, 1 full block), off-register by reg px
      const draw = it => {
        const cv = it.cv, dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
        if (!W || !H) return;
        if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
        const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
        const p = Math.max(0, it.p.x), s = it.seed, [r, gg, b] = it.col, rows = Math.floor(H / 2);
        // ghost of an old print
        if (it.ghost && p < .2) { g.fillStyle = `rgba(${r},${gg},${b},.07)`; for (let y = 0; y < rows; y++) if (h(1, y, s) > .25) g.fillRect(0, y * 2, W * (.45 + .4 * h(2, y, s)), 1.4); }
        if (p < .005) return;
        const off = it.reg.x;
        const tint = it.dark ? PINK : [Math.min(255, r + 100), Math.min(255, gg + 100), Math.min(255, b + 100)];
        // how far the longest row reaches, for the haze
        let far = 0;
        const row = y => {
          const speed = .7 + .7 * h(3, y, s), delay = .22 * h(4, y, s), core = .5 + .45 * h(5, y, s), start = 4 * h(11, y, s) * h(12, y, s);
          const reach = Math.max(0, Math.min(1, (p - delay) * speed * 1.45));
          const len = (W - start) * reach * (.8 + .2 * h(6, y, s));
          return { start, len, core, ink: .72 + .28 * h(13, y, s) };
        };
        for (let y = 0; y < rows; y++) far = Math.max(far, row(y).start + row(y).len);
        // a soft haze of the off-register colour round the block, like ink bleeding into the paper
        g.save(); g.filter = 'blur(3px)'; g.fillStyle = `rgba(${tint},${(.22 * Math.min(1, p * 1.4)).toFixed(3)})`;
        g.fillRect(off - 2, 1 + off * .3, far * 1.04 + 4, H - 2); g.restore();
        for (let pass = 0; pass < 2; pass++) {
          const isReg = pass === 0, dx = isReg ? off : 0, dy = isReg ? off * .35 : 0;
          for (let y = 0; y < rows; y++) {
            const { start, len, core, ink } = row(y);
            if (len < 1) continue;
            const yy = y * 2 + dy;
            g.fillStyle = `rgba(${isReg ? tint : [r, gg, b]},${isReg ? .35 : ink.toFixed(2)})`;
            // solid core packed tight, broken now and then by a dry gap
            const coreLen = len * core;
            g.fillRect(dx + start, yy, coreLen, 1.9);
            if (isReg) continue;
            if (h(7, y, s) > .78) g.clearRect(dx + start + coreLen * h(8, y, s), yy, 2 + 7 * h(9, y, s), 1.9);
            // the leading edge: dashes thinning out
            for (let x = coreLen; x < len; x += 2) {
              const n = h(x * .37, y, s), fade = 1 - (x - coreLen) / Math.max(1, len - coreLen);
              if (n < fade * .9) { g.fillStyle = `rgba(${r},${gg},${b},${(.3 + .55 * fade).toFixed(2)})`; g.fillRect(dx + start + x, yy, 1 + (n > .55 ? 1 : 0), 1.9); }
            }
            // halftone dots just past the edge, and stray colour specks in black ink
            for (let k = 0; k < 4; k++) {
              const x = start + len + 2 + 16 * h(10 + k, y, s);
              if (h(20 + k, y, s) < .5 * p && x < W) { g.fillStyle = `rgba(${r},${gg},${b},.45)`; g.fillRect(dx + x, yy, 1.2, 1.2); }
              if (it.dark && k < 3 && h(30 + k, y, s) < .14 * p) { g.fillStyle = ['rgba(240,58,62,.65)', 'rgba(255,106,20,.65)', 'rgba(18,101,201,.55)'][k]; g.fillRect(dx + start + len * h(40 + k, y, s), yy, 2 + 3 * h(50 + k, y, s), 1.9); }
            }
          }
        }
      };

      N.loop(dt => {
        let moving = false;
        for (const it of items) {
          const on = it.el.hasAttribute('aria-current');
          const target = on ? 1 : it.down ? .48 : it.hover ? .3 : 0;
          const regT = on && !it.down ? 0 : it.down ? 7 : it.hover ? 3 : 0;
          if (N.calm.matches) { it.p.x = target; it.reg.x = regT; it.p.v = it.reg.v = 0; }
          else {
            // ink spreads slowly and never overshoots; lifting off is quicker
            const m1 = N.spring(it.p, target, target > it.p.x ? 46 : 120, 1, dt);
            const m2 = N.spring(it.reg, regT, 90, .55, dt);
            if (m1 || m2) moving = true;
          }
          const key = it.p.x.toFixed(3) + it.reg.x.toFixed(2) + it.ghost + it.cv.clientWidth;
          if (key !== it.drawn) { draw(it); it.drawn = key; }
        }
        return moving;
      });

      items.forEach(it => {
        it.el.addEventListener('pointerenter', () => { it.hover = true; N.wake(); });
        it.el.addEventListener('pointerleave', () => { it.hover = false; it.down = false; N.wake(); });
        it.el.addEventListener('pointerdown', () => { it.down = true; N.wake(); });
      });
      addEventListener('pointerup', () => { items.forEach(it => it.down = false); N.wake(); });

      // the page of type: garbled lines, re-set for each place
      const garble = document.querySelector('.garble');
      const line = (n, s) => [...Array(n)].map((_, i) => 'abcdeiklmnorstuy  .,;:()[]{}=+-/'[Math.floor(h(i, s, 3) * 32)]).join('');
      const page = place => [...Array(7)].map((_, i) => (i % 3 === 0 ? `${i / 3 + 1}.   ` : '     ') + line(28 + Math.floor(h(i, place.length, 9) * 24), i + place.length * 3)).join('\n');

      N.init({
        names: { summary: 'summary', signals: 'signals', growth: 'growth', heat: 'heat', depth: 'depth' },
        onPick(place, prev, animate) {
          items.forEach(it => { if (it.el.dataset.place === prev) it.ghost = true; if (it.el.dataset.place === place) it.ghost = false; });
          garble.textContent = page(place);
        },
      });
      // the first print is already on the paper
      items.forEach(it => { if (it.el.hasAttribute('aria-current')) { it.p.x = 1; } });
      new ResizeObserver(() => N.wake(600)).observe(document.getElementById('side'));
    })();
  </script>
</body>
</html>
