<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 &middot; Serene, determinate</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A prototype page of its own, so its styles stay in this file.
     Soft and pale, the same in either scheme. */
  :root {
    --bg: #eef4f6;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Serene, determinate. The same stems, in the same depth and colours, held
  // in an unseen frame. They start at the foot of the frame and grow as the work
  // loads, so how high they stand in the frame is how much has loaded.
  // Half way, the rows and ripples are at their fullest; nearing the end
  // they draw level, and at 100% every stem touches the top of the frame.
  (() => {
    // ---------- colour: cool water blues, pale sky at the back, deep at the front ----------
    const BG = '#eef4f6';
    const BACK = ['#d6ebf2', '#a3cadc'];    // back row: tip, foot
    const FRONT = ['#7fcad6', '#1c6c98'];   // front row: tip, foot, teal into blue
    const SHADE = '18, 62, 96';             // the odd darker stem

    // ---------- the field, as in the Reeds sketch ----------
    const ROWS = 7;             // rows of stems, back to front
    const TOP = 0.2;            // where the back row stands, share of the frame's height
    const GAP = 0.1;            // step down to each nearer row
    const BAR = [2.5, 6];       // stem width at 1000px wide, back row to front row
    const BLUR = 0.5;           // the stems run together inside the frame, softened by this share of a middle stem's width; the frame's edge stays crisp
    const TALL = [0.06, 0.3];   // stem height range, share of the frame's height (front row)
    const RAGGED = 0.22;        // uneven tips
    const WAVES = [             // [length, speed per second, weight], lengths in 1000ths of the frame's width
      [520, -150, 0.6],
      [210, 90, 0.28],
      [95, -60, 0.12],
    ];
    const ROW_LAG = 0.8;        // each row runs this far behind the one in front, radians

    // ---------- the frame ----------
    const SIZE = window.self === window.top ? 0.45 : 0.9;   // share of the width
    const RATIO = 0.62;                                     // height / width
    const ROUND = 10;                                       // corner radius, px

    // ---------- timing ----------
    const EMPTY = 1, RUN = 18, HOLD = 1.8, FADE = 0.9;

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    // the field is drawn small, on its own canvas, then laid back at full
    // size: scaling up smooths the stems into each other. It is laid inside
    // the frame's outline drawn at full size, so the edge stays crisp.
    const soft = document.createElement('canvas'), sctx = soft.getContext('2d');
    let shrink = 1;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let W = 0, H = 0, box = null, rows = [];

    const mix = (a, b, k) => {
      const p = s => [0, 2, 4].map(i => parseInt(s.slice(1 + i, 3 + i), 16));
      const A = p(a), B = p(b);
      return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k))})`;
    };

    function layout() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = Math.min(W * SIZE, H * 0.9 / RATIO), h = w * RATIO;
      box = { x: (W - w) / 2, y: (H - h) / 2, w, h };

      // Each row: its baseline, stem width, a colour ramp, and stems with a
      // fixed ragged offset and shade so the field never looks combed.
      const scalePx = Math.max(0.6, w / 1000);
      shrink = Math.max(1.5, (BAR[0] + BAR[1]) / 2 * scalePx * 1.6 * BLUR);   // how much smaller the field is drawn, in CSS px per pixel
      soft.width = Math.ceil(W / shrink); soft.height = Math.ceil(H / shrink);
      sctx.setTransform(1 / shrink, 0, 0, 1 / shrink, 0, 0);
      rows = Array.from({ length: ROWS }, (_, i) => {
        const k = i / (ROWS - 1);
        const bw = Math.max(1.5, (BAR[0] + (BAR[1] - BAR[0]) * k) * scalePx * 1.6);
        const base = TOP + GAP * i;                        // share of the frame's height
        const scale = 0.55 + 0.45 * k;                     // nearer rows stand taller
        const off = (i * 0.37 % 1) * bw;                   // rows sit out of line with each other
        const bars = [];
        for (let x = -off; x < w + bw; x += bw) bars.push({ x, rag: Math.random() * 2 - 1, shade: Math.random() * 0.22 });
        return { k, base, bw, scale, bars, lag: (ROWS - 1 - i) * ROW_LAG, tip: mix(BACK[0], FRONT[0], k), foot: mix(BACK[1], FRONT[1], k) };
      });
    }

    function wave(x, t, lag) {
      let v = 0;
      for (const [len, speed, weight] of WAVES) {
        v += weight * Math.sin((x / box.w * 1000 - speed * t) / len * Math.PI * 2 - lag);
      }
      return 0.5 + 0.5 * v;                                // 0 to 1
    }

    // The field inside the frame, raised by `rise` (0 sunk out of sight below
    // the frame, 1 standing full height) and faded by `alpha`.
    function field(t, rise, alpha) {
      const { x: bx, y: by, w: bw, h: bh } = box;
      sctx.save();
      sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.clearRect(0, 0, soft.width, soft.height);
      sctx.restore();
      const sink = 0, foot = by + bh;
      // how far the rows and ripples stray from the common level: none at the
      // start or the end, most in the middle
      const stray = 4 * rise * (1 - rise);
      for (const row of rows) {
        const g = sctx.createLinearGradient(0, by, 0, foot);
        g.addColorStop(0, row.tip); g.addColorStop(1, row.foot);
        const level = foot - rise * bh - 4 * shrink * rise ** 6;   // at the end a hair past the top, so the top edge stays crisp
        const tops = row.bars.map(b => {
          const ripple = (wave(b.x, t, row.lag) - 0.5) * 0.22 + RAGGED * b.rag * 0.12 - (1 - row.k) * 0.34;   // back rows stand clearly taller than the front
          return Math.max(by - 4 * shrink, Math.min(foot, level + stray * ripple * bh));
        });
        // stems with rounded tips, all of one row in one fill
        sctx.fillStyle = g;
        sctx.beginPath();
        row.bars.forEach((b, i) => sctx.roundRect(bx + b.x, tops[i], row.bw - 0.4, by + bh + sink - tops[i] + 2 + 4 * shrink, [row.bw / 2, row.bw / 2, 0, 0]));
        sctx.fill();
        // the odd darker stem
        row.bars.forEach((b, i) => {
          if (b.shade <= 0.12) return;
          sctx.fillStyle = `rgba(${SHADE}, ${b.shade * 0.6})`;
          sctx.beginPath(); sctx.roundRect(bx + b.x, tops[i], row.bw - 0.4, by + bh + sink - tops[i] + 2 + 4 * shrink, [row.bw / 2, row.bw / 2, 0, 0]); sctx.fill();
        });
      }
      // back at full size, smoothed, inside the frame's crisp outline
      ctx.save();
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, ROUND); ctx.clip();
      ctx.globalAlpha = alpha;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(soft, 0, 0, soft.width * shrink, soft.height * shrink);
      ctx.restore();
    }


    // quick at first, slower in the middle, a small stall, then the finish
    function fake(x) {
      return x < 0.55 ? 0.7 * Math.sin((x / 0.55) * Math.PI / 2)
           : x < 0.7 ? 0.7 + (x - 0.55) * 0.2
           : 0.73 + 0.27 * ((x - 0.7) / 0.3) ** 1.4;
    }

    // ?state=0, ?state=progress or ?state=done holds one state still, for
    // taking the frames for the Figma drawings
    const HELD = { '0': 0, progress: 0.55, done: 1 }[new URLSearchParams(location.search).get('state')];
    const stage = document.querySelector('.stage');
    let t0 = performance.now(), shown = -1;

    function frame(now) {
      let s = (now - t0) / 1000;
      if (s > EMPTY + RUN + HOLD + FADE) { t0 = now; s = 0; }
      const t = reduce.matches ? 0 : now / 1000;
      let p = 0, alpha = 1;
      if (HELD !== undefined) p = HELD;
      else if (reduce.matches) p = 1;
      else if (s < EMPTY) p = 0;
      else if (s < EMPTY + RUN) p = fake((s - EMPTY) / RUN);
      else { p = 1; alpha = 1 - Math.max(0, (s - EMPTY - RUN - HOLD) / FADE); }

      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);
      field(t, p, alpha);

      const pct = Math.round(p * 100);
      if (pct !== shown) { shown = pct; stage.setAttribute('aria-valuenow', pct); }
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
