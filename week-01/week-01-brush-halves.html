<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Brush halves loader</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file.
     White dry-brush on black, the same in either scheme. */
  :root {
    --bg: #000000;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Brush halves. Two dry-brush circles like Brush ring, each centred on a
  // side edge of the screen so only its inner half shows. Both turn
  // together the same way, ease to a stop, and turn back the other way,
  // again and again.
  (() => {
    const BG = '#000000';
    const INK = '#ffffff';

    const RADIUS = 0.42;          // ring radius, share of the screen height
    const SPREAD = 0.1;           // how far strokes stray from the circle, share of the radius
    const STROKES = 46;           // brush strokes round the ring
    const FLECKS = 500;           // specks thrown off the strokes
    const SWING = 0.6;            // turns in each direction
    const PERIOD = 2.2;           // seconds for each swing

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    // each ring painted once, with its own strokes and its own heavy side
    const rings = [
      { tex: document.createElement('canvas'), heavy: -Math.PI / 5 },     // left
      { tex: document.createElement('canvas'), heavy: Math.PI * 0.8 },    // right
    ];
    let W = 0, H = 0, dpr = 1, R = 0;

    const rand = (a, b) => a + Math.random() * (b - a);
    const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

    function paint(tex, heavy) {
      // how hard the brush presses at angle a: heavy on one side, faint opposite
      const press = a => 0.25 + 0.75 * (0.5 + 0.5 * Math.cos(a - heavy)) ** 1.5;
      const size = Math.ceil(R * 2 * (1 + SPREAD * 3) + 20);
      tex.width = tex.height = Math.ceil(size * dpr);
      const g = tex.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, size, size);
      g.fillStyle = g.strokeStyle = INK;
      g.lineCap = 'round';
      const c = size / 2;

      for (let s = 0; s < STROKES; s++) {
        const r = R * (1 + SPREAD * gauss());
        const start = rand(0, Math.PI * 2), span = rand(0.15, 2.6);
        const weight = rand(0.35, 1) ** 2.2 * R * 0.05;   // most strokes thin, a few heavy
        const steps = Math.ceil(span * r / 5);             // chunky pieces
        let wob = rand(0, 10);
        for (let i = 0; i < steps; i++) {
          const a = start + span * i / steps, a2 = start + span * (i + 1) / steps;
          // dry brush: the bristles skip, so the stroke breaks up where pressure is low
          const p = press(a) * (0.6 + 0.4 * Math.sin(a * 7 + wob));
          if (Math.random() > 0.1 + 0.8 * p) continue;
          wob += rand(-0.2, 0.2);
          const rr = r + R * 0.004 * Math.sin(a * 23 + wob);
          g.lineWidth = Math.max(0.4, weight * p * rand(0.5, 1.3));
          g.globalAlpha = Math.min(1, 0.35 + p);
          g.beginPath();
          g.moveTo(c + Math.cos(a) * rr, c + Math.sin(a) * rr);
          g.lineTo(c + Math.cos(a2) * rr, c + Math.sin(a2) * rr);
          g.stroke();
        }
      }
      // flecks thrown off the strokes, thickest where the brush pressed
      for (let i = 0; i < FLECKS; i++) {
        const a = rand(0, Math.PI * 2);
        if (Math.random() > press(a)) continue;
        const r = R * (1 + SPREAD * 1.6 * gauss());
        g.globalAlpha = rand(0.4, 1);
        g.beginPath();
        g.arc(c + Math.cos(a) * r, c + Math.sin(a) * r, rand(0.3, 1) ** 2 * 2.6, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
    }

    function layout() {
      const r = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      R = RADIUS * H;
      rings.forEach(r => paint(r.tex, r.heavy));
    }

    // Swing one way, ease to a stop, swing back, each swing an ease in and out.
    function angle(s) {
      const k = s / PERIOD, n = Math.floor(k), u = k - n;
      const ease = u < 0.5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
      const from = n % 2 ? SWING : 0, to = n % 2 ? 0 : SWING;
      return (from + (to - from) * ease) * Math.PI * 2;
    }

    function frame(now) {
      const s = reduce.matches ? 0 : now / 1000;
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);
      rings.forEach((r, i) => {
        const size = r.tex.width / dpr;
        ctx.save();
        ctx.translate(i ? W : 0, H / 2);                  // centred on the left edge, then the right
        ctx.rotate(angle(s));                             // both the same way
        ctx.drawImage(r.tex, -size / 2, -size / 2, size, size);
        ctx.restore();
      });
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
