<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Rally loader</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #fbfaf7;
    --ink: #1a1a1a;
    --muted: #77756e;
    --track: #d6d3ca;
    --accent: #2b47ff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1c;
      --ink: #ededea;
      --muted: #9a9a94;
      --track: #3a3936;
      --accent: #8fa0ff;
    }
  }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  .stage { position: relative; flex: 1; min-height: 120px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .status {
    margin: 0; padding: 0 16px 14px; text-align: center;
    font-size: 13px; color: var(--muted); letter-spacing: .02em;
  }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading" aria-valuetext="Loading">
    <canvas aria-hidden="true"></canvas>
  </div>
  <p class="status">Loading</p>

  <script>
  // First person, standing at the baseline. A ball rallies with you: every
  // return comes straight down the middle to you, every shot you hit goes
  // away to the far left, then the far right, alternating. Plain perspective
  // projection (screen = f * world / depth) is what makes it feel 3D: the
  // ball grows as it nears, shrinks and slows as it leaves, and its shadow
  // on the ground tells you where it is in depth.
  (() => {
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');

    const LEG = 0.85;          // seconds for one flight, either direction
    const BALL = 0.1;          // ball radius, world units
    const EYE = 1.5;           // camera height above the court
    const NET_Z = 4.2, NET_H = 0.3;
    const NET_HALF = 1.75;     // half the net's width

    // Where the ball turns around: you hit it at NEAR, the other side at FAR.
    const NEAR = { x: 0, y: 1, z: 1.2 };
    const FAR = [{ x: -1.3, y: 0.35, z: 7.4 }, { x: 1.3, y: 0.35, z: 7.4 }];
    const ARC = 0.5;           // extra height at the top of each flight

    let W = 0, H = 0, f = 0, horizon = 0, colors = {};

    function readColors() {
      const st = getComputedStyle(document.documentElement);
      colors = {
        line: st.getPropertyValue('--track').trim(),
        ball: st.getPropertyValue('--accent').trim(),
        ink: st.getPropertyValue('--ink').trim(),
      };
    }

    function layout() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      f = Math.min(W, H * 1.4) * 0.8;                // focal length in px
      horizon = H * 0.22;
    }

    // world (x right, y up from the court, z away from you) -> screen
    const project = (x, y, z) => ({ x: W / 2 + (f * x) / z, y: horizon + (f * (EYE - y)) / z, s: f / z });

    // Ball position at time t. Legs alternate: away-left, back, away-right, back.
    function ballAt(t) {
      const leg = Math.floor(t / LEG), k = (t % LEG) / LEG;
      const far = FAR[Math.floor(leg / 2) % 2];
      const [a, b] = leg % 2 === 0 ? [NEAR, far] : [far, NEAR];
      return {
        x: a.x + (b.x - a.x) * k,
        y: a.y + (b.y - a.y) * k + ARC * 4 * k * (1 - k),
        z: a.z + (b.z - a.z) * k,
      };
    }

    function drawNet() {
      const l = project(-NET_HALF, 0, NET_Z), r = project(NET_HALF, 0, NET_Z);
      const top = project(0, NET_H, NET_Z).y;
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = colors.line;
      ctx.fillRect(l.x, top, r.x - l.x, l.y - top);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = colors.line;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(l.x, top); ctx.lineTo(r.x, top); ctx.stroke();
    }

    function drawBall(b) {
      // shadow straight below on the court, softer the higher the ball is
      const sh = project(b.x, 0, b.z);
      ctx.save();
      ctx.globalAlpha = Math.max(0.05, 0.28 - b.y * 0.1);
      ctx.fillStyle = colors.ink;
      ctx.beginPath();
      ctx.ellipse(sh.x, sh.y, BALL * sh.s * 1.1, BALL * sh.s * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // the ball, lit from the upper left so it reads as round
      const p = project(b.x, b.y, b.z), r = BALL * p.s;
      const g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.4, r * 0.1, p.x, p.y, r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.25, colors.ball);
      g.addColorStop(1, colors.ball);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      const b = ballAt(t);
      if (b.z > NET_Z) { drawBall(b); drawNet(); }   // behind the net: net covers it
      else { drawNet(); drawBall(b); }
    }

    let raf = 0, t0 = 0;

    function frame(now) {
      draw(Math.max(0, now - t0) / 1000);
      raf = requestAnimationFrame(frame);
    }

    function start() {
      cancelAnimationFrame(raf);
      layout(); readColors();
      if (reduce.matches) {
        // Parked: the ball hangs at the top of its flight, mid-court.
        draw(LEG * 0.5);
        return;
      }
      t0 = performance.now();
      raf = requestAnimationFrame(frame);
    }

    new ResizeObserver(start).observe(canvas);
    reduce.addEventListener('change', start);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); if (reduce.matches) start(); });
  })();
  </script>

</body>
</html>
