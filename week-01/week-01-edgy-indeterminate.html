<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 &middot; Edgy, indeterminate</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A prototype page of its own, so its styles stay in this file.
     Stainless-steel panels on a black crack, the same in either scheme. */
  :root {
    --bg: #0d0d0d;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Edgy, indeterminate: the Crack sketch, in stainless steel. Four brushed
  // steel panels fill the screen, parted by two bold black cracks that cross
  // somewhere in the middle, where the panels' corners round off and the
  // crack pools. Each panel catches the light from its own side, its edges
  // bevelled bright, and a soft highlight drifts across them. While loading,
  // the cracks wander and tilt, and each of their four arms swells and
  // thins on its own, so every panel keeps changing its width and height
  // and the crossing darts about the screen. When loading is done,
  // the four panels fly off to the four corners, then come back to start again.
  (() => {
    const BG = '#0d0d0d';              // the crack
    const PANEL = '#c4c8cc';           // the steel's mid tone, until its grain is made
    const SHEEN = 6;                   // seconds for the highlight to cross the screen

    const GAP = [0.018, 0.055];         // each crack's width, thinnest to widest, share of the short side: bold
    const TAPER = 0.25;                // how much one arm of a crack differs from the other
    const ROUND = [0.01, 0.06];        // panel corners at the crossing, near sharp to very round, share of the short side
    const TILT = 0.9;                  // how far each crack's ends swing apart, share of the short side, so it leans up to about 30 degrees
    const WANDER = 0.24;               // how far the cracks stray from the middle, share of the screen
    const DRIFT = 1.4;                 // how quickly they wander

    const RUN = 7;                     // seconds of loading
    const EXIT = 0.9;                  // panels fly off
    const EMPTY = 0.5;                 // screen left to the crack
    const ENTER = 0.9;                 // panels come back

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const stage = document.querySelector('.stage');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let W = 0, H = 0, dpr = 1, grain = null;

    function layout() {
      const r = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      brush();
    }

    // Brushed stainless, one tile that wraps without a seam: each row a
    // little lighter or darker, streaks running slowly along it, fine grain,
    // cool in tone. Made once per screen density.
    function brush() {
      const w = 1024, h = 512, c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
      let a = 12345;
      const rnd = () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; };
      const K = Math.max(2, Math.round(w / (90 * dpr)));    // knots round a row, so it wraps
      for (let y = 0; y < h; y++) {
        const row = (rnd() - 0.5) * 22;
        const knots = Array.from({ length: K }, () => (rnd() - 0.5) * 16);
        for (let x = 0; x < w; x++) {
          const u = x / w * K, i = Math.floor(u), f = u - i, e = f * f * (3 - 2 * f);
          const b = 194 + row + knots[i % K] + (knots[(i + 1) % K] - knots[i % K]) * e + (rnd() - 0.5) * 9;
          const o = (y * w + x) * 4;
          d[o] = b - 6; d[o + 1] = b - 2; d[o + 2] = b + 3; d[o + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);
      grain = ctx.createPattern(c, 'repeat');
    }

    // A panel in steel: the brushed grain (carried along as the panel flies,
    // by dx, dy), a broad band of light from the panel's own side, the
    // drifting highlight, and a bright bevel just inside its edge.
    function steel(path, dx, dy, q, sheen) {
      if (grain) {
        grain.setTransform(new DOMMatrix().translate(dx, dy).scale(1 / dpr));
        ctx.fillStyle = grain;
      } else ctx.fillStyle = PANEL;
      ctx.fill(path);
      const a = [-2.3, -0.8, 0.8, 2.3][q], r = Math.hypot(W, H) * 0.5;
      const cx = W / 2 + dx, cy = H / 2 + dy;
      const band = ctx.createLinearGradient(cx - Math.cos(a) * r, cy - Math.sin(a) * r, cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      band.addColorStop(0, 'rgba(255,255,255,0.32)');
      band.addColorStop(0.45, 'rgba(255,255,255,0.04)');
      band.addColorStop(0.6, 'rgba(20,24,30,0.22)');
      band.addColorStop(1, 'rgba(20,24,30,0.08)');
      ctx.fillStyle = band; ctx.fill(path);
      ctx.fillStyle = sheen; ctx.fill(path);
      ctx.save();
      ctx.clip(path);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2.4; ctx.stroke(path);   // half of it shows: the bevel
      ctx.restore();
    }

    // a slow, never-quite-repeating wander, -1 to 1
    const wander = (t, k) => 0.6 * Math.sin(t * 0.9 + k * 1.7) + 0.4 * Math.sin(t * 1.63 + k * 4.1 + 0.8);

    // where two lines, each through points p and q, cross
    function cross(p1, q1, p2, q2) {
      const a1 = q1[1] - p1[1], b1 = p1[0] - q1[0], c1 = a1 * p1[0] + b1 * p1[1];
      const a2 = q2[1] - p2[1], b2 = p2[0] - q2[0], c2 = a2 * p2[0] + b2 * p2[1];
      const d = a1 * b2 - a2 * b1;
      return [(c1 * b2 - c2 * b1) / d, (a1 * c2 - a2 * c1) / d];
    }

    // a closed shape through the points, rounding each corner by its own radius
    function rounded(pts, radii) {
      const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], path = new Path2D();
      const start = mid(pts[n - 1], pts[0]);
      path.moveTo(start[0], start[1]);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        path.arcTo(p[0], p[1], q[0], q[1], radii[i]);
      }
      path.closePath();
      return path;
    }

    // quick at first, slower in the middle, a small stall, then the finish
    function fake(x) {
      return x < 0.55 ? 0.7 * Math.sin((x / 0.55) * Math.PI / 2)
           : x < 0.7 ? 0.7 + (x - 0.55) * 0.2
           : 0.73 + 0.27 * ((x - 0.7) / 0.3) ** 1.4;
    }

    let t0 = performance.now(), shown = -1;

    function frame(now) {
      let s = (now - t0) / 1000;
      if (s > RUN + EXIT + EMPTY + ENTER) { t0 = now; s = 0; }
      const t = reduce.matches ? 0 : now / 1000 * DRIFT;

      // how far the panels have flown: 0 in place, 1 gone
      let away = 0;
      if (!reduce.matches) {
        if (s > RUN && s < RUN + EXIT) away = ((s - RUN) / EXIT) ** 3;                 // slow to leave, then fast
        else if (s >= RUN + EXIT && s < RUN + EXIT + EMPTY) away = 1;
        else if (s >= RUN + EXIT + EMPTY) away = (1 - (s - RUN - EXIT - EMPTY) / ENTER) ** 3;  // fast in, settle
      }
      const p = reduce.matches ? 1 : s < RUN ? fake(s / RUN) : 1;

      const S = Math.min(W, H), e = S;   // e: well past the edges
      const range = ([lo, hi], k) => S * (lo + (hi - lo) * (0.5 + 0.5 * wander(t * 1.3, k)));
      // Each crack its own width, on its own slow rhythm, so where they cross
      // the gap is sometimes tall, sometimes wide, rarely square; and each
      // arm a little wider or narrower than the other half of its crack.
      const vW = S * (GAP[0] + (GAP[1] - GAP[0]) * (0.5 + 0.5 * wander(t * 0.7, 20)) ** 1.3);
      const hW = S * (GAP[0] + (GAP[1] - GAP[0]) * (0.5 + 0.5 * wander(t * 0.95 + 3, 21)) ** 1.3);
      const arm = k => 1 + TAPER * wander(t * 1.3, k);
      const gTop = vW * arm(5) / 2, gBottom = vW * arm(6) / 2;
      const gLeft = hW * arm(7) / 2, gRight = hW * arm(8) / 2;
      // The two cracks: one running top to bottom, one left to right. Each
      // leans as its two ends swing apart, so they cross at a slant and the
      // gap between them turns from a rectangle to a rhombus and back.
      const lv = TILT * S * wander(t * 0.6, 30), lh = TILT * S * wander(t * 0.55 + 2, 31);
      const top = [W * (0.5 + WANDER * wander(t, 0)) + lv, -e], bottom = [W * (0.5 + WANDER * wander(t, 1)) - lv, H + e];
      const left = [-e, H * (0.5 + WANDER * wander(t, 2)) - lh], right = [W + e, H * (0.5 + WANDER * wander(t, 3)) + lh];

      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);
      // the highlight drifting across, on the slant
      const k = (((reduce.matches ? 0 : now / 1000) / SHEEN) % 1) * 1.6 - 0.3, x0 = W * k;
      const sheen = ctx.createLinearGradient(x0 - W * 0.3, 0, x0 + W * 0.3, H * 0.7);
      sheen.addColorStop(0, 'rgba(255,255,255,0)');
      sheen.addColorStop(0.47, 'rgba(255,255,255,0.22)');
      sheen.addColorStop(0.5, 'rgba(255,255,255,0.34)');
      sheen.addColorStop(0.56, 'rgba(255,255,255,0.06)');
      sheen.addColorStop(1, 'rgba(255,255,255,0)');

      // each panel: its side of both cracks, and the direction it leaves in
      [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy], q) => {
        const v0 = [top[0] + sx * gTop, top[1]], v1 = [bottom[0] + sx * gBottom, bottom[1]];
        const h0 = [left[0], left[1] + sy * gLeft], h1 = [right[0], right[1] + sy * gRight];
        const j = cross(v0, v1, h0, h1);                         // this panel's corner at the crossing
        const onV = cross(v0, v1, [0, sy < 0 ? -e : H + e], [1, sy < 0 ? -e : H + e]);
        const onH = cross(h0, h1, [sx < 0 ? -e : W + e, 0], [sx < 0 ? -e : W + e, 1]);
        const far = [sx < 0 ? -e : W + e, sy < 0 ? -e : H + e];
        const dist = away * Math.hypot(W, H) * 0.75;
        const dx = sx * dist * 0.7071, dy = sy * dist * 0.7071;
        const pts = [j, onV, far, onH].map(([x, y]) => [x + dx, y + dy]);
        steel(rounded(pts, [range(ROUND, 10 + q), 0, 0, 0]), dx, dy, q, sheen);
      });

      const pct = Math.round(p * 100);
      if (pct !== shown) { shown = pct; stage.setAttribute('aria-valuenow', pct); }
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
