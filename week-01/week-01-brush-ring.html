<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Brush ring loader</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file.
     White dry-brush on black, the same in either scheme. */
  :root {
    --bg: #000000;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Brush ring. A circle dragged in white with a dry brush: dozens of
  // broken strokes of every weight running round it, thick and bright on
  // one side, thinning to scratches and flecks on the other. It turns one
  // way, eases to a stop, and turns back the other way, again and again.
  (() => {
    const BG = '#000000';
    const INK = '#ffffff';

    const RADIUS = 0.3;           // ring radius, share of the short side
    const SPREAD = 0.1;           // how far strokes stray from the circle, share of the radius
    const STROKES = 46;           // brush strokes round the ring
    const FLECKS = 500;           // specks thrown off the strokes
    const HEAVY = -Math.PI / 4;   // the side where the brush pressed hardest (up and right)
    const SWING = 0.8;            // turns in each direction
    const PERIOD = 1.9;           // seconds for each swing

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const tex = document.createElement('canvas');        // the ring, painted once
    let W = 0, H = 0, dpr = 1, R = 0;

    const rand = (a, b) => a + Math.random() * (b - a);
    const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

    // How hard the brush presses at angle a: heavy on one side, faint opposite.
    const press = a => 0.25 + 0.75 * (0.5 + 0.5 * Math.cos(a - HEAVY)) ** 1.5;

    function paint() {
      const size = Math.ceil(R * 2 * (1 + SPREAD * 3) + 20);
      tex.width = tex.height = Math.ceil(size * dpr);
      const g = tex.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, size, size);
      g.fillStyle = g.strokeStyle = INK;
      g.lineCap = 'round';
      const c = size / 2;

      for (let s = 0; s < STROKES; s++) {
        const r = R * (1 + SPREAD * gauss());
        const start = rand(0, Math.PI * 2), span = rand(0.15, 2.6);
        const weight = rand(0.35, 1) ** 2.2 * R * 0.05;   // most strokes thin, a few heavy
        const steps = Math.ceil(span * r / 5);             // chunky pieces
        let wob = rand(0, 10);
        for (let i = 0; i < steps; i++) {
          const a = start + span * i / steps, a2 = start + span * (i + 1) / steps;
          // dry brush: the bristles skip, so the stroke breaks up where pressure is low
          const p = press(a) * (0.6 + 0.4 * Math.sin(a * 7 + wob));
          if (Math.random() > 0.1 + 0.8 * p) continue;
          wob += rand(-0.2, 0.2);
          const rr = r + R * 0.004 * Math.sin(a * 23 + wob);
          g.lineWidth = Math.max(0.4, weight * p * rand(0.5, 1.3));
          g.globalAlpha = Math.min(1, 0.35 + p);
          g.beginPath();
          g.moveTo(c + Math.cos(a) * rr, c + Math.sin(a) * rr);
          g.lineTo(c + Math.cos(a2) * rr, c + Math.sin(a2) * rr);
          g.stroke();
        }
      }
      // flecks thrown off the strokes, thickest where the brush pressed
      for (let i = 0; i < FLECKS; i++) {
        const a = rand(0, Math.PI * 2);
        if (Math.random() > press(a)) continue;
        const r = R * (1 + SPREAD * 1.6 * gauss());
        g.globalAlpha = rand(0.4, 1);
        g.beginPath();
        g.arc(c + Math.cos(a) * r, c + Math.sin(a) * r, rand(0.3, 1) ** 2 * 2.6, 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
    }

    function layout() {
      const r = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      R = RADIUS * Math.min(W, H);
      paint();
    }

    // Swing one way, ease to a stop, swing back: the ring rocks between two
    // angles, each swing an ease in and out.
    function angle(s) {
      const k = s / PERIOD, n = Math.floor(k), u = k - n;
      const ease = u < 0.5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2;
      const from = n % 2 ? SWING : 0, to = n % 2 ? 0 : SWING;
      return (from + (to - from) * ease) * Math.PI * 2;
    }

    function frame(now) {
      const s = reduce.matches ? 0 : now / 1000;
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);
      const size = tex.width / dpr;
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.rotate(angle(s));
      ctx.drawImage(tex, -size / 2, -size / 2, size, size);
      ctx.restore();
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
