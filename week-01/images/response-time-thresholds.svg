<svg xmlns="http://www.w3.org/2000/svg" width="900" height="272" viewBox="0 0 900 272" role="img" aria-label="Which loading state to show, by how long the wait lasts">
  <rect width="900" height="272" fill="#f6f4ef"/>
  <text x="60" y="46" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">What to show, by how long the wait lasts</text>
  <text x="60" y="68" font-family="system-ui, sans-serif" font-size="13" fill="#77756e">Thresholds after Nielsen, as collected in my loading guidelines</text>

  <g font-family="system-ui, sans-serif">
    <rect x="60"  y="96" width="150" height="96" fill="#e8e6df"/>
    <rect x="210" y="96" width="200" height="96" fill="#dcdad1"/>
    <rect x="410" y="96" width="220" height="96" fill="#c9d0f2"/>
    <rect x="630" y="96" width="210" height="96" fill="#2b47ff"/>

    <text x="135" y="124" font-size="13" font-weight="600" fill="#3a3a36" text-anchor="middle">feels instant</text>
    <text x="310" y="124" font-size="13" font-weight="600" fill="#3a3a36" text-anchor="middle">slight delay</text>
    <text x="520" y="124" font-size="13" font-weight="600" fill="#26306b" text-anchor="middle">actively waiting</text>
    <text x="735" y="124" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">attention drifts</text>

    <text x="135" y="152" font-size="12.5" fill="#55534d" text-anchor="middle">show the result,</text>
    <text x="135" y="168" font-size="12.5" fill="#55534d" text-anchor="middle">no indicator</text>

    <text x="310" y="152" font-size="12.5" fill="#55534d" text-anchor="middle">acknowledge the</text>
    <text x="310" y="168" font-size="12.5" fill="#55534d" text-anchor="middle">press, no loader</text>

    <text x="520" y="152" font-size="12.5" fill="#26306b" text-anchor="middle">indeterminate:</text>
    <text x="520" y="168" font-size="12.5" fill="#26306b" text-anchor="middle">spinner, skeleton, inline</text>

    <text x="735" y="152" font-size="12.5" fill="#e6e9ff" text-anchor="middle">determinate: percent,</text>
    <text x="735" y="168" font-size="12.5" fill="#e6e9ff" text-anchor="middle">stages, cancel</text>

    <line x1="60" y1="216" x2="840" y2="216" stroke="#b6b3a9" stroke-width="1.5"/>
    <g stroke="#6f6d66" stroke-width="1.5">
      <line x1="210" y1="210" x2="210" y2="224"/>
      <line x1="410" y1="210" x2="410" y2="224"/>
      <line x1="630" y1="210" x2="630" y2="224"/>
    </g>
    <g font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#3a3a36" text-anchor="middle">
      <text x="210" y="246">0.1 s</text>
      <text x="410" y="246">1 s</text>
      <text x="630" y="246">10 s</text>
    </g>

  </g>
</svg>
