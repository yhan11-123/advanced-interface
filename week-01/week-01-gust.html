<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Gust spinner</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #fbfaf7;
    --ink: #1a1a1a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1c;
      --ink: #ededea;
    }
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .status {
    position: absolute; left: 0; right: 0; bottom: 14px; margin: 0;
    text-align: center; font-size: 13px; letter-spacing: .02em;
    color: #fff; mix-blend-mode: difference;
  }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading">
    <canvas aria-hidden="true"></canvas>
    <p class="status" aria-hidden="true">Loading</p>
  </div>

  <script>
  // Gust. An indeterminate spinner made of a swarm of particles, gathered
  // like a gust of wind: a wide, rounded head and a body that thins out to
  // nothing, the whole shape wheeling round and round. Each grain is born
  // at the head, drifts back along the body, wavering as it goes, and
  // fades at the tip of the tail, so the shape keeps its outline while
  // everything inside it flows.
  (() => {
    const COUNT = 900;          // grains in the swarm
    const RADIUS = 0.2;         // circle the swarm travels, share of the short side
    const HEAD = 0.52;          // head width, share of the radius
    const CAP = 0.13;           // rounded front of the head, share of the body
    const ARC = 1.45 * Math.PI; // how far round the circle the body reaches
    const TAPER = 1.35;         // higher = the tail thins sooner
    const SPIN = 0.62;          // turns per second
    const FLOW = 0.38;          // how fast a grain drifts from head to tail, bodies per second
    const WAVER = 0.22;         // how far a grain wanders across the body, share of its width
    const DOT = 1.9;            // px, a grain at the head

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let W = 0, H = 0, ink = '';

    function layout() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    }

    // Width of the body at u (0 head, 1 tail): a round cap at the front,
    // then a long taper to a point.
    function width(u) {
      const cap = u < CAP ? Math.sqrt(1 - ((CAP - u) / CAP) ** 2) : 1;
      return cap * Math.pow(1 - u, TAPER);
    }

    // Each grain: where it is along the body (u), across it (v, -1 to 1),
    // and its own phase for wandering.
    const grains = Array.from({ length: COUNT }, () => spawn(Math.random()));
    function spawn(u) {
      // across the body, bunched a little toward the middle line
      const v = (Math.random() + Math.random() - 1);
      return { u, v, ph: Math.random() * Math.PI * 2, sp: 0.75 + Math.random() * 0.5 };
    }

    let last = performance.now(), turn = 0;

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const t = now / 1000, still = reduce.matches;
      if (!still) turn += dt * SPIN * Math.PI * 2;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = ink;
      const cx = W / 2, cy = H / 2, R = RADIUS * Math.min(W, H), head = HEAD * R;

      for (const g of grains) {
        if (!still) {
          // slow in the head, quicker down the tail, so the head stays full
          g.u += dt * FLOW * g.sp * (0.45 + 1.1 * g.u);
          if (g.u > 1) Object.assign(g, spawn(Math.random() * 0.04));
        }
        const w = width(g.u) * head;
        // wind: each grain drifts across the body and slips a little along it
        const across = g.v + (still ? 0 : WAVER * Math.sin(t * 2.3 * g.sp + g.ph + g.u * 9));
        const slip = still ? 0 : 0.035 * Math.sin(t * 1.7 + g.ph * 1.3) * (0.3 + g.u);
        const a = turn - g.u * ARC + slip;
        const r = R + across * w / 2;
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;

        // grains shrink and fade toward the tail
        ctx.globalAlpha = Math.pow(1 - g.u, 0.9) * 0.85;
        const s = DOT * (0.35 + 0.65 * Math.pow(1 - g.u, 0.7));
        ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', layout);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
