    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');

    const PIVOT = [268, 648];   // knuckle of the index finger, in still pixels
    const LIFT = 12;            // degrees at the top of a tap
    const BEAT = 1.6;           // seconds from one tap to the next
    const DOT = 0.96;           // largest dot, as a share of the spacing

    const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const base = bytes(BASE), finger = bytes(FINGER);
    const lum = (d, i) => (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;

    // Stretch brightness over the still's own range, so the dark frame
    // still gets a full spread of dot sizes.
    const ls = []; for (let i = 0; i < base.length; i += 3) ls.push(lum(base, i));
    ls.sort((a, b) => a - b);
    const LO = ls[Math.floor(ls.length * 0.02)], HI = ls[Math.floor(ls.length * 0.995)];
    const level = l => Math.min(1, Math.max(0, (l - LO) / (HI - LO)));
    const size = l => 0.22 + 0.78 * Math.sqrt(level(l));

    let W = 0, H = 0, scale = 1, ox = 0, oy = 0, pitch = 0, back = null;
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();

    // Black and white: a dot's shade and size both come from its brightness.
    function dot(c, x, y, l) {
      const v = Math.round(40 + 215 * level(l));
      c.fillStyle = `rgb(${v},${v},${v})`;
      c.beginPath();
      c.arc(x, y, pitch / 2 * DOT * size(l), 0, Math.PI * 2);
      c.fill();
    }

    function layout() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = rect.width; H = rect.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // whole frame in view, letterboxed like a film
      scale = Math.min(W / IMG.w, H / IMG.h);
      ox = (W - IMG.w * scale) / 2; oy = (H - IMG.h * scale) / 2;
      pitch = IMG.cell * scale;

      // everything but the finger is still, so draw it once
      back = document.createElement('canvas');
      back.width = canvas.width; back.height = canvas.height;
      const b = back.getContext('2d');
      b.setTransform(dpr, 0, 0, dpr, 0, 0);
      b.fillStyle = bg; b.fillRect(0, 0, W, H);
      for (let gy = 0; gy < IMG.gh; gy++) for (let gx = 0; gx < IMG.gw; gx++) {
        const i = (gy * IMG.gw + gx) * 3;
        dot(b, ox + (gx + 0.5) * pitch, oy + (gy + 0.5) * pitch, lum(base, i));
      }
    }

    // Cells the finger can reach at any angle.
    const G0 = [Math.floor(100 / IMG.cell), Math.floor(540 / IMG.cell)];
    const G1 = [Math.ceil(300 / IMG.cell), Math.ceil(760 / IMG.cell)];

    function draw(deg) {
      ctx.drawImage(back, 0, 0, W, H);
      const a = -deg * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
      for (let gy = G0[1]; gy < G1[1]; gy++) for (let gx = G0[0]; gx < G1[0]; gx++) {
        // this cell's centre, turned back into the resting finger's frame
        const px = (gx + 0.5) * IMG.cell - PIVOT[0], py = (gy + 0.5) * IMG.cell - PIVOT[1];
        const fx = Math.floor((PIVOT[0] + px * cs - py * sn - FIN.x) / FIN.cell);
        const fy = Math.floor((PIVOT[1] + px * sn + py * cs - FIN.y) / FIN.cell);
        if (fx < 0 || fy < 0 || fx >= FIN.w || fy >= FIN.h) continue;
        const i = (fy * FIN.w + fx) * 4, a = finger[i + 3] / 255;
        if (a < 0.04) continue;
        // Blend with whatever sits under it by the mask, so the finger's
        // edge fades into the hand instead of cutting a line round it.
        const l = a * lum(finger, i) + (1 - a) * lum(base, (gy * IMG.gw + gx) * 3);
        const x = ox + (gx + 0.5) * pitch, y = oy + (gy + 0.5) * pitch;
        ctx.fillStyle = bg;
        ctx.fillRect(x - pitch / 2, y - pitch / 2, pitch, pitch);
        dot(ctx, x, y, l);
      }
    }

    // One beat, u from 0 to 1: a slow lift, a short hold, a quicker drop,
    // then rest on the desk until the next beat.
    function tap(u) {
      if (u < 0.34) return 0.5 - 0.5 * Math.cos(u / 0.34 * Math.PI);
      if (u < 0.42) return 1;
      if (u < 0.52) { const d = (u - 0.42) / 0.1; return 1 - d * d; }
      return 0;
    }

    const t0 = performance.now();
    function frame(now) {
      const s = (now - t0) / 1000;
      draw(reduce.matches ? 0 : LIFT * tap((s % BEAT) / BEAT));
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
