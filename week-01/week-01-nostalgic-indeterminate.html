<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 &middot; Nostalgic, indeterminate</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A prototype page of its own, so its styles stay in this file.
     The scene carries its own muted palette, the same in either scheme. */
  :root {
    --bg: #ece1c8;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Nostalgic, indeterminate. Inside the old train from the determinate
  // indicator, looking out. The carriage is drawn only in lines, but
  // carefully: a round-cornered window in a screwed frame with its rubber
  // seal, a sill with depth and end brackets, and the luggage rack above,
  // two tube rails with a net slung between them on curved brackets. Out of the window the same field runs
  // past, evening light and wind moving through it, the near grass
  // quicker than the far. Now and then a tree goes by, near ones big and
  // fast, far ones small and slow, and the view gives a small jolt at each
  // rail joint. It rides on for as long as the wait lasts.
  //
  // Painted as tiny pixel art, scaled up, and seen through a screen of
  // round holes, so every pixel becomes one dot.
  (() => {
    // ---------- palette: faded, somber, warm ----------
    const C = {
      page: '#ece1c8',                                 // a lighter amber; the paper in it is made below
      gap: 'rgba(24, 16, 8, 0.45)',            // each dot's own colour, darker, between the dots
      // outside
      sky: [[214, 196, 150], [226, 208, 160]], // high, near the horizon
      hills: [118, 128, 104],
      grass: [[46, 60, 34], [88, 104, 58], [206, 194, 122]],
      tree: ['#2c3a26', '#3c4d32', '#566a44'], trunk: '#3b2f24',
      // inside: nothing filled, only lines, one strong and one faint
      line: '#4b3b27', faint: '#8a7148',
    };

    // ---------- scene, in dots ----------
    const GW = 160, GH = 106;
    const WIN = { x0: 24, y0: 22, x1: 136, y1: 92, r: 9 };   // the window, frame included
    const FRAME = 4;                                          // frame depth, outer line to glass
    const HORIZON = 0.4;                                      // share down the glass
    const SIZE = window.self === window.top ? 0.45 : 0.94;
    const DOT = 0.42;

    // ---------- motion ----------
    const SPEED = 26;              // dots per second the nearest grass slides by
    const JOINT = 2.4;             // seconds between rail joints
    const TREE_GAP = [1.6, 4.2];   // seconds between trees

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const art = document.createElement('canvas');
    art.width = GW; art.height = GH;
    const g = art.getContext('2d');
    const screen = document.createElement('canvas');
    const layer = document.createElement('canvas');
    let W = 0, H = 0, dpr = 1, pitch = 1, ox = 0, oy = 0;

    const hash = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return v - Math.floor(v); };
    const rgb = c => `rgb(${c.map(Math.round)})`;
    const lerp3 = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
    const px = (x, y, c) => { if (x < 0 || x >= GW || y < 0 || y >= GH) return; g.fillStyle = c; g.fillRect(x, y, 1, 1); };
    const smooth = k => k * k * (3 - 2 * k);

    // The page: a lighter amber, with the faintest paper in it, made once
    // per size. A slow mottle, fine grain, and a scatter of short fibres,
    // each barely there.
    const paper = document.createElement('canvas');
    function makePaper() {
      const w = canvas.width, h = canvas.height;
      paper.width = w; paper.height = h;
      const p = paper.getContext('2d'), img = p.createImageData(w, h), d = img.data;
      const base = [236, 225, 200];
      let a = 7;
      const rnd = () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; };
      // the mottle: a coarse grid of random shades, smoothly blended
      const cell = 90 * dpr, gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2;
      const grid = Array.from({ length: gw * gh }, () => rnd() - 0.5);
      for (let y = 0; y < h; y++) {
        const gy = y / cell, j = Math.floor(gy), fy = gy - j, vy = fy * fy * (3 - 2 * fy);
        for (let x = 0; x < w; x++) {
          const gx = x / cell, i = Math.floor(gx), fx = gx - i, vx = fx * fx * (3 - 2 * fx);
          const g = (k, l) => grid[l * gw + k];
          const m = g(i, j) + (g(i + 1, j) - g(i, j)) * vx + (g(i, j + 1) - g(i, j)) * vy + (g(i, j) - g(i + 1, j) - g(i, j + 1) + g(i + 1, j + 1)) * vx * vy;
          const v = m * 7 + (rnd() - 0.5) * 7;
          const o = (y * w + x) * 4;
          d[o] = base[0] + v; d[o + 1] = base[1] + v; d[o + 2] = base[2] + v * 0.8; d[o + 3] = 255;
        }
      }
      p.putImageData(img, 0, 0);
      // fibres: short, faint, gently bent
      p.lineCap = 'round';
      for (let k = 0; k < w * h / (2600 * dpr * dpr); k++) {
        const x = rnd() * w, y = rnd() * h, l = (4 + rnd() * 14) * dpr, t = rnd() * Math.PI;
        p.strokeStyle = rnd() < 0.5 ? `rgba(255, 250, 235, ${0.05 + rnd() * 0.06})` : `rgba(90, 64, 30, ${0.03 + rnd() * 0.04})`;
        p.lineWidth = (0.4 + rnd() * 0.5) * dpr;
        p.beginPath(); p.moveTo(x, y);
        p.quadraticCurveTo(x + Math.cos(t + 0.4) * l * 0.5, y + Math.sin(t + 0.4) * l * 0.5, x + Math.cos(t) * l, y + Math.sin(t) * l);
        p.stroke();
      }
    }

    function layout() {
      const r = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      makePaper();
      pitch = Math.min(W * SIZE / GW, H * 0.9 / GH);
      ox = (W - GW * pitch) / 2; oy = (H - GH * pitch) / 2;
      screen.width = layer.width = canvas.width; screen.height = layer.height = canvas.height;
      const s = screen.getContext('2d');
      s.setTransform(dpr, 0, 0, dpr, 0, 0);
      s.fillStyle = C.gap; s.fillRect(0, 0, W, H);
      s.globalCompositeOperation = 'destination-out';
      s.beginPath();
      const r0 = pitch * DOT;
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
        const cx = ox + (x + 0.5) * pitch, cy = oy + (y + 0.5) * pitch;
        s.moveTo(cx + r0, cy); s.arc(cx, cy, r0, 0, Math.PI * 2);
      }
      s.fill();
    }

    // inside a rounded rectangle?
    function inRound(x, y, x0, y0, x1, y1, r) {
      if (x < x0 || x > x1 || y < y0 || y > y1) return false;
      const cx = Math.min(Math.max(x, x0 + r), x1 - r), cy = Math.min(Math.max(y, y0 + r), y1 - r);
      return (x - cx) ** 2 + (y - cy) ** 2 <= r * r + 0.5;
    }
    const glass = { x0: WIN.x0 + FRAME, y0: WIN.y0 + FRAME, x1: WIN.x1 - FRAME, y1: WIN.y1 - FRAME, r: WIN.r - FRAME + 1 };
    const inGlass = (x, y) => inRound(x, y, glass.x0, glass.y0, glass.x1, glass.y1, glass.r);

    // ---------- outside: sky, far hills, the field running past ----------
    function outside(t, jolt) {
      const top = glass.y0, bottom = glass.y1, hz = Math.round(top + (bottom - top) * HORIZON) + jolt;
      const far = t * SPEED * 0.08, sun = 0.5 + 0.55 * Math.sin(t * 0.11);
      for (let y = top; y <= bottom; y++) for (let x = glass.x0; x <= glass.x1; x++) {
        if (!inGlass(x, y)) continue;
        if (y < hz) {
          // sky, paling toward the horizon, and a long low line of hills
          const k = (y - top) / Math.max(1, hz - top);
          const ridge = hz - 3 - Math.round(3 * (0.5 + 0.5 * Math.sin((x + far) * 0.07)) + 2 * (0.5 + 0.5 * Math.sin((x + far) * 0.19 + 1)));
          const c = y >= ridge ? lerp3(C.hills, C.sky[1], 0.25 + (hz - y) * 0.04) : lerp3(C.sky[0], C.sky[1], smooth(k) + (hash(x, y) - 0.5) * 0.06);
          px(x, y, rgb(c));
          continue;
        }
        // the field: the nearer the row, the faster it slides by
        const depth = (y - hz) / Math.max(1, bottom - hz);          // 0 far, 1 near
        const speed = SPEED * (0.15 + 0.85 * depth * depth);
        const wx = x + t * speed;                                    // where this dot is in the passing field
        const bladeH = 2 + Math.round(depth * 3);
        const rows = 0.5 + 0.5 * Math.sin(y * (1.5 - depth * 0.8) + hash(0, y) * 2);
        const gust = 0.5 + 0.5 * Math.sin(wx * 0.045 - y * 0.16 - t * 1.4 + Math.sin(wx * 0.011 + y * 0.05 + t * 0.35) * 2.2);
        const ripple = 0.5 + 0.5 * Math.sin(wx * 0.13 + y * 0.35 - t * 2.3);
        const col = Math.floor(wx);
        const lift = y + hash(col, 3) * bladeH;
        const seg = Math.floor(lift / bladeH), inBlade = (lift % bladeH) / bladeH;
        const blade = (hash(col, seg) > 0.55 ? 0.22 : -0.05) * (1 - inBlade) - (hash(col, seg + 50) > 0.8 ? 0.18 : 0);
        let k = 0.28 + 0.22 * rows * gust + 0.12 * ripple + blade - depth * 0.1 + (hash(col, y) - 0.5) * 0.12;
        k = Math.min(1, Math.max(0, k));
        let c = lerp3(C.grass[0], C.grass[1], smooth(k));
        const sx = glass.x0 + (glass.x1 - glass.x0) * sun;
        const light = Math.exp(-(((x - sx) / ((glass.x1 - glass.x0) * 0.35)) ** 2)) * (0.55 + 0.45 * gust);
        const warm = Math.min(1, light * smooth(Math.min(1, k * 1.5)) * 1.15);
        if (warm > 0.04) c = lerp3(c, C.grass[2], warm);
        px(x, y, rgb(c));
      }
      return hz;
    }

    // ---------- trees going by ----------
    const trees = [];
    let nextTree = 0.8;
    function addTree() {
      const near = Math.random() < 0.45;
      trees.push({
        x: glass.x1 + 20,
        near,
        speed: near ? SPEED * 1.35 : SPEED * (0.3 + Math.random() * 0.25),
        h: near ? 46 + Math.random() * 18 : 12 + Math.random() * 10,
        round: Math.random() < 0.4,
        seed: Math.random() * 100,
      });
    }
    function drawTree(tr, hz, t) {
      const base = tr.near ? glass.y1 + 4 : hz + 3 + Math.round(tr.h * 0.1);
      const top = base - tr.h, w = tr.round ? tr.h * 0.5 : tr.h * 0.42;
      const cx = tr.x, sway = Math.sin(t * 1.3 + tr.seed) * (tr.near ? 1 : 0.4);
      for (let y = Math.floor(top); y <= base; y++) {
        const u = (y - top) / tr.h;                        // 0 at the crown, 1 at the ground
        let half;
        if (tr.round) half = u < 0.8 ? w / 2 * Math.sqrt(Math.max(0, 1 - ((u - 0.42) / 0.42) ** 2)) : 0;
        else half = u < 0.88 ? w / 2 * (0.15 + 0.85 * u) * (0.8 + 0.2 * Math.sin(u * 22)) : 0;   // tiers of a conifer
        const lean = sway * (1 - u);
        for (let x = Math.floor(cx - half + lean); x <= cx + half + lean; x++) {
          if (!inGlass(x, y)) continue;
          const edge = Math.abs(x - cx - lean) / Math.max(1, half);
          if (edge > 0.8 && hash(x + tr.seed, y) < 0.4) continue;                            // ragged leafy edge
          const shade = (x - cx - lean) / Math.max(1, half) + (hash(x, y + tr.seed) - 0.5) * 0.8;
          px(x, y, shade < -0.3 ? C.tree[0] : shade < 0.4 ? C.tree[1] : C.tree[2]);
        }
        if (half === 0 || u > 0.7) for (let x = Math.round(cx - 1); x <= Math.round(cx + (tr.near ? 1 : 0)); x++) if (inGlass(x, y) && u > 0.6) px(x, y, C.trunk);
      }
    }

    // ---------- inside the carriage, in lines ----------
    const edge = (x, y, inside) => inside(x, y) && (!inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1));
    const inWindow = (x, y) => inRound(x, y, WIN.x0, WIN.y0, WIN.x1, WIN.y1, WIN.r);
    const inSeal = (x, y) => inRound(x, y, WIN.x0 + 2, WIN.y0 + 2, WIN.x1 - 2, WIN.y1 - 2, WIN.r - 2);

    function line(x0, y0, x1, y1, c = C.line) {                 // a one-dot line
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
      for (let i = 0; i <= n; i++) px(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c);
    }

    function frameLines() {
      for (let y = WIN.y0 - 1; y <= WIN.y1 + 1; y++) for (let x = WIN.x0 - 1; x <= WIN.x1 + 1; x++) {
        if (edge(x, y, inWindow)) px(x, y, C.line);                       // outer edge of the frame
        else if (edge(x, y, inSeal)) px(x, y, C.faint);                   // the step down to the rubber seal
        else if (inWindow(x, y) && !inGlass(x, y) && (inGlass(x - 1, y) || inGlass(x + 1, y) || inGlass(x, y - 1) || inGlass(x, y + 1))) px(x, y, C.line);   // the seal against the glass
      }
      // screws along the middle of the frame's straight runs
      const mid = 1;
      for (let x = WIN.x0 + WIN.r + 2; x <= WIN.x1 - WIN.r - 2; x += 12) { px(x, WIN.y0 + mid, C.line); px(x, WIN.y1 - mid, C.line); }
      for (let y = WIN.y0 + WIN.r + 2; y <= WIN.y1 - WIN.r - 2; y += 12) { px(WIN.x0 + mid, y, C.line); px(WIN.x1 - mid, y, C.line); }
    }

    function sill() {
      const x0 = WIN.x0 - 5, x1 = WIN.x1 + 5, y = WIN.y1 + 3;
      line(x0, y, x1, y);                                  // the top of the ledge
      line(x0 + 1, y + 1, x1 - 1, y + 1, C.faint);         // its top face, catching the light
      line(x0, y + 3, x1, y + 3);                          // the front edge
      line(x0, y, x0, y + 3); line(x1, y, x1, y + 3);      // the ends
      line(x0 + 3, y + 5, x1 - 3, y + 5, C.faint);         // shadow under the ledge
      // a bracket under each end, bent from the wall
      for (const [x, d] of [[x0 + 5, 1], [x1 - 5, -1]]) {
        line(x, y + 4, x, y + 9); line(x, y + 9, x + 3 * d, y + 9);
        px(x + d, y + 6, C.faint);
      }
    }

    function rack() {
      const x0 = 8, x1 = GW - 9, front = 5, back = 12;
      // two tube rails: each drawn as a pair of lines, the tube's two edges
      line(x0, front - 1, x1, front - 1); line(x0, front + 1, x1, front + 1); line(x0 + 1, front, x1 - 1, front, C.faint);
      line(x0 + 3, back - 1, x1 - 3, back - 1); line(x0 + 3, back + 1, x1 - 3, back + 1);
      // the net slung between them, a diamond mesh
      for (let y = front + 2; y < back - 1; y++) for (let x = x0 + 2; x <= x1 - 2; x++) {
        if ((x + y) % 4 === 0 || (x - y + 400) % 4 === 0) px(x, y, C.faint);
      }
      // curved brackets down to plates on the wall
      for (const x of [x0 + 4, Math.round(GW / 2), x1 - 4]) {
        const d = x < GW / 2 - 1 ? 1 : x > GW / 2 + 1 ? -1 : 0;
        line(x, front + 1, x, back + 3);
        line(x, back + 3, x + d * 2, back + 6);
        for (let yy = back + 5; yy <= back + 8; yy++) { px(x + d * 2 - 1, yy, C.line); px(x + d * 2 + 1, yy, C.line); }
        px(x + d * 2, back + 6, C.faint);                  // the plate's screw
      }
      // end caps on the rails
      for (const x of [x0 - 1, x1 + 1]) line(x, front - 1, x, front + 1);
    }

    function inside() {
      frameLines();
      sill();
      rack();
    }

    let last = performance.now(), clock = 0;

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const still = reduce.matches;
      if (!still) clock += dt;
      const t = clock;
      // at each rail joint the view jumps a dot, just for a moment
      const jolt = !still && (t % JOINT) < 0.08 ? 1 : 0;

      if (!still) {
        nextTree -= dt;
        if (nextTree <= 0) { addTree(); nextTree = TREE_GAP[0] + Math.random() * (TREE_GAP[1] - TREE_GAP[0]); }
        for (let i = trees.length - 1; i >= 0; i--) {
          trees[i].x -= trees[i].speed * dt;
          if (trees[i].x < glass.x0 - 40) trees.splice(i, 1);
        }
      }

      g.clearRect(0, 0, GW, GH);
      const hz = outside(t, jolt);
      // far trees first, near trees over them
      trees.filter(tr => !tr.near).forEach(tr => drawTree(tr, hz, t));
      trees.filter(tr => tr.near).forEach(tr => drawTree(tr, hz, t));
      inside();

      const l = layer.getContext('2d');
      l.globalCompositeOperation = 'source-over';
      l.clearRect(0, 0, layer.width, layer.height);
      l.imageSmoothingEnabled = false;
      l.drawImage(art, ox * dpr, oy * dpr, GW * pitch * dpr, GH * pitch * dpr);
      l.globalCompositeOperation = 'source-atop';
      l.drawImage(screen, 0, 0);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (paper.width === canvas.width && paper.height === canvas.height) ctx.drawImage(paper, 0, 0);
      else { ctx.fillStyle = C.page; ctx.fillRect(0, 0, canvas.width, canvas.height); }
      ctx.drawImage(layer, 0, 0);
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
