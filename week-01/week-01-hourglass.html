<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Hourglass loader</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #fbfaf7;
    --ink: #1a1a1a;
    --muted: #77756e;
    --accent: #2b47ff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1c;
      --ink: #ededea;
      --muted: #9a9a94;
      --accent: #8fa0ff;
    }
  }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  .stage { position: relative; flex: 1; min-height: 120px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .status {
    margin: 0; padding: 0 16px 14px; text-align: center;
    font-size: 13px; color: var(--muted); letter-spacing: .02em;
  }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading" aria-valuetext="Loading">
    <canvas aria-hidden="true"></canvas>
  </div>
  <p class="status">Loading</p>

  <script>
  // An hourglass drawn only in particles. The two shapes never change: sand
  // settled in the bottom of the top chamber, and below it a mound, narrow
  // on top and wide at the base. Nothing drains and nothing piles up. Only
  // the flow moves: grains slide out of the settled sand toward the neck,
  // pass through it, and fall, the column narrowing and thinning on the way
  // down like a thick liquid pouring. It has no start and no end.
  (() => {
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');

    const TOP = 0.42;          // share of the top chamber the settled sand fills
    const DIP = 0.12;          // how much its surface sags in the middle
    const PILE = 0.34;         // share of the bottom chamber the mound fills
    const MOUND = 1.1;         // how steep the mound is
    const RATE = 75;           // grains per second passing the neck
    const SLIDE = 0.45;        // seconds a grain takes to slide to the neck
    const FALL = 0.55;         // seconds from the neck to the mound

    let W = 0, H = 0, cx = 0, cy = 0;
    let chamber = 0, neck = 0, gap = 0, pitch = 0, grain = 0;
    let slots = [], topOrder = [], fillOrder = [];
    let color = '';

    function readColors() {
      color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    }

    // Seeded random, so the grains keep their places from frame to frame.
    function rng(seed) {
      return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    }
    // A well-mixed 0..1 value per stream grain, so neighbours do not line up.
    function hash(n) {
      n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
      n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    }

    // Half-width of a chamber at distance d from the neck: opens out quickly,
    // then runs straight up to a flat end, like a glass bulb.
    const halfWidth = d => neck + (chamber * 0.62 - neck) * Math.sin(Math.min(1, d / (chamber * 0.55)) * Math.PI / 2);

    function layout() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      cx = W / 2; cy = H / 2;
      chamber = Math.min(H * 0.4, W * 0.55);        // height of one chamber
      gap = Math.max(2, chamber * 0.04);             // half the neck's length
      neck = Math.max(1.5, chamber * 0.03);
      pitch = Math.max(2.6, chamber / 42);           // grain spacing
      grain = pitch * 0.34;                          // grain radius: small

      // Grain places in one chamber, measured as (x, d) with d = distance
      // from the neck. The same places serve the top (d up) and bottom (d down).
      const rand = rng(7);
      slots = [];
      for (let d = pitch * 0.5; d < chamber; d += pitch * 0.87) {
        const hw = halfWidth(d) - grain;
        const row = Math.round(d / pitch) % 2 ? pitch / 2 : 0;
        for (let x = -hw + row; x <= hw; x += pitch) {
          slots.push({ x: x + (rand() - 0.5) * pitch * 0.35, d: d + (rand() - 0.5) * pitch * 0.35 });
        }
      }
      const n = slots.map((_, i) => i);
      // Top: sand settles against the neck, its surface sagging a little in
      // the middle where it is flowing out.
      const topKey = i => slots[i].d - DIP * Math.abs(slots[i].x);
      topOrder = n.slice().sort((a, b) => topKey(a) - topKey(b));
      // Bottom: taking the lowest places first, the middle before the edges,
      // gives a mound, narrow on top and wide at the base.
      const fillKey = i => (chamber - slots[i].d) + MOUND * Math.abs(slots[i].x);
      fillOrder = n.slice().sort((a, b) => fillKey(a) - fillKey(b));
    }

    // Draw the hourglass at time t: the two fixed shapes, and the flow.
    function drawGlass(t, flowing) {
      ctx.beginPath();
      // settled sand in the top chamber
      const top = Math.round(slots.length * TOP);
      let surface = 0;                               // highest settled grain, as d
      for (let i = 0; i < top; i++) {
        const s = slots[topOrder[i]];
        surface = Math.max(surface, s.d);
        ctx.rect(cx + s.x - grain, cy - gap - s.d - grain, grain * 2, grain * 2);
      }
      // the mound below
      let peak = cy + gap + chamber;
      const bottom = Math.round(slots.length * PILE);
      for (let i = 0; i < bottom; i++) {
        const s = slots[fillOrder[i]];
        const y = cy + gap + s.d;
        if (y < peak) peak = y;
        ctx.rect(cx + s.x - grain, y - grain, grain * 2, grain * 2);
      }
      ctx.fillStyle = color;
      ctx.fill();
      if (!flowing) return;

      // The flow. Each grain starts somewhere in the settled sand, slides
      // down and in to the neck (slowly, then faster), then drops. On the
      // drop it speeds up, and the column narrows and thins toward the mound.
      const y0 = cy - gap, y1 = peak - grain;
      const len = Math.max(1, y1 - y0);
      ctx.beginPath();
      const first = Math.floor((t - SLIDE - FALL) * RATE), last = Math.floor(t * RATE);
      for (let k = Math.max(0, first); k <= last; k++) {
        const age = t - k / RATE;
        if (age < 0) continue;
        const a = hash(k * 4 + 1), b = hash(k * 4 + 2), j = (hash(k * 4 + 3) - 0.5) * 2;
        let x, y, r = grain;
        if (age < SLIDE) {
          // start point: inside the settled sand, near the middle
          const d0 = neck + a * surface * 0.55;
          const x0 = (b - 0.5) * 2 * halfWidth(d0) * 0.6;
          const u = age / SLIDE, e = u * u;          // ease in: gathers pace
          const d = d0 * (1 - e);
          x = cx + x0 * (1 - e) + j * neck * e;
          y = cy - gap - d;
        } else {
          const u = (age - SLIDE) / FALL;            // 0 at the neck, 1 at the mound
          if (hash(k * 4 + 4) < u * 0.4) continue;   // fewer grains lower down
          y = y0 + len * u * u;                      // falling: speeds up
          x = cx + j * neck * 1.4 * (1 - 0.8 * u);
          r = grain * (1 - 0.35 * u);
        }
        ctx.rect(x - r, y - r, r * 2, r * 2);
      }
      ctx.fill();
    }

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      drawGlass(t, true);
    }

    let raf = 0, t0 = 0;

    function frame(now) {
      draw(1 + Math.max(0, now - t0) / 1000);        // +1 s: already flowing on the first frame
      raf = requestAnimationFrame(frame);
    }

    function start() {
      cancelAnimationFrame(raf);
      layout(); readColors();
      if (reduce.matches) {
        // Parked: the two shapes, no falling stream.
        ctx.clearRect(0, 0, W, H);
        drawGlass(0, false);
        return;
      }
      t0 = performance.now();
      raf = requestAnimationFrame(frame);
    }

    new ResizeObserver(start).observe(canvas);
    reduce.addEventListener('change', start);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); if (reduce.matches) start(); });
  })();
  </script>

</body>
</html>
