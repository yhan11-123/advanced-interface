<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Vortex loader</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file.
     Streaks of light need the dark, so it stays dark in either scheme. */
  :root {
    --bg: #000000;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Vortex. A black sphere resting on a plane, seen from above at a slant,
  // with streaks of light circling it across the plane like a whirlpool or
  // the disc round a black hole. Near the sphere they crowd in and race;
  // far out they drift slowly. Streaks on the far side pass behind the
  // sphere, near ones sweep in front of it.
  (() => {
    const BG = '#000000';
    const INK = '255, 255, 255';

    const COUNT = 4200;           // streaks
    const SPHERE = 0.2;           // sphere radius, share of the short side
    const CENTRE = [0.5, 0.4];    // where the sphere sits on screen, shares of width, height
    const SQUASH = 0.4;           // how flat the plane looks: 1 straight down, 0 edge-on
    const DEPTH = 0.45;           // how much nearer streaks grow than farther ones
    const SPEED = 2.2;            // radians per second at the sphere's edge
    const FALLOFF = 1.15;         // how quickly the swirl slows further out
    const TRAIL = 0.55;           // seconds of path each streak shows
    const MAX_ARC = 1.1;          // longest streak, radians
    const MIN_LEN = 70;           // px, so slow far streaks still read as streaks
    const CLEAR = 1.35;           // dark ring round the sphere's foot, share of its radius
    const LEVELS = 6;             // brightness steps, one path each

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let W = 0, H = 0, streaks = [], Rs = 0, Rmax = 0;

    function layout() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      Rs = SPHERE * Math.min(W, H);
      Rmax = Math.max(W, H / SQUASH) * 1.1;                  // far enough to fill the screen
      streaks = Array.from({ length: COUNT }, () => ({
        // bunched toward the middle, where the swirl is thickest
        r: Rs * CLEAR + (Rmax - Rs * CLEAR) * Math.pow(Math.random(), 1.7),
        a: Math.random() * Math.PI * 2,
        glow: 0.25 + 0.75 * Math.pow(Math.random(), 1.5),
      }));
    }

    // A point on the plane at radius r, angle a (sin a > 0 is the near side).
    function project(r, a, cx, cy) {
      const near = 1 + DEPTH * (r * Math.sin(a)) / Rmax;
      return [cx + r * Math.cos(a) * near, cy + r * Math.sin(a) * SQUASH * near, near];
    }

    let last = performance.now();

    function frame(now) {
      const dt = reduce.matches ? 0 : Math.min(0.05, (now - last) / 1000); last = now;
      const cx = W * CENTRE[0], cy = H * CENTRE[1] + Rs * 0.55;   // the plane meets the sphere below its middle
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);
      ctx.lineCap = 'round';

      // behind the sphere, then the sphere, then in front of it
      const back = Array.from({ length: LEVELS }, () => new Path2D());
      const front = Array.from({ length: LEVELS }, () => new Path2D());
      for (const s of streaks) {
        const w = SPEED * Math.pow(Rs / s.r, FALLOFF);
        s.a += w * dt;
        const arc = Math.min(MAX_ARC, Math.max(w * TRAIL, MIN_LEN / s.r));
        // fade in from the dark ring round the sphere's foot
        const fade = Math.min(1, (s.r - Rs * CLEAR) / (Rs * 0.8));
        const lvl = Math.min(LEVELS - 1, Math.floor(s.glow * fade * LEVELS));
        // piece by piece, so a streak crossing from the far side to the near
        // side is hidden by the sphere only where it is actually behind it
        let prev = project(s.r, s.a, cx, cy);
        for (let k = 1; k <= 6; k++) {
          const a = s.a - arc * k / 6, cur = project(s.r, a, cx, cy);
          const p = (Math.sin(a + arc / 12) > 0 ? front : back)[lvl];
          p.moveTo(prev[0], prev[1]); p.lineTo(cur[0], cur[1]);
          prev = cur;
        }
      }
      const stroke = paths => paths.forEach((p, i) => {
        ctx.strokeStyle = `rgba(${INK}, ${0.08 + 0.85 * ((i + 0.5) / LEVELS) ** 1.3})`;
        ctx.lineWidth = 0.8 + 0.8 * (i / LEVELS);
        ctx.stroke(p);
      });
      stroke(back);

      // the sphere: black, with a faint rim where the swirl's light catches it
      const sx = W * CENTRE[0], sy = H * CENTRE[1];
      const shade = ctx.createRadialGradient(sx - Rs * 0.3, sy - Rs * 0.4, Rs * 0.2, sx, sy, Rs);
      shade.addColorStop(0, '#050505');
      shade.addColorStop(0.9, '#000000');
      shade.addColorStop(1, '#0c0c0c');
      ctx.fillStyle = shade;
      ctx.beginPath(); ctx.arc(sx, sy, Rs, 0, Math.PI * 2); ctx.fill();

      stroke(front);
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
