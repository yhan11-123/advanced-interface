<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Ripple dots loader</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #fbfaf7;
    --ink: #1a1a1a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1c;
      --ink: #ededea;
    }
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Ripple dots. A halftone ring: dots on a honeycomb grid, cut to a
  // circle with an empty middle. Rings of larger dots keep swelling out of
  // the inner edge and travelling to the outer one, where they shrink away,
  // so the ring seems to breathe outward without end.
  (() => {
    const OUTER = 0.3;          // ring's outer radius, share of the short side
    const INNER = 0.3;          // hole, share of the outer radius
    const ROWS = 25;            // dots across the ring, edge to edge
    const DOT = 0.4;            // largest dot radius, share of the spacing
    const WAVE = 0.5;           // distance between ripples, share of the ring's width
    const PERIOD = 1.6;         // seconds for a ripple to move one WAVE outward

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let W = 0, H = 0, ink = '', dots = [], pitch = 0, r0 = 0, r1 = 0;

    function layout() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();

      // honeycomb grid: rows offset by half a step, rows closer by √3/2
      r1 = OUTER * Math.min(W, H); r0 = INNER * r1;
      pitch = 2 * r1 / (ROWS - 1);
      const rowH = pitch * Math.sqrt(3) / 2, n = Math.ceil(r1 / rowH) + 1;
      dots = [];
      for (let j = -n; j <= n; j++) {
        const shift = (j & 1) ? pitch / 2 : 0;
        for (let i = -n - 1; i <= n + 1; i++) {
          const x = i * pitch + shift, y = j * rowH, d = Math.hypot(x, y);
          if (d <= r1 + pitch * 0.3 && d >= r0 - pitch * 0.3) dots.push({ x, y, d });
        }
      }
    }

    function frame(now) {
      const t = reduce.matches ? 0 : now / 1000;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = ink;
      const cx = W / 2, cy = H / 2, band = r1 - r0;
      for (const p of dots) {
        const k = Math.min(1, Math.max(0, (p.d - r0) / band));      // 0 inner edge, 1 outer edge
        const edge = Math.pow(Math.sin(k * Math.PI), 0.6);            // small at both edges
        const ripple = 0.5 + 0.5 * Math.cos(2 * Math.PI * (k / WAVE - t / PERIOD));
        const r = pitch * DOT * edge * (0.25 + 0.75 * ripple);
        if (r < 0.3) continue;
        ctx.beginPath(); ctx.arc(cx + p.x, cy + p.y, r, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', layout);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
