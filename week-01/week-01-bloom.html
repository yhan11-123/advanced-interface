<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Bloom loader</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file.
     Specks of light need the dark, so it stays dark in either scheme. */
  :root {
    --bg: #000000;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Bloom. Thousands of specks of light scattered over the skin of a ball.
  // A slow current runs through that skin and pushes it out of shape: the
  // ball crumples and unfolds into loose petals, like cloth or a flower
  // opening, then gathers back toward a ball, and never quite repeats.
  // It turns slowly the whole time; near specks bright, far ones faint,
  // each one glinting on its own.
  (() => {
    const BG = '#000000';
    const INK = '255, 255, 255';

    const COUNT = 6000;           // specks
    const SIZE = 0.22;            // ball radius, share of the short side
    const FOLD = [0.12, 0.85];    // how far the skin is pushed out of shape: calm, full bloom
    const CYCLE = 11;             // seconds from calm to bloom and back
    const FLOW = 0.35;            // how fast the current moves through the skin
    const TURN = 0.06;            // turns per second
    const DOT = 1.4;              // px, a near speck
    const LEVELS = 7;             // brightness steps, one path each

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let W = 0, H = 0;

    function layout() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Specks scattered at random over a ball, each with its own glint phase.
    const specks = Array.from({ length: COUNT }, () => {
      const y = Math.random() * 2 - 1, r = Math.sqrt(1 - y * y), a = Math.random() * Math.PI * 2;
      return { x: Math.cos(a) * r, y, z: Math.sin(a) * r, ph: Math.random() * Math.PI * 2, bright: 0.35 + 0.65 * Math.random() };
    });

    // A smooth, slowly moving field: a few folded sine waves, cheap
    // stand-in for noise. Returns roughly -1 to 1.
    function field(x, y, z, t, k) {
      return (Math.sin(1.7 * x + 1.1 * t + k + Math.sin(2.3 * y - 0.7 * t))
            + Math.sin(2.1 * y - 0.9 * t + 2 * k + Math.sin(1.9 * z + 0.6 * t))
            + Math.sin(1.9 * z + 0.8 * t + 3 * k + Math.sin(2.5 * x - 0.5 * t))) / 3;
    }

    function frame(now) {
      const s = reduce.matches ? CYCLE * 0.4 : now / 1000, t = s * FLOW * 2;
      const bloom = FOLD[0] + (FOLD[1] - FOLD[0]) * (0.5 - 0.5 * Math.cos(s / CYCLE * Math.PI * 2));
      const R = SIZE * Math.min(W, H), cx = W / 2, cy = H / 2, cam = 3.2;
      const ay = s * TURN * Math.PI * 2, ax = 0.35 * Math.sin(s * 0.13);
      const cyr = Math.cos(ay), syr = Math.sin(ay), cxr = Math.cos(ax), sxr = Math.sin(ax);

      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);
      const paths = Array.from({ length: LEVELS }, () => new Path2D());

      for (const p of specks) {
        // push out along the surface normal, and slide sideways, so the skin folds
        const n = field(p.x * 2.2, p.y * 2.2, p.z * 2.2, t, 0);
        const scale = 1 + bloom * 0.6 * n;
        let x = p.x * scale + bloom * 0.5 * field(p.y * 3.2, p.z * 3.2, p.x * 3.2, t, 1);
        let y = p.y * scale + bloom * 0.5 * field(p.z * 3.2, p.x * 3.2, p.y * 3.2, t, 2);
        let z = p.z * scale + bloom * 0.5 * field(p.x * 3.2, p.z * 3.2, p.y * 3.2, t, 3);
        // turn about the vertical, then tip a little
        [x, z] = [x * cyr + z * syr, -x * syr + z * cyr];
        [y, z] = [y * cxr - z * sxr, y * sxr + z * cxr];
        const k = cam / (cam - z);
        const px = cx + x * R * k, py = cy + y * R * k;
        const near = Math.min(1, Math.max(0, (z + 1.6) / 3.2));
        const glint = 0.55 + 0.45 * Math.sin(s * 3 + p.ph);
        const lvl = Math.min(LEVELS - 1, Math.floor((0.25 + 0.75 * near) * p.bright * glint * LEVELS));
        const d = DOT * (0.5 + 0.6 * near) * k;
        paths[lvl].rect(px - d / 2, py - d / 2, d, d);
      }
      paths.forEach((p, i) => {
        ctx.fillStyle = `rgba(${INK}, ${0.15 + 0.85 * ((i + 0.5) / LEVELS) ** 1.1})`;
        ctx.fill(p);
      });
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
