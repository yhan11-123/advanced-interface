<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 &middot; Edgy, determinate</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A prototype page of its own, so its styles stay in this file.
     A black panel and yellow cracks, the same in either scheme. */
  :root {
    --bg: #0d0d0d;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Edgy, determinate. A black panel. A crack starts at the middle and runs
  // out along the seams of pieces not yet there, branching at every joint,
  // and splits open in yellow: each tip a sharp point, the gap widening
  // behind it and bursting open where the lines meet. Inside, the yellow is
  // rough, torn into streaks of pale, deep and burnt yellow with black
  // splinters, all running the way that crack opens (outward from a joint),
  // and shards of yellow break out past its edges. The branches run at
  // different speeds, so the front is never even. How far out it has spread
  // is how much has loaded, and the roomiest face near the middle carries
  // the percentage; when the cracks reach every edge of the screen it is
  // done. Then the gaps close back into the black for the next load.
  (() => {
    const INK = '#0d0d0d';
    const YELLOW = '#f5c200';          // the gap
    // the streaks torn through it, pale to burnt to black, and how often each comes
    const TONES = ['#fff3b0', '#ffdb45', '#dd9d00', '#8a5a00', '#140e00'];
    const SHARE = [0.14, 0.2, 0.26, 0.2, 0.2];
    const CELL = 0.2;                  // rough size of a piece, share of the short side
    const JOIN = 0.5;                  // chance a piece is joined to a neighbour, for bent, notched shapes
    const WIDTH = [0.005, 0.014];      // half a crack's full width, narrowest to widest, share of the short side
    const WIDE = 0.08;                 // share of cracks that open a little wider
    const POOL = [0.012, 0.03];        // the burst at a joint, radius, share of the short side
    const SPEED = [0.5, 1.6];          // each seam's own speed, slowest to fastest
    const BEHIND = 0.16;               // how far behind its tip a crack reaches full width, share of the short side
    const FLOW = 0.14;                 // how much the widths slowly swell and ebb

    // ---------- timing ----------
    const START = 0.4;                 // the whole panel
    const RUN = 11;                    // seconds of loading
    const HOLD = 0.5;                  // done, cracked to every edge
    const CLOSE = 1.3;                 // the seams thin and close back into the black
    const REST = 0.5;                  // all black again, before the next load

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const stage = document.querySelector('.stage');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let W = 0, H = 0, S = 0, seed = 5, joints = [], seams = [], far = 1, label = null;

    // a small seeded random, so one load's cracks stay the same through a resize
    function rng(a) {
      return () => {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // Cut a convex shape by the line n·x = k, keeping the side n·x <= k.
    // Each corner carries the name of the edge that leaves it.
    function clip(poly, n, k, name) {
      const out = [], side = p => n[0] * p.x + n[1] * p.y - k;
      for (let i = 0; i < poly.length; i++) {
        const P = poly[i], Q = poly[(i + 1) % poly.length], a = side(P), b = side(Q);
        const at = () => { const f = a / (a - b); return { x: P.x + (Q.x - P.x) * f, y: P.y + (Q.y - P.y) * f }; };
        if (a <= 0) {
          out.push(P);
          if (b > 0) out.push({ ...at(), e: name });
        } else if (b <= 0) out.push({ ...at(), e: P.e });
      }
      return out;
    }

    // Lay out the pieces, then keep only their seams: the lines the crack
    // will run along, and the joints where seams meet. Then work out when
    // the crack reaches each joint, going the quickest way from the middle.
    function build() {
      joints = []; seams = []; label = null;
      if (W < 2 || H < 2) return;                        // not laid out yet; the resize will come
      const rnd = rng(seed);
      const mid = [W * (0.5 + (rnd() - 0.5) * 0.1), H * (0.5 + (rnd() - 0.5) * 0.1)];
      const step = S * CELL, cols = Math.ceil(W / step) + 1, rows = Math.ceil(H / step) + 1;
      const ox = (W - (cols - 1) * step) / 2, oy = (H - (rows - 1) * step) / 2;
      const at = [];
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        at.push([ox + (c + (rnd() - 0.5) * 0.95) * step, oy + (r + (rnd() - 0.5) * 0.95) * step]);
      }
      const m = S * 0.03;
      const polys = at.map((a, i) => {
        let poly = [{ x: -m, y: -m, e: -1 }, { x: W + m, y: -m, e: -1 }, { x: W + m, y: H + m, e: -1 }, { x: -m, y: H + m, e: -1 }];
        at.forEach((b, j) => {
          if (j === i || poly.length < 3) return;
          const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy), n = [dx / d, dy / d];
          poly = clip(poly, n, n[0] * (a[0] + b[0]) / 2 + n[1] * (a[1] + b[1]) / 2, j);
        });
        return poly;
      });
      // join some pieces to a neighbour: the seam between them never cracks
      const group = at.map((_, i) => i), size = at.map(() => 1);
      polys.forEach((poly, i) => {
        if (rnd() > JOIN) return;
        const next = poly.map(p => p.e).filter(e => e >= 0);
        const j = next[Math.floor(rnd() * next.length)];
        if (j === undefined) return;
        const a = group[i], b = group[j];
        if (a === b || size[a] + size[b] > 3) return;
        group.forEach((g, k) => { if (g === a) group[k] = b; });
        size[b] += size[a];
      });
      // the face that carries the percentage: the roomiest piece near the
      // middle, the number set in its centre and sized to sit inside it
      label = null;
      polys.forEach((poly, i) => {
        if (poly.length < 3 || poly.some(p => p.x < 0 || p.y < 0 || p.x > W || p.y > H)) return;
        let A = 0, cx = 0, cy = 0;
        poly.forEach((p, k) => {
          const q = poly[(k + 1) % poly.length], c = p.x * q.y - q.x * p.y;
          A += c; cx += (p.x + q.x) * c; cy += (p.y + q.y) * c;
        });
        cx /= 3 * A; cy /= 3 * A;
        if (Math.hypot(cx - mid[0], cy - mid[1]) > S * 0.35) return;
        // room: the nearest edge to the centre
        let room = Infinity;
        poly.forEach((p, k) => {
          const q = poly[(k + 1) % poly.length], dx = q.x - p.x, dy = q.y - p.y, l = Math.hypot(dx, dy);
          room = Math.min(room, Math.abs((cx - p.x) * dy - (cy - p.y) * dx) / l);
        });
        if (!label || room > label.room) label = { x: cx, y: cy, room };
      });
      // joints, one for each corner shared between pieces
      joints = [];
      const joint = p => {
        for (const J of joints) if (Math.abs(J.x - p.x) < 1.5 && Math.abs(J.y - p.y) < 1.5) return J;
        const J = { x: p.x, y: p.y, seams: [], pool: S * (POOL[0] + (POOL[1] - POOL[0]) * rnd()), phase: rnd() * 6.28, when: Infinity };
        joints.push(J);
        return J;
      };
      seams = [];
      const seen = new Set();
      polys.forEach((poly, i) => poly.forEach((P, k) => {
        const j = P.e;
        if (j < 0 || group[i] === group[j]) return;
        const key = Math.min(i, j) + ',' + Math.max(i, j);
        if (seen.has(key)) return;
        seen.add(key);
        const A = joint(P), B = joint(poly[(k + 1) % poly.length]);
        if (A === B) return;
        const len = Math.hypot(B.x - A.x, B.y - A.y);
        const seam = { A, B, len, speed: SPEED[0] + (SPEED[1] - SPEED[0]) * rnd(), phase: rnd() * 6.28,
                       wide: S * (rnd() < WIDE ? WIDTH[1] * (1.2 + rnd() * 0.5) : WIDTH[0] + (WIDTH[1] - WIDTH[0]) * rnd() ** 1.5) };
        seams.push(seam);
        A.seams.push(seam); B.seams.push(seam);
      }));
      // when the crack gets to each joint, the quickest way from the one nearest the middle
      let first = joints[0];
      for (const J of joints) if (Math.hypot(J.x - mid[0], J.y - mid[1]) < Math.hypot(first.x - mid[0], first.y - mid[1])) first = J;
      first.when = 0;
      const open = new Set([first]);
      while (open.size) {
        let J = null;
        for (const K of open) if (!J || K.when < J.when) J = K;
        open.delete(J);
        for (const s of J.seams) {
          const K = s.A === J ? s.B : s.A, t = J.when + s.len / s.speed;
          if (t < K.when) { K.when = t; open.add(K); }
        }
      }
      // done when the crack has reached the edge of the screen all the way round
      const out = joints.filter(J => J.x <= 0 || J.y <= 0 || J.x >= W || J.y >= H);
      far = Math.max(...out.map(J => J.when).filter(isFinite));
      splinter(rng(seed + 1000));
    }

    // ---------- the grain ----------
    // Every crack is drawn onto one layer: first its shape in yellow, then,
    // kept inside that shape, streaks laid along the way it opens (and out
    // from the middle of each joint), then shards breaking out past its
    // edges. Streaks and shards are laid out once per load, in each seam's
    // own terms: how far along it, how far across (as a share of its width
    // there, so they spread as it opens), how long, what tone.
    const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
    let dpr = 1;

    // smooth value noise, for the torn edges
    function noise(seed) {
      const h = (i, j) => { const v = Math.sin(i * 127.1 + j * 311.7 + seed * 74.7) * 43758.5453; return v - Math.floor(v); };
      return (x, y) => {
        const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
        const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
        const a = h(i, j), b = h(i + 1, j), c = h(i, j + 1), d = h(i + 1, j + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      };
    }
    const n2 = noise(2);

    function tone(rnd) {
      let r = rnd(), i = 0;
      while (i < SHARE.length - 1 && r > SHARE[i]) r -= SHARE[i++];
      return i;
    }
    function splinter(rnd) {
      for (const seam of seams) {
        seam.grain = [0, 1].map(() => {
          const streaks = [], shards = [];
          const n = Math.ceil(seam.len / (S * 0.0025));
          for (let k = 0; k < n; k++) {
            const o = (rnd() * 2 - 1) * (rnd() < 0.8 ? 1 : 0.4);        // across; a few kept to the middle
            streaks.push({ s: rnd() * seam.len, l: S * (0.012 + rnd() ** 1.6 * 0.16), o, drift: (rnd() - 0.5) * 0.25,
                           b: tone(rnd) * 2 + (rnd() < 0.35 ? 1 : 0) });
          }
          const m = Math.ceil(seam.len / (S * 0.018));
          for (let k = 0; k < m; k++) {
            shards.push({ s: rnd() * seam.len, side: rnd() < 0.5 ? -1 : 1, l: S * (0.006 + rnd() ** 2 * 0.045),
                          a: 0.08 + rnd() * 0.35, w: S * (0.0015 + rnd() * 0.004), b: rnd() < 0.7 ? 1 : 2 });
          }
          return { streaks, shards };
        });
      }
      for (const J of joints) {
        J.rays = Array.from({ length: 40 }, () => ({ a: rnd() * Math.PI * 2, r0: rnd() * 0.5, r1: 0.6 + rnd() * 0.7, b: tone(rnd) * 2 + (rnd() < 0.3 ? 1 : 0) }));
      }
    }

    // The cracks, yellow and torn, as far as `front` has got; `close` narrows it all, 1 open to 0 shut.
    function pour(front, t, close) {
      if (!layer.width || !layer.height) return;
      const c = lctx;
      c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, layer.width, layer.height); c.restore();
      c.fillStyle = YELLOW;
      crack(c, front, t, close);
      // streaks, bucketed by tone and weight so each bucket is one stroke
      const paths = TONES.flatMap(() => [new Path2D(), new Path2D()]);
      for (const seam of seams) {
        [[seam.A, seam.B], [seam.B, seam.A]].forEach(([A, B], n) => {
          const run = (front - A.when) * seam.speed;
          if (run <= 0) return;
          const reach = Math.min(run, seam.len);
          const dx = (B.x - A.x) / seam.len, dy = (B.y - A.y) / seam.len, nx = -dy, ny = dx;
          for (const st of seam.grain[n].streaks) {
            if (st.s >= reach) continue;
            const e = Math.min(st.s + st.l, reach);
            const w0 = half(seam, A, run, st.s, t, close), w1 = half(seam, A, run, e, t, close);
            const o1 = st.o + st.drift;
            paths[st.b].moveTo(A.x + dx * st.s + nx * st.o * w0, A.y + dy * st.s + ny * st.o * w0);
            paths[st.b].lineTo(A.x + dx * e + nx * o1 * w1, A.y + dy * e + ny * o1 * w1);
          }
        });
      }
      for (const J of joints) {
        const r = poolAt(J, front, t, close);
        if (r <= 0) continue;
        for (const ray of J.rays) {
          const cx = Math.cos(ray.a), cy = Math.sin(ray.a);
          paths[ray.b].moveTo(J.x + cx * ray.r0 * r, J.y + cy * ray.r0 * r);
          paths[ray.b].lineTo(J.x + cx * ray.r1 * r, J.y + cy * ray.r1 * r);
        }
      }
      c.globalCompositeOperation = 'source-atop';       // only inside the yellow
      c.lineCap = 'round';
      TONES.forEach((col, i) => [S * 0.0011, S * 0.0042].forEach((lw, j) => {
        c.strokeStyle = col; c.lineWidth = lw; c.stroke(paths[i * 2 + j]);
      }));
      c.globalCompositeOperation = 'source-over';
      // shards breaking out past the edges, pointing the way the crack runs
      const shardPaths = [null, new Path2D(), new Path2D()];
      for (const seam of seams) {
        [[seam.A, seam.B], [seam.B, seam.A]].forEach(([A, B], n) => {
          const run = (front - A.when) * seam.speed;
          if (run <= 0) return;
          const reach = Math.min(run, seam.len);
          const dx = (B.x - A.x) / seam.len, dy = (B.y - A.y) / seam.len, nx = -dy, ny = dx;
          for (const sh of seam.grain[n].shards) {
            if (sh.s >= reach - S * 0.01) continue;
            const w = half(seam, A, run, sh.s, t, close) * 0.85, l = sh.l * close;
            if (l < 0.5) continue;
            const bx = A.x + dx * sh.s + nx * sh.side * w, by = A.y + dy * sh.s + ny * sh.side * w;
            const ca = Math.cos(sh.a), sa = Math.sin(sh.a) * sh.side;
            const tx = bx + (dx * ca + nx * sa) * l, ty = by + (dy * ca + ny * sa) * l;
            const P = shardPaths[sh.b];
            P.moveTo(bx - dx * sh.w, by - dy * sh.w); P.lineTo(tx, ty); P.lineTo(bx + dx * sh.w, by + dy * sh.w); P.closePath();
          }
        });
      }
      c.fillStyle = TONES[1]; c.fill(shardPaths[1]);
      c.fillStyle = TONES[2]; c.fill(shardPaths[2]);
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(layer, 0, 0);
      ctx.restore();
    }

    function layout() {
      const r = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height; S = Math.min(W, H);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layer.width = canvas.width; layer.height = canvas.height;
      lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build();
    }

    const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

    // One seam cracking in from joint A, `run` along it so far (may pass
    // its end). Sharp at the tip, widening behind, flaring into A's pool.
    // Its edge is torn, never quite even. Filled as it is traced.
    // Half the gap's width at `s` along a seam cracking in from A.
    function half(seam, A, run, s, t, swell) {
      const flow = 1 + FLOW * Math.sin(t * 1.1 + seam.phase);
      const pool = A.pool * swell * ease(run / (S * 0.06));
      let w = seam.wide * swell * flow * ease((run - s) / (S * BEHIND)) ** 0.8;
      w *= 0.72 + 0.56 * n2(s / (S * 0.012), seam.phase * 7);             // a torn, uneven edge
      return w + pool * 0.85 * Math.exp(-((s / (pool * 1.6 + 1)) ** 2));  // opening into the burst at the joint
    }
    // The radius of the burst at joint J.
    function poolAt(J, front, t, swell) {
      const k = ease((front - J.when) / (S * 0.06));
      return k <= 0 ? 0 : J.pool * swell * k * (1 + FLOW * 0.7 * Math.sin(t * 0.9 + J.phase));
    }
    function side(pen, seam, A, B, run, t, swell) {
      if (run <= 0) return;
      const reach = Math.min(run, seam.len), N = Math.max(4, Math.ceil(reach / (S * 0.006)));   // fine steps, for the torn edge
      const dx = (B.x - A.x) / seam.len, dy = (B.y - A.y) / seam.len, nx = -dy, ny = dx;
      const L = [], R = [];
      for (let k = 0; k <= N; k++) {
        const s = reach * k / N, w = half(seam, A, run, s, t, swell);
        const x = A.x + dx * s, y = A.y + dy * s;
        L.push([x + nx * w, y + ny * w]); R.push([x - nx * w, y - ny * w]);
      }
      const pts = [...L, ...R.reverse()];
      pen.beginPath();
      pen.moveTo(pts[0][0], pts[0][1]);
      for (const p of pts) pen.lineTo(p[0], p[1]);
      pen.fill();
    }

    // The whole crack as far as `front` has got (in the same units as
    // `when`), drawn with `pen`; `swell` scales every width.
    function crack(pen, front, t, swell) {
      // each shape filled on its own (in the pen's colour), so where they overlap they never cut holes
      for (const s of seams) {
        side(pen, s, s.A, s.B, (front - s.A.when) * s.speed, t, swell);
        side(pen, s, s.B, s.A, (front - s.B.when) * s.speed, t, swell);
      }
      for (const J of joints) {
        const r = poolAt(J, front, t, swell);
        if (r <= 0) continue;
        pen.beginPath();
        pen.arc(J.x, J.y, r, 0, Math.PI * 2);
        pen.fill();
      }
    }

    // The percentage, in pale grey, set in the middle of its face: light
    // figures, a little open in their spacing.
    function number(pct, alpha) {
      ctx.save();
      // as large as fits: the height inside the face, and "100" across it
      const TRACK = 0.06;                                 // letter spacing, share of the size
      ctx.font = `300 100px "Helvetica Neue", Helvetica, Arial, sans-serif`;
      const wide = (ctx.measureText('100').width + 3 * TRACK * 100) / 100;
      const size = Math.min(label.room * 0.9, label.room * 1.35 / wide);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#d6d6d4';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.font = `300 ${size}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
      if ('letterSpacing' in ctx) ctx.letterSpacing = `${size * TRACK}px`;
      // the spacing also trails the last figure, so shift right by half of it to stay centred
      ctx.fillText(String(pct), label.x + size * TRACK / 2, label.y + size * 0.36);
      ctx.restore();
    }

    // quick at first, slower in the middle, a small stall, then the finish
    function fake(x) {
      return x < 0.55 ? 0.7 * Math.sin((x / 0.55) * Math.PI / 2)
           : x < 0.7 ? 0.7 + (x - 0.55) * 0.2
           : 0.73 + 0.27 * ((x - 0.7) / 0.3) ** 1.4;
    }

    // ?state=0, ?state=progress or ?state=done holds one state still, for
    // taking the frames for the Figma drawings; ?at=12.5 holds any moment, in seconds
    const HELD = new URLSearchParams(location.search).get('state');
    const AT = new URLSearchParams(location.search).get('at');
    let t0 = performance.now(), shown = -1;

    function frame(now) {
      let s = (now - t0) / 1000;
      const END = START + RUN + HOLD + CLOSE + REST;
      if (s > END) { t0 = now; s = 0; seed++; build(); }
      if (reduce.matches) s = Math.min(s, START + RUN + HOLD);
      if (HELD === '0') s = 0;
      else if (HELD === 'progress') s = START + RUN * 0.42;
      else if (HELD === 'done') s = START + RUN + HOLD * 0.5;
      if (AT !== null) s = +AT;
      const t = reduce.matches ? 0 : now / 1000;

      const p = s < START ? 0 : Math.min(1, fake((s - START) / RUN));
      const after = s - START - RUN;                     // time since done
      // past 100% the crack keeps running a little, so every seam fills in
      const front = p * far + Math.max(0, after) * far * 0.12;
      const closing = Math.max(0, Math.min(1, (after - HOLD) / CLOSE));   // 0 open, 1 shut

      ctx.fillStyle = INK;
      ctx.fillRect(0, 0, W, H);
      if (closing < 1) pour(front, t, 1 - ease(closing));
      if (label && closing < 0.6) number(Math.round(p * 100), 1 - closing / 0.6);

      const pct = Math.round(p * 100);
      if (pct !== shown) { shown = pct; stage.setAttribute('aria-valuenow', pct); }
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
