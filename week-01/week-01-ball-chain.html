<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Ball chain loader</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #fbfaf7;
    --ink: #1a1a1a;
    --muted: #77756e;
    --chain: #8a877f;
    --accent: #2b47ff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1c;
      --ink: #ededea;
      --muted: #9a9a94;
      --chain: #8d8b85;
      --accent: #8fa0ff;
    }
  }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  .stage { position: relative; flex: 1; min-height: 120px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .status {
    margin: 0; padding: 0 16px 14px; text-align: center;
    font-size: 13px; color: var(--muted); letter-spacing: .02em;
  }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading" aria-valuetext="Loading">
    <canvas aria-hidden="true"></canvas>
  </div>
  <p class="status">Loading</p>

  <script>
  // Fifteen ball chains hang still from the top edge down to 30% up from the
  // bottom. In place of an indeterminate bar, a circle sweeps back and forth
  // across their lower ends. Only the chains it touches move: the circle drags
  // them along, then they swing back and settle. Tops stay pinned.
  (() => {
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');

    const CHAINS = 15;
    const LINKS = 40;         // points along each chain's curve
    const PERIOD = 2.4;       // seconds for the circle to go there and back
    const RADIUS = 12;
    const STIFF = 2.2;        // higher keeps more of the top straight
    const SPRING = 60;        // pull back toward hanging straight
    const FRICTION = 2.6;     // how fast a swing dies out
    const GRIP = 14;          // how strongly a touching circle drags a chain
    const STEP = 1 / 120;

    let W = 0, H = 0, topY, drop, ballY, reach, maxOff, chains = [];
    let colors = {};

    function readColors() {
      const st = getComputedStyle(document.documentElement);
      colors = { chain: st.getPropertyValue('--chain').trim(), accent: st.getPropertyValue('--accent').trim() };
    }

    function layout() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      topY = -6;
      drop = H * 0.7 - topY;                         // ends 30% up from the bottom
      ballY = topY + drop * 0.88;                    // circle runs across the lower ends
      const span = Math.min(W * 0.6, 420);           // width the row of chains covers
      reach = span / 2 + RADIUS * 3;                 // circle travels just past the row
      maxOff = drop * 0.25;
      chains = Array.from({ length: CHAINS }, (_, c) => ({
        x: W / 2 - span / 2 + (span * c) / (CHAINS - 1),
        off: 0, vel: 0, lag: 0,                      // tip offset, its speed, and a trailing copy for the bend
      }));
    }

    const ballX = t => W / 2 - reach * Math.cos((2 * Math.PI * t) / PERIOD);
    const ballV = t => reach * Math.sin((2 * Math.PI * t) / PERIOD) * (2 * Math.PI) / PERIOD;

    // Where a chain sits at the circle's height.
    const xAtBall = c => c.x + c.off * Math.pow((ballY - topY) / drop, STIFF);

    function simulate(t) {
      const bx = ballX(t), bv = ballV(t);
      for (const c of chains) {
        let acc = -SPRING * c.off - FRICTION * c.vel;
        if (Math.abs(bx - xAtBall(c)) < RADIUS + 3) acc += GRIP * (bv - c.vel);
        c.vel += acc * STEP;
        c.off = Math.max(-maxOff, Math.min(maxOff, c.off + c.vel * STEP));
        c.lag += (c.off - c.lag) * Math.min(1, STEP * 10);
      }
    }

    // One chain's curve: s runs 0 at the pinned top to 1 at the tip. The
    // upper part follows a trailing copy of the tip, so the chain bends.
    function curve(c) {
      return Array.from({ length: LINKS }, (_, i) => {
        const s = i / (LINKS - 1);
        const shift = c.lag + (c.off - c.lag) * s;
        return { x: c.x + shift * Math.pow(s, STIFF), y: topY + drop * s };
      });
    }

    function drawChain(pts) {
      // the thin wire the balls are strung on
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.globalAlpha = 0.45;
      ctx.stroke();
      ctx.globalAlpha = 1;

      // balls placed at an even pitch along the curve
      const R = 2.6, PITCH = 7.5;
      let carry = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        for (let d = carry; d < len; d += PITCH) {
          const k = d / len;
          ctx.beginPath();
          ctx.arc(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, R, 0, Math.PI * 2);
          ctx.fill();
        }
        carry = (carry - len) % PITCH;
        if (carry < 0) carry += PITCH;
      }
    }

    function draw(bx) {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = ctx.fillStyle = colors.chain;
      ctx.lineWidth = 1;
      chains.forEach(c => drawChain(curve(c)));

      ctx.beginPath();
      ctx.arc(bx, ballY, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = colors.accent;
      ctx.fill();
    }

    let raf = 0, last = 0, acc = 0, clock = 0;

    function frame(now) {
      acc += Math.min((now - last) / 1000, 0.05);
      last = now;
      while (acc >= STEP) { clock += STEP; simulate(clock); acc -= STEP; }
      draw(ballX(clock));
      raf = requestAnimationFrame(frame);
    }

    function start() {
      cancelAnimationFrame(raf);
      layout(); readColors();
      clock = 0; acc = 0;
      if (reduce.matches) {
        // Parked: chains hang straight, circle rests off to the left.
        draw(ballX(0));
        return;
      }
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }

    new ResizeObserver(start).observe(canvas);
    reduce.addEventListener('change', start);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); if (reduce.matches) start(); });
  })();
  </script>

</body>
</html>
