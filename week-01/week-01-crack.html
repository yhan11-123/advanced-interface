<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 01 sketch &middot; Crack loader</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file.
     Pale panels on a black crack, the same in either scheme. */
  :root {
    --bg: #0d0d0d;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }
  .stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div class="stage" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <canvas aria-hidden="true"></canvas>
  </div>

  <script>
  // Crack. Four pale panels fill the screen, parted by two thin black
  // cracks that cross somewhere in the middle, where the panels' corners
  // round off and the crack pools, like a joint in enamel. While loading,
  // the cracks wander and tilt, and each of their four arms swells and
  // thins on its own, so every panel keeps changing its width and height
  // and the crossing darts about the screen. When loading is done,
  // the four panels fly off to the four corners, then come back to start again.
  (() => {
    const BG = '#0d0d0d';              // the crack
    const PANEL = '#f3f1ec';

    const GAP = [0.004, 0.03];         // crack width, thinnest to widest, share of the short side
    const ROUND = [0.035, 0.1];        // panel corners at the crossing, share of the short side
    const WANDER = 0.24;               // how far the cracks stray from the middle, share of the screen
    const DRIFT = 1.4;                 // how quickly they wander

    const RUN = 7;                     // seconds of loading
    const EXIT = 0.9;                  // panels fly off
    const EMPTY = 0.5;                 // screen left to the crack
    const ENTER = 0.9;                 // panels come back

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const stage = document.querySelector('.stage');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    let W = 0, H = 0;

    function layout() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // a slow, never-quite-repeating wander, -1 to 1
    const wander = (t, k) => 0.6 * Math.sin(t * 0.9 + k * 1.7) + 0.4 * Math.sin(t * 1.63 + k * 4.1 + 0.8);

    // where two lines, each through points p and q, cross
    function cross(p1, q1, p2, q2) {
      const a1 = q1[1] - p1[1], b1 = p1[0] - q1[0], c1 = a1 * p1[0] + b1 * p1[1];
      const a2 = q2[1] - p2[1], b2 = p2[0] - q2[0], c2 = a2 * p2[0] + b2 * p2[1];
      const d = a1 * b2 - a2 * b1;
      return [(c1 * b2 - c2 * b1) / d, (a1 * c2 - a2 * c1) / d];
    }

    // a closed shape through the points, rounding each corner by its own radius
    function rounded(pts, radii) {
      const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const start = mid(pts[n - 1], pts[0]);
      ctx.moveTo(start[0], start[1]);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        ctx.arcTo(p[0], p[1], q[0], q[1], radii[i]);
      }
      ctx.closePath();
    }

    // quick at first, slower in the middle, a small stall, then the finish
    function fake(x) {
      return x < 0.55 ? 0.7 * Math.sin((x / 0.55) * Math.PI / 2)
           : x < 0.7 ? 0.7 + (x - 0.55) * 0.2
           : 0.73 + 0.27 * ((x - 0.7) / 0.3) ** 1.4;
    }

    let t0 = performance.now(), shown = -1;

    function frame(now) {
      let s = (now - t0) / 1000;
      if (s > RUN + EXIT + EMPTY + ENTER) { t0 = now; s = 0; }
      const t = reduce.matches ? 0 : now / 1000 * DRIFT;

      // how far the panels have flown: 0 in place, 1 gone
      let away = 0;
      if (!reduce.matches) {
        if (s > RUN && s < RUN + EXIT) away = ((s - RUN) / EXIT) ** 3;                 // slow to leave, then fast
        else if (s >= RUN + EXIT && s < RUN + EXIT + EMPTY) away = 1;
        else if (s >= RUN + EXIT + EMPTY) away = (1 - (s - RUN - EXIT - EMPTY) / ENTER) ** 3;  // fast in, settle
      }
      const p = reduce.matches ? 1 : s < RUN ? fake(s / RUN) : 1;

      const S = Math.min(W, H), e = S;   // e: well past the edges
      const range = ([lo, hi], k) => S * (lo + (hi - lo) * (0.5 + 0.5 * wander(t * 1.3, k)));
      // each arm of each crack its own width, so the cracks are never even
      const gTop = range(GAP, 5) / 2, gBottom = range(GAP, 6) / 2;
      const gLeft = range(GAP, 7) / 2, gRight = range(GAP, 8) / 2;
      // the two cracks: one running top to bottom, one left to right, each tilted
      const top = [W * (0.5 + WANDER * wander(t, 0)), -e], bottom = [W * (0.5 + WANDER * wander(t, 1)), H + e];
      const left = [-e, H * (0.5 + WANDER * wander(t, 2))], right = [W + e, H * (0.5 + WANDER * wander(t, 3))];

      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = PANEL;

      // each panel: its side of both cracks, and the direction it leaves in
      [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy], q) => {
        const v0 = [top[0] + sx * gTop, top[1]], v1 = [bottom[0] + sx * gBottom, bottom[1]];
        const h0 = [left[0], left[1] + sy * gLeft], h1 = [right[0], right[1] + sy * gRight];
        const j = cross(v0, v1, h0, h1);                         // this panel's corner at the crossing
        const onV = cross(v0, v1, [0, sy < 0 ? -e : H + e], [1, sy < 0 ? -e : H + e]);
        const onH = cross(h0, h1, [sx < 0 ? -e : W + e, 0], [sx < 0 ? -e : W + e, 1]);
        const far = [sx < 0 ? -e : W + e, sy < 0 ? -e : H + e];
        const dist = away * Math.hypot(W, H) * 0.75;
        const dx = sx * dist * 0.7071, dy = sy * dist * 0.7071;
        const pts = [j, onV, far, onH].map(([x, y]) => [x + dx, y + dy]);
        ctx.beginPath();
        rounded(pts, [range(ROUND, 10 + q), 0, 0, 0]);
        ctx.fill();
      });

      const pct = Math.round(p * 100);
      if (pct !== shown) { shown = pct; stage.setAttribute('aria-valuenow', pct); }
      requestAnimationFrame(frame);
    }

    layout();
    new ResizeObserver(layout).observe(canvas);
    requestAnimationFrame(frame);
  })();
  </script>

</body>
</html>
