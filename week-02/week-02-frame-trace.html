<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 02 sketch &middot; Frame trace badge</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #f4f3ef;
    --ink: #1a1a1a;
    --dot: #e5392f;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); display: grid; place-items: center; }
  .icon { width: min(56vmin, 260px); height: auto; overflow: visible; }
  .icon path { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .dot { fill: var(--dot); stroke: var(--bg); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; }

  .back-pill {
    position: fixed; left: 12px; bottom: 12px; z-index: 9;
    font: 12px/1 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.65);
    padding: 8px 12px; border-radius: 999px; text-decoration: none;
  }
  </style>
</head>
<body>

  <svg class="icon" viewBox="-6 -6 36 36" role="img" aria-label="Messages">
    <!-- the shared speech bubble, still -->
    <path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
    <!-- the frame: a rounded box round the icon, drawn clockwise from the middle of its upper right corner -->
    <path class="frame" d="M24.95 -0.95A7 7 0 0 1 27 4V20A7 7 0 0 1 20 27H4A7 7 0 0 1 -3 20V4A7 7 0 0 1 4 -3H20A7 7 0 0 1 24.95 -0.95z"/>
    <circle class="dot" cx="24.95" cy="-0.95" r="2.6"/>
  </svg>

  <a class="back-pill" href="week-02.html" hidden>&larr; Week 02</a>

  <script>
  // Frame trace. The bubble stays still. A rounded frame draws itself
  // clockwise round it, starting and ending at the frame's upper right
  // corner. Where it closes, a dot appears. Then it clears and goes again.
  (() => {
    const TRACE = 1400;                // ms for one lap of the frame (longer than the icon's lap)
    const HOLD = 1800;                 // ms the dot stays before clearing
    const REST = 900;                  // ms of bare icon between loops

    const svg = document.querySelector('.icon');
    const frame = document.querySelector('.frame');
    const dot = document.querySelector('.dot');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const len = frame.getTotalLength();
    frame.style.strokeDasharray = len;
    frame.style.strokeDashoffset = len;
    dot.style.opacity = 0;

    const wait = ms => new Promise(r => setTimeout(r, ms));

    async function loop() {
      for (;;) {
        await wait(REST);
        if (reduce.matches) {
          // no travelling line: the frame fades in whole, then the dot
          frame.style.strokeDashoffset = 0;
          await frame.animate({ opacity: [0, 1] }, { duration: 300, fill: 'forwards' }).finished;
          await dot.animate({ opacity: [0, 1] }, { duration: 200, fill: 'forwards' }).finished;
        } else {
          frame.style.opacity = 1;
          await frame.animate(
            { strokeDashoffset: [len, 0] },
            { duration: TRACE, easing: 'cubic-bezier(.65, 0, .35, 1)', fill: 'forwards' }
          ).finished;
          await dot.animate(
            { opacity: [0, 1, 1], transform: ['scale(0)', 'scale(1.3)', 'scale(1)'] },
            { duration: 320, easing: 'cubic-bezier(.2, .8, .3, 1)', fill: 'forwards' }
          ).finished;
        }
        svg.setAttribute('aria-label', 'Messages, something new');
        await wait(HOLD);
        await Promise.all([
          frame.animate({ opacity: [1, 0] }, { duration: 260, fill: 'forwards' }).finished,
          dot.animate({ opacity: [1, 0] }, { duration: 260, fill: 'forwards' }).finished
        ]);
        frame.getAnimations().forEach(a => a.cancel());
        dot.getAnimations().forEach(a => a.cancel());
        frame.style.strokeDashoffset = len;
        dot.style.opacity = 0;
        svg.setAttribute('aria-label', 'Messages');
      }
    }
    loop();

    if (window.self === window.top) document.querySelector('.back-pill').removeAttribute('hidden');
  })();
  </script>

</body>
</html>
