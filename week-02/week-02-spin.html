<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 02 sketch &middot; Spin badge</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #f4f3ef;
    --ink: #1a1a1a;
    --dot: #e5392f;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); display: grid; place-items: center; }
  .icon { width: min(46vmin, 220px); height: auto; overflow: visible; }
  .icon path { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .dot { fill: var(--dot); stroke: var(--bg); stroke-width: 1.2; }

  .back-pill {
    position: fixed; left: 12px; bottom: 12px; z-index: 9;
    font: 12px/1 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.65);
    padding: 8px 12px; border-radius: 999px; text-decoration: none;
  }
  </style>
</head>
<body>

  <svg class="icon" viewBox="0 0 24 24" role="img" aria-label="Messages">
    <path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
    <circle class="dot" cx="20.4" cy="4.2" r="2.3"/>
  </svg>

  <a class="back-pill" href="week-02.html" hidden>&larr; Week 02</a>

  <script>
  // Spin. The dot spins its way onto the upper right corner: it circles its
  // own spot, clockwise, on a ring that tightens to nothing while it grows
  // from a speck to full size, and slows as it settles. A plain circle cannot
  // show turning on its own, so the turning is in its path.
  (() => {
    const SPIN = 900;                  // ms from first appearance to settled
    const TURNS = 2;                   // laps round its spot on the way in
    const RING = 4.5;                  // starting radius of the lap, in icon units
    const HOLD = 1800;                 // ms the dot stays before clearing
    const REST = 900;                  // ms of bare icon between loops
    const CX = 20.4, CY = 4.2, R = 2.3;

    const svg = document.querySelector('.icon');
    const dot = document.querySelector('.dot');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const easeOut = t => 1 - Math.pow(1 - t, 3);
    const wait = ms => new Promise(r => setTimeout(r, ms));

    function place(x, y, r, o) {
      dot.setAttribute('cx', x); dot.setAttribute('cy', y);
      dot.setAttribute('r', r); dot.style.opacity = o;
    }

    function spinIn() {
      return new Promise(done => {
        const t0 = performance.now();
        (function frame(now) {
          const t = Math.max(0, Math.min(1, (now - t0) / SPIN)), k = easeOut(t);
          const a = -Math.PI / 2 + k * TURNS * 2 * Math.PI;      // start at the top, go clockwise
          const ring = RING * (1 - k);
          place(CX + Math.cos(a) * ring, CY + Math.sin(a) * ring, R * (0.15 + 0.85 * k), Math.min(1, t * 4));
          if (t < 1) requestAnimationFrame(frame); else done();
        })(t0);
      });
    }

    async function loop() {
      place(CX, CY, R, 0);
      for (;;) {
        await wait(REST);
        if (reduce.matches) {
          place(CX, CY, R, 0);
          await dot.animate({ opacity: [0, 1] }, { duration: 200, fill: 'forwards' }).finished;
          dot.getAnimations().forEach(a => a.cancel());
          dot.style.opacity = 1;
        } else {
          await spinIn();
        }
        svg.setAttribute('aria-label', 'Messages, something new');
        await wait(HOLD);
        await dot.animate({ opacity: [1, 0] }, { duration: 260, fill: 'forwards' }).finished;
        dot.getAnimations().forEach(a => a.cancel());
        place(CX, CY, R, 0);
        svg.setAttribute('aria-label', 'Messages');
      }
    }
    loop();

    if (window.self === window.top) document.querySelector('.back-pill').removeAttribute('hidden');
  })();
  </script>

</body>
</html>
