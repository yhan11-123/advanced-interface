<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 02 &middot; Somber badge</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A prototype page of its own, so its styles stay in this file.
     Somber: a low, cold dusk, everything close in value. The bubble sits on a
     tile, a plain filled face, there from the start. The badge is not a dot
     set on top: the tile's own top edge slowly rises into a low hill, the
     way ground swells, one body with the face it grows from. */
  :root {
    --bg: #15181d;
    --tile: #2a2f37;                             /* the face the bubble sits on */
    --ink: #9aa1a9;                              /* the bubble, muted */
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { display: grid; place-items: center; }
  .icon { width: min(60vmin, 290px); height: auto; overflow: visible; margin-bottom: 6vmin; }
  .tile { fill: var(--tile); }
  .bubble { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  /* the count: a plain sans in a pale grey, sitting in the hill */
  .count { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 400; font-size: 4.4px; fill: #c9ced4; }

  /* three states, one chosen: the chosen one is filled */
  .controls {
    position: fixed; left: 0; right: 0; bottom: 14px; z-index: 5;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 12px;
    font: 400 13px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .04em;
  }
  .controls button {
    height: 32px; padding: 0 16px; border: 1px solid rgba(154, 161, 169, .28); border-radius: 999px;
    background: transparent; color: var(--ink); font: inherit; letter-spacing: inherit; cursor: pointer;
  }
  .controls button:hover:not(:disabled) { border-color: rgba(154, 161, 169, .6); }
  .controls button[aria-pressed="true"] { background: var(--tile); border-color: rgba(154, 161, 169, .5); color: #d6dade; }
  .controls button:disabled { opacity: .35; cursor: not-allowed; }
  .controls button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .back-pill {
    position: fixed; left: 12px; top: 12px; z-index: 9;
    font: 12px/1 system-ui, sans-serif; color: var(--bg); background: rgba(214, 218, 222, .7);
    padding: 8px 12px; border-radius: 999px; text-decoration: none;
  }
  </style>
</head>
<body>

  <svg class="icon" viewBox="-6 -6 36 36" role="img" aria-label="Messages">
    <!-- the tile: a rounded square face behind the bubble, its top edge drawn point by point so it can rise -->
    <path class="tile"/>
    <!-- the shared bubble, still -->
    <path class="bubble" d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
    <defs>
      <!-- the count is kept above the bubble's top line, so a number sinking away goes under the face, not over the bubble -->
      <clipPath id="above"><rect x="-1" y="-8" width="26" height="10.6"/></clipPath>
      <filter id="haze" filterUnits="userSpaceOnUse" x="4" y="-8" width="16" height="14">
        <feGaussianBlur class="haze-blur" stdDeviation="0"/>
      </filter>
      <filter id="haze2" filterUnits="userSpaceOnUse" x="4" y="-8" width="16" height="14">
        <feGaussianBlur class="haze-blur" stdDeviation="0"/>
      </filter>
    </defs>
    <!-- two counts, so the old one can sink away while the new one surfaces -->
    <g clip-path="url(#above)">
      <text class="count" text-anchor="middle" dominant-baseline="central" filter="url(#haze)" opacity="0"></text>
      <text class="count" text-anchor="middle" dominant-baseline="central" filter="url(#haze2)" opacity="0"></text>
    </g>
  </svg>

  <div class="controls" role="group" aria-label="Badge state">
    <button type="button" data-state="none" aria-pressed="true">None</button>
    <button type="button" data-state="dot" aria-pressed="false">Dot</button>
    <button type="button" data-state="content" aria-pressed="false">With content</button>
  </div>
  <p class="sr" id="status" aria-live="polite"></p>

  <a class="back-pill" href="week-02.html" hidden>&larr; Week 02</a>

  <script>
  // Somber badge.
  // The tile is already there, a plain filled face behind the bubble.
  // Dot: no circle appears. The middle of the tile's top edge
  // slowly rises into a low, smooth hill, and as it rises it also spreads a
  // little, the way ground swells rather than something being placed on it.
  // With content: the hill is already there, a little fuller, holding a 2.
  // After a beat, one more arrives as if a small ball were rolling under the
  // tile like under a cloth: never seen, only its bump, which comes up at the
  // tile's left and travels along the top edge, up the hill, and runs into it.
  // As it is taken in, the hill swells a little, the 2 sinks into the face and
  // blurs away, and a 3 surfaces in its place.
  // None: the hill sinks back and the edge is flat again.
  (() => {
    const RISE = 1600;                 // ms for the hill to rise
    const SINK = 1100;                 // ms for it to settle back
    const TILE = { x0: -1, y0: -.5, x1: 25, y1: 25.5, r: 6 };   // square, centred on the bubble (12, 12.5)
    const HILL = { cx: 12, h: 3.4, w0: 7, w1: 9.5 };   // where on the top edge, how high, and its half-width as it starts and at full
    const FULL = 1.2;                  // the hill with a count in it: a little higher and wider than the dot's
    const BEAT = 600;                  // ms the 2 is shown before it changes
    const CHANGE = 2000;               // ms for the ball to come and the 2 to become a 3
    const SWELL = .12;                 // how much the hill swells as it takes the ball in
    const BALL = { h: 1.1, w: 3.2, from: 2.5, to: 9 };   // the bump the ball makes in the edge (height, half-width), and where it rolls from and to
    const SPOT = { x: 12, y: -.7 };    // where the count sits, in the hill
    const DROP = 1.8;                  // how far a count sinks going, or rises from coming

    const svg = document.querySelector('.icon');
    const tile = document.querySelector('.tile');
    const status = document.getElementById('status');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');

    const clamp = x => Math.max(0, Math.min(1, x));
    const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

    // k: 0 flat, 1 the full hill
    let k = 0;
    // the top edge as it is without the hill: flat, curving down into the corners
    function base(x) {
      const { x0, y0, x1, r } = TILE;
      return x < x0 + r ? y0 + r - Math.sqrt(Math.max(0, r * r - (x - x0 - r) ** 2))
           : x > x1 - r ? y0 + r - Math.sqrt(Math.max(0, r * r - (x - x1 + r) ** 2)) : y0;
    }
    const hillW = () => HILL.w0 + (HILL.w1 - HILL.w0) * k;
    // the top edge with the hill: a raised cosine lifted off that edge, so its feet meet it with no kink,
    // raised to a power so it rises clearly rather than as a broad dome, then eased at the very top
    // so the crest is rounded off rather than peaked
    // the ball under the face: where it is along the edge, and how much it shows (0 not there)
    const ball = { x: 0, s: 0 };
    function surface(x) {
      let y = base(x);
      const u = (x - HILL.cx) / hillW();
      if (Math.abs(u) < 1) y -= HILL.h * k * (1 - Math.pow(1 - Math.pow(.5 * (1 + Math.cos(Math.PI * u)), 1.8), 1.35));
      // the ball's bump: the hill's profile in small, low and wide, easing out into the edge at each side
      const v = (x - ball.x) / BALL.w;
      if (ball.s > 0 && Math.abs(v) < 1) y -= BALL.h * ball.s * (1 - Math.pow(1 - .5 * (1 + Math.cos(Math.PI * v)), 1.35));
      return y;
    }
    function render() {
      const { x0, y0, x1, y1, r } = TILE;
      // the hill is wider than the flat part, so it starts partway round each corner
      const w = hillW(), b = HILL.cx + w;
      const a = Math.max(x0 + .6, Math.min(HILL.cx - w, ball.s > 0 ? ball.x - BALL.w : Infinity));
      let top = `A${r} ${r} 0 0 1 ${a} ${base(a).toFixed(3)}`;
      for (let x = a; x <= b + 1e-6; x += .25) top += 'L' + x.toFixed(2) + ' ' + surface(x).toFixed(3);
      tile.setAttribute('d',
        `M${x0} ${y0 + r}` + top +
        `A${r} ${r} 0 0 1 ${x1} ${y0 + r}V${y1 - r}A${r} ${r} 0 0 1 ${x1 - r} ${y1}` +
        `H${x0 + r}A${r} ${r} 0 0 1 ${x0} ${y1 - r}Z`);
    }

    let token = 0;
    function to(target, ms, my) {
      return new Promise(done => {
        const from = k, span = Math.abs(target - from);
        if (!span) return done(true);
        const t0 = performance.now();
        (function f(now) {
          if (my !== token) return done(false);
          const t = clamp((now - t0) / (ms * span));
          k = from + (target - from) * easeInOut(t);
          render();
          if (t < 1) requestAnimationFrame(f); else done(true);
        })(t0);
      });
    }
    // the counts: gone is how far one has sunk away, 0 in place and clear, 1 sunk under the face and blurred out
    const counts = [...document.querySelectorAll('.count')];
    const blurs = [...document.querySelectorAll('.haze-blur')];
    function setCount(i, text, gone) {
      const el = counts[i];
      if (text !== undefined) el.textContent = text;
      el.setAttribute('x', SPOT.x);
      el.setAttribute('y', SPOT.y + DROP * gone);
      el.setAttribute('opacity', 1 - gone);
      blurs[i].setAttribute('stdDeviation', .7 * gone);
    }
    const hideCounts = () => { setCount(0, '', 1); setCount(1, '', 1); };
    const shown = () => counts.some(c => +c.getAttribute('opacity') > 0);

    const announce = label => { svg.setAttribute('aria-label', label); status.textContent = label; };

    // a count already showing sinks away first
    function clearCounts(my) {
      if (!shown() || reduce.matches) { hideCounts(); return Promise.resolve(true); }
      const g0 = counts.map(c => 1 - +c.getAttribute('opacity'));
      return run(500, t => { for (let i = 0; i < 2; i++) setCount(i, undefined, g0[i] + (1 - g0[i]) * easeInOut(t)); }, my);
    }
    function run(ms, fn, my) {
      return new Promise(done => {
        const t0 = performance.now();
        (function f(now) {
          if (my !== token) return done(false);
          const t = clamp((now - t0) / ms);
          fn(t);
          if (t < 1) requestAnimationFrame(f); else done(true);
        })(t0);
      });
    }

    async function showDot(my) {
      if (!(await clearCounts(my))) return;
      // always shown from nothing: if a hill is up, it settles flat first (quickly), then rises again
      if (k > 0 && !reduce.matches && !(await to(0, 600 / Math.max(k, 1), my))) return;
      k = 0; render();
      announce('Messages');
      if (reduce.matches) { k = 1; render(); announce('Messages, something new'); return; }
      if (await to(1, RISE, my)) announce('Messages, something new');
    }
    async function showNone(my) {
      if (!(await clearCounts(my))) return;
      if (reduce.matches) { k = 0; render(); announce('Messages'); return; }
      if (await to(0, SINK, my)) announce('Messages');
    }
    async function showContent(my) {
      // already there: the fuller hill and the 2
      k = FULL; render();
      setCount(0, '2', 0); setCount(1, '', 1);
      announce('Messages, 2 unread');
      if (!(await new Promise(r => setTimeout(() => r(my === token), BEAT)))) return;
      if (reduce.matches) { setCount(0, '3', 0); announce('Messages, 3 unread'); return; }
      const ok = await run(CHANGE, t => {
        // the hill swells a little as it takes the ball in
        k = FULL + SWELL * Math.sin(Math.PI * clamp((t - .5) / .45));
        // the ball under the face: comes up at the left, rolls along the edge and up the slope,
        // and runs into the hill, its bump merging into it
        ball.x = BALL.from + (BALL.to - BALL.from) * easeInOut(t / .6);
        ball.s = clamp(t / .12) * (1 - easeInOut((t - .45) / .2));
        render();
        // as it is taken in, the 2 sinks away and the 3 surfaces, overlapping a little
        setCount(0, '2', easeInOut((t - .55) / .3));
        setCount(1, '3', 1 - easeInOut((t - .62) / .38));
      }, my);
      ball.s = 0; render();
      if (!ok) return;
      k = FULL; render();
      setCount(0, '3', 0); setCount(1, '', 1);
      announce('Messages, 3 unread');
    }

    const buttons = [...document.querySelectorAll('[data-state]')];
    for (const b of buttons) b.addEventListener('click', () => {
      if (b.disabled) return;
      const next = b.dataset.state, my = ++token;
      for (const o of buttons) o.setAttribute('aria-pressed', String(o === b));
      if (next === 'none') showNone(my);
      else if (next === 'dot') showDot(my);
      else showContent(my);
    });

    render(); hideCounts();
    if (window.self === window.top) document.querySelector('.back-pill').removeAttribute('hidden');
  })();
  </script>

</body>
</html>
