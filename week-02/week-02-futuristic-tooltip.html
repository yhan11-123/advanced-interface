<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 02 &middot; Futuristic tooltip</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A prototype page of its own, so its styles stay in this file.
     Futuristic, matching its badge: Obsidian's graph view. The bell is a
     network of notes on springs; hovering it does what hovering a note in the
     graph does: it and its links light up in violet and the rest fall back.
     Then notes stream out of its crown and link up into a box round its name. */
  :root {
    --bg: #1b1b1d;
    --node: #a7a7ad;
    --link: rgba(170, 170, 178, .32);
    --accent: #7fb0ff;                         /* a cool, icy blue */
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { display: grid; place-items: center; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }

  .wrap { position: relative; width: min(70vmin, 340px); aspect-ratio: 1; }
  .graph { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .links line { stroke: var(--link); stroke-width: .14; transition: stroke .25s, opacity .25s; }
  .links line.chord { stroke: rgba(170, 170, 178, .14); stroke-width: .1; }
  .nodes circle { fill: var(--node); transition: fill .25s, opacity .25s; }
  /* hovered: the bell's notes and links light up; the links across fall back */
  .on .links line.bell { stroke: rgba(127, 176, 255, .8); }
  .on .nodes circle.bell { fill: var(--accent); }
  .on .links line.chord { opacity: .35; }
  /* the notes that make the box, and the links between them */
  .links line.box { stroke: rgba(127, 176, 255, .85); stroke-width: .14; }
  .links line.stem { stroke: rgba(127, 176, 255, .6); stroke-width: .12; }
  .nodes circle.box { fill: var(--accent); }
  .fill { fill: #18202c; }
  .tip-text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 2.1px; font-weight: 500; fill: #e2ecff; }

  /* the hit area over the bell: a real button, so the tooltip works by keyboard too */
  .bell-btn {
    position: absolute; left: 33%; top: 30%; width: 34%; height: 44%;
    padding: 0; border: 0; background: none; cursor: pointer; border-radius: 10px;
  }
  .bell-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .hint {
    position: fixed; left: 0; right: 0; bottom: 18px; margin: 0; text-align: center;
    font: 500 12px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; color: rgba(255,255,255,.45);
  }
  .back-pill {
    position: fixed; left: 12px; top: 12px; z-index: 9;
    font: 12px/1 system-ui, sans-serif; color: #fff; background: rgba(255,255,255,.12);
    padding: 8px 12px; border-radius: 999px; text-decoration: none;
  }
  </style>
</head>
<body>

  <div class="wrap">
    <svg class="graph" viewBox="-6 -8 36 36" aria-hidden="true">
      <!-- the shared bell, in two parts, sampled into notes -->
      <path class="body" d="M6 10a6 6 0 0 1 12 0v4l2 3H4l2-3z" fill="none" stroke="none"/>
      <path class="clapper" d="M10 20a2 2 0 0 0 4 0" fill="none" stroke="none"/>
      <rect class="fill" rx=".5" opacity="0"/>
      <g class="links"></g>
      <g class="nodes"></g>
      <text class="tip-text" text-anchor="middle" dominant-baseline="central" opacity="0">Notifications</text>
    </svg>
    <button type="button" class="bell-btn" aria-label="Notifications" aria-describedby="tip"></button>
    <span class="sr" role="tooltip" id="tip">Notifications</span>
  </div>

  <p class="hint">Hover or focus the bell</p>

  <a class="back-pill" href="week-02.html" hidden>&larr; Week 02</a>

  <script>
  // Futuristic tooltip, plain. Hover the bell: like hovering a note in
  // Obsidian's graph, the bell's notes and links light up violet and the links
  // across fall back. Then a stream of notes pours out of the bell's crown,
  // one after another, each flying to its place round a box above the bell
  // and linking to its neighbours, the box tied to the bell by a few irregular links; as the box closes, the name appears inside.
  // The bell takes every tug and settles. On leaving, the name goes and the
  // notes are drawn back into the crown, last out first in.
  (() => {
    const NS = 'http://www.w3.org/2000/svg';
    const K_HOME = 40, K_LINK = 60, DAMP = 7;
    const DELAY = 180;                     // ms of hover before it starts
    const BOX_N = 30;                      // notes round the box
    const LAUNCH = 16;                     // ms between one note leaving the crown and the next
    const RETURN = 10;                     // ms between notes going back
    const PAD_X = 2.8, BOX_H = 5.6;        // box padding round the name, and its height: room to breathe
    const GAP = 3.4;                       // from the bell's crown up to the box's lower edge

    const wrap = document.querySelector('.wrap');
    const svg = document.querySelector('.graph');
    const gLinks = svg.querySelector('.links');
    const gNodes = svg.querySelector('.nodes');
    const fill = svg.querySelector('.fill');
    const label = svg.querySelector('.tip-text');
    const btn = document.querySelector('.bell-btn');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');

    // ---- a graph of notes on springs
    const nodes = [], links = [];
    function node(x, y, r, cls) {
      const el = document.createElementNS(NS, 'circle');
      el.setAttribute('r', r); el.setAttribute('class', cls);
      gNodes.appendChild(el);
      const n = { x, y, vx: 0, vy: 0, hx: x, hy: y, el };
      nodes.push(n); return n;
    }
    function link(a, b, cls, rest) {
      const el = document.createElementNS(NS, 'line');
      el.setAttribute('class', cls);
      gLinks.appendChild(el);
      const l = { a, b, el, rest: rest ?? Math.hypot(a.hx - b.hx, a.hy - b.hy), k: cls === 'chord' ? .3 : 1 };
      links.push(l); return l;
    }
    function unlink(l) { l.el.remove(); links.splice(links.indexOf(l), 1); }
    function drop(n) { n.el.remove(); nodes.splice(nodes.indexOf(n), 1); }

    // the bell
    function sample(path, count, closed) {
      const len = path.getTotalLength(), out = [];
      const n = closed ? count : count - 1;
      for (let i = 0; i < count; i++) {
        const p = path.getPointAtLength(len * i / n);
        out.push(node(p.x, p.y, .3 + ((i * 7) % 5) * .05, 'bell'));
      }
      for (let i = 0; i < (closed ? count : count - 1); i++) link(out[i], out[(i + 1) % count], 'bell');
      return out;
    }
    const body = sample(svg.querySelector('.body'), 30, true);
    const clap = sample(svg.querySelector('.clapper'), 6, false);
    for (let i = 0; i < body.length; i += 3) for (let j = i + 5; j < i + 11; j += 3) {
      const a = body[i], b = body[j % body.length];
      if (Math.hypot(a.hx - b.hx, a.hy - b.hy) < 8) link(a, b, 'chord');
    }
    const nearestOf = (p, pool) => pool.reduce((m, n) => Math.hypot(n.hx - p.hx, n.hy - p.hy) < Math.hypot(m.hx - p.hx, m.hy - p.hy) ? n : m);
    link(clap[0], nearestOf(clap[0], body), 'chord'); link(clap[clap.length - 1], nearestOf(clap[clap.length - 1], body), 'chord');
    const crown = body.reduce((m, n) => n.hy < m.hy || (n.hy === m.hy && Math.abs(n.hx - 12) < Math.abs(m.hx - 12)) ? n : m);

    // ---- the box: its corners and the points round it, starting from the bottom middle,
    // so the stream fills it outward both ways from where it arrives
    function boxPoints() {
      const w = label.getComputedTextLength() + PAD_X * 2;
      const cx = crown.hx, bottom = crown.hy - GAP, top = bottom - BOX_H;
      const L = cx - w / 2, R = cx + w / 2;
      // the perimeter as one path, walked from the bottom middle round anticlockwise on screen
      const corners = [[cx, bottom], [R, bottom], [R, top], [L, top], [L, bottom], [cx, bottom]];
      const seg = [], lens = [];
      let total = 0;
      for (let i = 0; i < corners.length - 1; i++) {
        const [x1, y1] = corners[i], [x2, y2] = corners[i + 1], d = Math.hypot(x2 - x1, y2 - y1);
        seg.push([x1, y1, x2, y2, d]); total += d;
      }
      const pts = [];
      for (let i = 0; i < BOX_N; i++) {
        let s = total * i / BOX_N;
        for (const [x1, y1, x2, y2, d] of seg) {
          if (s <= d) { pts.push({ x: x1 + (x2 - x1) * s / d, y: y1 + (y2 - y1) * s / d }); break; }
          s -= d;
        }
      }
      return { pts, cx, top, bottom, w };
    }

    // ---- the simulation
    let running = false, last = 0, busy = false;
    function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); } }
    function tick(now) {
      let dt = Math.min(.05, Math.max(0, now - last) / 1000); last = now;
      while (dt > 0) {
        const h = Math.min(1 / 120, dt); dt -= h;
        for (const n of nodes) { n.ax = K_HOME * (n.hx - n.x); n.ay = K_HOME * (n.hy - n.y); }
        for (const l of links) {
          const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy) || 1e-6;
          const f = K_LINK * l.k * (d - l.rest) / d;
          l.a.ax += f * dx * .5; l.a.ay += f * dy * .5;
          l.b.ax -= f * dx * .5; l.b.ay -= f * dy * .5;
        }
        for (const n of nodes) {
          n.vx += (n.ax - DAMP * n.vx) * h; n.vy += (n.ay - DAMP * n.vy) * h;
          n.x += n.vx * h; n.y += n.vy * h;
        }
      }
      let e = 0;
      for (const n of nodes) e += n.vx * n.vx + n.vy * n.vy + (n.x - n.hx) ** 2 + (n.y - n.hy) ** 2;
      render();
      if (e > 1e-4 || busy) requestAnimationFrame(tick); else running = false;
    }
    function render() {
      for (const n of nodes) { n.el.setAttribute('cx', n.x); n.el.setAttribute('cy', n.y); }
      for (const l of links) {
        l.el.setAttribute('x1', l.a.x); l.el.setAttribute('y1', l.a.y);
        l.el.setAttribute('x2', l.b.x); l.el.setAttribute('y2', l.b.y);
      }
    }

    // ---- show and hide
    let boxNodes = [], boxLinks = [], token = 0, timer = 0, open = false;
    const wait = ms => new Promise(r => setTimeout(r, ms));
    function fade(el, to, ms) { el.animate({ opacity: [el.getAttribute('opacity') ?? 1, to] }, { duration: ms, fill: 'forwards' }); el.setAttribute('opacity', to); }

    async function showTip() {
      const my = ++token;
      if (open) return; open = true;
      wrap.classList.add('on');
      const { pts, cx, top, bottom, w } = boxPoints();
      fill.setAttribute('x', cx - w / 2); fill.setAttribute('y', top);
      fill.setAttribute('width', w); fill.setAttribute('height', BOX_H);
      label.setAttribute('x', cx); label.setAttribute('y', (top + bottom) / 2);

      // every note starts in the crown and is let go one after another
      clearBox();
      for (const p of pts) {
        const n = node(crown.x, crown.y, .26, 'box');
        n.home = p; n.hx = crown.hx; n.hy = crown.hy;         // held at the crown until its turn
        boxNodes.push(n);
      }
      // the box's own links, and the first note tied back to the crown
      for (let i = 0; i < boxNodes.length; i++) {
        const a = boxNodes[i], b = boxNodes[(i + 1) % boxNodes.length];
        boxLinks.push(link(a, b, 'box', Math.hypot(a.home.x - b.home.x, a.home.y - b.home.y)));
      }
      // irregular links tie the bell to the box, as links in a graph run where they like:
      // two to its lower edge, one to its left side, two over to its top
      const upper = body.filter(n => n.hy < crown.hy + 6).sort((a, c) => a.hx - c.hx);   // the dome, left to right
      const bell = f => upper[Math.round(f * (upper.length - 1))];
      const L = cx - w / 2;
      const sideOf = (pred, key) => boxNodes.filter(pred).sort((a, c) => a.home[key] - c.home[key]);
      const lowerEdge = sideOf(n => Math.abs(n.home.y - bottom) < .01, 'x');
      const topEdge = sideOf(n => Math.abs(n.home.y - top) < .01, 'x');
      const leftEdge = sideOf(n => Math.abs(n.home.x - L) < .01, 'y');
      const at = (list, f) => list[Math.round(f * (list.length - 1))];
      const ties = [
        [bell(.38), at(lowerEdge, .3)],      // lower edge, leaning left
        [bell(.78), at(lowerEdge, .82)],     // lower edge, from the right shoulder
        [bell(.05), at(leftEdge, .5)],       // the left side, from the far left of the dome
        [bell(.6), at(topEdge, .2)],         // over the box to its top, crossing left
        [bell(.18), at(topEdge, .74)]        // and one crossing right
      ];
      for (const [d, b] of ties) if (d && b) boxLinks.push(link(d, b, 'stem', Math.hypot(b.home.x - d.hx, b.home.y - d.hy)));

      if (reduce.matches) {
        for (const n of boxNodes) { n.hx = n.x = n.home.x; n.hy = n.y = n.home.y; }
        render(); fill.setAttribute('opacity', .92); label.setAttribute('opacity', 1); return;
      }
      busy = true; kick();
      // the stream: the order fans out from the bottom middle, both ways round at once
      const order = boxNodes.map((n, i) => ({ n, k: Math.min(i, boxNodes.length - i) })).sort((a, b) => a.k - b.k);
      for (const { n } of order) {
        if (my !== token) return;
        n.hx = n.home.x; n.hy = n.home.y;
        n.vx = (n.home.x - n.x) * 2; n.vy = (n.home.y - n.y) * 2 - 4;    // flung out of the crown
        await wait(LAUNCH);
      }
      await wait(220);                                               // the box closes
      if (my !== token) return;
      fade(fill, .92, 200); fade(label, 1, 220);                     // and the name is there inside it
      busy = false;
    }

    async function hideTip() {
      const my = ++token;
      clearTimeout(timer);
      if (!open) return; open = false;
      fade(label, 0, 100); fade(fill, 0, 140);
      if (!reduce.matches) {
        busy = true; kick();
        // drawn back into the crown, the last out going first
        const order = boxNodes.map((n, i) => ({ n, k: Math.min(i, boxNodes.length - i) })).sort((a, b) => b.k - a.k);
        for (const { n } of order) {
          if (my !== token) return;
          n.hx = crown.hx; n.hy = crown.hy;
          await wait(RETURN);
        }
        for (const l of boxLinks) l.rest = 0;
        await wait(320);
        if (my !== token) return;
        busy = false;
      }
      clearBox();
      wrap.classList.remove('on');
      render(); kick();
    }
    function clearBox() {
      for (const l of boxLinks) unlink(l);
      for (const n of boxNodes) drop(n);
      boxLinks = []; boxNodes = [];
    }

    // hover waits a beat; keyboard focus shows at once; Esc closes
    wrap.addEventListener('mouseenter', () => { clearTimeout(timer); timer = setTimeout(showTip, DELAY); });
    wrap.addEventListener('mouseleave', hideTip);
    btn.addEventListener('focus', showTip);
    btn.addEventListener('blur', hideTip);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });

    // on load, the bell falls into shape from a loose scatter
    if (!reduce.matches) {
      let seed = 5;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 - .5;
      for (const n of nodes) { n.x += rnd() * 6; n.y += rnd() * 6; }
    }
    render(); kick();

    if (window.self === window.top) document.querySelector('.back-pill').removeAttribute('hidden');
  })();
  </script>

</body>
</html>
