<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 02 sketch &middot; Sweep badge</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #f4f3ef;
    --ink: #1a1a1a;
    --dot: #e5392f;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); display: grid; place-items: center; }
  .icon { width: min(46vmin, 220px); height: auto; overflow: visible; }
  .icon path { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .dot { fill: var(--dot); stroke: var(--bg); stroke-width: 1.2; }
  /* the reveal: a wedge that opens clockwise from twelve o'clock.
     A circle of radius 1.5 drawn with a 3-wide stroke covers a disc of radius 3;
     drawing that stroke along its length paints the disc in as a sweep. */
  .wedge { fill: none; stroke: #fff; stroke-width: 3; }

  .back-pill {
    position: fixed; left: 12px; bottom: 12px; z-index: 9;
    font: 12px/1 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.65);
    padding: 8px 12px; border-radius: 999px; text-decoration: none;
  }
  </style>
</head>
<body>

  <svg class="icon" viewBox="0 0 24 24" role="img" aria-label="Messages">
    <defs>
      <mask id="sweep" maskUnits="userSpaceOnUse" x="0" y="-2" width="26" height="26">
        <!-- turned back a quarter so the sweep starts at the top; a circle's stroke runs clockwise on screen -->
        <circle class="wedge" cx="20.4" cy="4.2" r="1.5" transform="rotate(-90 20.4 4.2)"/>
      </mask>
    </defs>
    <path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
    <circle class="dot" cx="20.4" cy="4.2" r="2.3" mask="url(#sweep)"/>
  </svg>

  <a class="back-pill" href="week-02.html" hidden>&larr; Week 02</a>

  <script>
  // Sweep. The dot is revealed clockwise, like a clock hand going once round
  // from twelve: a wedge opens from the top of the dot's spot and widens
  // until the whole dot is there. Then it clears and goes again.
  (() => {
    const SWEEP = 650;                 // ms for the wedge to go all the way round
    const HOLD = 1800;                 // ms the dot stays before clearing
    const REST = 900;                  // ms of bare icon between loops

    const svg = document.querySelector('.icon');
    const wedge = document.querySelector('.wedge');
    const dot = document.querySelector('.dot');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const len = 2 * Math.PI * 1.5;
    wedge.style.strokeDasharray = len;
    wedge.style.strokeDashoffset = len;
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const settle = el => el.getAnimations().forEach(a => a.cancel());

    async function loop() {
      for (;;) {
        await wait(REST);
        if (reduce.matches) {
          // no sweep: the whole dot fades in
          wedge.style.strokeDashoffset = 0;
          await dot.animate({ opacity: [0, 1] }, { duration: 200, fill: 'forwards' }).finished;
        } else {
          await wedge.animate(
            { strokeDashoffset: [len, 0] },
            { duration: SWEEP, easing: 'cubic-bezier(.45, 0, .25, 1)', fill: 'forwards' }
          ).finished;
        }
        svg.setAttribute('aria-label', 'Messages, something new');
        await wait(HOLD);
        await dot.animate({ opacity: [1, 0] }, { duration: 260, fill: 'forwards' }).finished;
        settle(wedge); settle(dot);
        wedge.style.strokeDashoffset = len;
        svg.setAttribute('aria-label', 'Messages');
      }
    }
    loop();

    if (window.self === window.top) document.querySelector('.back-pill').removeAttribute('hidden');
  })();
  </script>

</body>
</html>
