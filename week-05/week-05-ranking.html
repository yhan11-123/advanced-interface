<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 05 sketch &middot; Ranking</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-05-sketch.css?v=3" />
  <style>
  /* Ranking, laid sideways as in its reference, a chart of albums. Tall white cards stand in one
     sliding row on a lilac-to-periwinkle haze. Each reads top to bottom: a big condensed numeral
     over a short red dash (leading), title and artist (content), the cover with a long coloured
     shadow, then a row of small grey actions (trailing). A red segment on a thin rail under the
     row shows where in the chart you are. Opening a card widens it to list its versions. */
  @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@400;500;600&display=swap");
  :root { --w: 360px; --ink: #232326; --muted: #9b9aa3; --num: #6f6f74; --red: #e3476b; --card-w: 150px; --open-w: 300px;
    --ease: cubic-bezier(.2, .8, .2, 1); --font: "Inter", system-ui, sans-serif; --cond: "Barlow Condensed", "Arial Narrow", sans-serif; }
  body { font-family: var(--font); color: var(--ink);
    background: radial-gradient(70% 60% at 0% 0%, #ead3f2, transparent 70%), radial-gradient(60% 60% at 100% 0%, #f8ecdc, transparent 70%),
                linear-gradient(160deg, #f3eef8 30%, #b9b8e3 100%); }
  .level { padding: 18px 0 28px; overflow: hidden; }
  .head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 18px; margin-bottom: 14px; }
  .head h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .date { display: flex; align-items: center; gap: 5px; color: var(--muted); }
  .date b { font: 300 24px/1 var(--font); }
  .date span { font-size: 9px; line-height: 1.15; }

  .track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 18px;
    padding: 4px 18px 24px; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track::-webkit-scrollbar { display: none; }

  .card { flex: none; display: flex; width: var(--card-w); overflow: hidden; scroll-snap-align: start; background: #fff; border-radius: 4px;
    box-shadow: 0 12px 26px -16px rgba(86, 66, 160, .4); transition: width .45s var(--ease), transform .2s ease, box-shadow .2s ease; }
  .card:has(.row:hover) { transform: translateY(-4px); box-shadow: 0 22px 34px -18px rgba(86, 66, 160, .55); }
  .card:has(.row:active) { transform: translateY(-1px) scale(.985); }
  .card.is-open { width: var(--open-w); }
  .main { flex: none; width: var(--card-w); padding: 16px 14px 12px; }
  .row { display: block; width: 100%; }
  .row:focus-visible { outline: 2px solid var(--red); outline-offset: 6px; }

  /* leading: the rank, a numeral over a red dash that stretches on hover */
  .rank { display: block; font: 600 34px/1 var(--cond); color: var(--num); }
  .rank::after { content: ""; display: block; width: 14px; height: 2px; margin-top: 8px; background: var(--red); transition: width .25s ease; }
  .row:hover .rank::after, .is-open .rank::after { width: 30px; }
  .t { display: block; margin-top: 18px; font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { display: block; margin-top: 2px; font-size: 10.5px; color: var(--muted); }
  .cover { display: block; aspect-ratio: 1; margin-top: 12px; border-radius: 2px; background: var(--art); box-shadow: 0 14px 18px -12px var(--glow); transition: transform .3s var(--ease); }
  .row:hover .cover { transform: translateY(-2px); }
  .acts { display: flex; gap: 12px; margin-top: 14px; color: #8f8e97; }
  .acts svg { width: 12px; height: 12px; }
  .acts .more { margin-left: auto; transition: rotate .3s var(--ease); }
  .is-open .acts .more { rotate: 90deg; color: var(--red); }

  /* opened: the versions stand beside the card's own column */
  .side { flex: none; width: calc(var(--open-w) - var(--card-w)); padding: 16px 14px 12px 0; opacity: 0; transition: opacity .2s ease; }
  .is-open .side { opacity: 1; transition: opacity .3s ease .18s; }
  .side p { margin: 10px 0 8px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .ver { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid #f0eef4; font-size: 11.5px; white-space: nowrap; }
  .ver i { width: 22px; height: 22px; border-radius: 2px; }
  .ver span { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* where in the chart: a red segment riding a thin rail */
  .rail { position: relative; width: 120px; height: 2px; margin: 0 18px 0 auto; background: rgba(35, 35, 38, .12); }
  .rail i { position: absolute; left: 0; top: 0; height: 2px; width: 30%; background: var(--red); }
  @media (prefers-reduced-motion: reduce) { .card, .side, .cover { transition: none; } }
  </style>
</head>
<body>
  <div class="stage">

    <section class="level is-on" id="home">
      <div class="head"><h1>Ranking Lists</h1><span class="date"><b>15</b><span>June<br>Friday</span></span></div>

      <div class="track" role="list"></div>
      <div class="rail" aria-hidden="true"><i></i></div>

      <template id="card">
        <div class="card" role="listitem">
          <div class="main"><button class="row">
            <span class="rank"></span><span class="t"></span><span class="s"></span><span class="cover"></span>
          </button>
          <span class="acts">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7 2v7M4 6l3 3 3-3M2.5 11.5h9"/></svg>
            <svg viewBox="0 0 14 14" fill="currentColor"><path d="M7 12S1.5 8.6 1.5 5.2A2.7 2.7 0 0 1 7 4a2.7 2.7 0 0 1 5.5 1.2C12.5 8.6 7 12 7 12z"/></svg>
            <svg viewBox="0 0 14 14" fill="currentColor"><path d="M8 2l5 4.5L8 11V8.5C4.5 8.5 2.5 9.5 1 12c.5-4 2.5-6.5 7-7V2z"/></svg>
            <svg class="more" viewBox="0 0 14 14" fill="currentColor"><circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/><circle cx="11" cy="7" r="1.2"/></svg>
          </span></div>
        </div>
      </template>
    </section>

  </div>
  <a class="back-pill" href="week-05.html" hidden>&larr; Week 05</a>
  <script src="week-05-sketch.js?v=6"></script>
  <script>
    // one card build for the whole chart; a card with versions opens sideways
    const songs = [
      ['Bubble pop', 'Kim Hyun A', 'linear-gradient(140deg,#2d3c4e,#c43d3d 60%,#e8d2b0)', 'rgba(196,61,61,.55)'],
      ['Love me', 'Kim Hyun A', 'linear-gradient(160deg,#e9e3dc,#b88f78)', 'rgba(150,110,90,.5)'],
      ['Billy cullum', 'Lost in you', 'linear-gradient(150deg,#f6b99a,#e98a8f 60%,#8a7fd6)', 'rgba(233,138,143,.6)',
        [['Original', '3:24', 'linear-gradient(150deg,#f6b99a,#8a7fd6)'], ['Acoustic', '3:51', 'linear-gradient(150deg,#ffd9c4,#e98a8f)'], ['Night mix', '4:02', 'linear-gradient(150deg,#c9c2f3,#5a4fc0)']]],
      ['Candy bar creep', 'MSMR', 'linear-gradient(160deg,#f7b5d6,#8fd3e8 55%,#f4d36b)', 'rgba(143,211,232,.6)'],
      ['Night drive', 'Oh Wonder', 'linear-gradient(170deg,#1d2242,#5b4fb5 70%,#e78bb8)', 'rgba(91,79,181,.55)'],
    ];
    const track = document.querySelector('.track'), tpl = document.getElementById('card');
    songs.forEach(([t, s, art, glow, vers], i) => {
      const el = tpl.content.firstElementChild.cloneNode(true);
      el.style.setProperty('--art', art); el.style.setProperty('--glow', glow);
      el.querySelector('.rank').textContent = String(i + 1).padStart(2, '0');
      el.querySelector('.t').textContent = t; el.querySelector('.s').textContent = s;
      if (vers) {
        el.setAttribute('data-item', '');
        const row = el.querySelector('.row');
        row.setAttribute('data-expand', ''); row.setAttribute('aria-expanded', 'false');
        el.insertAdjacentHTML('beforeend', `<div class="side"><p>${vers.length} versions</p>${vers.map(([n, d, a]) =>
          `<div class="ver"><i style="background:${a}"></i>${n}<span>${d}</span></div>`).join('')}</div>`);
        row.addEventListener('click', () => setTimeout(() => {
          if (el.classList.contains('is-open')) track.scrollTo({ left: el.offsetLeft - 18, behavior: 'smooth' });
        }, 460));
      }
      track.appendChild(el);
    });

    // the red segment: its length is how much of the chart shows, its place is how far along
    const seg = document.querySelector('.rail i');
    const rail = () => {
      const max = track.scrollWidth - track.clientWidth, part = track.clientWidth / track.scrollWidth;
      seg.style.width = part * 100 + '%';
      seg.style.left = (max > 0 ? track.scrollLeft / max : 0) * (1 - part) * 100 + '%';
    };
    track.addEventListener('scroll', rail, { passive: true });
    new ResizeObserver(rail).observe(track); rail();
  </script>
</body>
</html>
