<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 05 sketch &middot; Ranking</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-05-sketch.css?v=3" />
  <style>
  /* Ranking: after a chart of albums. A big condensed numeral with a short red dash under it
     leads each row; white cards float on a lilac-to-periwinkle haze with long, soft shadows. */
  @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@400;500;600&display=swap");
  :root {
    --ink: #232326; --muted: #9b9aa3; --num: #6f6f74; --red: #e3476b;
    --card: #fff; --font: "Inter", system-ui, sans-serif; --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --shadow: 0 10px 24px -14px rgba(86, 66, 160, .38);
  }
  body { font-family: var(--font); color: var(--ink);
    background: radial-gradient(70% 60% at 0% 0%, #ead3f2, transparent 70%), radial-gradient(60% 60% at 100% 0%, #f8ecdc, transparent 70%),
                linear-gradient(160deg, #f3eef8 30%, #b9b8e3 100%); }
  .level { padding: 16px 16px 28px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 2px 14px; }
  .head h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .date { display: flex; align-items: center; gap: 5px; color: var(--muted); }
  .date b { font: 300 24px/1 var(--font); }
  .date span { font-size: 9px; line-height: 1.15; }

  .list { display: grid; gap: 8px; }
  .row, .item { background: var(--card); border-radius: 6px; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 12px;
    transition: transform .2s ease, box-shadow .2s ease; }
  .item > .row { box-shadow: none; }
  .row:hover { transform: translateY(-2px); box-shadow: 0 16px 28px -14px rgba(86, 66, 160, .5); }
  .item > .row:hover { transform: none; box-shadow: none; }
  .item:has(> .row:hover) { box-shadow: 0 16px 28px -14px rgba(86, 66, 160, .5); }
  .row:active { transform: scale(.985); }
  .row:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* leading: the rank, a numeral over a red dash that stretches on hover */
  .rank { flex: none; width: 34px; font: 600 26px/1 var(--cond); color: var(--num); }
  .rank::after { content: ""; display: block; width: 12px; height: 2px; margin-top: 5px; background: var(--red); transition: width .25s ease; }
  .row:hover .rank::after, .is-open .rank::after { width: 22px; }
  .icon { flex: none; width: 34px; display: grid; place-items: start; color: var(--num); }
  .text { flex: 1; min-width: 0; }
  .t { display: block; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
  .thumb { flex: none; width: 40px; height: 40px; border-radius: 3px; box-shadow: 0 8px 14px -8px var(--glow, rgba(0,0,0,.4)); }
  .trail { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .go { flex: none; width: 14px; color: var(--muted); transition: transform .2s ease, color .2s ease; }
  .row:hover .go { transform: translateX(2px); color: var(--red); }
  .plus { flex: none; width: 14px; height: 14px; position: relative; color: var(--muted); }
  .plus::before, .plus::after { content: ""; position: absolute; left: 3px; right: 3px; top: 6px; height: 1.5px; background: currentColor; transition: transform .25s ease; }
  .plus::after { transform: rotate(90deg); }
  .is-open .plus::after { transform: rotate(0); }

  .sub-in { padding: 2px 12px 12px 58px; }
  .acts { display: flex; gap: 14px; padding: 6px 0 10px; color: var(--muted); }
  .acts svg { width: 14px; height: 14px; }
  .mini { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid #f0eef4; font-size: 12px; }
  .mini .thumb { width: 26px; height: 26px; }
  .mini .trail { margin-left: auto; }

  /* one level deeper: the track itself */
  </style>
</head>
<body>
  <div class="stage">

    <section class="level is-on" id="home">
      <div class="head"><h1>Ranking Lists</h1><span class="date"><b>15</b><span>June<br>Friday</span></span></div>
      <div class="list">
        <button class="row">
          <span class="rank">01</span>
          <span class="text"><span class="t">Bubble pop</span><span class="s">Kim Hyun A</span></span>
          <span class="thumb" style="background:linear-gradient(140deg,#2d3c4e,#c43d3d 60%,#e8d2b0); --glow:rgba(196,61,61,.55)"></span>
          <svg class="go" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3l4 4-4 4"/></svg>
        </button>
        <button class="row">
          <span class="rank">02</span>
          <span class="text"><span class="t">Love me</span><span class="s">Kim Hyun A</span></span>
          <span class="thumb" style="background:linear-gradient(160deg,#e9e3dc,#b88f78); --glow:rgba(150,110,90,.5)"></span>
          <svg class="go" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3l4 4-4 4"/></svg>
        </button>
        <div class="item" data-item>
          <button class="row" data-expand aria-expanded="false">
            <span class="rank">03</span>
            <span class="text"><span class="t">Billy cullum</span><span class="s">Lost in you &middot; 3 versions</span></span>
            <span class="thumb" style="background:linear-gradient(150deg,#f6b99a,#e98a8f 60%,#8a7fd6); --glow:rgba(233,138,143,.6)"></span>
            <span class="plus"></span>
          </button>
          <div class="sub"><div><div class="sub-in">
            <div class="acts">
              <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7 2v7M4 6l3 3 3-3M2.5 11.5h9"/></svg>
              <svg viewBox="0 0 14 14" fill="currentColor"><path d="M7 12S1.5 8.6 1.5 5.2A2.7 2.7 0 0 1 7 4a2.7 2.7 0 0 1 5.5 1.2C12.5 8.6 7 12 7 12z"/></svg>
              <svg viewBox="0 0 14 14" fill="currentColor"><path d="M8 2l5 4.5L8 11V8.5C4.5 8.5 2.5 9.5 1 12c.5-4 2.5-6.5 7-7V2z"/></svg>
            </div>
            <div class="mini"><span class="thumb" style="background:linear-gradient(150deg,#f6b99a,#8a7fd6)"></span>Original<span class="trail">3:24</span></div>
            <div class="mini"><span class="thumb" style="background:linear-gradient(150deg,#ffd9c4,#e98a8f)"></span>Acoustic<span class="trail">3:51</span></div>
            <div class="mini"><span class="thumb" style="background:linear-gradient(150deg,#c9c2f3,#5a4fc0)"></span>Night mix<span class="trail">4:02</span></div>
          </div></div></div>
        </div>
        <button class="row">
          <span class="rank">04</span>
          <span class="text"><span class="t">Candy bar creep</span><span class="s">MSMR</span></span>
          <span class="trail">2:58</span>
          <svg class="go" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3l4 4-4 4"/></svg>
        </button>
        <button class="row">
          <span class="icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="13" r="2.5"/><path d="M8.5 13V3l7-1.5v9"/><circle cx="13" cy="10.5" r="2.5"/></svg></span>
          <span class="text"><span class="t">All 50 songs</span></span>
          <svg class="go" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3l4 4-4 4"/></svg>
        </button>
      </div>
    </section>

  </div>
  <a class="back-pill" href="week-05.html" hidden>&larr; Week 05</a>
  <script src="week-05-sketch.js?v=3"></script>
</body>
</html>
