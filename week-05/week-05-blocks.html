<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 05 sketch &middot; Blocks</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-05-sketch.css?v=3" />
  <style>
  /* Blocks: after a habit list. Every row is a block of one flat pastel, and a big plain shape
     in a deeper tone of the same colour sits cropped against its right edge: a building, a heart,
     a half moon, a trapezoid. A white chip rides in the corner. Hover lifts the shape; opening
     a row lets the shape grow with it. */
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap");
  :root { --w: 340px; --ink: #222; --font: "Inter", system-ui, sans-serif; }
  body { font-family: var(--font); color: var(--ink); background: #fff; }
  .level { padding: 14px 14px 28px; }
  .list { display: grid; gap: 10px; }

  .block { position: relative; overflow: hidden; border-radius: 22px; background: var(--c); isolation: isolate; transition: transform .2s ease; }
  .block:has(> .row:active) { transform: scale(.975); }
  .row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 84px; padding: 16px 18px; }
  .row:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; border-radius: 22px; }
  .shape { position: absolute; z-index: -1; right: 18px; bottom: -6px; width: 104px; height: 64px; background: var(--d);
    transition: transform .35s cubic-bezier(.3, 1.4, .5, 1); }
  .block:has(> .row:hover) .shape { transform: translateY(-6px); }
  .is-open .shape { transform: translateY(-6px) scale(1.25); transform-origin: 50% 100%; }
  .shape.house { clip-path: polygon(14% 18%, 86% 18%, 86% 32%, 100% 32%, 100% 100%, 0 100%, 0 32%, 14% 32%); }
  .shape.heart { clip-path: path("M52 64 C 20 44 0 30 0 16 C 0 4 12 -4 26 0 C 38 3 48 12 52 18 C 56 12 66 3 78 0 C 92 -4 104 4 104 16 C 104 30 84 44 52 64 Z"); }
  .shape.moon { border-radius: 52px 52px 0 0; height: 70px; }
  .shape.trap { clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }

  .avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .text { flex: 1; min-width: 0; }
  .t { display: block; font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -.01em; }
  .s { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 13px; color: rgba(0, 0, 0, .58); }
  .s svg { width: 14px; height: 14px; }
  .s i { font-style: normal; margin-left: 6px; }
  .chip { position: absolute; top: 12px; right: 12px; padding: 4px 8px; border-radius: 6px; background: #fff; font-size: 11px; font-weight: 500; }

  .sub-in { padding: 0 18px 16px; }
  .days { display: flex; gap: 6px; }
  .days span { flex: 1; padding: 7px 0; border-radius: 10px; background: rgba(255, 255, 255, .55); text-align: center; font-size: 11px; font-weight: 500; }
  .days span.on { background: #fff; }

  </style>
</head>
<body>
  <div class="stage">

    <section class="level is-on" id="home">
      <div class="list">
        <div class="block" style="--c:#f1f1f1; --d:#dedede">
          <button class="row">
            <span class="text"><span class="t">Make the bed</span><span class="s"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7.5" r="4.5"/><path d="M7 5v2.5l1.5 1M2.5 2.5l2-1M11.5 2.5l-2-1"/></svg>6:00 AM</span></span>
          </button>
          <span class="shape house"></span>
        </div>
        <div class="block" data-item style="--c:#f4b5b8; --d:#e85b5b">
          <button class="row" data-expand aria-expanded="false">
            <span class="text"><span class="t">Work out daily</span><span class="s"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7.5" r="4.5"/><path d="M7 5v2.5l1.5 1M2.5 2.5l2-1M11.5 2.5l-2-1"/></svg>8:00 PM<i>Fit club</i></span></span>
          </button>
          <span class="chip">Photo check</span>
          <div class="sub"><div><div class="sub-in">
            <div class="days"><span class="on">M</span><span class="on">T</span><span>W</span><span class="on">T</span><span>F</span><span>S</span><span>S</span></div>
          </div></div></div>
          <span class="shape heart"></span>
        </div>
        <div class="block" style="--c:#a6e3d8; --d:#5cc6b3">
          <button class="row">
            <span class="avatar">MK</span>
            <span class="text"><span class="t">Eat out less</span><span class="s">With Min &middot; 1:00 PM</span></span>
          </button>
          <span class="chip">Photo check</span>
          <span class="shape moon"></span>
        </div>
        <div class="block" style="--c:#fdf2bf; --d:#f5db78">
          <button class="row">
            <span class="text"><span class="t">Stretch</span></span>
          </button>
          <span class="shape trap"></span>
        </div>
      </div>
    </section>

  </div>
  <a class="back-pill" href="week-05.html" hidden>&larr; Week 05</a>
  <script src="week-05-sketch.js?v=6"></script>
</body>
</html>
