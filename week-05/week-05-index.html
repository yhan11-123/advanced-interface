<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 05 sketch &middot; Index</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-05-sketch.css?v=3" />
  <style>
  /* Index: after a portfolio register. Editorial and dry: black grotesk on white, a big light
     catalogue number per entry, one black hairline across the top of each, and the only colour
     in small flat pills. Opening an entry unfolds a two-column ledger of label and value. */
  @import url("https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap");
  :root { --ink: #0f0f0f; --muted: #7a7a7a; --blue: #bcd2ff; --violet: #d8c3ff; --mint: #c7efd9; --font: "Inter Tight", "Helvetica Neue", Arial, sans-serif; }
  body { font-family: var(--font); color: var(--ink); background: #fff; }
  .level { padding: 14px 16px 28px; }

  .entry { border-top: 1px solid var(--ink); }
  .entry:last-child { border-bottom: 1px solid var(--ink); }
  .row { display: grid; grid-template-columns: 56px 1fr auto; align-items: baseline; gap: 10px; width: 100%; padding: 10px 0 12px; transition: background-color .15s ease; }
  .row:hover { background: #f4f4f4; }
  .row:active { background: #e9e9e9; }
  .row:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .no { font-size: 26px; font-weight: 300; letter-spacing: -.02em; line-height: 1; transition: color .2s ease; font-variant-numeric: tabular-nums; }
  .row:hover .no { color: #3a63e8; }
  .name { min-width: 0; font-size: 13px; font-weight: 600; }
  .name small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .tags { display: flex; gap: 4px; margin-top: 6px; }
  .tag { padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 500; background: var(--c); }
  .end { font-size: 12px; color: var(--muted); }
  .end.sign { font-size: 16px; font-weight: 300; color: var(--ink); width: 14px; text-align: center; }
  .is-open .end.sign { rotate: 45deg; }
  .end.sign { transition: rotate .25s ease; }
  .pic { width: 34px; height: 34px; border-radius: 2px; background: var(--c); align-self: center; }

  .ledger { display: grid; grid-template-columns: 70px 1fr; margin: 0 0 12px 66px; font-size: 12px; line-height: 16px; }
  .ledger dt, .ledger dd { margin: 0; padding: 6px 0; border-top: 1px solid #e3e3e3; }
  .ledger dt { color: var(--muted); }
  .ledger a { color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .ledger a:hover { color: #3a63e8; }

  </style>
</head>
<body>
  <div class="stage">

    <section class="level is-on" id="home">
      <div class="entry is-open" data-item>
        <button class="row" data-expand aria-expanded="true">
          <span class="no">013</span>
          <span class="name">Brami<span class="tags"><span class="tag" style="--c:var(--blue)">Designer</span><span class="tag" style="--c:var(--violet)">Advisor</span></span></span>
          <span class="end sign">+</span>
        </button>
        <div class="sub"><div><dl class="ledger">
          <dt>Year</dt><dd>2017 – Present</dd>
          <dt>Location</dt><dd>Carlsbad, CA</dd>
          <dt>http://</dt><dd><a>bramisnacks.com</a></dd>
          <dt>Project</dt><dd>A food company with a focus on high-protein, all-natural snacks.</dd>
        </dl></div></div>
      </div>
      <div class="entry"><button class="row">
        <span class="no">008</span>
        <span class="name">Field Notes<small>Identity, 2019</small></span>
        <span class="end">→</span>
      </button></div>
      <div class="entry" data-item>
        <button class="row" data-expand aria-expanded="false">
          <span class="no">006</span>
          <span class="name">Halcyon<span class="tags"><span class="tag" style="--c:var(--mint)">Founder</span></span></span>
          <span class="end sign">+</span>
        </button>
        <div class="sub"><div><dl class="ledger">
          <dt>Year</dt><dd>2014 – 2016</dd>
          <dt>Location</dt><dd>Lisbon</dd>
          <dt>Project</dt><dd>A small press for travel writing.</dd>
        </dl></div></div>
      </div>
      <div class="entry"><button class="row">
        <span class="no">004</span>
        <span class="name">Orchard</span>
        <span class="pic" style="--c:linear-gradient(135deg,#e8d5b5,#a7b98a)"></span>
      </button></div>
      <div class="entry"><button class="row">
        <span class="no">001</span>
        <span class="name">First Light<small>2011</small></span>
        <span class="end">→</span>
      </button></div>
    </section>

  </div>
  <a class="back-pill" href="week-05.html" hidden>&larr; Week 05</a>
  <script src="week-05-sketch.js?v=6"></script>
</body>
</html>
