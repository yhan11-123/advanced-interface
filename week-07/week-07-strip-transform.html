  <style>
  /* Strip: Transform. Three grouped keys with chevrons: Transform, Align, Boolean. Each opens its
     own labelled row, and the rows stack under the strip in order, so you can keep all three out.
     The rows' keys are icons in colour: green for transform, blue for align and boolean.
     Motion: each row unfolds out of its key and folds back into it. Point at a key in a row and its
     icon acts out what the key will do, on a spring: Scale shrinks and grows back, Rotate turns a
     quarter, Flip mirrors, Skew pulls its two circles apart and lets them snap back, the align icons
     shove their bars to the edge they name, the boolean squares slide into each other. */
  .tiers { gap: 8px; }
  .tier { position: relative; }
  .tier .lbl { width: 150px; text-align: right; }
  .tier-in .key { border-radius: 2px; min-width: 56px; padding: 0 12px; }
  .tier-in .key:nth-child(2) { border-radius: 8px 2px 2px 8px; }
  .tier-in .key:last-child { border-radius: 2px 8px 8px 2px; }
  .tier-in .close { width: 28px; min-width: 28px; padding: 0; }
  .g { color: #3ddc6a; } .b { color: #2f8bff; } .tier-in.b .key svg { color: #2f8bff; }
  .key[aria-expanded="true"] .g, .key[aria-expanded="true"] .b { color: var(--on); }
  .key.ring { padding: 0; width: 64px; }
  /* icons acting out their command */
  .key svg { transform-box: fill-box; transform-origin: 50% 50%; }
  .key:hover > svg[data-play="scale"] { animation: p-scale .7s var(--snap); }
  .key:hover > svg[data-play="rotate"] { animation: p-rot var(--snap-t) var(--snap) forwards; }
  .key:hover > svg[data-play="flip"] { animation: p-flip var(--snap-t) var(--snap) forwards; }
  .key:hover > svg[data-play="apart"] circle:first-child { animation: p-l .7s var(--snap); }
  .key:hover > svg[data-play="apart"] circle:last-child { animation: p-r .7s var(--snap); }
  .key:hover > svg[data-play="pulse"] { animation: p-scale .7s var(--pop); }
  .key:hover > svg[data-play="l"] .bars { animation: p-l .6s var(--snap); }
  .key:hover > svg[data-play="r"] .bars { animation: p-r .6s var(--snap); }
  .key:hover > svg[data-play="t"] .bars { animation: p-t .6s var(--snap); }
  .key:hover > svg[data-play="b"] .bars { animation: p-b .6s var(--snap); }
  .key:hover > svg[data-play="sq"] .bars { animation: p-sq .6s var(--snap); }
  .key:hover > svg[data-play="merge"] .a { animation: p-in-a .7s var(--snap); }
  .key:hover > svg[data-play="merge"] .b { animation: p-in-b .7s var(--snap); }
  @keyframes p-scale { 40% { scale: .7; } }
  @keyframes p-rot { to { rotate: 90deg; } }
  @keyframes p-flip { to { scale: -1 1; } }
  @keyframes p-l { 40% { translate: -3px 0; } }
  @keyframes p-r { 40% { translate: 3px 0; } }
  @keyframes p-t { 40% { translate: 0 -3px; } }
  @keyframes p-b { 40% { translate: 0 3px; } }
  @keyframes p-sq { 40% { scale: .6 1; } }
  @keyframes p-in-a { 40% { translate: 2.5px -2.5px; } }
  @keyframes p-in-b { 40% { translate: -2.5px 2.5px; } }
  .bars, .a, .b { transform-box: fill-box; transform-origin: 50% 50%; }
  @media (prefers-reduced-motion: reduce) { .key svg, .key svg * { animation: none !important; } }
  .ring i { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid transparent; background: conic-gradient(#ff2d55, #ffd60a, #30d158, #64d2ff, #bf5af2, #ff2d55) border-box; -webkit-mask: radial-gradient(circle, transparent 7px, #000 7.5px); mask: radial-gradient(circle, transparent 7px, #000 7.5px); }
  .ring.solid i { -webkit-mask: none; mask: none; }
  </style>
</head>
