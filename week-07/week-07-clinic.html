<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 07 sketch &middot; Clinic</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-07-sketch.css?v=2" />
  <style>
  /* Clinic: a patient record in warm greys. The top toolbar sits on a dark band whose edge sweeps
     down in one soft curve; its pills hold an icon and a word, the chosen one white. Under the
     vitals a second toolbar: a round icon-only filter, then text pills that each switch a kind of
     record on (white) or off (faded). A yellow round button on the timeline adds a note.
     Motion: the white of the chosen pill is one shape that moves: it stretches toward the pill you
     pick, its leading edge first and the trailing edge catching up, so it travels like a drop. A record
     pill switched on swells a little and grows a dot; switched off it lets the air out. Filters slides
     its three knobs and the sort choices unfold out of it. The yellow button sends a ring out and two
     beads of light along the timeline. */
  @property --l { syntax: '<length>'; inherits: false; initial-value: 0px; }
  @property --r { syntax: '<length>'; inherits: false; initial-value: 0px; }
  :root { --w: 1040px; --h: 470px; --page: #dddcd7; --band: #5c5c58; --pill: #ecebe7; --ink: #2b2b29; --soft: #8d8c86; --lime: #ecf542; --ease: cubic-bezier(.22, 1, .36, 1); }
  body { background: var(--page); color: var(--ink); font: 400 15px/1.2 "Avenir Next", "Helvetica Neue", system-ui, sans-serif; }
  .band { position: absolute; left: 0; top: 0; width: 100%; height: 112px; }
  .said { position: absolute; left: 34px; top: 296px; margin: 0; font-size: 12px; color: var(--soft); }
  .brand { position: absolute; left: 30px; top: 40px; font-size: 30px; font-weight: 500; letter-spacing: -.02em; }
  .top { position: absolute; left: 230px; right: 24px; top: 26px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 22px; border-radius: 28px; background: var(--pill); color: var(--ink); white-space: nowrap; font-size: 15px;
    transition: background-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease); }
  .pill svg { width: 22px; height: 22px; flex: none; }
  .pill:hover { background: #f6f5f2; box-shadow: 0 6px 16px -10px rgba(0,0,0,.45); }
  .pill:active { background: #e2e1dc; transition-duration: .06s; }
  .pill[aria-pressed="true"] { background: #fff; box-shadow: 0 8px 18px -12px rgba(0,0,0,.5); }
  .pill:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .top .row { position: relative; }
  .blob { position: absolute; top: 0; height: 56px; left: var(--l); width: calc(var(--r) - var(--l)); border-radius: 28px; background: #fff; box-shadow: 0 8px 18px -12px rgba(0,0,0,.5); pointer-events: none; }
  .top .pill { position: relative; z-index: 1; }
  .top .pill[aria-pressed="true"] { background: transparent; box-shadow: none; }
  .sub .pill:not(.round)::before { content: ""; width: 0; height: 6px; margin-right: -10px; border-radius: 3px; background: #9ccf5a; transition: width var(--snap-t) var(--snap), margin var(--snap-t) var(--snap); }
  .sub .pill[aria-pressed="true"]:not(.round)::before { width: 6px; margin-right: 0; }
  .round .knob { transition: transform var(--snap-t) var(--snap); }
  .round[aria-expanded="true"] .k1 { transform: translateY(8px); }
  .round[aria-expanded="true"] .k2 { transform: translateY(-6px); }
  .round[aria-expanded="true"] .k3 { transform: translateY(5px); }
  .ring { position: absolute; left: 50%; top: 381px; width: 52px; height: 52px; margin: -26px; border-radius: 50%; border: 2px solid var(--lime); pointer-events: none; }
  .bead { position: absolute; top: 377px; width: 60px; height: 8px; margin-left: -30px; border-radius: 4px; background: radial-gradient(closest-side, #fbff9a, rgba(236,245,66,0)); pointer-events: none; }
  .card { position: absolute; left: 0; top: 140px; width: 200px; height: 120px; padding: 40px 0 0 34px; border-radius: 0 34px 34px 0; background: #e9e8e4; font-size: 13px; color: var(--soft); }
  .card b { display: block; margin-top: 6px; font-size: 18px; line-height: 1.15; font-weight: 600; color: var(--ink); }
  .vitals { position: absolute; left: 250px; right: 24px; top: 140px; display: flex; gap: 70px; }
  .vitals div { font-size: 11px; color: #6c6b66; }
  .vitals b { display: block; margin-top: 6px; font-size: 34px; font-weight: 400; color: var(--ink); letter-spacing: -.01em; }
  .vitals small { font-size: 15px; }
  .sub { position: absolute; left: 230px; right: 24px; top: 238px; }
  .sub .pill { height: 50px; padding: 0 18px; background: rgba(255,255,255,.35); color: #a3a29c; }
  .sub .pill[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .sub .pill:hover { background: rgba(255,255,255,.7); color: var(--ink); }
  .round { width: 56px; min-width: 56px; padding: 0; justify-content: center; background: #fff !important; color: var(--ink) !important; }
  .round[aria-expanded="true"] { background: var(--ink) !important; color: #fff !important; }
  .line { position: absolute; left: 0; right: 0; top: 380px; height: 2px; background: linear-gradient(90deg, #ef7d6a, #f0a35c 40%, #c8d65b 60%, #8fcf8f); opacity: .8; }
  .add { position: absolute; left: 50%; top: 355px; width: 52px; height: 52px; margin-left: -26px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; color: var(--ink);
    box-shadow: 0 0 0 0 rgba(236,245,66,.45); transition: box-shadow .3s var(--ease), transform .2s var(--ease); }
  .add:hover { box-shadow: 0 0 0 10px rgba(236,245,66,.4); }
  .add:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .add svg { width: 22px; height: 22px; }
  .filters { gap: 6px; }
  .filters .pill { height: 50px; }
  </style>
</head>
<body>
  <a class="back-pill" href="week-07.html#ideation" hidden>&larr; Week 07</a>
  <div class="stage" data-align="left">
    <svg class="band" viewBox="0 0 1040 112" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H1040V112H230C196 112 186 92 170 60C154 28 140 0 100 0Z" fill="#5c5c58"/></svg>
    <span class="brand">Vital</span>
    <div class="top dock" role="toolbar" aria-label="Record" data-radio>
      <div class="row" data-glide>
        <button class="pill" type="button" aria-pressed="true"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="9.5" cy="9.5" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14 14l5 5M7 10l1.5-2 1.5 3 1.5-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Treatment Dynamics</button>
        <button class="pill" type="button" aria-pressed="false"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M5 4h12v15H5zM8 2.5v3M14 2.5v3M8 10h6M8 13.5h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Visits</button>
        <button class="pill" type="button" aria-pressed="false"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M5.5 16.5a3.5 3.5 0 0 1 0-5l6-6a3.5 3.5 0 0 1 5 5l-6 6a3.5 3.5 0 0 1-5 0zM8.5 8.5l5 5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Medications</button>
        <button class="pill" type="button" aria-pressed="false"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M9 3v6L4 18h14l-5-9V3M8 3h6M7 13h8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Labs</button>
        <button class="pill" type="button" aria-pressed="false"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 2.5v3M11 16.5v3M2.5 11h3M16.5 11h3M5 5l2 2M15 15l2 2M5 17l2-2M15 7l2-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Allergies</button>
      </div>
    </div>

    <div class="card">Female, 24<b>Tiffany<br>Woodward</b></div>
    <div class="vitals" aria-hidden="true">
      <div>Diagnosis<b>Hypertension</b></div>
      <div>Heart Rate<b>89 <small>bpm</small></b></div>
      <div>Pressure<b>100<small>/67</small></b></div>
      <div>Oxygen<b>98 <small>%</small></b></div>
    </div>

    <div class="sub dock" role="toolbar" aria-label="Show records">
      <div class="row" data-glide>
        <button class="pill round" type="button" aria-label="Filters" data-opens="sort"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6 3v16M11 3v16M16 3v16" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path class="knob k1" d="M4 7h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="knob k2" d="M9 14h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="knob k3" d="M14 9h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <div class="filters" data-tier id="sort" role="group" aria-label="Sort" data-radio>
          <button class="pill" type="button" aria-pressed="true"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M7 4v14M3.5 14.5L7 18l3.5-3.5M13 7h6M13 11h4M13 15h2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Newest</button>
          <button class="pill" type="button" aria-pressed="false"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M7 18V4M3.5 7.5L7 4l3.5 3.5M13 7h2M13 11h4M13 15h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Oldest</button>
        </div>
        <button class="pill" type="button" aria-pressed="true">Office Visits</button>
        <button class="pill" type="button" aria-pressed="true">Medications</button>
        <button class="pill" type="button" aria-pressed="true">Labs</button>
        <button class="pill" type="button" aria-pressed="false">Procedures</button>
      </div>
    </div>

    <span class="line" aria-hidden="true"></span>
    <button class="add" type="button" aria-label="Add a note" data-no-squash><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M6 3h10v16H6zM9 8h4M9 11h4M9 14h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    <p class="said" aria-live="polite"></p>
  </div>
  <script src="week-07-sketch.js?v=4"></script>
  <script>
    (() => {
      // the white of the chosen pill: one shape whose two edges move on their own springs.
      // The edge on the side it is heading leads (quick), the other trails (slower), so it stretches and gathers.
      const row = document.querySelector('.top .row'), blob = document.createElement('span');
      blob.className = 'blob'; row.prepend(blob);
      const place = (to, animate) => {
        const l = to.offsetLeft, r = l + to.offsetWidth;
        const goingRight = l > parseFloat(getComputedStyle(blob).getPropertyValue('--l'));
        const fast = '.32s ' + M.ease.snap, slow = '.62s ' + M.ease.flow;
        blob.style.transition = animate && !M.calm.matches ? `--l ${goingRight ? slow : fast}, --r ${goingRight ? fast : slow}` : 'none';
        blob.style.setProperty('--l', l + 'px'); blob.style.setProperty('--r', r + 'px');
      };
      place(row.querySelector('[aria-pressed="true"]'), false);
      row.addEventListener('click', e => { const p = e.target.closest('.pill'); if (p) place(p, true); });

      // record pills: on swells, off lets the air out
      document.querySelector('.sub').addEventListener('click', e => {
        const p = e.target.closest('.pill'); if (!p || p.classList.contains('round') || p.closest('#sort') || M.calm.matches) return;
        const on = p.getAttribute('aria-pressed') === 'true';
        p.animate(on ? [{ scale: 1 }, { scale: 1.08 }, { scale: 1 }] : [{ scale: 1 }, { scale: .93 }, { scale: 1 }], { duration: M.dur.pop, easing: M.ease.pop, composite: 'add' });
      });

      // the yellow button: a ring goes out, two beads run along the timeline
      const add = document.querySelector('.add'), stage = document.querySelector('.stage');
      add.addEventListener('click', () => {
        if (M.calm.matches) return;
        add.animate([{ scale: 1 }, { scale: .82 }, { scale: 1 }], { duration: M.dur.pop, easing: M.ease.pop });
        const ring = document.createElement('span'); ring.className = 'ring'; stage.append(ring);
        ring.animate([{ transform: 'scale(1)', opacity: .9 }, { transform: 'scale(2.6)', opacity: 0 }], { duration: 700, easing: 'cubic-bezier(.2, .7, .3, 1)' }).finished.then(() => ring.remove());
        [-1, 1].forEach(d => {
          const b = document.createElement('span'); b.className = 'bead'; b.style.left = '50%'; stage.append(b);
          b.animate([{ transform: 'translateX(0)', opacity: 1 }, { transform: `translateX(${d * 480}px)`, opacity: 0 }], { duration: 900, easing: 'cubic-bezier(.3, .6, .4, 1)' }).finished.then(() => b.remove());
        });
      });
    })();
  </script>
</body>
</html>
