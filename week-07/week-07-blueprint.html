<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 07 sketch &middot; Blueprint</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-07-sketch.css?v=2" />
  <style>
  /* Blueprint: a tower builder's floor plan, after a city-building game's construction panel: a dark
     grid of icon-over-label buttons laid over a top-down plan full of orange snap points. Toggles
     glow orange when on (Red Axis, Blue Axis, Mirroring, Hide Upper, Pause); Grid and Levels step
     through values; Undo, Redo and Construct act. Plan, Structure and Finish are text tabs; the
     chevron (an icon button) folds the panel away.
     Motion: mirroring is shown, not told. Click the plan to place a column: it snaps onto the grid
     on a spring, and its copies leave it and fly across the axes to their mirrored places. Turn an
     axis on and its line draws out from the centre, then every point's copy crosses it; turn it off
     and the copies fly home into their originals. Undo pulls the last column's copies back into it
     and it shrinks away; Redo pops it back. Grid tightens or loosens the lines with a little zoom.
     Construct stacks the levels one by one, each floor rising off the last; Pause holds it. */
  :root { --w: 900px; --h: 700px; --orange: #f5a524; --panel: #1b1d21; --g: 20px; }
  body { background: #c9cbcd; font: 500 13px/1.2 "Avenir Next", "Helvetica Neue", system-ui, sans-serif; color: #fff; }
  .said { position: absolute; left: 0; right: 0; top: 10px; margin: 0; text-align: center; font-size: 12px; color: #4b4f55; min-height: 1em; }
  .tabs { position: absolute; left: 20px; top: 34px; z-index: 3; display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: rgba(27,29,33,.85); }
  .tab { position: relative; height: 30px; padding: 0 14px; border-radius: 6px; color: #aeb3ba; font-size: 13px; transition: color .2s; }
  .tab:hover { color: #fff; }
  .tab[aria-pressed="true"] { color: #1b1d21; }
  .tab-hl { position: absolute; top: 3px; left: 0; height: 30px; border-radius: 6px; background: var(--orange); transition: transform var(--flow-t) var(--flow), width var(--flow-t) var(--flow); }
  button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

  .view { position: absolute; left: 0; right: 0; top: 0; height: 480px; overflow: hidden;
    background-color: #c9cbcd; background-image: linear-gradient(rgba(255,255,255,.55) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.55) 1px, transparent 1px); background-size: var(--g) var(--g); background-position: center; }
  .plan { position: absolute; z-index: 0; left: 150px; top: 40px; width: 600px; height: 420px; cursor: crosshair; }
  #pts { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  .axis { z-index: 15; }
  .plan svg.floor { position: absolute; inset: 0; overflow: visible; }
  .floor .fl { transition: fill .5s ease; }
  .levels { position: absolute; inset: 0; pointer-events: none; }
  .lvl { position: absolute; inset: 0; }
  .lvl svg { width: 100%; height: 100%; overflow: visible; }
  .axis { position: absolute; pointer-events: none; transform-origin: center; transition: transform .45s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
  .axis.red { left: 299px; top: -60px; width: 2px; height: 540px; background: #e3262f; }
  .axis.blue { top: 209px; left: -150px; height: 2px; width: 900px; background: #2d3fd9; }
  .axis.red:not(.on) { transform: scaleY(0); } .axis.blue:not(.on) { transform: scaleX(0); }
  .pt { position: absolute; width: 22px; height: 22px; margin: -11px; border-radius: 50%; border: 3px solid var(--orange); pointer-events: none; }
  .pt.col { background: var(--orange); box-shadow: 0 0 10px rgba(245,165,36,.6); }
  .pt.ghost { opacity: .75; }
  .snapmark { position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; pointer-events: none; }

  .dock-wrap { position: absolute; left: 0; right: 0; bottom: 14px; padding: 0 20px; }
  .panel { position: relative; background: var(--panel); border-radius: 4px; box-shadow: 0 16px 30px -16px rgba(0,0,0,.6); padding: 10px 8px 8px; overflow: hidden; }
  .grid { display: grid; grid-template-columns: repeat(5, 116px); gap: 4px; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 84px; border-radius: 4px; color: #e9ebee; font-size: 13px; transition: background-color .15s, color .2s; }
  .cell svg { width: 30px; height: 30px; transition: transform var(--snap-t) var(--snap); }
  .cell:hover { background: #262a30; }
  .cell:hover svg { transform: translateY(-2px); }
  .cell:active { background: #30353d; }
  .cell[aria-pressed="true"] { color: var(--orange); }
  .cell[aria-disabled="true"] { color: #5b6068; }
  .cell .val { font-variant-numeric: tabular-nums; }
  .fold { position: absolute; right: 6px; top: 4px; width: 26px; height: 20px; display: grid; place-items: center; border-radius: 4px; color: #8b9097; }
  .fold:hover { color: #fff; background: #2a2e34; }
  .fold svg { width: 12px; height: 12px; transition: rotate var(--snap-t) var(--snap); }
  .panel.is-folded .fold svg { rotate: 180deg; }
  .panel.is-folded .grid { height: 0; }
  .grid { transition: height var(--open-t) var(--open); height: 172px; }
  </style>
</head>
<body>
  <a class="back-pill" href="week-07.html#ideation" hidden>&larr; Week 07</a>
  <div class="stage" data-align="center">
    <div class="view" id="view">
      <div class="plan" id="plan">
        <div class="levels" id="levels" aria-hidden="true"></div>
        <svg class="floor" viewBox="-300 -210 600 420" aria-hidden="true">
          <defs>
            <radialGradient id="heat" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#2fbf3a"/><stop offset=".55" stop-color="#9ccc2a"/><stop offset=".85" stop-color="#d8b92e"/><stop offset="1" stop-color="#c98a2a"/></radialGradient>
          </defs>
          <g id="shape">
            <path class="fl" fill="url(#heat)" d="M-120 -200H120V-90H280V90H120V200H-120V90H-280V-90H-120Z"/>
            <path d="M-120 -200H120V-90H280V90H120V200H-120V90H-280V-90H-120Z" fill="none" stroke="#efece4" stroke-width="7"/>
            <path d="M-60 -200V200M60 -200V200M-280 -30H280M-280 30H280M-200 -90V90M200 -90V90" stroke="#efece4" stroke-width="5" opacity=".85"/>
            <path d="M-30 -60h60v120h-60z" fill="#7d8186" stroke="#efece4" stroke-width="4"/>
          </g>
        </svg>
        <span class="axis red" id="ax-red"></span><span class="axis blue" id="ax-blue"></span>
        <div id="pts"></div>
      </div>
      <div class="tabs" role="toolbar" aria-label="Show" data-radio id="tabs">
        <span class="tab-hl" aria-hidden="true"></span>
        <button class="tab" type="button" aria-pressed="true" data-fill="url(#heat)">Plan</button>
        <button class="tab" type="button" aria-pressed="false" data-fill="#8f949a">Structure</button>
        <button class="tab" type="button" aria-pressed="false" data-fill="#d9c7a6">Finish</button>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>

    <div class="dock-wrap dock">
      <div class="panel" id="panel" data-glide>
        <button class="fold" type="button" aria-label="Fold the panel" aria-expanded="true" id="fold" data-manual><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <div class="grid" role="toolbar" aria-label="Build">
          <button class="cell" type="button" aria-pressed="true" id="b-red"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2v26" stroke="#e3262f" stroke-width="2"/><circle cx="8" cy="9" r="1.8" fill="currentColor"/><circle cx="22" cy="9" r="1.8" fill="currentColor"/><circle cx="8" cy="21" r="1.8" fill="currentColor"/><circle cx="22" cy="21" r="1.8" fill="currentColor"/></svg>Red Axis</button>
          <button class="cell" type="button" aria-pressed="false" id="b-blue"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M2 15h26" stroke="#4a5cff" stroke-width="2"/><circle cx="8" cy="8" r="1.8" fill="currentColor"/><circle cx="22" cy="8" r="1.8" fill="currentColor"/><circle cx="8" cy="22" r="1.8" fill="currentColor"/><circle cx="22" cy="22" r="1.8" fill="currentColor"/></svg>Blue Axis</button>
          <button class="cell" type="button" aria-pressed="true" id="b-mirror"><svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 3a8 8 0 0 1 0 16z" fill="currentColor"/><path d="M15 19v8M10 27h10" stroke="currentColor" stroke-width="1.8"/></svg>Mirroring</button>
          <button class="cell" type="button" id="b-grid" data-manual><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M3 9h24M3 15h24M3 21h24M9 3v24M15 3v24M21 3v24" stroke="currentColor" stroke-width="1" opacity=".8"/></svg><span>Grid <span class="val" id="gv">20</span></span></button>
          <button class="cell" type="button" id="b-levels" data-manual><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M8 4h14M8 8h14M8 12h14M8 16h14M8 20h14M8 24h14" stroke="currentColor" stroke-width="1.6"/></svg><span>Levels <span class="val" id="lv">5</span></span></button>
          <button class="cell" type="button" id="b-undo" aria-disabled="true"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M11 6L5 12l6 6M5 12h12a8 8 0 0 1 0 16h-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>Undo</button>
          <button class="cell" type="button" id="b-redo" aria-disabled="true"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M19 6l6 6-6 6M25 12H13a8 8 0 0 0 0 16h4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>Redo</button>
          <button class="cell" type="button" aria-pressed="false" id="b-hide"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M8 4h14M8 8h14M8 12h14" stroke="currentColor" stroke-width="1.6" opacity=".35"/><path d="M8 16h14M8 20h14M8 24h14" stroke="currentColor" stroke-width="1.6"/></svg>Hide Upper</button>
          <button class="cell" type="button" aria-pressed="false" id="b-pause"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M9 6h4v18H9zM17 6h4v18h-4z" fill="currentColor"/></svg>Pause</button>
          <button class="cell" type="button" id="b-build" data-manual><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M9 28V4l14 4M9 8h14M12 4v4M16 5v3M20 6v2M23 8v8M21 16h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Construct</button>
        </div>
      </div>
    </div>
  </div>
  <script src="week-07-sketch.js?v=4"></script>
  <script>
    (() => {
      const said = document.querySelector('.said'), plan = document.getElementById('plan'), ptsEl = document.getElementById('pts');
      const CX = 300, CY = 210, root = document.documentElement;
      const B = id => document.getElementById(id), on = id => B(id).getAttribute('aria-pressed') === 'true';
      const after = fn => setTimeout(fn);   // read a toggle once the shared script has flipped it

      // ---- points: originals live in one quarter (x, y <= 0); copies are made by the axes
      let base = [[-250, -60, 0], [-200, -60, 0], [-150, -60, 1], [-90, -180, 1], [-90, -120, 0], [-40, -180, 0], [-200, -140, 0], [-140, -140, 1], [-40, -90, 0], [-90, -60, 0]]
        .map(([x, y, c], i) => ({ id: 'p' + i, x, y, col: !!c }));
      const els = {};                  // key -> element
      const known = {};                // id -> point, kept after a point leaves, so its copies know where home is
      const want = () => {
        const mx = on('b-mirror') && on('b-red'), my = on('b-mirror') && on('b-blue'), out = {};
        base.forEach(p => {
          known[p.id] = p;
          out[p.id] = [p.x, p.y, p, ''];
          if (mx) out[p.id + 'x'] = [-p.x, p.y, p, 'x'];
          if (my) out[p.id + 'y'] = [p.x, -p.y, p, 'y'];
          if (mx && my) out[p.id + 'xy'] = [-p.x, -p.y, p, 'xy'];
        });
        return out;
      };
      const put = (el, x, y) => { el.style.left = CX + x + 'px'; el.style.top = CY + y + 'px'; };
      // copies leave their original and fly across the axis; the ones further from the axis leave later
      const sync = (anim = true) => {
        const w = want();
        for (const k in w) if (!els[k]) {
          const [x, y, p, kind] = w[k], el = document.createElement('span');
          el.className = 'pt' + (p.col ? ' col' : '') + (kind ? ' ghost' : ''); put(el, x, y); ptsEl.append(el); els[k] = el;
          if (anim && !M.calm.matches) {
            const delay = kind ? Math.min(Math.abs(p.x), Math.abs(p.y)) * 0 + (Math.abs(kind === 'y' ? p.y : p.x)) * 1.1 : 0;
            if (kind) el.animate([{ transform: `translate(${p.x - x}px, ${p.y - y}px) scale(.6)`, opacity: 0 }, { transform: `translate(${(p.x - x) / 2}px, ${(p.y - y) / 2}px) scale(1.15)`, opacity: 1, offset: .5 }, { transform: 'none', opacity: 1 }],
              { duration: 620, delay, easing: 'cubic-bezier(.3, .7, .3, 1)', fill: 'backwards' });
            else el.animate([{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: M.dur.pop, easing: M.ease.pop });
          }
        }
        for (const k in els) if (!w[k]) {
          const el = els[k]; delete els[k];
          const id = k.replace(/(xy|x|y)$/, ''), p = known[id];
          if (!anim || M.calm.matches || !p) { el.remove(); continue; }
          const x = parseFloat(el.style.left) - CX, y = parseFloat(el.style.top) - CY;
          el.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${p.x - x}px, ${p.y - y}px) scale(.5)`, opacity: 0 }],
            { duration: 380, delay: (Math.abs(x) + Math.abs(y)) * .3, easing: 'cubic-bezier(.5, 0, .7, .4)', fill: 'forwards' }).finished.then(() => el.remove());
        }
      };
      sync(false);

      ['b-red', 'b-blue', 'b-mirror'].forEach(id => B(id).addEventListener('click', () => after(() => {
        B('ax-red').classList.toggle('on', on('b-red') && on('b-mirror'));
        B('ax-blue').classList.toggle('on', on('b-blue') && on('b-mirror'));
        // the axis draws out first, then the copies cross it
        setTimeout(() => sync(true), M.calm.matches ? 0 : 220);
      })));
      B('ax-red').classList.toggle('on', on('b-red')); B('ax-blue').classList.toggle('on', on('b-blue'));

      // ---- placing: click the plan, the column snaps onto the grid on a spring, copies follow
      let undone = [], g = 20;
      plan.addEventListener('click', e => {
        const r = plan.getBoundingClientRect(), f = M.fit();
        let x = (e.clientX - r.left) / f - CX, y = (e.clientY - r.top) / f - CY;
        // keep originals in their quarter; a click elsewhere is folded into it (that is what mirroring means)
        x = -Math.abs(x); y = -Math.abs(y);
        const sx = Math.round(x / g) * g, sy = Math.round(y / g) * g;
        const p = { id: 'n' + Date.now(), x: sx, y: sy, col: true };
        base.push(p); undone = [];
        sync(false);
        const el = els[p.id];
        if (!M.calm.matches) {
          el.animate([{ transform: `translate(${x - sx}px, ${y - sy}px) scale(.4)` }, { transform: 'none' }], { duration: M.dur.snap, easing: M.ease.snap });
          for (const k of ['x', 'y', 'xy']) if (els[p.id + k]) {
            const c = els[p.id + k], cx = parseFloat(c.style.left) - CX, cy = parseFloat(c.style.top) - CY;
            c.animate([{ transform: `translate(${sx - cx}px, ${sy - cy}px) scale(.6)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 620, delay: 120 + (k === 'xy' ? 120 : 0), easing: 'cubic-bezier(.3, .7, .3, 1)', fill: 'backwards' });
          }
        }
        B('b-undo').removeAttribute('aria-disabled'); B('b-redo').setAttribute('aria-disabled', 'true');
        said.textContent = 'Column placed' + (on('b-mirror') ? ', mirrored' : '');
      });
      B('b-undo').addEventListener('click', () => {
        const last = [...base].reverse().find(p => p.id.startsWith('n')); if (!last) return;
        base = base.filter(p => p !== last); undone.push(last);
        // the copies fly home into it, then it shrinks away
        const el = els[last.id]; delete els[last.id];
        sync(true);
        setTimeout(() => { if (M.calm.matches) { el.remove(); return; } el.animate([{ transform: 'scale(1)' }, { transform: 'scale(0)' }], { duration: 240, easing: 'cubic-bezier(.5, 0, 1, 1)', fill: 'forwards' }).finished.then(() => el.remove()); }, M.calm.matches ? 0 : 380);
        if (!base.some(p => p.id.startsWith('n'))) B('b-undo').setAttribute('aria-disabled', 'true');
        B('b-redo').removeAttribute('aria-disabled');
        said.textContent = 'Undone';
      });
      B('b-redo').addEventListener('click', () => {
        const p = undone.pop(); if (!p) return;
        base.push(p); sync(true);
        B('b-undo').removeAttribute('aria-disabled'); if (!undone.length) B('b-redo').setAttribute('aria-disabled', 'true');
        said.textContent = 'Redone';
      });

      // ---- grid precision: 40, 20, 10; the lines tighten with a little zoom
      B('b-grid').addEventListener('click', () => {
        g = g === 40 ? 20 : g === 20 ? 10 : 40;
        root.style.setProperty('--g', g + 'px'); B('gv').textContent = g;
        if (!M.calm.matches) {
          B('view').animate([{ backgroundSize: (g * 1.6) + 'px ' + (g * 1.6) + 'px' }, { backgroundSize: g + 'px ' + g + 'px' }], { duration: M.dur.open, easing: M.ease.open });
          B('gv').animate([{ transform: 'translateY(6px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 300, easing: 'ease-out' });
        }
        said.textContent = 'Grid ' + g;
      });

      // ---- levels and construct: floors rise one by one off the last; Pause holds; Hide Upper fades them
      let levels = 5, built = 0, building = false;
      const outline = B('shape').innerHTML;
      B('b-levels').addEventListener('click', () => {
        levels = levels % 8 + 1; B('lv').textContent = levels;
        if (!M.calm.matches) B('lv').animate([{ transform: 'translateY(6px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 300, easing: 'ease-out' });
        said.textContent = levels + ' levels';
      });
      const lvlBox = B('levels');
      const addLevel = n => {
        const d = document.createElement('div'); d.className = 'lvl'; d.dataset.n = n;
        d.innerHTML = `<svg viewBox="-300 -210 600 420"><path d="M-120 -200H120V-90H280V90H120V200H-120V90H-280V-90H-120Z" fill="rgba(30,34,40,.06)" stroke="#efece4" stroke-width="3" stroke-opacity=".9"/></svg>`;
        d.style.transform = `translate(${-n * 6}px, ${-n * 10}px)`; d.style.zIndex = n;
        lvlBox.append(d);
        if (!M.calm.matches) d.animate([{ transform: `translate(${-(n - 1) * 6}px, ${-(n - 1) * 10}px)`, opacity: 0 }, { transform: `translate(${-n * 6}px, ${-n * 10}px)`, opacity: 1 }], { duration: M.dur.open, easing: M.ease.open });
        hideUpper();
      };
      const hideUpper = () => [...lvlBox.children].forEach(l => l.style.opacity = on('b-hide') && +l.dataset.n > 1 ? .12 : '');
      B('b-hide').addEventListener('click', () => after(hideUpper));
      B('b-build').addEventListener('click', async () => {
        if (building) return;
        if (built >= levels) { lvlBox.innerHTML = ''; built = 0; said.textContent = 'Cleared'; return; }
        building = true;
        while (built < levels) {
          while (on('b-pause')) await new Promise(r => setTimeout(r, 80));
          built++; addLevel(built); said.textContent = 'Level ' + built + ' of ' + levels;
          await new Promise(r => setTimeout(r, M.calm.matches ? 0 : 420));
        }
        building = false; said.textContent = 'Built, ' + levels + ' levels. Construct again to clear';
      });
      B('b-pause').addEventListener('click', () => after(() => { const p = on('b-pause'); B('b-pause').querySelector('svg').innerHTML = p ? '<path d="M9 5l15 10-15 10z" fill="currentColor"/>' : '<path d="M9 6h4v18H9zM17 6h4v18h-4z" fill="currentColor"/>'; B('b-pause').lastChild.textContent = p ? 'Resume' : 'Pause'; }));

      // ---- tabs: one orange highlight slides between them; the floor changes colour
      const tabs = B('tabs'), hl = tabs.querySelector('.tab-hl');
      const placeTab = anim => { const t = tabs.querySelector('[aria-pressed="true"]'); if (!anim) hl.style.transition = 'none'; hl.style.width = t.offsetWidth + 'px'; hl.style.transform = `translateX(${t.offsetLeft}px)`; if (!anim) requestAnimationFrame(() => hl.style.transition = ''); };
      placeTab(false);
      tabs.addEventListener('click', e => { const t = e.target.closest('.tab'); if (!t) return; after(() => { placeTab(true); document.querySelector('.floor .fl').setAttribute('fill', t.dataset.fill); }); });

      // ---- fold: the grid of buttons folds down into the panel's top edge
      B('fold').addEventListener('click', () => {
        const panel = B('panel'), folded = panel.classList.toggle('is-folded');
        B('fold').setAttribute('aria-expanded', String(!folded)); B('fold').setAttribute('aria-label', folded ? 'Open the panel' : 'Fold the panel');
        said.textContent = folded ? 'Panel folded' : 'Panel open';
      });
    })();
  </script>
</body>
</html>
