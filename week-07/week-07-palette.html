<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 07 sketch &middot; Palette</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-07-sketch.css?v=2" />
  <style>
  /* Palette: a drawing app's tool palette, after a chart of one palette's looks from 1987 to 2024.
     One build in three eras: 1990 (one-bit: white cells, black lines, the picked tool inverted, a
     striped title bar), 2000 (grey bevels: raised on hover, sunk when pressed) and 2024 (dark, one
     column, soft corners). The tools are icon buttons; the eras are text buttons; Labels is an
     icon-and-text toggle that turns the palette into a list with names. A tool with a corner
     triangle holds more tools: hold it, or click the triangle, and they fly out beside it.
     Motion: changing era turns every tool over, one after another down the palette, and they come
     back in the new era's look walking to their new places (two columns fold into one, and back).
     Labels does the same walk and the names slide out of the icons. A fly-out unfolds out of its
     tool and folds back into it; the tool you pick from it turns over into the palette. A name
     tip slides out after a short wait. The fill and stroke squares swap places along an arc. */
  :root { --w: 780px; --h: 700px; --ink: #1d1d1f; }
  body { background: #ecebe8; color: var(--ink); font: 500 13px/1.2 -apple-system, system-ui, sans-serif; }
  .said { position: absolute; left: 0; right: 0; bottom: 10px; margin: 0; text-align: center; font-size: 12px; color: #8a8985; min-height: 1em; }
  .eras { position: absolute; left: 0; right: 0; top: 18px; display: flex; justify-content: center; gap: 10px; }
  .seg { display: flex; padding: 3px; border-radius: 10px; background: #dad9d5; }
  .seg button { position: relative; z-index: 1; height: 30px; padding: 0 14px; border-radius: 7px; font-size: 13px; color: #6b6a66; font-variant-numeric: tabular-nums; transition: color .2s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { color: var(--ink); }
  .seg .hl { position: absolute; top: 3px; height: 30px; border-radius: 7px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: transform var(--flow-t) var(--flow), width var(--flow-t) var(--flow); }
  .seg { position: relative; }
  .lab-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; background: #dad9d5; color: #6b6a66; }
  .lab-btn svg { width: 16px; height: 16px; }
  .lab-btn:hover { color: var(--ink); }
  .lab-btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg button:focus-visible, .lab-btn:focus-visible { outline: 2px solid #2b6cff; outline-offset: 2px; }

  .board { position: absolute; left: 30px; right: 30px; top: 72px; bottom: 34px; border-radius: 4px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.06); padding: 18px; align-items: flex-start; }
  .art { position: absolute; left: 50%; top: 50%; translate: -50% -50%; opacity: .9; pointer-events: none; }

  /* the palette, one build */
  .pal { position: relative; z-index: 2; display: flex; flex-direction: column; overflow: hidden; }
  .pal-title { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; }
  .tools { display: grid; grid-template-columns: repeat(var(--cols, 2), auto); perspective: 700px; }
  .tool { position: relative; display: flex; align-items: center; gap: 8px; width: 42px; height: 34px; padding: 0 10px; white-space: nowrap; transform-style: preserve-3d; backface-visibility: hidden; }
  .tool svg { flex: none; width: 22px; height: 22px; }
  .tool .nm { display: none; font-size: 12px; }
  .tool.more::after { content: ""; position: absolute; right: 2px; bottom: 2px; border: 3px solid transparent; border-right-color: currentColor; border-bottom-color: currentColor; opacity: .7; }
  .pal.is-labels .tools { --cols: 1; }
  .pal.is-labels .tool { width: 170px; height: 30px; }
  .pal.is-labels .tool .nm { display: inline; }
  .colors { flex: none; position: relative; height: 54px; }
  .sq { position: absolute; width: 24px; height: 24px; }
  .sq.fill { left: 10px; top: 8px; z-index: 1; background: var(--fill, #fff); }
  .sq.stroke { left: 22px; top: 20px; background: transparent; box-shadow: inset 0 0 0 5px var(--stroke, #1d1d1f); }
  .colors.swapped .sq.fill { z-index: 0; }
  .swap { position: absolute; left: 48px; top: 6px; width: 16px; height: 16px; display: grid; place-items: center; }
  .swap svg { width: 12px; height: 12px; }

  /* 1990: one bit */
  .pal[data-era="1990"] { background: #fff; border: 1px solid #000; box-shadow: 2px 2px 0 #000; font-family: Geneva, Monaco, monospace; }
  .pal[data-era="1990"] .pal-title { height: 14px; background: repeating-linear-gradient(#000 0 1px, #fff 1px 2px) 0 3px / 100% 9px no-repeat; border-bottom: 1px solid #000; }
  .pal[data-era="1990"] .pal-title i { width: 9px; height: 9px; background: #fff; border: 1px solid #000; margin-left: 4px; }
  .pal[data-era="1990"] .tool { color: #000; box-shadow: inset -1px -1px 0 #000; }
  .pal[data-era="1990"] .tool:hover { background: repeating-conic-gradient(#000 0 25%, #fff 0 50%) 0 0 / 2px 2px; }
  .pal[data-era="1990"] .tool:hover svg { filter: drop-shadow(0 0 0 #fff) drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff); }
  .pal[data-era="1990"] .tool[aria-pressed="true"], .pal[data-era="1990"] .tool:active { background: #000; color: #fff; }
  .pal[data-era="1990"] .colors { border-top: 1px solid #000; }
  .pal[data-era="1990"] .sq.fill { box-shadow: inset 0 0 0 1px #000; }

  /* 2000: grey bevels */
  .pal[data-era="2000"] { background: #d4d0c8; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080, 0 0 0 1px #404040, 3px 3px 6px rgba(0,0,0,.25); padding: 0 3px 3px; font-family: Tahoma, Verdana, sans-serif; }
  .pal[data-era="2000"] .pal-title { height: 16px; margin: 3px 0 4px; background: linear-gradient(90deg, #0a246a, #a6caf0); }
  .pal[data-era="2000"] .pal-title i { width: 10px; height: 10px; background: #d4d0c8; box-shadow: inset 1px 1px #fff, inset -1px -1px #808080; }
  .pal[data-era="2000"] .tools { gap: 1px; }
  .pal[data-era="2000"] .tool { color: #000; }
  .pal[data-era="2000"] .tool:hover { box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080; }
  .pal[data-era="2000"] .tool[aria-pressed="true"], .pal[data-era="2000"] .tool:active { background: #e8e6e1; box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff; }
  .pal[data-era="2000"] .tool[aria-pressed="true"] svg { translate: 1px 1px; }
  .pal[data-era="2000"] .colors { margin-top: 4px; border-top: 1px solid #808080; box-shadow: inset 0 1px 0 #fff; }
  .pal[data-era="2000"] .sq.fill { box-shadow: inset 0 0 0 1px #404040; }

  /* 2024: dark, one column */
  .pal[data-era="2024"] { --cols: 1; background: #323232; border-radius: 6px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.45), 0 0 0 1px #1f1f1f; padding: 0 4px 4px; }
  .pal[data-era="2024"] .pal-title { height: 18px; color: #9a9a9a; font-size: 10px; }
  .pal[data-era="2024"] .pal-title i { width: 8px; height: 8px; background: none; border: 0; }
  .pal[data-era="2024"] .pal-title i::before { content: "\00d7"; font-style: normal; font-size: 11px; line-height: 8px; color: #9a9a9a; }
  .pal[data-era="2024"] .tools { gap: 0; }
  .pal[data-era="2024"] .tool { color: #c8c8c8; border-radius: 4px; transition: background-color .12s; }
  .pal[data-era="2024"] .tool:hover { background: #424242; color: #fff; }
  .pal[data-era="2024"] .tool[aria-pressed="true"] { background: #565656; color: #fff; }
  .pal[data-era="2024"] .tool:active { background: #626262; }
  .pal[data-era="2024"] .colors { margin-top: 4px; }
  .pal[data-era="2024"] .sq.fill { box-shadow: 0 0 0 1px #777; }
  .pal[data-era="2024"] .sq.stroke { --stroke: #e6e6e6; }
  .pal[data-era="2024"] .swap { color: #c8c8c8; }
  .tool:focus-visible, .swap:focus-visible { outline: 2px solid #2b6cff; outline-offset: -2px; }

  /* fly-out and name tip */
  .fly { position: absolute; z-index: 5; display: flex; padding: 2px; }
  .fly .tool { width: 42px; }
  .fly[data-era="1990"] { background: #fff; border: 1px solid #000; box-shadow: 2px 2px 0 #000; }
  .fly[data-era="2000"] { background: #d4d0c8; box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080, 0 0 0 1px #404040; }
  .fly[data-era="2024"] { background: #323232; border-radius: 6px; box-shadow: 0 8px 20px -8px rgba(0,0,0,.5); gap: 2px; }
  .fly .tool { color: inherit; }
  .fly[data-era="1990"] .tool { color: #000; } .fly[data-era="1990"] .tool:hover { background: #000; color: #fff; }
  .fly[data-era="2000"] .tool { color: #000; } .fly[data-era="2000"] .tool:hover { box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080; }
  .fly[data-era="2024"] .tool { color: #c8c8c8; border-radius: 4px; } .fly[data-era="2024"] .tool:hover { background: #4a4a4a; color: #fff; }
  .tip { position: absolute; z-index: 6; padding: 4px 8px; border-radius: 4px; background: #1d1d1f; color: #fff; font-size: 11.5px; white-space: nowrap; pointer-events: none; }
  </style>
</head>
<body>
  <a class="back-pill" href="week-07.html#ideation" hidden>&larr; Week 07</a>
  <div class="stage" data-align="left">
    <div class="eras" role="toolbar" aria-label="Look">
      <div class="seg" data-radio id="eras">
        <span class="hl" aria-hidden="true"></span>
        <button type="button" aria-pressed="false" data-era="1990">1990</button>
        <button type="button" aria-pressed="true" data-era="2000">2000</button>
        <button type="button" aria-pressed="false" data-era="2024">2024</button>
      </div>
      <button class="lab-btn" type="button" aria-pressed="false" id="labels"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2M2 8h2M2 12h2M6 4h8M6 8h8M6 12h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Labels</button>
    </div>
    <div class="board dock">
      <svg class="art" width="300" height="220" viewBox="0 0 300 220" aria-hidden="true"><path d="M30 180C70 40 160 30 200 90s60 90 80 40" fill="none" stroke="#c9c7c2" stroke-width="2"/><circle cx="200" cy="90" r="4" fill="#fff" stroke="#9a9893"/><circle cx="30" cy="180" r="4" fill="#fff" stroke="#9a9893"/><rect x="150" y="140" width="80" height="50" fill="none" stroke="#c9c7c2" stroke-dasharray="4 4"/></svg>
      <div class="pal" data-era="2000" data-glide id="pal">
        <div class="pal-title" aria-hidden="true"><i></i><span></span></div>
        <div class="tools" role="toolbar" aria-label="Tools" aria-orientation="vertical" data-radio id="tools"></div>
        <div class="colors" id="colors">
          <span class="sq fill" aria-hidden="true"></span><span class="sq stroke" aria-hidden="true"></span>
          <button class="swap" type="button" aria-label="Swap fill and stroke"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 5a3 3 0 0 1 3-3h4M7 0l2 2-2 2M10 7a3 3 0 0 1-3 3H3M5 12l-2-2 2-2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        </div>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <script>
    // tools: name, icon, and the tools hidden behind it
    const I = {
      select: '<path d="M5 3l10 7-4.5 1 2.5 5-2 1-2.5-5L5 15z" fill="currentColor"/>',
      direct: '<path d="M5 3l10 7-4.5 1 2.5 5-2 1-2.5-5L5 15z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
      pen: '<path d="M10 2l5 8-3 3H8l-3-3zM10 2v6M8 13l-.5 4h5L12 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="9" r="1.2" fill="currentColor"/>',
      penAdd: '<path d="M9 2l4.5 7.5L11 12H7.5L5 9.5zM9 2v5.5M7.5 12l-.5 4h4.5l-.5-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M15 13v5M12.5 15.5h5" stroke="currentColor" stroke-width="1.5"/>',
      penDel: '<path d="M9 2l4.5 7.5L11 12H7.5L5 9.5zM9 2v5.5M7.5 12l-.5 4h4.5l-.5-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12.5 15.5h5" stroke="currentColor" stroke-width="1.5"/>',
      convert: '<path d="M3 17L10 4l7 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
      type: '<path d="M4 4h12M10 4v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
      areaType: '<rect x="2.5" y="2.5" width="15" height="15" fill="none" stroke="currentColor" stroke-dasharray="2 2"/><path d="M6 6h8M10 6v8" stroke="currentColor" stroke-width="1.8"/>',
      vType: '<path d="M4 4h12M10 4v13M14 9v8M12 11h4" fill="none" stroke="currentColor" stroke-width="1.6"/>',
      line: '<path d="M4 16L16 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      rect: '<rect x="3.5" y="5.5" width="13" height="9" fill="none" stroke="currentColor" stroke-width="1.5"/>',
      ellipse: '<ellipse cx="10" cy="10" rx="7" ry="5" fill="none" stroke="currentColor" stroke-width="1.5"/>',
      polygon: '<path d="M10 3l7 5-2.7 8H5.7L3 8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
      star: '<path d="M10 2.5l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L2.8 7.7l5-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
      brush: '<path d="M16 3l1.5 1.5-7 7.5-2-2zM8 10c-2 0-3.5 1-3.5 3.5 0 1.2-1 2-2 2 3 1.5 7 .5 7-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
      pencil: '<path d="M4 16l1-4 9-9 3 3-9 9zM12 5l3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
      rotate: '<path d="M15.5 10a5.5 5.5 0 1 1-2.2-4.4M13.5 2v4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
      scale: '<path d="M3 9h8v8H3zM8 3h9v9M13 7l4-4M14 3h3v3" fill="none" stroke="currentColor" stroke-width="1.4"/>',
      gradient: '<defs><linearGradient id="g"><stop offset="0" stop-color="currentColor"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><rect x="3" y="4" width="14" height="12" fill="url(#g)" stroke="currentColor"/>',
      dropper: '<path d="M14 3l3 3-2 2-3-3zM12.5 5.5l-8 8V16h2.5l8-8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>',
      hand: '<path d="M7 10V5a1 1 0 0 1 2 0v4M9 9V4a1 1 0 0 1 2 0v5M11 9V5a1 1 0 0 1 2 0v5M13 10V7a1 1 0 0 1 2 0v5c0 3-2 5-5 5-2.5 0-4-1.5-5-3.5l-1.5-3a1 1 0 0 1 1.8-1l1.7 2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
      zoom: '<circle cx="8.5" cy="8.5" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.2 12.2L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
    };
    const TOOLS = [
      ['Selection', 'select'], ['Direct Selection', 'direct'],
      ['Pen', 'pen', [['Pen', 'pen'], ['Add Anchor Point', 'penAdd'], ['Delete Anchor Point', 'penDel'], ['Convert Anchor Point', 'convert']]],
      ['Type', 'type', [['Type', 'type'], ['Area Type', 'areaType'], ['Vertical Type', 'vType']]],
      ['Line', 'line'], ['Rectangle', 'rect', [['Rectangle', 'rect'], ['Ellipse', 'ellipse'], ['Polygon', 'polygon'], ['Star', 'star']]],
      ['Brush', 'brush'], ['Pencil', 'pencil'], ['Rotate', 'rotate'], ['Scale', 'scale'],
      ['Gradient', 'gradient'], ['Eyedropper', 'dropper'], ['Hand', 'hand'], ['Zoom', 'zoom']
    ];
    const svg = k => `<svg viewBox="0 0 20 20" aria-hidden="true">${I[k]}</svg>`;
    document.getElementById('tools').innerHTML = TOOLS.map(([n, k, more], i) =>
      `<button class="tool${more ? ' more' : ''}" type="button" aria-pressed="${i === 0}" aria-label="${n}" data-i="${i}">${svg(k)}<span class="nm">${n}</span></button>`).join('');
  </script>
  <script src="week-07-sketch.js?v=4"></script>
  <script>
    (() => {
      const stage = document.querySelector('.stage'), pal = document.getElementById('pal'), said = document.querySelector('.said');
      const tools = [...pal.querySelectorAll('.tool')];
      const local = el => { const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect(), f = M.fit(); return { x: (r.left - s.left) / f, y: (r.top - s.top) / f, w: r.width / f, h: r.height / f }; };

      // era segmented control: one highlight slides between the years
      const seg = document.getElementById('eras'), hl = seg.querySelector('.hl');
      const placeHl = anim => { const on = seg.querySelector('[aria-pressed="true"]'); if (!anim) hl.style.transition = 'none'; hl.style.width = on.offsetWidth + 'px'; hl.style.transform = `translateX(${on.offsetLeft - 3}px)`; hl.style.left = '3px'; if (!anim) requestAnimationFrame(() => hl.style.transition = ''); };
      placeHl(false);

      // re-arrange: every tool walks from where it was to where the new layout puts it.
      // turn = true: first every tool turns away in a wave, then comes back already in the new look.
      let busy = false;
      const rearrange = async (change, turn) => {
        if (busy) return; busy = true;
        closeFly(); hideTip();
        const before = tools.map(local), p0 = local(pal);
        if (turn && !M.calm.matches) {
          await Promise.all(tools.map((t, i) => t.animate([{ transform: 'none' }, { transform: 'rotateY(90deg)' }],
            { duration: 130, delay: i * 11, easing: 'cubic-bezier(.5, 0, 1, .5)', fill: 'forwards' }).finished));
        }
        change();
        tools.forEach(t => t.getAnimations().forEach(a => a.cancel()));
        const after = tools.map(local), p1 = local(pal);
        if (M.calm.matches) { busy = false; return; }
        pal.animate([{ width: p0.w + 'px', height: p0.h + 'px' }, { width: p1.w + 'px', height: p1.h + 'px' }], { duration: M.dur.open, easing: M.ease.open });
        tools.forEach((t, i) => {
          const dx = before[i].x - after[i].x - (p0.x - p1.x) * 0, dy = before[i].y - after[i].y;
          t.animate([{ transform: `translate(${dx}px, ${dy}px)${turn ? ' rotateY(-90deg)' : ''}` }, { transform: 'none' }],
            { duration: M.dur.open, delay: i * (turn ? 16 : 10), easing: M.ease.open, fill: 'backwards' });
        });
        if (pal.classList.contains('is-labels')) tools.forEach((t, i) => t.querySelector('.nm').animate([{ opacity: 0, transform: 'translateX(-10px)' }, { opacity: 1, transform: 'none' }], { duration: 360, delay: 140 + i * 18, easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'backwards' }));
        setTimeout(() => busy = false, 300);
      };
      seg.addEventListener('click', e => {
        const b = e.target.closest('[data-era]'); if (!b) return;
        setTimeout(() => placeHl(true));
        if (pal.dataset.era === b.dataset.era) return;
        rearrange(() => { pal.dataset.era = b.dataset.era; }, true);
      });
      // (the shared script flips aria-pressed after this handler, so read it a tick later)
      const labels = document.getElementById('labels');
      labels.addEventListener('click', () => setTimeout(() => rearrange(() => pal.classList.toggle('is-labels', labels.getAttribute('aria-pressed') === 'true'), false)));

      // name tip: after a short wait, slides out of the tool's side
      let tip, tipTimer;
      const hideTip = () => { clearTimeout(tipTimer); if (!tip) return; const t = tip; tip = null; t.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 90, fill: 'forwards' }).finished.then(() => t.remove()); };
      pal.addEventListener('pointerover', e => {
        const t = e.target.closest('.tool'); if (!t || pal.classList.contains('is-labels')) return;
        hideTip();
        tipTimer = setTimeout(() => {
          const r = local(t); tip = document.createElement('span'); tip.className = 'tip'; tip.textContent = t.getAttribute('aria-label');
          tip.style.left = (r.x + r.w + 8) + 'px'; tip.style.top = (r.y + r.h / 2 - 11) + 'px'; stage.append(tip);
          if (!M.calm.matches) tip.animate([{ opacity: 0, transform: 'translateX(-6px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2, .8, .3, 1)' });
        }, 480);
      });
      pal.addEventListener('pointerout', e => { if (e.target.closest('.tool')) hideTip(); });

      // fly-out: hold a tool with a corner triangle (or click its triangle, or right-click)
      let fly = null, flyFor = null, holdTimer;
      const closeFly = () => {
        if (!fly) return; const f = fly, kids = [...f.children], n = kids.length; fly = null; flyFor = null;
        if (M.calm.matches) { f.remove(); return; }
        Promise.all(kids.map((k, i) => k.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-(i + 1) * 42}px) scale(.6)` }], { duration: 150, delay: (n - 1 - i) * 14, easing: 'cubic-bezier(.4, 0, 1, 1)', fill: 'forwards' }).finished))
          .then(() => f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 80, fill: 'forwards' }).finished).then(() => f.remove());
      };
      const openFly = t => {
        closeFly(); hideTip();
        const [, , more] = TOOLS[t.dataset.i]; if (!more) return;
        const r = local(t);
        fly = document.createElement('div'); fly.className = 'fly'; fly.dataset.era = pal.dataset.era; flyFor = t;
        fly.setAttribute('role', 'toolbar'); fly.setAttribute('aria-label', TOOLS[t.dataset.i][0] + ' tools');
        fly.innerHTML = more.map(([n, k]) => `<button class="tool" type="button" aria-label="${n}" data-k="${k}">${svg(k)}</button>`).join('');
        fly.style.left = (r.x + r.w + 2) + 'px'; fly.style.top = (r.y - 2) + 'px'; stage.append(fly);
        fly.firstElementChild.focus({ preventScroll: true });
        if (M.calm.matches) return;
        fly.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 260, easing: 'cubic-bezier(.2, .8, .3, 1)' });
        [...fly.children].forEach((k, i) => k.animate([{ opacity: 0, transform: `translateX(${-(i + 1) * 42}px) scale(.6)` }, { opacity: 1, transform: 'none' }], { duration: M.dur.open, delay: i * 30, easing: M.ease.open, fill: 'backwards' }));
        said.textContent = TOOLS[t.dataset.i][0] + ' tools';
      };
      pal.addEventListener('pointerdown', e => {
        const t = e.target.closest('.tool.more'); if (!t) return;
        const r = t.getBoundingClientRect();
        if (e.clientX > r.right - 9 * M.fit() && e.clientY > r.bottom - 9 * M.fit()) { e.preventDefault(); openFly(t); return; }
        holdTimer = setTimeout(() => openFly(t), 380);
      });
      addEventListener('pointerup', () => clearTimeout(holdTimer));
      pal.addEventListener('contextmenu', e => { const t = e.target.closest('.tool.more'); if (t) { e.preventDefault(); openFly(t); } });
      pal.addEventListener('keydown', e => { const t = e.target.closest('.tool.more'); if (t && (e.key === 'ArrowRight' && e.altKey || e.key === 'Enter' && e.shiftKey)) { e.preventDefault(); openFly(t); } });
      stage.addEventListener('click', e => {
        const k = e.target.closest('.fly .tool');
        if (k) {
          // the picked tool turns over into its place in the palette
          const t = flyFor, i = +t.dataset.i;
          t.querySelector('svg').outerHTML = svg(k.dataset.k);
          t.setAttribute('aria-label', k.getAttribute('aria-label')); t.querySelector('.nm').textContent = k.getAttribute('aria-label');
          tools.forEach(x => x.setAttribute('aria-pressed', String(x === t)));
          if (!M.calm.matches) t.animate([{ transform: 'rotateX(90deg)' }, { transform: 'none' }], { duration: M.dur.pop, easing: M.ease.pop });
          said.textContent = k.getAttribute('aria-label');
          closeFly(); t.focus(); return;
        }
        if (fly && !e.target.closest('.fly') && !e.target.closest('.tool.more')) closeFly();
      });
      addEventListener('click', e => { if (e.target.closest('[data-align-to]')) { closeFly(); hideTip(); } });
      addEventListener('keydown', e => { if (e.key === 'Escape' && fly) { const t = flyFor; closeFly(); t?.focus(); } });
      // the fly-out's own arrows
      stage.addEventListener('keydown', e => {
        if (!e.target.closest('.fly')) return;
        const ks = [...fly.children], i = ks.indexOf(e.target);
        if (e.key === 'ArrowRight') { e.preventDefault(); ks[(i + 1) % ks.length].focus(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); ks[(i - 1 + ks.length) % ks.length].focus(); }
      });
      // the palette's tools go up and down with the arrows (it stands upright)
      pal.querySelector('.tools').addEventListener('keydown', e => {
        const i = tools.indexOf(document.activeElement); if (i < 0) return;
        const cols = parseInt(getComputedStyle(pal.querySelector('.tools')).gridTemplateColumns.split(' ').length);
        const to = { ArrowDown: i + cols, ArrowUp: i - cols }[e.key];
        if (to === undefined || !tools[to]) return;
        e.preventDefault(); tools.forEach(t => t.tabIndex = -1); tools[to].tabIndex = 0; tools[to].focus();
      });

      // fill and stroke trade places along an arc
      const colors = document.getElementById('colors');
      colors.querySelector('.swap').addEventListener('click', () => {
        const fill = colors.querySelector('.fill'), stroke = colors.querySelector('.stroke');
        const doIt = () => { colors.classList.toggle('swapped'); const a = colors.style.getPropertyValue('--fill') || '#fff', b = colors.style.getPropertyValue('--stroke') || (pal.dataset.era === '2024' ? '#e6e6e6' : '#1d1d1f'); colors.style.setProperty('--fill', b); colors.style.setProperty('--stroke', a); };
        if (M.calm.matches) { doIt(); return; }
        const o = { duration: 420, easing: 'cubic-bezier(.4, 0, .2, 1)' };
        Promise.all([
          fill.animate([{ translate: '0 0' }, { translate: '14px -6px', offset: .5 }, { translate: '12px 12px' }], o).finished,
          stroke.animate([{ translate: '0 0' }, { translate: '-14px 6px', offset: .5 }, { translate: '-12px -12px' }], o).finished
        ]).then(doIt);
      });
    })();
  </script>
</body>
