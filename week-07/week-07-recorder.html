<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 07 sketch &middot; Recorder</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-07-sketch.css?v=2" />
  <style>
  /* Recorder: a screen recorder's floating bar, after a dark pill over a teal desktop. Close; three
     capture modes (whole screen, smart, an area: icon buttons under one sliding highlight); which
     display; Cam and Mic (icon-and-text toggles); apps and settings (icon buttons); and Record, the
     one blue icon-and-text button.
     Motion: the highlight slides between modes and the screen answers: a frame lights the whole
     screen, a shimmer crosses it for the smart mode, a dashed area draws itself for the area mode.
     Cam on: a camera bubble grows out of the Cam button and arcs up to the corner of the screen;
     off, it flies back in. Mic on: three level bars inside it start to move. Record counts 3, 2, 1
     on the button itself, then the whole bar gathers into a small pill with a breathing red dot and
     a running clock; Stop opens it back into the bar and a "Saved" note rises. Close shrinks the bar
     into a dot you can click to bring it back. */
  :root { --w: 760px; --h: 480px; --blue: #5e9bff; }
  body { background: #061314; font: 500 13px/1 "Inter", -apple-system, system-ui, sans-serif; color: #dfe6e6; }
  .desk { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 70% at 50% 75%, #1a8a85, #0d4d4d 45%, #061314 75%); overflow: hidden; }
  .desk::after { content: ""; position: absolute; inset: 0; background: repeating-radial-gradient(ellipse at 50% 80%, transparent 0 14px, rgba(0,0,0,.08) 14px 16px); }
  .said { position: absolute; left: 0; right: 0; top: 14px; margin: 0; text-align: center; font-size: 12px; color: #7fa6a4; min-height: 1em; z-index: 3; }
  .frame { position: absolute; inset: 10px; border-radius: 10px; box-shadow: inset 0 0 0 2px var(--blue); opacity: 0; transition: opacity .35s; pointer-events: none; z-index: 1; }
  .shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(160,200,255,.25) 50%, transparent 70%); transform: translateX(-100%); pointer-events: none; z-index: 1; }
  .area { position: absolute; left: 210px; top: 90px; width: 340px; height: 190px; pointer-events: none; z-index: 1; }
  .area rect { fill: rgba(94,155,255,.08); stroke: #fff; stroke-width: 1.5; stroke-dasharray: 6 5; animation: ants .6s linear infinite; }
  @keyframes ants { to { stroke-dashoffset: -11; } }
  .cam { position: absolute; z-index: 2; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, #e8c7a8 0 17%, transparent 18%), radial-gradient(ellipse 34% 22% at 50% 88%, #3f6d8f 0 99%, transparent 100%), linear-gradient(#cfd8de, #9fb0bb); box-shadow: 0 0 0 3px #fff, 0 12px 26px -10px rgba(0,0,0,.7); pointer-events: none; }
  .toast { position: absolute; left: 50%; top: 40%; translate: -50% 0; z-index: 3; padding: 10px 16px; border-radius: 10px; background: rgba(20,26,28,.92); box-shadow: 0 0 0 1px #2c3437; font-size: 13px; }
  .wrap { position: absolute; left: 0; right: 0; bottom: 34px; padding: 0 30px; z-index: 2; }
  .bar { position: relative; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 7px; border-radius: 14px; background: #1c2224; box-shadow: 0 0 0 1px #2c3437, 0 12px 30px -12px rgba(0,0,0,.8); overflow: hidden; white-space: nowrap; }
  .bar > * { flex: none; }
  .i { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: #c9d2d3; transition: background-color .12s, color .12s; }
  .i:hover { background: #2a3235; color: #fff; }
  .i svg { width: 17px; height: 17px; }
  .round { border-radius: 50%; background: #262e31; }
  .grp { position: relative; display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: #151a1c; }
  .grp .hl { position: absolute; top: 2px; left: 2px; width: 32px; height: 32px; border-radius: 8px; background: #323b3f; transition: transform var(--flow-t) var(--flow); }
  .grp .i { position: relative; z-index: 1; }
  .grp .i[aria-pressed="true"] { color: #fff; }
  .tg { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; color: #8f9a9c; transition: color .15s, background-color .15s; }
  .tg svg { width: 17px; height: 17px; }
  .tg:hover { background: #2a3235; }
  .tg[aria-pressed="true"] { color: #fff; }
  .lv { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; width: 0; overflow: hidden; transition: width .3s var(--snap); }
  .tg[aria-pressed="true"] .lv { width: 10px; }
  .lv i { width: 2px; height: 3px; border-radius: 1px; background: #5ee38f; transition: height .09s; }
  .gear svg { transition: transform .6s var(--snap); }
  .gear:hover svg { transform: rotate(60deg); }
  .rec { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 88px; height: 32px; padding: 0 14px; border-radius: 8px; background: var(--blue); color: #08203f; font-weight: 600; transition: background-color .12s; }
  .rec:hover { background: #79adff; }
  .rec svg { width: 16px; height: 16px; display: inline-block; }
  .rec .n { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; }
  .compact { display: none; align-items: center; gap: 10px; padding: 0 4px 0 10px; }
  .is-rec .full { display: none; } .is-rec .compact { display: flex; }
  .full { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4d4f; animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(.7); opacity: .6; } }
  .clock { font-variant-numeric: tabular-nums; color: #fff; min-width: 42px; }
  .is-paused .dot { animation-play-state: paused; background: #ffb340; }
  .dotbtn { width: 22px; height: 22px; border-radius: 50%; background: #1c2224; box-shadow: 0 0 0 1px #2c3437, 0 6px 14px -6px #000; display: none; }
  .is-min .bar { display: none; } .is-min .dotbtn { display: block; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .dot, .area rect { animation: none; } }
  </style>
</head>
<body>
  <a class="back-pill" href="week-07.html#ideation" hidden>&larr; Week 07</a>
  <div class="stage" data-align="center">
    <div class="desk" id="desk">
      <span class="frame" id="frame"></span><span class="shimmer" id="shimmer"></span>
      <svg class="area" id="area" style="display:none" aria-hidden="true"><rect x="1" y="1" width="338" height="188" rx="4"/></svg>
    </div>
    <p class="said" aria-live="polite"></p>
    <div class="wrap dock" id="wrap">
      <div data-glide>
        <div class="bar" id="bar" role="toolbar" aria-label="Recorder">
          <div class="full">
            <button class="i" type="button" aria-label="Close" id="close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
            <div class="grp" data-radio id="modes">
              <span class="hl" aria-hidden="true"></span>
              <button class="i" type="button" aria-pressed="true" aria-label="Whole screen" data-m="screen"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11" cy="9" r="2.4" fill="currentColor"/></svg></button>
              <button class="i" type="button" aria-pressed="false" aria-label="Smart capture" data-m="smart"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 1.5l1.2 3.3L10.5 6 7.2 7.2 6 10.5 4.8 7.2 1.5 6l3.3-1.2zM12 8.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="currentColor"/></svg></button>
              <button class="i" type="button" aria-pressed="false" aria-label="An area" data-m="area"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg></button>
            </div>
            <button class="i round" type="button" aria-label="Display"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 14h4M8 11v3" stroke="currentColor" stroke-width="1.4"/></svg></button>
            <div class="grp">
              <button class="tg" type="button" aria-pressed="false" id="cam" data-manual><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="9" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 7l4-2v6l-4-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Cam</button>
              <button class="tg" type="button" aria-pressed="false" id="mic" data-manual><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5V15" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Mic<span class="lv" aria-hidden="true"><i></i><i></i><i></i></span></button>
            </div>
            <button class="i round" type="button" aria-label="Apps"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h5v5H2zM9 9h5v5H9zM2 9h5v5H2zM11.5 2v5M9 4.5h5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
            <button class="i round gear" type="button" aria-label="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
            <button class="rec" type="button" id="rec" data-manual><span class="lab"><svg viewBox="0 0 16 16" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><circle cx="8" cy="8" r="2.5" fill="currentColor"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Record</span></button>
          </div>
          <div class="compact">
            <span class="dot" aria-hidden="true"></span><span class="clock" id="clock">0:00</span>
            <button class="i" type="button" aria-label="Pause" id="pause" data-manual><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3h2.5v10H4.5zM9 3h2.5v10H9z" fill="currentColor"/></svg></button>
            <button class="i" type="button" aria-label="Stop" id="stop"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="2" fill="#ff4d4f"/></svg></button>
          </div>
        </div>
        <button class="dotbtn" type="button" aria-label="Show the recorder" id="dotbtn"></button>
      </div>
    </div>
  </div>
  <script src="week-07-sketch.js?v=4"></script>
  <script>
    (() => {
      const said = document.querySelector('.said'), bar = document.getElementById('bar'), wrap = document.getElementById('wrap'), desk = document.getElementById('desk');
      const $ = id => document.getElementById(id), calm = () => M.calm.matches;
      const local = el => { const s = document.querySelector('.stage').getBoundingClientRect(), r = el.getBoundingClientRect(), f = M.fit(); return { x: (r.left - s.left) / f, y: (r.top - s.top) / f, w: r.width / f, h: r.height / f }; };

      // capture modes: the highlight slides; the screen shows what will be captured
      const modes = $('modes'), hl = modes.querySelector('.hl');
      const showMode = m => {
        const i = [...modes.querySelectorAll('.i')].findIndex(b => b.dataset.m === m);
        hl.style.transform = `translateX(${i * 34}px)`;
        $('frame').style.opacity = m === 'screen' ? 1 : 0;
        $('area').style.display = m === 'area' ? '' : 'none';
        if (m === 'area' && !calm()) { const r = $('area').querySelector('rect'), L = 1060; r.animate([{ strokeDasharray: `0 ${L}` }, { strokeDasharray: `${L} 0`, offset: .99 }, { strokeDasharray: '6 5' }], { duration: 520, easing: 'cubic-bezier(.3, .7, .3, 1)' }); }
        if (m === 'smart' && !calm()) $('shimmer').animate([{ transform: 'translateX(-100%)' }, { transform: 'translateX(100%)' }], { duration: 900, easing: 'cubic-bezier(.4, 0, .2, 1)' });
      };
      modes.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) showMode(b.dataset.m); });
      showMode('screen');

      // Cam: a bubble grows out of the button and arcs to the screen's corner
      let bubble = null;
      $('cam').addEventListener('click', () => {
        const on = $('cam').getAttribute('aria-pressed') !== 'true'; $('cam').setAttribute('aria-pressed', String(on));
        const c = local($('cam')), end = { x: 24, y: 220 };
        if (on) {
          bubble = document.createElement('span'); bubble.className = 'cam'; bubble.style.left = end.x + 'px'; bubble.style.top = end.y + 'px'; desk.append(bubble);
          if (!calm()) {
            const sx = c.x + c.w / 2 - 60 - end.x, sy = c.y + c.h / 2 - 60 - end.y;
            bubble.animate([{ transform: `translate(${sx}px, ${sy}px) scale(.12)` }, { transform: `translate(${sx * .4}px, ${sy * .4 - 70}px) scale(.8)`, offset: .55 }, { transform: 'none' }], { duration: 640, easing: 'cubic-bezier(.3, .6, .3, 1)' })
              .finished.then(() => bubble?.animate([{ transform: 'scale(1.06)' }, { transform: 'none' }], { duration: M.dur.snap, easing: M.ease.snap }));
          }
          said.textContent = 'Camera on';
        } else if (bubble) {
          const b = bubble; bubble = null;
          if (calm()) { b.remove(); return; }
          const sx = c.x + c.w / 2 - 60 - end.x, sy = c.y + c.h / 2 - 60 - end.y;
          b.animate([{ transform: 'none' }, { transform: `translate(${sx}px, ${sy}px) scale(.1)`, opacity: .4 }], { duration: 380, easing: 'cubic-bezier(.5, 0, .7, .3)', fill: 'forwards' }).finished.then(() => b.remove());
          said.textContent = 'Camera off';
        }
      });

      // Mic: three level bars start to move
      let micT;
      $('mic').addEventListener('click', () => {
        const on = $('mic').getAttribute('aria-pressed') !== 'true'; $('mic').setAttribute('aria-pressed', String(on));
        clearInterval(micT);
        const bars = [...$('mic').querySelectorAll('.lv i')];
        if (on && !calm()) micT = setInterval(() => bars.forEach((b, i) => b.style.height = (3 + Math.random() * (i === 1 ? 9 : 7)) + 'px'), 110);
        else bars.forEach(b => b.style.height = '3px');
        said.textContent = on ? 'Microphone on' : 'Microphone off';
      });

      // the bar gathers into a pill (and opens back): its width springs from one to the other
      const morph = async change => {
        const w0 = bar.offsetWidth; change(); const w1 = bar.offsetWidth;
        if (calm()) return;
        const kids = [...bar.querySelector(bar.classList.contains('is-rec') ? '.compact' : '.full').children];
        kids.forEach((k, i) => k.animate([{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'none' }], { duration: 300, delay: 120 + i * 30, easing: 'cubic-bezier(.2, .8, .3, 1)', fill: 'backwards' }));
        await bar.animate([{ width: w0 + 'px' }, { width: w1 + 'px' }], { duration: M.dur.open, easing: M.ease.open }).finished;
      };

      // Record: 3, 2, 1 on the button, then the bar gathers into the recording pill
      let t0 = 0, clockT, paused = false, pausedAt = 0, counting = false;
      $('rec').addEventListener('click', async () => {
        if (counting) return; counting = true;
        const rec = $('rec'), lab = rec.querySelector('.lab');
        lab.style.visibility = 'hidden';
        for (const n of [3, 2, 1]) {
          const s = document.createElement('span'); s.className = 'n'; s.textContent = n; rec.append(s); said.textContent = n;
          if (!calm()) await s.animate([{ transform: 'scale(1.8)', opacity: 0 }, { transform: 'scale(1)', opacity: 1, offset: .35 }, { transform: 'scale(.7)', opacity: 0 }], { duration: 700, easing: 'cubic-bezier(.2, .7, .3, 1)' }).finished;
          s.remove();
        }
        lab.style.visibility = ''; counting = false;
        await morph(() => bar.classList.add('is-rec'));
        t0 = performance.now(); paused = false; bar.classList.remove('is-paused');
        clockT = setInterval(() => { if (paused) return; const s = Math.floor((performance.now() - t0) / 1000); $('clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 250);
        said.textContent = 'Recording';
      });
      $('pause').addEventListener('click', () => {
        paused = !paused; bar.classList.toggle('is-paused', paused);
        if (paused) pausedAt = performance.now(); else t0 += performance.now() - pausedAt;
        $('pause').setAttribute('aria-label', paused ? 'Resume' : 'Pause');
        $('pause').innerHTML = paused ? '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3l9 5-9 5z" fill="currentColor"/></svg>' : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3h2.5v10H4.5zM9 3h2.5v10H9z" fill="currentColor"/></svg>';
        said.textContent = paused ? 'Paused' : 'Recording';
      });
      $('stop').addEventListener('click', async () => {
        clearInterval(clockT); const took = $('clock').textContent;
        await morph(() => bar.classList.remove('is-rec'));
        $('clock').textContent = '0:00';
        const t = document.createElement('div'); t.className = 'toast'; t.textContent = 'Saved · ' + took; document.querySelector('.stage').append(t);
        if (!calm()) await t.animate([{ transform: 'translateY(16px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: M.dur.open, easing: M.ease.open }).finished;
        setTimeout(() => t.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }).finished.then(() => t.remove()), 1400);
        said.textContent = 'Saved';
      });

      // Close: the bar shrinks into a dot; the dot brings it back
      $('close').addEventListener('click', async () => {
        if (!calm()) await bar.animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(.05, .4)', opacity: 0 }], { duration: 280, easing: 'cubic-bezier(.5, 0, .7, .4)' }).finished;
        wrap.classList.add('is-min'); $('dotbtn').focus(); said.textContent = 'Recorder hidden';
        if (!calm()) $('dotbtn').animate([{ transform: 'scale(0)' }, { transform: 'none' }], { duration: M.dur.pop, easing: M.ease.pop });
      });
      $('dotbtn').addEventListener('click', () => {
        wrap.classList.remove('is-min');
        if (!calm()) bar.animate([{ transform: 'scale(.05, .4)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: M.dur.open, easing: M.ease.open });
        said.textContent = 'Recorder';
      });
    })();
  </script>
</body>
</html>
