<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 07 sketch &middot; Node</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-07-sketch.css?v=2" />
  <style>
  /* Node: an automation step drawn as a card (an icon, "Node 07", what it does, who is on it), after a
     dark card with a stack of colourful avatars and "+3". Its toolbar lives behind the card and comes
     out when you point at it: Run (icon and text), Edit (text), Duplicate and More (icons). Alignment
     lines the toolbar up with the card's left edge, middle or right edge.
     Motion: the toolbar rises from behind the card's top edge on a spring, its buttons arriving one
     after another, and sinks back when you leave. The avatars fan apart when you point at them and
     "+3" opens into three more faces. Run sends a light round the card's border and a bead along the
     icon's line while the text says it is working, then a tick pops into the icon. Duplicate slides
     a copy out from under the card and lets it settle behind. More unfolds a small row of choices. */
  :root { --w: 760px; --h: 560px; }
  body { background: #141414; font: 400 15px/1.45 "Inter", -apple-system, system-ui, sans-serif; color: #f2f2f2; }
  .said { position: absolute; left: 0; right: 0; bottom: 14px; margin: 0; text-align: center; font-size: 12px; color: #7a7a7a; min-height: 1em; }
  .holder { position: absolute; left: 50%; top: 170px; width: 380px; margin-left: -190px; }
  .tools { position: absolute; left: 0; right: 0; bottom: 100%; height: 64px; overflow: hidden; pointer-events: none; }
  .tools .dock { height: 100%; align-items: flex-end; padding: 0 22px; }
  .tb { display: flex; gap: 4px; padding: 5px; border-radius: 14px 14px 0 0; background: #2a2a2a; transform: translateY(100%); pointer-events: auto; }
  .tb button { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 10px; color: #ddd; font-size: 13.5px; transition: background-color .12s; }
  .tb button:hover { background: #3a3a3a; color: #fff; }
  .tb button svg { width: 16px; height: 16px; }
  .tb .ic { width: 36px; padding: 0; justify-content: center; }
  .tb .run { color: #8ef0a8; }
  .menu { position: absolute; z-index: 3; top: 8px; gap: 2px; padding: 5px; border-radius: 12px; background: #2a2a2a; box-shadow: 0 12px 26px -12px #000; }
  .menu button { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 8px; color: #ddd; font-size: 13px; }
  .menu button:hover { background: #3a3a3a; }
  .menu svg { width: 15px; height: 15px; }
  .card { position: relative; z-index: 2; padding: 34px 34px 30px; border-radius: 32px; background: #202020; transition: transform var(--snap-t) var(--snap), box-shadow .3s; }
  .holder:hover .card, .holder:focus-within .card { transform: translateY(-3px); box-shadow: 0 18px 40px -20px #000; }
  .card .border { position: absolute; inset: 0; border-radius: inherit; padding: 2px; background: conic-gradient(from var(--a, 0deg), transparent 0 70%, #8ef0a8 85%, transparent 100%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; pointer-events: none; }
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .card.running .border { opacity: 1; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { --a: 360deg; } }
  .card.done { box-shadow: 0 0 0 2px #2fbf6b, 0 18px 40px -20px #000; }
  .head { display: flex; align-items: center; gap: 18px; }
  .icon { position: relative; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: #2c2c2c; }
  .icon svg { width: 26px; height: 26px; }
  .icon .bead { position: absolute; left: 14px; top: 26px; width: 5px; height: 5px; border-radius: 50%; background: #8ef0a8; opacity: 0; }
  h2 { margin: 0; font-size: 26px; font-weight: 500; }
  .desc { margin: 22px 0 26px; color: #8f8f8f; font-size: 18px; min-height: 78px; }
  .people { display: flex; align-items: center; gap: 12px; }
  .stack { display: flex; align-items: center; }
  .av { width: 46px; height: 46px; border-radius: 50%; margin-left: -14px; box-shadow: 0 0 0 3px #202020; transition: margin var(--snap-t) var(--snap), transform var(--snap-t) var(--snap); }
  .av:first-child { margin-left: 0; }
  .stack:hover .av, .stack:focus-within .av { margin-left: 4px; }
  .stack:hover .av:first-child { margin-left: 0; }
  .stack:hover .av:nth-child(2n) { transform: translateY(-3px); }
  .more { color: #8f8f8f; font-size: 17px; height: 46px; padding: 0 6px; border-radius: 10px; }
  .more:hover { color: #fff; }
  .ghost { position: absolute; z-index: 1; inset: 0; border-radius: 32px; background: #1a1a1a; box-shadow: 0 0 0 1px #2a2a2a; pointer-events: none; }
  button:focus-visible { outline: 2px solid #8ef0a8; outline-offset: 2px; }
  </style>
</head>
<body>
  <a class="back-pill" href="week-07.html#ideation" hidden>&larr; Week 07</a>
  <div class="stage" data-align="left">
    <div class="holder" id="holder">
      <div class="tools"><div class="dock"><div class="tb" id="tb" role="toolbar" aria-label="Node tools" data-glide>
        <button class="run" type="button" id="run" data-manual><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5l9 5.5-9 5.5z" fill="currentColor"/></svg>Run</button>
        <button type="button" id="edit">Edit</button>
        <button class="ic" type="button" aria-label="Duplicate" id="dup"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 10.5V3.5A1.5 1.5 0 0 1 4.5 2h6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button class="ic" type="button" aria-label="More" data-opens="menu"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="12.5" cy="8" r="1.4" fill="currentColor"/></svg></button>
      </div></div></div>
      <div class="card" id="card">
        <span class="border" aria-hidden="true"></span>
        <div class="head"><span class="icon" aria-hidden="true"><svg viewBox="0 0 26 26" id="ico"><path d="M3 13h6M17 13h6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="13" cy="13" r="4" fill="none" stroke="#fff" stroke-width="2.2"/></svg><span class="bead"></span></span><h2>Node 07</h2></div>
        <p class="desc" id="desc">Reads the thread, writes a summary, and posts it back to the channel it came from.</p>
        <div class="people">
          <span class="stack" id="stack"></span>
          <button class="more" type="button" id="more" aria-label="Show 3 more people" aria-expanded="false" data-manual>+3</button>
        </div>
      </div>
      <div class="menu" data-tier id="menu" role="toolbar" aria-label="More">
        <button type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13l1-3 7-7 2 2-7 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Rename</button>
        <button type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 12l8-8" stroke="currentColor" stroke-width="1.4"/></svg>Disable</button>
        <button type="button" style="color:#ff7a7a"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>Delete</button>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <script src="week-07-sketch.js?v=4"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id), said = document.querySelector('.said'), calm = () => M.calm.matches;
      const holder = $('holder'), tb = $('tb'), card = $('card');
      const BLOBS = [['#2f7bff', '#5a4bff'], ['#ff5a4b', '#e23b6a'], ['#ff5ac8', '#c247ff'], ['#ffb02e', '#ff6a2e'], ['#2fd3a8', '#1b8cff'], ['#a8e05a', '#2fbf6b']];
      const av = ([a, b]) => `<span class="av" style="background:radial-gradient(circle at 35% 30%, ${a}, ${b} 70%)"></span>`;
      $('stack').innerHTML = BLOBS.slice(0, 3).map(av).join('');

      // the toolbar rises from behind the card, buttons one after another; it sinks when you leave
      let up = false, leaveT;
      const show = on => {
        clearTimeout(leaveT);
        if (on === up) return; up = on;
        if (calm()) { tb.style.transform = on ? 'none' : ''; return; }
        tb.getAnimations().forEach(a => a.cancel());
        tb.animate(on ? [{ transform: 'translateY(100%)' }, { transform: 'none' }] : [{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: on ? M.dur.open : 220, easing: on ? M.ease.open : 'cubic-bezier(.5, 0, .7, .4)', fill: 'forwards' });
        if (on) [...tb.children].forEach((b, i) => b.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 320, delay: 60 + i * 35, easing: 'cubic-bezier(.2, .8, .3, 1)', fill: 'backwards' }));
        if (!on) M.tier('menu', false);
      };
      holder.addEventListener('pointerenter', () => show(true));
      holder.addEventListener('pointerleave', () => { leaveT = setTimeout(() => show(false), 350); });
      holder.addEventListener('focusin', () => show(true));
      holder.addEventListener('focusout', e => { if (!holder.contains(e.relatedTarget)) show(false); });
      // the menu opens under the More button
      const placeMenu = () => { const m = $('menu'), b = tb.querySelector('[data-opens]'), f = M.fit(), hr = holder.getBoundingClientRect(), br = b.getBoundingClientRect(); m.style.left = Math.min(380 - 270, Math.max(0, (br.left - hr.left) / f - 10)) + 'px'; };
      tb.querySelector('[data-opens]').addEventListener('click', placeMenu);

      // shown at first, so the picture says what the card has; it sinks the first time the pointer leaves
      show(true);

      // +3 opens into three more faces
      $('more').addEventListener('click', () => {
        const open = $('more').getAttribute('aria-expanded') !== 'true'; $('more').setAttribute('aria-expanded', String(open));
        const st = $('stack');
        if (open) {
          st.insertAdjacentHTML('beforeend', BLOBS.slice(3).map(av).join(''));
          $('more').textContent = '−'; $('more').setAttribute('aria-label', 'Show fewer people');
          if (!calm()) [...st.children].slice(3).forEach((a, i) => a.animate([{ transform: 'scale(0) translateX(-20px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: M.dur.pop, delay: i * 60, easing: M.ease.pop, fill: 'backwards' }));
          said.textContent = '6 people';
        } else {
          const extra = [...st.children].slice(3);
          $('more').textContent = '+3'; $('more').setAttribute('aria-label', 'Show 3 more people');
          if (calm()) extra.forEach(a => a.remove());
          else extra.reverse().forEach((a, i) => a.animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(0)', opacity: 0 }], { duration: 180, delay: i * 40, fill: 'forwards' }).finished.then(() => a.remove()));
          said.textContent = '3 people';
        }
      });

      // Run: light goes round the border, a bead runs along the icon's line, then a tick pops in
      const desc = $('desc'), base = desc.textContent;
      let running = false;
      $('run').addEventListener('click', async () => {
        if (running) return; running = true;
        card.classList.remove('done'); card.classList.add('running'); said.textContent = 'Running';
        const bead = card.querySelector('.bead');
        const type = async t => { desc.textContent = ''; for (const ch of t) { desc.textContent += ch; if (!calm()) await new Promise(r => setTimeout(r, 18)); } };
        await type('Reading the thread…');
        if (!calm()) await bead.animate([{ transform: 'translateX(0)', opacity: 1 }, { transform: 'translateX(-10px)', opacity: 1, offset: .25 }, { transform: 'translateX(14px)', opacity: 1, offset: .75 }, { transform: 'translateX(0)', opacity: 0 }], { duration: 900, iterations: 2, easing: 'ease-in-out' }).finished;
        await type('Posted a summary to #design.');
        card.classList.remove('running'); card.classList.add('done');
        const ico = $('ico'), old = ico.innerHTML;
        ico.innerHTML = '<path d="M6 13.5l5 5 9-11" fill="none" stroke="#8ef0a8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
        if (!calm()) ico.animate([{ transform: 'scale(.3) rotate(-30deg)' }, { transform: 'none' }], { duration: M.dur.pop, easing: M.ease.pop });
        said.textContent = 'Done';
        setTimeout(() => { ico.innerHTML = old; card.classList.remove('done'); desc.textContent = base; running = false; }, 2400);
      });

      // Duplicate: a copy slides out from under the card and settles behind it
      $('dup').addEventListener('click', () => {
        const g = document.createElement('div'); g.className = 'ghost'; holder.append(g);
        said.textContent = 'Duplicated as Node 08';
        if (calm()) { setTimeout(() => g.remove(), 600); return; }
        g.animate([{ transform: 'none' }, { transform: 'translate(40px, 30px) rotate(3deg)', offset: .55 }, { transform: 'translate(18px, 16px) rotate(1deg)' }], { duration: 700, easing: 'cubic-bezier(.3, .7, .3, 1)', fill: 'forwards' })
          .finished.then(() => g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, delay: 900, fill: 'forwards' }).finished).then(() => g.remove());
      });
      $('edit').addEventListener('click', () => { said.textContent = 'Editing Node 07'; if (!calm()) card.querySelector('h2').animate([{ background: 'rgba(142,240,168,.18)' }, { background: 'transparent' }], { duration: 700 }); });
    })();
  </script>
</body>
</html>
