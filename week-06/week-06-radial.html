<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Radial</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Radial: the menu as a ring around the pointer, so every item is the same short reach away.
     The two sections are two arcs with a gap between them (the divider), each named inside the
     ring. Label under the icon, shortcut under the label, the badge on the icon. The submenu
     is a second, outer arc that grows out from its item. The centre says what was picked. */
  :root { --w: 500px; --h: 430px; --r: 128px; --bg: #0d1016; --fg: #e9eef5; --muted: #6f7a8a; --cyan: #7ef0ff; --amber: #ffc46b; }
  body { background: radial-gradient(circle at 50% 50%, #171c26, var(--bg) 70%); color: var(--fg); font: 500 12px/1.2 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .ring { position: absolute; inset: 0; }
  .arcs { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; translate: -50% -50%; overflow: visible; pointer-events: none; }
  .menu { position: absolute; inset: 0; }
  .item { position: absolute; left: 50%; top: 50%; display: grid; justify-items: center; gap: 3px; width: 78px; padding: 8px 0 7px; border-radius: 16px;
    transform: translate(-50%, -50%) rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))); transition: background .15s, box-shadow .15s, scale .15s; }
  .item svg { width: 22px; height: 22px; }
  .item kbd { font-size: 10px; color: var(--muted); letter-spacing: .06em; }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item { background: rgba(126, 240, 255, .12); box-shadow: 0 0 0 1px rgba(126, 240, 255, .55), 0 0 22px rgba(126, 240, 255, .25); outline: none; scale: 1.06; }
  .item:active, .item.is-picked { scale: .94; background: rgba(126, 240, 255, .3); }
  .item[aria-disabled="true"] { color: #3c4553; }
  .item[aria-disabled="true"]:hover { background: none; box-shadow: none; scale: 1; }
  .item[aria-disabled="true"] kbd { color: #2e3540; }
  .ic { position: relative; }
  .badge { position: absolute; top: -6px; right: -12px; min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--amber); color: #1a1205; font-size: 10px; font-weight: 800; line-height: 16px; text-align: center; }
  .label .out { font-size: 10px; color: var(--muted); margin-left: 2px; }
  .sect { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(var(--a)) translate(58px) rotate(calc(-1 * var(--a))); font-size: 9px; letter-spacing: .3em; color: var(--muted); }
  .has-sub .submenu .item { --r: 206px; width: 64px; padding: 7px 0; opacity: 0; scale: .6; transition: opacity .2s, scale .25s cubic-bezier(.3, 1.5, .5, 1), background .15s, box-shadow .15s; }
  .has-sub.is-open .submenu .item { opacity: 1; scale: 1; }
  .has-sub.is-open .submenu .item:nth-child(2) { transition-delay: .04s; }
  .has-sub.is-open .submenu .item:nth-child(3) { transition-delay: .08s; }
  .submenu .item[aria-checked="true"] { color: var(--cyan); box-shadow: 0 0 0 1px rgba(126, 240, 255, .35); }
  .submenu { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .has-sub { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .has-sub > .item { left: 0; top: 0; }
  .submenu .item { left: 0; top: 0; }
  .said { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 92px; margin: 0; text-align: center; color: var(--cyan); font-size: 12px; }
  .said:empty::before { content: "●"; color: #2a3240; font-size: 10px; }
  </style>
</head>
<body>
  <div class="stage">
    <svg class="arcs" viewBox="-180 -180 360 360" aria-hidden="true">
      <!-- two arcs, radius 128, one per section, a gap between them -->
      <path d="M -116.3 -53.6 A 128 128 0 0 1 116.3 -53.6" fill="none" stroke="rgba(126,240,255,.07)" stroke-width="82" stroke-linecap="round"/>
      <path d="M 116.3 53.6 A 128 128 0 0 1 -116.3 53.6" fill="none" stroke="rgba(255,196,107,.06)" stroke-width="82" stroke-linecap="round"/>
      <circle r="44" fill="none" stroke="#212836" stroke-width="1"/>
    </svg>
    <div class="menu" role="menu" aria-label="Photo">
      <span class="sect" style="--a: -90deg" aria-hidden="true">EDIT</span>
      <span class="sect" style="--a: 90deg" aria-hidden="true">SEND</span>
      <button class="item" role="menuitem" style="--a: -155deg"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="6" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 14 16 3M14 14 6 3" stroke="currentColor" stroke-width="1.6"/></svg><span class="label">Cut</span><kbd>⌘X</kbd></button>
      <button class="item" role="menuitem" style="--a: -115deg"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M7 7V3h12v12h-4M3 7h12v12H3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="label">Copy</span><kbd>⌘C</kbd></button>
      <button class="item" role="menuitem" style="--a: -65deg"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M8 3h6v3H8zM6 4H4v15h14V4h-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="label">Paste</span><kbd>⌘V</kbd></button>
      <button class="item" role="menuitem" style="--a: -25deg" aria-disabled="true"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M17 11a6 6 0 1 1-2-4.5M17 3v4h-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Redo</span><kbd>⇧⌘Z</kbd></button>
      <button class="item" role="menuitem" style="--a: 25deg" data-say="12 new"><span class="ic"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 5h16v12H3zM3 5l8 7 8-7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="badge">12</span></span><span class="label">Inbox</span><kbd>⌘1</kbd></button>
      <button class="item" role="menuitem" style="--a: 75deg"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="5" cy="11" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 10l8-4M7 12l8 4" stroke="currentColor" stroke-width="1.6"/></svg><span class="label">Share<span class="out">↗</span></span></button>
      <button class="item" role="menuitem" style="--a: 115deg"><svg viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 7v4l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="label">Later</span></button>
      <div class="has-sub" style="--a: 155deg">
        <button class="item" role="menuitem" style="--a: 155deg"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M18 11a7 7 0 1 1-3-5.7M16 2v4h-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Rotate ›</span></button>
        <div class="submenu" role="menu" aria-label="Rotate">
          <button class="item" role="menuitemradio" aria-checked="true" style="--a: 137deg"><span class="label">90°</span></button>
          <button class="item" role="menuitemradio" aria-checked="false" style="--a: 155deg"><span class="label">180°</span></button>
          <button class="item" role="menuitemradio" aria-checked="false" style="--a: 173deg"><span class="label">270°</span></button>
        </div>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=1"></script>
</body>
</html>
