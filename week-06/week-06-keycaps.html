<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Keycaps</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Keycaps: shortcut first. The shortcut is not grey small print at the end of the row but a set
     of real keys, so the menu teaches its keys while you use it. Hover lifts the item's keys;
     pressing pushes them down, the way the keys would go. Icons sit on round coloured stickers,
     the badge is a sticker too. The submenu pops out of its item with a little bounce. */
  @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap");
  :root { --w: 540px; --h: 410px; --bg: #f4efe4; --card: #fffdf8; --ink: #23201b; --muted: #9b9486; --font: "DM Sans", system-ui, sans-serif; }
  body { background: var(--bg); color: var(--ink); font: 500 15px/1 var(--font); }
  .menu, .submenu { padding: 8px; background: var(--card); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); }
  .menu { position: absolute; left: 26px; top: 22px; width: 290px; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 8px; border-radius: 12px; }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item { background: #f3ecdc; outline: none; }
  .st { display: grid; place-items: center; width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--c, #ddd); }
  .st svg { width: 15px; height: 15px; }
  .label { flex: 1; }
  .keys { display: flex; gap: 3px; }
  .keys kbd { display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--card); font-size: 12px; font-weight: 700;
    box-shadow: 0 2px 0 var(--ink); transition: translate .08s, box-shadow .08s; }
  .item:hover .keys kbd, .item:focus-visible .keys kbd { translate: 0 -2px; box-shadow: 0 4px 0 var(--ink); }
  .item:active .keys kbd, .item.is-picked .keys kbd { translate: 0 2px; box-shadow: 0 0 0 var(--ink); background: #ffd75e; }
  .item[aria-disabled="true"] { color: var(--muted); }
  .item[aria-disabled="true"]:hover { background: none; }
  .item[aria-disabled="true"] .st { background: #ece6d8; color: var(--muted); }
  .item[aria-disabled="true"] .keys kbd { border-color: #cfc8b9; box-shadow: 0 2px 0 #cfc8b9; color: var(--muted); translate: none; }
  .rule { height: 0; margin: 6px 8px; border-top: 2px dotted #d7cfbe; }
  .sect { padding: 8px 8px 4px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .badge { min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: #ff6b4a; color: #fff; font-size: 13px; font-weight: 700; line-height: 26px; text-align: center; rotate: -8deg; border: 2px solid var(--ink); }
  .end { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); font-size: 14px; }
  .submenu { position: absolute; left: calc(100% + 18px); bottom: -10px; width: 190px; transform-origin: 0 calc(100% - 24px); scale: .4; opacity: 0;
    transition: scale .35s cubic-bezier(.3, 1.6, .5, 1), opacity .12s; }
  .has-sub.is-open > .submenu { scale: 1; opacity: 1; }
  .submenu .dot { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 2px solid var(--ink); }
  .submenu [aria-checked="true"] .dot { background: var(--ink); box-shadow: inset 0 0 0 2px var(--card); }
  .said { position: absolute; right: 30px; bottom: 26px; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13px; }
  .said:empty { display: none; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="menu" role="menu" aria-label="Tools">
      <button class="item" role="menuitem"><span class="st" style="--c:#b8e3ff"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13c3 0 4-2 4-4l5-6 1 1-6 5c0 2-2 4-4 4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span><span class="label">Brush</span><span class="keys"><kbd>B</kbd></span></button>
      <button class="item" role="menuitem"><span class="st" style="--c:#ffd0e0"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 13 2 9l6-6 6 6-4 4zM5 6l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span><span class="label">Eraser</span><span class="keys"><kbd>E</kbd></span></button>
      <button class="item" role="menuitem" aria-disabled="true"><span class="st"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2s4 5 4 8a4 4 0 0 1-8 0c0-3 4-8 4-8z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span><span class="label">Fill</span><span class="keys"><kbd>⇧</kbd><kbd>G</kbd></span></button>
      <button class="item" role="menuitem"><span class="st" style="background:none"></span><span class="label">Undo</span><span class="keys"><kbd>⌘</kbd><kbd>Z</kbd></span></button>
      <div class="rule" role="separator"></div>
      <div class="sect">Canvas</div>
      <button class="item" role="menuitem" data-say="5 layers"><span class="st" style="--c:#c9f2b4"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 14 5 8 8 2 5zM2 8l6 3 6-3M2 11l6 3 6-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span><span class="label">Layers</span><span class="badge">5</span></button>
      <button class="item" role="menuitem"><span class="st" style="--c:#ffe59a"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2M5 5l3-3 3 3M3 10v4h10v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="label">Export</span><span class="end">↗</span></button>
      <div class="has-sub">
        <button class="item" role="menuitem"><span class="st" style="--c:#e2d4ff"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span><span class="label">Blend</span><span class="end">→</span></button>
        <div class="submenu" role="menu" aria-label="Blend">
          <button class="item" role="menuitemradio" aria-checked="true"><span class="dot"></span><span class="label">Normal</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="dot"></span><span class="label">Multiply</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="dot"></span><span class="label">Screen</span></button>
        </div>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
</body>
</html>
