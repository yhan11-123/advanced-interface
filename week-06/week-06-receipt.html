<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Receipt</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Receipt: a café till's menu printed on thermal paper. Dot leaders run from each item to its
     shortcut like a price; sections are a dashed rule with the name in the middle; the bottom edge
     is torn. Hover drags a yellow highlighter over the row; pressing stamps a round "OK" on it.
     The submenu prints as a second, shorter slip beside the first. */
  @import url("https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap");
  :root { --w: 500px; --h: 400px; --paper: #fbfaf6; --ink: #2a2a2a; --muted: #9a978f; --hi: #ffe45c; --font: "Space Mono", ui-monospace, monospace; }
  body { background: #c9cbc6; color: var(--ink); font: 400 13px/1 var(--font); }
  .menu { filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); }
  .menu, .submenu { isolation: isolate; padding: 16px 14px 26px; }
  .menu::before, .submenu::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--paper);
    -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 12px 8px repeat-x;
    mask: linear-gradient(#000 0 0) top / 100% calc(100% - 8px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 12px 8px repeat-x; }
  .menu { position: absolute; left: 30px; top: 18px; width: 250px; }
  .head { text-align: center; font-weight: 700; letter-spacing: .2em; padding-bottom: 10px; }
  .item { position: relative; display: flex; align-items: baseline; gap: 6px; width: 100%; height: 28px; padding: 8px 4px 0; }
  .item::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 2px; width: 100%; background: var(--hi); border-radius: 2px 6px 3px 7px; transform: scaleX(0) skewX(-8deg); transform-origin: left; transition: transform .22s ease-out; mix-blend-mode: multiply; }
  .item:hover::before, .item:focus-visible::before, .has-sub.is-open > .item::before { transform: scaleX(1) skewX(-8deg); }
  .item:focus-visible { outline: none; }
  .item > * { position: relative; }
  .ico { width: 2ch; flex: none; }
  .label { white-space: nowrap; }
  .lead { flex: 1; border-bottom: 2px dotted var(--muted); transform: translateY(-3px); min-width: 12px; }
  kbd, .end { white-space: nowrap; }
  .item[aria-disabled="true"] { color: var(--muted); }
  .item[aria-disabled="true"]::before { display: none; }
  .item[aria-disabled="true"] .label::after { content: " — sold out"; font-size: 11px; }
  .item::after { content: "OK"; position: absolute; right: 26px; top: 0; width: 30px; height: 30px; border: 2px solid #c8322b; border-radius: 50%; color: #c8322b; font: 700 11px/26px var(--font); text-align: center; opacity: 0; transform: rotate(-14deg) scale(1.6); pointer-events: none; }
  .item.is-picked::after { animation: stamp .6s ease-out; }
  @keyframes stamp { 0% { opacity: 0; transform: rotate(-14deg) scale(1.6); } 25%, 70% { opacity: .9; transform: rotate(-14deg) scale(1); } 100% { opacity: 0; transform: rotate(-14deg) scale(1); } }
  .sect { display: flex; align-items: center; gap: 8px; padding: 14px 0 4px; color: var(--muted); font-size: 11px; letter-spacing: .2em; }
  .sect::before, .sect::after { content: ""; flex: 1; border-top: 1px dashed var(--muted); }
  .rule { border-top: 1px dashed var(--muted); margin: 10px 0 0; }
  .badge { padding: 0 5px; border: 1.5px solid var(--ink); border-radius: 9px; font-weight: 700; font-size: 11px; line-height: 15px; }
  .submenu { position: absolute; left: calc(100% + 30px); bottom: -30px; width: 150px; transform: translateY(-14px); clip-path: inset(0 0 100% 0); transition: clip-path .4s steps(8), transform .4s steps(8); }
  .has-sub.is-open > .submenu { clip-path: inset(0 0 0 0); transform: none; }
  .submenu .ico { visibility: hidden; }
  .submenu [aria-checked="true"] .ico { visibility: visible; }
  .said { position: absolute; right: 30px; bottom: 12px; width: 160px; text-align: right; color: #4d4b46; font-size: 12px; }
  .said:not(:empty)::before { content: "> "; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="menu" role="menu" aria-label="Order">
      <div class="head" aria-hidden="true">CAFÉ No.6</div>
      <button class="item" role="menuitem"><span class="ico">☕</span><span class="label">Latte</span><span class="lead"></span><kbd>⌘1</kbd></button>
      <button class="item" role="menuitem"><span class="ico">◐</span><span class="label">Flat white</span><span class="lead"></span><kbd>⌘2</kbd></button>
      <button class="item" role="menuitem" aria-disabled="true"><span class="ico">❄</span><span class="label">Cold brew</span><span class="lead"></span><kbd>⌘3</kbd></button>
      <button class="item" role="menuitem"><span class="ico"></span><span class="label">Water</span><span class="lead"></span><kbd>⌘0</kbd></button>
      <div class="sect" role="separator" aria-label="Table">TABLE 4</div>
      <button class="item" role="menuitem" data-say="4 open orders"><span class="ico">≡</span><span class="label">Open tab</span><span class="lead"></span><span class="badge">4</span></button>
      <button class="item" role="menuitem"><span class="ico">✎</span><span class="label">Split bill</span><span class="lead"></span><span class="end">↗</span></button>
      <div class="has-sub">
        <button class="item" role="menuitem"><span class="ico">◇</span><span class="label">Cup size</span><span class="lead"></span><span class="end">»</span></button>
        <div class="submenu" role="menu" aria-label="Cup size">
          <button class="item" role="menuitemradio" aria-checked="false"><span class="ico">✓</span><span class="label">Small</span><span class="lead"></span><span class="end">8oz</span></button>
          <button class="item" role="menuitemradio" aria-checked="true"><span class="ico">✓</span><span class="label">Medium</span><span class="lead"></span><span class="end">12oz</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="ico">✓</span><span class="label">Large</span><span class="lead"></span><span class="end">16oz</span></button>
        </div>
      </div>
      <div class="rule" aria-hidden="true"></div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
</body>
</html>
