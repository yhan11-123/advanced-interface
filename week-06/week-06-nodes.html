<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Nodes</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Nodes: after a shared node-graph tool for image generation. The menu drops from the Edit
     pill in the top bar, over a dotted canvas of wired nodes. It borrows the graph's language:
     a lit item shows a coloured port at its left edge, like a socket ready to take a wire, and
     the submenu adds a node. Other people are in the file, so their named cursors sit on the
     canvas; one of them is pointing at the menu too. */
  :root { --w: 620px; --h: 470px; --bg: #121213; --node: #232325; --line: #39393c; --fg: #ededed; --muted: #8a8a8f; --green: #7ee08a; --yellow: #f2e15b; --pink: #f0a3ef; --blue: #8fc3ff; }
  body { background: var(--bg); color: var(--fg); font: 500 13px/1 ui-sans-serif, -apple-system, "Inter", system-ui, sans-serif; }
  .stage { background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1.2px); background-size: 16px 16px; }
  .top { position: absolute; left: 16px; top: 14px; display: flex; gap: 6px; align-items: center; }
  .logo { width: 22px; height: 14px; border: 3px solid #fff; border-radius: 50%; rotate: -30deg; margin-right: 10px; }
  .pill { height: 32px; padding: 0 16px; border-radius: 8px; background: #252527; color: #d6d6d6; }
  .pill[aria-expanded="true"] { background: #38383b; color: #fff; }
  .node { position: absolute; width: 150px; padding: 10px; border-radius: 12px; background: var(--node); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: 11px; }
  .node b { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: var(--fg); font-weight: 500; }
  .node b::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  .node p { margin: 0; line-height: 1.45; }
  .wires { position: absolute; inset: 0; pointer-events: none; }
  .cursor { position: absolute; display: flex; align-items: flex-start; gap: 2px; pointer-events: none; }
  .cursor svg { width: 14px; height: 14px; }
  .cursor span { margin-top: 10px; padding: 3px 7px; border-radius: 5px; color: #1a1a1a; font-size: 11px; font-weight: 600; }

  .menu { position: absolute; left: 112px; top: 54px; width: 240px; padding: 6px; border-radius: 12px; background: #1d1d1f; box-shadow: inset 0 0 0 1px #3a3a3d, 0 20px 40px -16px rgba(0,0,0,.9); transition: opacity .12s, translate .15s; z-index: 2; }
  .menu.is-shut { opacity: 0; translate: 0 -6px; pointer-events: none; }
  .item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border-radius: 8px; }
  .item::before { content: ""; position: absolute; left: -9px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px #1d1d1f, 0 0 10px var(--green); scale: 0; transition: scale .18s cubic-bezier(.3, 1.6, .5, 1); }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item { background: #2c2c2f; outline: none; }
  .item:hover::before, .item:focus-visible::before, .has-sub.is-open > .item::before { scale: 1; }
  .item:active, .item.is-picked { background: #36363a; }
  .item:active::before, .item.is-picked::before { background: #fff; }
  .ico { width: 16px; height: 16px; flex: none; color: #cfcfcf; }
  .label { flex: 1; }
  kbd, .end { font-size: 12px; color: var(--muted); }
  .item[aria-disabled="true"] { color: #5a5a5e; }
  .item[aria-disabled="true"] .ico { color: #4a4a4e; }
  .item[aria-disabled="true"]::before { display: none; }
  .item[aria-disabled="true"]:hover { background: none; }
  .rule { height: 1px; margin: 5px 10px; background: #333336; }
  .sect { padding: 7px 10px 5px; font-size: 11px; color: var(--muted); }
  .faces { display: flex; }
  .faces i { width: 18px; height: 18px; margin-left: -5px; border-radius: 50%; border: 2px solid #1d1d1f; }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--green); color: #102512; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; margin-left: 4px; }
  .submenu { position: absolute; left: calc(100% + 10px); top: -6px; width: 180px; padding: 6px; border-radius: 12px; background: #1d1d1f; box-shadow: inset 0 0 0 1px #3a3a3d, 0 20px 40px -16px rgba(0,0,0,.9); opacity: 0; translate: -6px 0; transition: opacity .15s, translate .2s; }
  .has-sub.is-open > .submenu { opacity: 1; translate: 0; }
  .submenu .port { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .said { position: absolute; right: 18px; bottom: 14px; color: var(--muted); font: 400 11px/1.5 ui-monospace, Menlo, monospace; text-align: right; }
  .said:empty::before { content: "T: 0.00s  N: 10"; }
  </style>
</head>
<body>
  <div class="stage">
    <svg class="wires" viewBox="0 0 620 470" aria-hidden="true"><g fill="none" stroke="#5a5a5e" stroke-width="1.2"><path d="M222 300 C 300 300, 300 250, 380 250"/><path d="M222 310 C 300 310, 300 380, 380 380"/></g></svg>
    <div class="node" style="left:72px;top:262px"><b>Model</b><p>DreamShaper 6</p></div>
    <div class="node" style="left:380px;top:200px"><b>Positive</b><p>A black bear with a pink snout, minimal, soft gradients</p></div>
    <div class="node" style="left:380px;top:340px"><b>Negative</b><p>No text, no background objects</p></div>
    <div class="cursor" style="left:186px;top:330px" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M13 1 1 6l5 2 2 5z" fill="var(--yellow)"/></svg><span style="background:var(--yellow)">Paul</span></div>
    <div class="cursor" style="left:520px;top:396px" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M13 1 1 6l5 2 2 5z" fill="var(--pink)"/></svg><span style="background:var(--pink)">Maria</span></div>
    <div class="cursor kate" style="left:318px;top:212px" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M13 1 1 6l5 2 2 5z" fill="var(--blue)"/></svg><span style="background:var(--blue)">Kate</span></div>

    <div class="top">
      <span class="logo" aria-hidden="true"></span>
      <button class="pill" type="button" tabindex="-1">Workflow</button>
      <button class="pill edit" type="button" aria-expanded="true" aria-controls="edit">Edit</button>
      <button class="pill" type="button" tabindex="-1">Help</button>
    </div>
    <div class="menu" role="menu" aria-label="Edit" id="edit">
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6h6a3.5 3.5 0 0 1 0 7H6M4 6l3-3M4 6l3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Undo</span><kbd>⌘Z</kbd></button>
      <button class="item" role="menuitem" aria-disabled="true"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M12 6H6a3.5 3.5 0 0 0 0 7h4M12 6 9 3M12 6 9 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Redo</span><kbd>⇧⌘Z</kbd></button>
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M11 3a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v6a1 1 0 0 0 1 1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Duplicate node</span><kbd>⌘D</kbd></button>
      <button class="item" role="menuitem"><span class="ico"></span><span class="label">Select all</span><kbd>⌘A</kbd></button>
      <div class="rule" role="separator"></div>
      <div class="sect">Graph</div>
      <button class="item" role="menuitem" data-say="3 comments from Paul, Maria, Kate"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v8H7l-3 3v-3H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Comments</span><span class="faces" aria-hidden="true"><i style="background:var(--yellow)"></i><i style="background:var(--pink)"></i><i style="background:var(--blue)"></i></span><span class="badge">3</span></button>
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6h12" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Open preview</span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" style="color:var(--muted)"><path d="M6 3h7v7M13 3 4 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <div class="has-sub">
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Add node</span><span class="end">›</span></button>
        <div class="submenu" role="menu" aria-label="Add node">
          <button class="item" role="menuitem"><span class="port" style="background:var(--green)"></span><span class="label">Prompt</span><kbd>P</kbd></button>
          <button class="item" role="menuitem"><span class="port" style="background:var(--yellow)"></span><span class="label">Model</span><kbd>M</kbd></button>
          <button class="item" role="menuitem"><span class="port" style="background:var(--blue)"></span><span class="label">Image generator</span><kbd>G</kbd></button>
        </div>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
  <script>
    // the Edit pill opens and shuts its menu
    const edit = document.querySelector('.edit'), menu = document.querySelector('.menu');
    edit.addEventListener('click', () => { const on = menu.classList.toggle('is-shut') === false; edit.setAttribute('aria-expanded', on); });
  </script>
</body>
</html>
