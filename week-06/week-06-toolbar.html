<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Toolbar</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Toolbar: after a dark text editor. The menu hangs off the toolbar's + button and inserts a
     block. Every item ends in a grip: the menu is also a list you arrange, so dragging an item by
     its grip lifts it and moves it inside its section. The shortcut is the slash command you
     could type instead. Heading opens a submenu of levels. */
  :root { --w: 560px; --h: 560px; --bg: #1c1c1d; --tile: #2c2c2e; --tile2: #343437; --fg: #f1f1f1; --muted: #8e8e93; --teal: #7fdcd2; }
  body { background: var(--bg); color: var(--fg); font: 500 15px/1 ui-sans-serif, -apple-system, system-ui, sans-serif; }
  .bar { position: absolute; left: 30px; top: 28px; display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; }
  .grp { display: flex; gap: 2px; padding: 4px; border-radius: 10px; background: var(--tile); }
  .grp span, .plus { display: grid; place-items: center; min-width: 38px; height: 36px; padding: 0 10px; border-radius: 7px; color: #d8d8d8; font-weight: 700; }
  .grp .on { background: #3a3a3d; }
  .para { width: 178px; justify-content: space-between !important; display: flex !important; font-weight: 500 !important; }
  .swatch { width: 44px; height: 44px; border-radius: 10px; background: var(--tile); display: grid; place-items: center; } .swatch i { width: 30px; height: 30px; border-radius: 6px; background: var(--teal); }
  .plus { background: var(--tile); border-radius: 10px; height: 44px; min-width: 60px; font-size: 22px; font-weight: 400; }
  .plus[aria-expanded="true"] { background: #48484b; }
  .menu { position: absolute; left: 252px; top: 136px; width: 270px; padding: 6px; border-radius: 12px; background: #262628; box-shadow: inset 0 0 0 1px #48484b, 0 20px 30px -16px rgba(0,0,0,.7);
    transform-origin: 70% 0; transition: opacity .15s, scale .2s; }
  .menu.is-shut { opacity: 0; scale: .96; pointer-events: none; }
  .item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 42px; padding: 0 8px 0 12px; border-radius: 8px; background: var(--tile2); transition: background .12s, translate .18s, box-shadow .15s; }
  .item + .item, .item + .has-sub, .has-sub + .item { margin-top: 4px; }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item { background: #414145; outline: none; }
  .item:active, .item.is-picked { background: #4c4c51; }
  .item.is-lifted { z-index: 3; background: #46464a; box-shadow: 0 12px 20px -8px rgba(0,0,0,.8); transition: background .12s, box-shadow .15s; scale: 1.03; }
  .ico { width: 20px; height: 20px; flex: none; color: #d6d6d6; }
  .label { flex: 1; }
  kbd { font: 400 12px/1 ui-monospace, Menlo, monospace; color: var(--muted); }
  .grip { width: 18px; height: 22px; flex: none; color: #8a8a8f; cursor: grab; touch-action: none; display: grid; place-items: center; }
  .grip svg { width: 10px; height: 16px; }
  .is-lifted .grip { cursor: grabbing; }
  .item[aria-disabled="true"] { color: #6b6b70; background: #2e2e30; }
  .item[aria-disabled="true"] .ico { color: #5d5d61; }
  .item[aria-disabled="true"] .label::after { content: "  Pro"; font-size: 11px; color: #a98bff; }
  .sect { padding: 10px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  .sect:first-child { padding-top: 4px; }
  .badge { padding: 3px 6px; border-radius: 5px; background: var(--teal); color: #10322e; font-size: 11px; font-weight: 700; }
  .end { color: var(--muted); }
  .submenu { position: absolute; right: calc(100% + 8px); top: -6px; width: 150px; padding: 6px; border-radius: 12px; background: #262628; box-shadow: inset 0 0 0 1px #48484b, 0 20px 30px -16px rgba(0,0,0,.7); opacity: 0; translate: 8px 0; transition: opacity .15s, translate .2s; }
  .has-sub.is-open > .submenu { opacity: 1; translate: 0; }
  .submenu .item { height: 36px; }
  .submenu .h { width: 26px; font-weight: 800; color: var(--teal); }
  .submenu [aria-checked="false"] .h { color: var(--muted); }
  .said { position: absolute; left: 30px; bottom: 22px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bar" aria-hidden="true">
      <div class="row"><div class="grp"><span class="para">Paragraph <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span></div><div class="swatch"><i></i></div><div class="grp"><span>B</span><span style="font-style:italic;font-weight:500">I</span><span style="text-decoration:underline">U</span><span style="text-decoration:line-through">S</span></div></div>
      <div class="row"><div class="grp"><span class="on">≡</span><span>≡</span><span>≡</span></div><div class="grp"><span>•≡</span><span>1≡</span></div></div>
    </div>
    <button class="plus" type="button" aria-expanded="true" aria-controls="insert" style="position:absolute;left:280px;top:82px">+</button>
    <div class="menu" role="menu" aria-label="Insert" id="insert">
      <div class="sect">Blocks</div>
      <div class="sortable">
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 10h15M10 4v12" stroke="currentColor" stroke-width="1.5"/></svg><span class="label">Table</span><kbd>/table</kbd><span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16"><g fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13.5" r="1.4"/><circle cx="7.5" cy="13.5" r="1.4"/></g></svg></span></button>
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="label">Divider</span><kbd>/hr</kbd><span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16"><g fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13.5" r="1.4"/><circle cx="7.5" cy="13.5" r="1.4"/></g></svg></span></button>
        <button class="item" role="menuitem" data-say="Callout is new"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6.5" cy="8" r="1.3" fill="currentColor"/><path d="M9.5 8h5M6 12.5h8.5" stroke="currentColor" stroke-width="1.5"/></svg><span class="label">Callout</span><span class="badge">New</span><span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16"><g fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13.5" r="1.4"/><circle cx="7.5" cy="13.5" r="1.4"/></g></svg></span></button>
        <button class="item" role="menuitem"><span class="ico"></span><span class="label">Quote</span><kbd>/q</kbd><span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16"><g fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13.5" r="1.4"/><circle cx="7.5" cy="13.5" r="1.4"/></g></svg></span></button>
        <div class="has-sub">
          <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4v12M12 4v12M4 10h8M15 8l2-1.5V16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Heading</span><span class="end">‹</span><span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16"><g fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13.5" r="1.4"/><circle cx="7.5" cy="13.5" r="1.4"/></g></svg></span></button>
          <div class="submenu" role="menu" aria-label="Heading">
            <button class="item" role="menuitemradio" aria-checked="true"><span class="h">H1</span><span class="label">Title</span></button>
            <button class="item" role="menuitemradio" aria-checked="false"><span class="h">H2</span><span class="label">Section</span></button>
            <button class="item" role="menuitemradio" aria-checked="false"><span class="h">H3</span><span class="label">Small</span></button>
          </div>
        </div>
      </div>
      <div class="sect" role="separator">Media</div>
      <div class="sortable">
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="8" r="1.5" fill="currentColor"/><path d="M3 15l5-4 3 2 3-3 3.5 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="label">Image</span><kbd>/img</kbd><span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16"><g fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13.5" r="1.4"/><circle cx="7.5" cy="13.5" r="1.4"/></g></svg></span></button>
        <button class="item" role="menuitem" aria-disabled="true"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6 3 10l4 4M13 6l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Embed</span><kbd>/embed</kbd><span class="grip" aria-hidden="true"><svg viewBox="0 0 10 16"><g fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13.5" r="1.4"/><circle cx="7.5" cy="13.5" r="1.4"/></g></svg></span></button>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
  <script>
    // the + button opens and shuts the menu
    const plus = document.querySelector('.plus'), menu = document.querySelector('.menu');
    plus.addEventListener('click', () => { const on = menu.classList.toggle('is-shut') === false; plus.setAttribute('aria-expanded', on); });

    // drag an item by its grip: it lifts, follows the pointer, and trades places with its
    // neighbours inside its own section; letting go drops it into the gap
    document.querySelectorAll('.grip').forEach(grip => grip.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const item = grip.closest('.item'), unit = item.parentElement.classList.contains('has-sub') ? item.parentElement : item, list = unit.parentElement;
      const y0 = e.clientY, fit = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fit')) || 1;
      let shift = 0; item.classList.add('is-lifted'); grip.setPointerCapture(e.pointerId);
      const move = ev => {
        let dy = (ev.clientY - y0) / fit - shift;
        const sibs = [...list.children], i = sibs.indexOf(unit), step = unit.offsetHeight + 4;
        if (dy > step / 2 && sibs[i + 1]) { sibs[i + 1].after(unit); shift += step; dy -= step; }
        else if (dy < -step / 2 && sibs[i - 1]) { sibs[i - 1].before(unit); shift -= step; dy += step; }
        item.style.translate = `0 ${dy}px`;
      };
      const up = () => { item.classList.remove('is-lifted'); item.style.translate = ''; grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); };
      grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up);
    }));
    document.querySelectorAll('.grip').forEach(g => g.addEventListener('click', e => e.stopPropagation()));
  </script>
</body>
</html>
