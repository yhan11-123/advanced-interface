<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Columns</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Columns: after a soft grey app menu with a rail beside it. The menu is one tall pane in two
     columns: the items on the left, and on the right whatever the open item holds, so the submenu
     is a column of the same pane rather than a pop-up. The open item turns into a black pill;
     the rail beside it marks the same place. Sections in the right column carry their own count
     and an icon. */
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Big+Shoulders+Text:wght@700&display=swap");
  :root { --w: 640px; --h: 520px; --pane: linear-gradient(180deg, #f3f3f6, #e7e7ec); --ink: #18181b; --muted: #85858d; --hover: #fff; }
  body { background: #cfd0d6; color: var(--ink); font: 500 14px/1 "Inter", system-ui, sans-serif; }
  .rail { position: absolute; left: 22px; top: 22px; bottom: 0; width: 70px; border-radius: 35px 35px 0 0; background: var(--pane); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 10px 30px -18px rgba(0,0,0,.3); display: grid; align-content: start; justify-items: center; gap: 18px; padding-top: 28px; }
  .rail span { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: #3c3c42; }
  .rail span.on { background: #fff; box-shadow: 0 2px 6px -2px rgba(0,0,0,.2); }
  .rail svg { width: 18px; height: 18px; }
  .pane { position: absolute; left: 106px; top: 22px; right: 22px; bottom: 0; border-radius: 30px 30px 0 0; background: var(--pane); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 10px 30px -18px rgba(0,0,0,.3); }
  .head { display: flex; align-items: center; gap: 8px; height: 66px; padding: 0 26px; border-bottom: 1px solid #dcdce2; width: 250px; font: 700 22px/1 "Big Shoulders Text", sans-serif; letter-spacing: .02em; }
  .menu { position: static; width: 250px; padding: 22px 16px; }
  .item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 14px; border-radius: 20px; transition: background .15s, color .15s; }
  .item + .item, .item + .has-sub, .has-sub + .item { margin-top: 4px; }
  .item:hover, .item:focus-visible { background: var(--hover); outline: none; box-shadow: 0 2px 8px -4px rgba(0,0,0,.18); }
  .has-sub.is-open > .item { background: var(--ink); color: #fff; box-shadow: none; }
  .item:active, .item.is-picked { scale: .98; }
  .ico { width: 18px; height: 18px; flex: none; }
  .label { flex: 1; }
  kbd { font-size: 11px; color: #a7a7af; }
  .has-sub.is-open > .item kbd, .has-sub.is-open > .item .end { color: #bbb; }
  .end { color: #6d6d75; font-size: 16px; }
  .dot { position: absolute; left: 25px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: #e070d6; }
  .badge { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 11px; font-weight: 600; }
  .item[aria-disabled="true"] { color: #b7b7be; }
  .item[aria-disabled="true"]:hover { background: none; box-shadow: none; }
  .rule { height: 1px; margin: 14px 10px; background: #dcdce2; }
  .sect { padding: 0 14px 8px; font-size: 12px; color: var(--muted); }
  .has-sub { position: static; }
  .submenu { position: absolute; left: 250px; top: 0; right: 0; bottom: 0; padding: 20px 18px; border-left: 1px solid #dcdce2; opacity: 0; translate: 10px 0; transition: opacity .2s, translate .25s; }
  .has-sub.is-open > .submenu { opacity: 1; translate: 0; }
  .submenu .item { height: 38px; }
  .submenu [aria-checked="true"] { background: #fff; box-shadow: 0 2px 8px -4px rgba(0,0,0,.18); }
  .submenu .sect { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 14px 14px 8px; border-top: 1px solid #dcdce2; font-size: 14px; color: #55555c; }
  .submenu .sect svg { width: 16px; height: 16px; }
  .said { position: absolute; left: 132px; bottom: 16px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="rail" aria-hidden="true">
      <span style="font-size:20px">✦</span>
      <span><svg viewBox="0 0 18 18"><path d="M3 8 9 3l6 5v7H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
      <span><svg viewBox="0 0 18 18"><path d="M2 5h14v10H2zM2 11h4l1 2h4l1-2h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
      <span><svg viewBox="0 0 18 18"><rect x="2.5" y="2.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9 6v6M6 9h6" stroke="currentColor" stroke-width="1.4"/></svg></span>
      <span class="on"><svg viewBox="0 0 18 18"><path d="M3 6h12l-1 9H4zM2 3h14v3H2zM7 9h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
      <span><svg viewBox="0 0 18 18"><rect x="3" y="3" width="12" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 13c.5-1.5 1.6-2 3-2s2.5.5 3 2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
    </div>
    <div class="pane">
      <div class="head" aria-hidden="true">✦ Menu</div>
      <div class="menu" role="menu" aria-label="Menu" data-click-sub>
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 8 9 3l6 5v7H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Home</span><kbd>⌘H</kbd></button>
        <button class="item" role="menuitem" data-say="2 unread messages"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5h14v10H2zM2 11h4l1 2h4l1-2h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="dot" aria-hidden="true"></span><span class="label">Messages</span><span class="badge">2</span></button>
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="2.5" width="13" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9 6v6M6 9h6" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Integrations</span><span class="end">+</span></button>
        <button class="item" role="menuitem" aria-disabled="true"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="4" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 8h14M5 11h3" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Finance</span><kbd>⌘F</kbd></button>
        <div class="has-sub">
          <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 6h12l-1 9H4zM2 3h14v3H2zM7 9h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Library</span><span class="end">›</span></button>
          <div class="submenu" role="menu" aria-label="Library">
            <button class="item" role="menuitemradio" aria-checked="false"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h5l1.5 2H16v9H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Archive</span></button>
            <button class="item" role="menuitemradio" aria-checked="false"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h5l1.5 2H16v9H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 13.2 7.2 11.5a1.1 1.1 0 0 1 1.8-1.3 1.1 1.1 0 0 1 1.8 1.3z" fill="currentColor"/></svg><span class="label">Favourites</span></button>
            <div class="sect" aria-hidden="true">Drafts (3)<svg viewBox="0 0 16 16"><path d="M10 2l4 4-3 1-3 3 1 3-1 1-7-7 1-1 3 1 3-3z M5 11l-3 3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
            <button class="item" role="menuitemradio" aria-checked="false"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h5l1.5 2H16v9H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">General</span></button>
            <button class="item" role="menuitemradio" aria-checked="true"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h5l1.5 2H16v9H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Feedback</span></button>
            <div class="sect" aria-hidden="true">Folders (6)<svg viewBox="0 0 16 16"><path d="M1.5 3.5h4.5l1.5 2h7v8h-13z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
            <button class="item" role="menuitemradio" aria-checked="false"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h5l1.5 2H16v9H2zM6 10h6M6 12.5h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Duotone</span></button>
            <button class="item" role="menuitemradio" aria-checked="false"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h5l1.5 2H16v9H2zM6 10h6M6 12.5h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Solid</span></button>
          </div>
        </div>
        <div class="rule" role="separator"></div>
        <div class="sect">People</div>
        <button class="item" role="menuitem"><span class="ico"></span><span class="label">Contacts</span><kbd>⌘K</kbd></button>
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3h8l2 4-6 8-6-8z M3 7h12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Explore</span><span class="end">↗</span></button>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
  <script>
    // the right column starts open, so the preview shows the whole pane; it stays until its item is clicked again
    const host = document.querySelector('.has-sub'); host.classList.add('is-open'); host.querySelector('.item').setAttribute('aria-expanded', 'true');
  </script>
</body>
</html>
