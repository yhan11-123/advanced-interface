<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Save room</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Save room: the one safe room in a survival-horror game, where a typewriter saves your
     progress. The menu is typed on the sheet in the machine. Pointing at an item types it out
     again letter by letter behind a caret; pressing strikes it hard, the line jumping. Saving
     costs an ink ribbon, counted in the badge. The submenu is the next lines, typed below. */
  @import url("https://fonts.googleapis.com/css2?family=Special+Elite&display=swap");
  :root { --w: 600px; --h: 560px; --paper: #ece4d1; --ink: #23201b; --red: #8f1d14; --font: "Special Elite", "Courier New", monospace; }
  body { background: #0f1210; color: var(--ink); font: 400 17px/1 var(--font); }
  .room { position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 40%, rgba(255, 214, 140, .25), transparent 70%), linear-gradient(#1c221e, #0b0d0c); }
  .machine { position: absolute; left: 50%; bottom: 0; width: 470px; height: 90px; translate: -50% 0; border-radius: 22px 22px 0 0; background: linear-gradient(#2e302d, #161716); box-shadow: inset 0 2px 0 rgba(255,255,255,.12); }
  .machine::before { content: ""; position: absolute; left: -16px; right: -16px; top: 6px; height: 16px; border-radius: 8px; background: linear-gradient(#4a4c48, #1e1f1d); }
  .sheet { position: absolute; left: 50%; top: 22px; width: 380px; translate: -50% 0; padding: 26px 28px 40px; background: var(--paper); box-shadow: 0 10px 30px rgba(0,0,0,.5); background-image: linear-gradient(rgba(0,0,0,.03) 1px, transparent 1px); background-size: 100% 26px; }
  .head { margin: 0 0 12px; font-size: 13px; color: #6d6455; letter-spacing: .08em; }
  .menu { position: relative; }
  .item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 28px; }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item { outline: none; }
  .item:hover .label, .item:focus-visible .label, .has-sub.is-open > .item .label { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .label.is-typing::after { content: "▌"; animation: caret .5s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .item:active, .item.is-picked { animation: strike .2s steps(2); color: #000; }
  @keyframes strike { 50% { translate: 0 -3px; } }
  .ico { width: 16px; height: 16px; flex: none; }
  .label { flex: 1; white-space: pre; }
  kbd, .end { font-size: 14px; color: #6d6455; }
  .item[aria-disabled="true"] { color: #a69c88; }
  .item[aria-disabled="true"] .label::after { content: " -- no ribbon"; font-size: 12px; }
  .rule { margin: 6px 0; color: #8a8170; white-space: pre; overflow: hidden; font-size: 14px; }
  .sect { padding: 4px 0 2px; font-size: 13px; color: var(--red); letter-spacing: .08em; }
  .badge { padding: 1px 6px; border: 1.5px solid var(--red); color: var(--red); font-size: 13px; }
  .has-sub { position: relative; }
  .submenu { position: relative; display: grid; grid-template-rows: 0fr; padding-left: 26px; transition: grid-template-rows .3s steps(3); visibility: visible; }
  .submenu > div { min-height: 0; overflow: hidden; }
  .has-sub.is-open > .submenu { grid-template-rows: 1fr; }
  .submenu .item { height: 24px; font-size: 15px; }
  .submenu .mark { width: 12px; color: var(--red); visibility: hidden; }
  .submenu [aria-checked="true"] .mark { visibility: visible; }
  .said { min-height: 16px; margin: 10px 0 0; font-size: 13px; color: var(--red); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="room" aria-hidden="true"></div>
    <div class="sheet">
      <p class="head" aria-hidden="true">SAFE ROOM -- WEST WING -- 03:12</p>
      <div class="menu" role="menu" aria-label="Typewriter" data-click-sub>
        <button class="item" role="menuitem" data-say="saved. one ribbon left"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h10l2 2v10H2zM5 2v4h6V2M4 10h8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="label">Save game</span><kbd>[S]</kbd></button>
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h5l1.5 2H14v8H2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span class="label">Load game</span><kbd>[L]</kbd></button>
        <button class="item" role="menuitem" aria-disabled="true"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 13 3M5 3h8v8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span class="label">Overwrite</span><kbd>[O]</kbd></button>
        <button class="item" role="menuitem"><span class="ico"></span><span class="label">Leave the room</span><kbd>[ESC]</kbd></button>
        <div class="rule" aria-hidden="true">- - - - - - - - - - - - - - - - - - - - - - - -</div>
        <div class="sect" role="separator">ITEM BOX</div>
        <button class="item" role="menuitem" data-say="2 ink ribbons"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="11" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 5h6M5 11h6" stroke="currentColor" stroke-width="1.3"/></svg><span class="label">Ink ribbons</span><span class="badge">x2</span></button>
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4l4-1.5 4 2 4-1.5v9l-4 1.5-4-2-4 1.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg><span class="label">Map</span><span class="end">-&gt;|</span></button>
        <div class="has-sub">
          <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h7l3 3v9H3zM5 7h6M5 10h6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span class="label">Files</span><span class="end">v</span></button>
          <div class="submenu" role="menu" aria-label="Files"><div>
            <button class="item" role="menuitemradio" aria-checked="false"><span class="mark">x</span><span class="label">Nurse's diary</span></button>
            <button class="item" role="menuitemradio" aria-checked="true"><span class="mark">x</span><span class="label">Basement note</span></button>
            <button class="item" role="menuitemradio" aria-checked="false"><span class="mark">x</span><span class="label">Torn photo</span></button>
          </div></div>
        </div>
      </div>
      <p class="said" aria-live="polite"></p>
    </div>
    <div class="machine" aria-hidden="true"></div>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
  <script>
    // pointing at an item types its words out again behind a caret
    const type = lab => {
      if (lab.dataset.full === undefined) lab.dataset.full = lab.textContent;
      const full = lab.dataset.full; let n = 0; clearInterval(lab._t);
      lab.classList.add('is-typing'); lab.textContent = '';
      lab._t = setInterval(() => { lab.textContent = full.slice(0, ++n); if (n >= full.length) { clearInterval(lab._t); setTimeout(() => lab.classList.remove('is-typing'), 400); } }, 38);
    };
    document.querySelectorAll('.item').forEach(it => { if (it.getAttribute('aria-disabled') === 'true') return; const lab = it.querySelector('.label'); it.addEventListener('pointerenter', () => type(lab)); it.addEventListener('focus', () => type(lab)); });
    // the Files lines start typed out, so the preview shows them
    const host = document.querySelector('.has-sub'); host.classList.add('is-open'); host.querySelector('.item').setAttribute('aria-expanded', 'true');
  </script>
</body>
</html>
