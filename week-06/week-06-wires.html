<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Wires</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Wires: after a sports-brand data diagram. The menu is a table of ruled rows on grey, each
     with a letter that is its key. Most rows sit pale; the one you point at goes dark and
     throws curved wires across to the outputs it drives, which go dark too, so a menu shows
     what an item will touch before you pick it. Sections are the two data groups. The submenu
     opens in the space the wires use, and the wires step aside for it. */
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap");
  :root { --w: 720px; --h: 470px; --dark: #141414; --pale: rgba(255,255,255,.92); --rule: rgba(20,20,20,.25); --font: "Inter", "Helvetica Neue", sans-serif; }
  body { background: linear-gradient(180deg, #b3b3b3, #a3a3a3); color: var(--pale); font: 700 17px/1 var(--font); letter-spacing: -.01em; }
  .title { position: absolute; left: 18px; top: 16px; display: flex; align-items: baseline; gap: 12px; color: var(--dark); font-size: 24px; }
  .title small { font-size: 10px; }
  .menu { position: absolute; left: 18px; top: 68px; width: 300px; }
  .outs { position: absolute; right: 18px; top: 68px; width: 230px; }
  .sect, .head { height: 30px; padding: 12px 0 0 112px; font-size: 11px; font-weight: 600; color: var(--dark); border-bottom: 1px solid var(--dark); }
  .head { padding-left: 0; }
  .item, .out { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; border-bottom: 1px solid var(--rule); transition: color .15s; }
  .item kbd { width: 102px; flex: none; font-size: 11px; font-weight: 600; color: var(--pale); }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item, .item.is-lit { color: var(--dark); outline: none; }
  .item:hover kbd, .item.is-lit kbd { color: var(--dark); }
  .item:active, .item.is-picked { color: #fff; background: var(--dark); }
  .ico { width: 15px; height: 15px; flex: none; }
  .label { flex: 1; }
  .end { font-size: 13px; }
  .badge { padding: 2px 6px; border-radius: 9px; background: var(--dark); color: #fff; font-size: 10px; }
  .item[aria-disabled="true"] { color: rgba(255,255,255,.45); }
  .item[aria-disabled="true"] kbd { color: rgba(255,255,255,.45); }
  .item[aria-disabled="true"]:hover { color: rgba(255,255,255,.45); }
  .out { font-size: 15px; transition: color .2s; }
  .out.is-lit { color: var(--dark); border-bottom-color: var(--dark); }
  .wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .wires path { fill: none; stroke: var(--dark); stroke-width: 1; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw .5s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .submenu { position: absolute; left: 326px; top: -6px; width: 140px; padding: 6px 10px; background: #e9e9e9; color: var(--dark); font-size: 14px; opacity: 0; translate: -8px 0; transition: opacity .2s, translate .25s; }
  .has-sub.is-open > .submenu { opacity: 1; translate: 0; }
  .submenu .item { height: 28px; border-bottom-color: #cfcfcf; color: #777; }
  .submenu .item:last-child { border-bottom: 0; }
  .submenu .item:hover, .submenu [aria-checked="true"] { color: var(--dark); }
  .submenu .tick { width: 12px; visibility: hidden; }
  .submenu [aria-checked="true"] .tick { visibility: visible; }
  .said { position: absolute; right: 18px; top: 20px; font-size: 12px; font-weight: 600; color: var(--dark); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="title" aria-hidden="true"><small>03 / 04</small>Articulated Speed</div>
    <svg class="wires" viewBox="0 0 720 470" aria-hidden="true"></svg>
    <div class="menu" role="menu" aria-label="Inputs">
      <div class="sect" aria-hidden="true">Circumstance Data</div>
      <button class="item" role="menuitem" data-out="1 2"><kbd>A</kbd><span class="label">Air Quality</span></button>
      <button class="item" role="menuitem" data-out="0 2 5" data-say="3 outputs watch humidity"><kbd>B</kbd><span class="label">Humidity</span><span class="badge">3</span></button>
      <button class="item" role="menuitem" data-out="0 6"><kbd>C</kbd><svg class="ico" viewBox="0 0 15 15" aria-hidden="true"><circle cx="7.5" cy="7.5" r="3" fill="currentColor"/><path d="M7.5 1v2M7.5 12v2M1 7.5h2M12 7.5h2M3 3l1.4 1.4M10.6 10.6 12 12M3 12l1.4-1.4M10.6 4.4 12 3" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Solar Elevation</span><span class="end">↗</span></button>
      <button class="item" role="menuitem" data-out="3 4"><kbd>D</kbd><span class="label">Temperature</span></button>
      <div class="sect" role="separator">Athlete Data</div>
      <button class="item" role="menuitem" data-out="1 5 7 8"><kbd>E</kbd><svg class="ico" viewBox="0 0 15 15" aria-hidden="true"><path d="M1 10c3 0 4-5 7-5s3 3 6 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="label">Speed / Motion</span></button>
      <button class="item" role="menuitem" data-out="3 7"><kbd>F</kbd><span class="label">Cold Sensitivity</span></button>
      <div class="has-sub">
        <button class="item" role="menuitem" data-out="6 8"><kbd>G</kbd><span class="label">Direction of Course</span><span class="end">›</span></button>
        <div class="submenu" role="menu" aria-label="Course">
          <button class="item" role="menuitemradio" aria-checked="true"><span class="tick">✓</span><span class="label">Loop</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="tick">✓</span><span class="label">Out and back</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="tick">✓</span><span class="label">Point to point</span></button>
        </div>
      </div>
      <button class="item" role="menuitem" aria-disabled="true"><kbd>H</kbd><span class="label">Wetness Sensitivity</span></button>
    </div>
    <div class="outs" aria-hidden="true">
      <div class="head">Output Parameters</div>
      <div class="out">Ambient Light Levels</div><div class="out">Color of Forms</div><div class="out">Environment Hue</div>
      <div class="out">Follicle Length</div><div class="out">Follicle Colour</div><div class="out">Number of Forms</div>
      <div class="out">Position of Light</div><div class="out">Rigidity of Forms</div><div class="out">Texture of Forms</div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
  <script>
    // pointing at (or focusing) an input draws a wire to each output it drives and darkens them;
    // the wires step aside while a submenu is open; the letter keys pick the rows
    const stage = document.querySelector('.stage'), svg = document.querySelector('.wires'), outs = [...document.querySelectorAll('.out')];
    const fit = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fit')) || 1;
    const local = r => { const s = stage.getBoundingClientRect(), f = fit(); return { l: (r.left - s.left) / f, r: (r.right - s.left) / f, y: (r.top + r.height / 2 - s.top) / f }; };
    const clear = () => { svg.innerHTML = ''; outs.forEach(o => o.classList.remove('is-lit')); document.querySelectorAll('.is-lit').forEach(i => i.classList.remove('is-lit')); };
    const wire = it => {
      clear(); if (!it.dataset.out || it.getAttribute('aria-disabled') === 'true' || document.querySelector('.has-sub.is-open')) return;
      it.classList.add('is-lit');
      const a = local(it.querySelector('.label').getBoundingClientRect()), x0 = local(it.getBoundingClientRect()).r + 6;
      svg.innerHTML = it.dataset.out.split(' ').map(n => { const o = outs[+n]; o.classList.add('is-lit'); const b = local(o.getBoundingClientRect()), x1 = b.l - 8, mx = (x0 + x1) / 2;
        return `<path d="M${x0} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${x1} ${b.y}"/>`; }).join('');
    };
    document.querySelectorAll('.menu > .item, .has-sub > .item').forEach(it => { it.addEventListener('pointerenter', () => wire(it)); it.addEventListener('focus', () => wire(it)); });
    document.querySelector('.menu').addEventListener('pointerleave', clear);
    document.querySelector('.has-sub').addEventListener('pointerenter', () => setTimeout(clear, 0));
    addEventListener('keydown', e => { const k = e.key.toUpperCase(); const it = [...document.querySelectorAll('.item kbd')].find(x => x.textContent === k)?.closest('.item'); if (it && k.length === 1 && !e.metaKey) { it.focus(); it.click(); } });
    wire(document.querySelectorAll('.menu > .item')[4]);
  </script>
</body>
</html>
