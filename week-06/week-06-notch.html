<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Notch</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Notch: after a phone tab bar whose middle button sits in a scoop cut out of the bar. The
     button is the menu: pressed, its three lines turn to a cross and the menu rises out of the
     scoop in the bar's green-to-blue. Sections, a submenu that opens to the side, a badge. */
  :root { --w: 580px; --h: 520px; --g1: #86cba4; --g2: #7fa6c7; --ink: #fff; --soft: rgba(255,255,255,.72); }
  body { background: #dfe3e2; font: 500 14px/1 ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
  .phone { position: absolute; left: 80px; right: 80px; bottom: 16px; height: 128px; border-radius: 0 0 46px 46px; background: #eef0ef; box-shadow: 0 18px 30px -18px rgba(0,0,0,.3); }
  .bar { position: absolute; left: 14px; right: 14px; bottom: 26px; height: 74px; border-radius: 0 0 34px 34px; background: linear-gradient(90deg, var(--g1), var(--g2));
    -webkit-mask: radial-gradient(circle 54px at 50% 0, transparent 53px, #000 54px); mask: radial-gradient(circle 54px at 50% 0, transparent 53px, #000 54px); }
  .tabs { position: absolute; left: 14px; right: 14px; bottom: 26px; height: 74px; display: flex; align-items: center; justify-content: space-around; padding: 0 20px; }
  .tabs svg { width: 22px; height: 22px; color: #fff; opacity: .9; }
  .tabs .gap { width: 90px; }
  .home { position: absolute; left: 50%; bottom: 8px; width: 160px; height: 4px; translate: -50% 0; border-radius: 2px; background: #cfd3d2; }
  .fab { position: absolute; left: 50%; bottom: 66px; width: 84px; height: 84px; translate: -50% 0; border-radius: 50%; background: linear-gradient(135deg, var(--g1), var(--g2)); box-shadow: 0 8px 18px -8px rgba(40,80,90,.6); display: grid; place-items: center; z-index: 3; }
  .fab i { position: absolute; width: 30px; height: 3px; border-radius: 2px; background: #fff; transition: translate .3s, rotate .3s, opacity .2s; }
  .fab i:nth-child(1) { translate: 0 -9px; } .fab i:nth-child(3) { translate: 0 9px; }
  .open .fab i:nth-child(1) { translate: 0; rotate: 45deg; } .open .fab i:nth-child(2) { opacity: 0; } .open .fab i:nth-child(3) { translate: 0; rotate: -45deg; }
  .fab:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .menu { position: absolute; left: 50%; bottom: 168px; width: 250px; translate: -50% 0; padding: 8px; border-radius: 24px; background: linear-gradient(160deg, var(--g1), var(--g2));
    box-shadow: 0 16px 30px -14px rgba(40,80,90,.55); transform-origin: 50% 110%; scale: .2; opacity: 0; pointer-events: none; transition: scale .4s cubic-bezier(.3, 1.3, .5, 1), opacity .2s; z-index: 2; }
  .open .menu { scale: 1; opacity: 1; pointer-events: auto; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 12px; border-radius: 14px; transition: background .15s; }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item { background: rgba(255,255,255,.2); outline: none; }
  .item:active, .item.is-picked { background: rgba(255,255,255,.34); }
  .ico { width: 18px; height: 18px; flex: none; }
  .label { flex: 1; }
  kbd, .end { color: var(--soft); font-size: 12px; }
  .item[aria-disabled="true"] { color: rgba(255,255,255,.42); }
  .item[aria-disabled="true"]:hover { background: none; }
  .rule { height: 1px; margin: 6px 12px; background: rgba(255,255,255,.3); }
  .sect { padding: 6px 12px 4px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #fff; color: #4f8a8a; font-size: 11px; font-weight: 800; line-height: 20px; text-align: center; }
  .submenu { position: absolute; left: calc(100% + 16px); bottom: -8px; width: 130px; padding: 8px; border-radius: 20px; background: linear-gradient(160deg, var(--g1), var(--g2)); box-shadow: 0 16px 30px -14px rgba(40,80,90,.55);
    opacity: 0; translate: -8px 0; transition: opacity .2s, translate .25s; }
  .has-sub.is-open > .submenu { opacity: 1; translate: 0; }
  .submenu .tick { width: 14px; visibility: hidden; }
  .submenu [aria-checked="true"] .tick { visibility: visible; }
  .said { position: absolute; left: 0; right: 0; top: 14px; text-align: center; color: #5c7f80; font-size: 13px; }
  </style>
</head>
<body>
  <div class="stage open">
    <p class="said" aria-live="polite"></p>
    <div class="menu" role="menu" aria-label="Wallet" id="wallet">
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 6h11M11 3l3 3-3 3M15 12H4M7 9l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label">Transfer</span><kbd>⌘T</kbd></button>
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="4" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 8h14" stroke="currentColor" stroke-width="1.5"/></svg><span class="label">Pay bills</span><kbd>⌘P</kbd></button>
      <button class="item" role="menuitem" aria-disabled="true"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2v14M3 5l12 8M15 5 3 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="label">Freeze card</span><kbd>⌘F</kbd></button>
      <button class="item" role="menuitem"><span class="ico"></span><span class="label">Statements</span><kbd>⌘S</kbd></button>
      <div class="rule" role="separator"></div>
      <div class="sect">Account</div>
      <button class="item" role="menuitem" data-say="3 new alerts"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 12V8a4 4 0 0 1 8 0v4l1.5 2h-11zM7.5 16h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="label">Alerts</span><span class="badge">3</span></button>
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 7a2 2 0 1 1 2 2v2M9 13.5v.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="label">Help centre</span><svg class="ico" viewBox="0 0 18 18" aria-hidden="true" style="opacity:.7"><path d="M7 4h7v7M14 4l-9 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <div class="has-sub">
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 6.5c-.5-.7-1.2-1-2-1-1.2 0-2 .7-2 1.6 0 2.2 4 1.2 4 3.6 0 1-.9 1.8-2.1 1.8-.9 0-1.6-.4-2-1M9 4v1.5M9 12.5V14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span class="label">Currency</span><span class="end">›</span></button>
        <div class="submenu" role="menu" aria-label="Currency">
          <button class="item" role="menuitemradio" aria-checked="true"><span class="tick">✓</span><span class="label">USD</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="tick">✓</span><span class="label">EUR</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="tick">✓</span><span class="label">KRW</span></button>
        </div>
      </div>
    </div>
    <div class="phone">
      <div class="bar"></div>
      <div class="tabs" aria-hidden="true">
        <svg viewBox="0 0 22 22"><path d="M3 15a8 8 0 1 1 16 0M11 15l4-5M6 11l1 1M15.5 8.5M11 7v1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 22 22"><path d="M5 19V3h12v16M3 19h16M8 6h2M12 6h2M8 9h2M12 9h2M8 12h2M12 12h2M10 19v-3h2v3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="gap"></span>
        <svg viewBox="0 0 22 22"><path d="M14.5 6.5C14 5.6 12.8 5 11.3 5 9.3 5 8 6 8 7.4c0 3.4 7 1.9 7 5.6 0 1.5-1.4 2.6-3.6 2.6-1.6 0-2.9-.6-3.4-1.6M11 3v2M11 15.6V18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 22 22"><circle cx="11" cy="7" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 19c0-4 3-6 7-6s7 2 7 6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </div>
      <span class="home"></span>
    </div>
    <button class="fab" type="button" aria-label="Menu" aria-expanded="true" aria-controls="wallet"><i></i><i></i><i></i></button>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
  <script>
    // the round button opens and closes the menu; it starts open so the preview shows it
    const stage = document.querySelector('.stage'), fab = document.querySelector('.fab');
    fab.addEventListener('click', () => { const on = !stage.classList.contains('open'); stage.classList.toggle('open', on); fab.setAttribute('aria-expanded', on); });
  </script>
</body>
</html>
