<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Glass</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Glass: after the brief's Apple drawing. The menu is frosted glass over a warm gradient, so
     the colour behind it comes through. The lit item is a soft pill that glides from item to item
     instead of jumping; pressing dims it for a beat. The submenu is a second pane that springs
     out from its item, a little smaller and a little lower, its checked item lit. */
  :root { --w: 520px; --h: 400px; --fg: #fff4ee; --muted: rgba(255, 228, 214, .62); --lit: rgba(255, 255, 255, .2); --red: #ff7a6b; }
  body { background: radial-gradient(60% 70% at 18% 20%, #e3743c, transparent 70%), radial-gradient(60% 70% at 85% 80%, #b34763, transparent 70%), linear-gradient(130deg, #c9572f, #b9414a 55%, #a73a5e);
    color: var(--fg); font: 500 15px/1 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif; }
  .blob { position: absolute; border-radius: 50%; filter: blur(4px); }
  .menu, .submenu { padding: 6px; border-radius: 16px; background: rgba(70, 18, 16, .42); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), inset 0 1px 0 rgba(255, 255, 255, .22), 0 24px 40px -18px rgba(60, 5, 10, .55); }
  .menu { position: absolute; left: 34px; top: 40px; width: 270px; }
  .pill { position: absolute; left: 6px; right: 6px; top: 0; height: 36px; border-radius: 10px; background: var(--lit); opacity: 0; pointer-events: none;
    transition: translate .22s cubic-bezier(.3, .9, .3, 1), opacity .15s, background .1s; }
  .item { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 12px; border-radius: 10px; }
  .item:focus-visible { outline: none; }
  .ico { width: 18px; height: 18px; flex: none; opacity: .9; }
  .label { flex: 1; }
  kbd { color: var(--muted); font-size: 14px; letter-spacing: .08em; }
  .end { color: var(--muted); font-size: 16px; }
  .item[aria-disabled="true"] { color: rgba(255, 228, 214, .35); }
  .item[aria-disabled="true"] kbd { color: rgba(255, 228, 214, .25); }
  .rule { height: 1px; margin: 6px 12px; background: rgba(255, 255, 255, .16); }
  .sect { padding: 8px 12px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .badge { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--fg); color: #a8343f; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
  .submenu { position: absolute; left: calc(100% + 14px); bottom: -6px; width: 180px; transform-origin: 0 calc(100% - 18px); opacity: 0; scale: .9; translate: -10px 0;
    transition: opacity .18s, scale .35s cubic-bezier(.3, 1.4, .5, 1), translate .35s cubic-bezier(.3, 1.4, .5, 1); }
  .has-sub.is-open > .submenu { opacity: 1; scale: 1; translate: 0 0; }
  .submenu .item[aria-checked="true"] { background: var(--red); color: #fff; }
  .submenu .tick { width: 14px; visibility: hidden; }
  .submenu [aria-checked="true"] .tick { visibility: visible; }
  .said { position: absolute; left: 38px; bottom: 18px; color: var(--fg); opacity: .8; font-size: 13px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="menu" role="menu" aria-label="Edit">
      <span class="pill" aria-hidden="true"></span>
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 6V3h9v9h-3M3 6h9v9H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Copy</span><kbd>⌘C</kbd></button>
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M6.5 2.5h5v2.5h-5zM5 3.5H3.5v12h11v-12H13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Paste</span><kbd>⌘V</kbd></button>
      <button class="item" role="menuitem" aria-disabled="true"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M6.5 2.5h5v2.5h-5zM5 3.5H3.5v12h11v-12H13M7 11h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Paste and Match</span><kbd>⌥⇧⌘V</kbd></button>
      <button class="item" role="menuitem"><span class="ico"></span><span class="label">Select All</span><kbd>⌘A</kbd></button>
      <div class="rule" role="separator"></div>
      <div class="sect">Window</div>
      <button class="item" role="menuitem" data-say="12 unread"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4h12v9H8l-3 3v-3H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Messages</span><span class="badge">12</span></button>
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="3.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7h13" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">New Window</span><svg class="ico" viewBox="0 0 18 18" aria-hidden="true" style="opacity:.6"><path d="M7 4h7v7M14 4l-9 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <div class="has-sub">
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 5.5h5l1.5 2h6.5v7h-13z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="label">Move To</span><span class="end">›</span></button>
        <div class="submenu" role="menu" aria-label="Move To">
          <button class="item" role="menuitemradio" aria-checked="false"><span class="tick">✓</span><span class="label">Desktop</span></button>
          <button class="item" role="menuitemradio" aria-checked="true"><span class="tick">✓</span><span class="label">Documents</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="tick">✓</span><span class="label">Downloads</span></button>
        </div>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=1"></script>
  <script>
    // the lit pill glides to whichever item is under the pointer or the keyboard
    (() => {
      const menu = document.querySelector('.menu'), pill = menu.querySelector('.pill');
      const own = [...menu.querySelectorAll('.item')].filter(i => i.closest('[role="menu"]') === menu);
      const show = it => { if (it.getAttribute('aria-disabled') === 'true') return hide(); pill.style.translate = `0 ${it.offsetTop + (it.parentElement.classList.contains('has-sub') ? it.parentElement.offsetTop : 0)}px`; pill.style.opacity = 1; };
      const hide = () => { if (!menu.querySelector('.has-sub.is-open')) pill.style.opacity = 0; };
      own.forEach(it => { it.addEventListener('pointerenter', () => show(it)); it.addEventListener('focus', () => show(it)); it.addEventListener('pointerdown', () => pill.style.background = 'rgba(255,255,255,.1)'); });
      addEventListener('pointerup', () => pill.style.background = '');
      menu.addEventListener('pointerleave', () => setTimeout(hide, 320));
    })();
  </script>
</body>
</html>
