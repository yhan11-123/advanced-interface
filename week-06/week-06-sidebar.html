<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Sidebar</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Sidebar: after a light app sidebar that folds to a rail. Open, the submenu is a tree that
     opens in place under its item, a thin line joining the children. Folded to the rail, only
     the icons stay; pointing at one shows its name in a dark tip, and the same submenu flies out
     to the side as a card. Badges are soft coloured squares; the chevron button folds it. */
  :root { --w: 520px; --h: 640px; --bg: #e6e8eb; --panel: #fbfbfb; --ink: #1d1f22; --muted: #8a8f96; --sel: #efefef; }
  body { background: var(--bg); color: var(--ink); font: 500 14px/1 ui-sans-serif, -apple-system, "Inter", system-ui, sans-serif; }
  .side { position: absolute; left: 30px; top: 20px; width: 250px; padding: 14px 14px; background: var(--panel); border-radius: 14px; box-shadow: 0 10px 30px -18px rgba(0,0,0,.3); transition: width .35s cubic-bezier(.3, .8, .2, 1); }
  .dots { display: flex; gap: 5px; margin-bottom: 18px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: #ec6559; } .dots i:nth-child(2) { background: #f3bf4f; } .dots i:nth-child(3) { background: #5fc454; }
  .logo { display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 18px; border-radius: 12px; background: var(--ink); }
  .logo::after { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 4px solid #fff; }
  .fold { position: absolute; left: calc(100% + 12px); top: 62px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 4px 10px -4px rgba(0,0,0,.25); }
  .fold svg { width: 14px; height: 14px; transition: rotate .35s; }
  .is-rail .fold svg { rotate: 180deg; }
  .item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 38px; padding: 0 10px; border-radius: 10px; color: #5f646b; white-space: nowrap; }
  .item + .item, .item + .has-sub, .has-sub + .item { margin-top: 2px; }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item, .item.is-current { background: var(--sel); color: var(--ink); outline: none; }
  .item:active, .item.is-picked { background: #e4e4e4; }
  .ico { width: 18px; height: 18px; flex: none; }
  .label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  kbd { font-size: 11px; color: #b4b8bd; }
  .end { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .end svg { width: 14px; height: 14px; }
  .chev { transition: rotate .25s; }
  .has-sub.is-open > .item .chev { rotate: 180deg; }
  .badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 700; line-height: 22px; text-align: center; background: #c8f0dc; color: #1d6b45; }
  .badge.warm { background: #f6d5b8; color: #8a4512; }
  .item[aria-disabled="true"] { color: #c3c6ca; }
  .item[aria-disabled="true"]:hover { background: none; }
  .rule { height: 1px; margin: 10px 4px; background: #ececec; }
  .sect { padding: 4px 10px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #a9adb3; white-space: nowrap; }

  /* open: the submenu is a tree under its item */
  .side:not(.is-rail) .submenu { display: grid; grid-template-rows: 0fr; margin-left: 19px; padding-left: 12px; border-left: 1px solid #e3e3e3; transition: grid-template-rows .3s cubic-bezier(.3, .8, .2, 1); }
  .side:not(.is-rail) .submenu > div { min-height: 0; overflow: hidden; }
  .side:not(.is-rail) .has-sub.is-open > .submenu { grid-template-rows: 1fr; }
  .side:not(.is-rail) .has-sub:not(.is-open) > .submenu { visibility: visible; }
  .submenu .item { height: 34px; margin-top: 2px; font-weight: 450; }
  .submenu .item::before { content: ""; position: absolute; left: -12px; top: 50%; width: 8px; border-top: 1px solid #e3e3e3; }

  /* folded to the rail: icons only, a tip with the name, the submenu flies out */
  .is-rail { width: 76px; }
  .is-rail .label, .is-rail .end, .is-rail kbd, .is-rail .sect { display: none; }
  .is-rail .item { width: 46px; justify-content: center; padding: 0; }
  .is-rail .item[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%; translate: 0 -50%; padding: 7px 10px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 13px; z-index: 5; }
  .is-rail .submenu { position: absolute; left: calc(100% + 8px); top: 30px; width: 190px; padding: 8px 8px 8px 22px; background: #fff; border-radius: 14px; box-shadow: 0 14px 30px -14px rgba(0,0,0,.3); opacity: 0; translate: -6px 0; transition: opacity .2s, translate .25s; }
  .is-rail .has-sub.is-open > .submenu { opacity: 1; translate: 0; }
  .is-rail .submenu .item { width: 100%; justify-content: flex-start; padding: 0 10px; }
  .is-rail .submenu .label { display: block; }
  .is-rail .submenu .item::before { left: -10px; }
  .is-rail .submenu > div { border-left: 1px solid #e3e3e3; padding-left: 8px; margin-left: -8px; }
  .said { position: absolute; right: 24px; bottom: 22px; padding: 7px 10px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 12px; }
  .said:empty { display: none; }
  </style>
</head>
<body>
  <div class="stage">
    <nav class="side" role="menu" aria-label="Workspace" data-click-sub>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="logo" aria-hidden="true"></div>
      <button class="fold" type="button" aria-label="Fold the sidebar"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9 3 5 7l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="item is-current" role="menuitem" data-tip="Dashboard"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 8 9 3l6 5v7H3zM7 15v-4h4v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="label">Dashboard</span><kbd>⌘1</kbd></button>
      <button class="item" role="menuitem" data-tip="Posts" data-say="8 new posts"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2h7l3 3v11H4zM7 9h4M7 12h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="label">Posts</span><span class="badge">8</span></button>
      <button class="item" role="menuitem" data-tip="Schedules"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="3.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 2v3M12 2v3M6 10l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="label">Schedules</span><span class="end"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor"/><path d="M7 4v6M4 7h6" stroke="currentColor" stroke-width="1.3"/></svg><span class="badge warm">3</span></span></button>
      <div class="has-sub">
        <button class="item" role="menuitem" data-tip="Income"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M8 3a6 6 0 1 0 6 6H8z M10.5 1.5a5 5 0 0 1 5 5h-5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="label">Income</span><span class="end"><svg class="chev" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
        <div class="submenu" role="menu" aria-label="Income"><div>
          <button class="item" role="menuitem"><span class="label">Earnings</span></button>
          <button class="item" role="menuitem"><span class="label">Refunds</span></button>
          <button class="item" role="menuitem"><span class="label">Declines</span></button>
          <button class="item" role="menuitem"><span class="label">Payouts</span></button>
        </div></div>
      </div>
      <div class="rule" role="separator"></div>
      <div class="sect">Workspace</div>
      <button class="item" role="menuitem" aria-disabled="true" data-tip="Reports"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 15V9M7 15V5M11 15v-4M15 15V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="label">Reports</span><kbd>⌘R</kbd></button>
      <button class="item" role="menuitem" data-tip="Help"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 7a2 2 0 1 1 2 2v1.5M9 13v.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="label">Help</span><span class="end"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M5 3h6v6M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span></button>
      <button class="item" role="menuitem" data-tip="Settings"><span class="ico"></span><span class="label">Settings</span><kbd>⌘,</kbd></button>
    </nav>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
  <script>
    // starts open with the tree showing; the chevron button folds it to the rail and back
    const side = document.querySelector('.side'), host = side.querySelector('.has-sub');
    host.classList.add('is-open'); host.querySelector('.item').setAttribute('aria-expanded', 'true');
    side.querySelector('.fold').addEventListener('click', () => {
      const rail = !side.classList.contains('is-rail');
      host.classList.remove('is-open'); host.querySelector('.item').setAttribute('aria-expanded', 'false');
      side.classList.toggle('is-rail', rail);
      rail ? side.removeAttribute('data-click-sub') : side.setAttribute('data-click-sub', '');
    });
  </script>
</body>
</html>
