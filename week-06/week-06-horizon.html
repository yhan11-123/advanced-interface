<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Horizon</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Horizon: after a service diagram. The items stand along a wide glass arc like a skyline, and
     the rail above the arc carries the sections, Before, During and After, split by ticks. A lit
     item rises off the arc and glows. Under it all sits a globe that says what was picked; the
     submenu is a set of round nodes that light up under the globe, wired to it. */
  :root { --w: 640px; --h: 440px; --fg: #e8f3ff; --muted: #7fa2c8; --cyan: #7cd8ff; }
  body { background: radial-gradient(80% 70% at 50% 100%, #10325c, #050c1d 70%); color: var(--fg); font: 500 12px/1.2 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .art { position: absolute; inset: 0; pointer-events: none; }
  .menu, .has-sub { position: static; }
  .menu { position: absolute; inset: 0; }
  .item { position: absolute; display: grid; justify-items: center; gap: 4px; width: 84px; padding: 8px 2px 6px; translate: -50% -100%; border-radius: 12px; text-align: center; transition: translate .2s cubic-bezier(.3, 1.4, .5, 1), background .15s; }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item { translate: -50% calc(-100% - 8px); background: rgba(124, 216, 255, .12); outline: none; }
  .item:hover .ico, .item:focus-visible .ico, .has-sub.is-open > .item .ico { filter: drop-shadow(0 0 8px var(--cyan)); color: #fff; }
  .item:active, .item.is-picked { background: rgba(124, 216, 255, .3); }
  .ico { width: 30px; height: 30px; color: var(--cyan); }
  .ico.none { height: 30px; display: grid; place-items: center; font-size: 18px; color: var(--muted); }
  .label { font-weight: 600; }
  kbd { font-size: 10px; color: var(--muted); }
  .item[aria-disabled="true"] { color: #3d5677; }
  .item[aria-disabled="true"] .ico { color: #3d5677; }
  .item[aria-disabled="true"]:hover { translate: -50% -100%; background: none; }
  .badge { position: absolute; top: 4px; right: 14px; min-width: 18px; height: 18px; border-radius: 9px; background: #ffb547; color: #2a1800; font-size: 11px; font-weight: 800; line-height: 18px; }
  .sect { position: absolute; translate: -50% -50%; font-size: 11px; color: #a9c8ec; letter-spacing: .06em; }
  .globe { position: absolute; left: 50%; top: 292px; width: 104px; height: 104px; translate: -50% -50%; border-radius: 50%; display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle at 40% 35%, rgba(190, 235, 255, .7), rgba(60, 140, 220, .4) 45%, rgba(10, 40, 90, .6) 70%); box-shadow: 0 0 40px rgba(124, 216, 255, .35), inset 0 0 20px rgba(255,255,255,.2); }
  .globe p { margin: 0; padding: 0 10px; font-size: 12px; font-weight: 600; }
  .submenu { position: absolute; inset: 0; pointer-events: none; }
  .submenu svg { position: absolute; inset: 0; opacity: 0; transition: opacity .3s; }
  .has-sub.is-open .submenu svg { opacity: 1; }
  .submenu .item { width: 52px; height: 52px; padding: 0; place-items: center; border-radius: 50%; translate: -50% -50%; pointer-events: auto; font-size: 11px; font-weight: 700;
    background: radial-gradient(circle at 40% 35%, #2a5a8f, #0f2c52); box-shadow: inset 0 0 0 1px rgba(124, 216, 255, .5); scale: .5; opacity: 0; transition: scale .3s cubic-bezier(.3, 1.5, .5, 1), opacity .2s, box-shadow .15s; }
  .has-sub.is-open .submenu .item { scale: 1; opacity: 1; }
  .submenu .item:hover, .submenu .item:focus-visible { translate: -50% -50%; box-shadow: inset 0 0 0 2px var(--cyan), 0 0 16px rgba(124, 216, 255, .5); }
  .submenu [aria-checked="true"] { box-shadow: inset 0 0 0 2px #ffb547, 0 0 14px rgba(255, 181, 71, .45); }
  </style>
</head>
<body>
  <div class="stage">
    <svg class="art" viewBox="0 0 640 440" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7cd8ff" stop-opacity=".05"/><stop offset=".5" stop-color="#7cd8ff" stop-opacity=".35"/><stop offset="1" stop-color="#7cd8ff" stop-opacity=".05"/></linearGradient></defs>
      <!-- the arc the items stand on (radius 620 round 320,760) and the section rail above it (radius 700) -->
      <circle cx="320" cy="760" r="620" fill="none" stroke="url(#g)" stroke-width="3"/>
      <circle cx="320" cy="760" r="660" fill="none" stroke="rgba(124,216,255,.07)" stroke-width="76"/>
      <circle cx="320" cy="760" r="704" fill="none" stroke="rgba(124,216,255,.35)" stroke-width="1"/>
      <g class="ticks" stroke="#7cd8ff" stroke-width="1.5"></g>
    </svg>
    <div class="menu" role="menu" aria-label="Event service">
      <span class="sect" data-a="-12" aria-hidden="true">Before event</span>
      <span class="sect" data-a="12" aria-hidden="true">During</span>
      <span class="sect" data-a="22.5" aria-hidden="true">After</span>
      <!-- data-a: angle from the top of the arc, in degrees; the script stands the item on the arc -->
      <button class="item" role="menuitem" data-a="-24"><svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><circle cx="9" cy="10" r="3.5" fill="currentColor"/><circle cx="21" cy="10" r="3.5" fill="currentColor"/><path d="M3 23c0-4 2.5-7 6-7s6 3 6 7zM15 23c0-4 2.5-7 6-7s6 3 6 7z" fill="currentColor"/></svg><span class="label">Consulting</span><kbd>⌘1</kbd></button>
      <button class="item" role="menuitem" data-a="-16"><svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><circle cx="13" cy="15" r="5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M13 5v4M13 21v4M3 15h4M19 15h4M6 8l3 3M17 19l3 3M6 22l3-3M17 11l3-3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="label">Integration</span><kbd>⌘2</kbd></button>
      <button class="item" role="menuitem" data-a="-8" data-say="4 sites near capacity"><svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><ellipse cx="15" cy="7" rx="9" ry="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 7v16c0 2 4 3.5 9 3.5s9-1.5 9-3.5V7M6 12.5c0 2 4 3.5 9 3.5s9-1.5 9-3.5M6 18c0 2 4 3.5 9 3.5s9-1.5 9-3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span class="label">Capacity</span><span class="badge">4</span></button>
      <button class="item" role="menuitem" data-a="0" aria-disabled="true"><svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><path d="M6 24 20 10M18 6a5 5 0 0 0 6 6l-3 3-6-6zM5 25l1-4 3 3zM8 6l16 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="label">Netcheck</span><kbd>⌘4</kbd></button>
      <button class="item" role="menuitem" data-a="8"><span class="ico none">—</span><span class="label">Drill</span><kbd>⌘5</kbd></button>
      <button class="item" role="menuitem" data-a="16"><svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15 3v5M15 22v5M3 15h5M22 15h5M6.5 6.5l3.5 3.5M20 20l3.5 3.5M6.5 23.5 10 20M20 10l3.5-3.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="label">Spare parts ↗</span></button>
      <div class="has-sub">
        <button class="item" role="menuitem" data-a="24"><svg class="ico" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 15h22M15 4c4 4 4 18 0 22M15 4c-4 4-4 18 0 22" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="label">Centres ▾</span></button>
        <div class="submenu" role="menu" aria-label="Service centre">
          <svg viewBox="0 0 640 440" aria-hidden="true"><g stroke="rgba(124,216,255,.45)" stroke-width="1"><path d="M320 292 L200 362M320 292 L262 400M320 292 L320 412M320 292 L378 400M320 292 L440 362"/></g></svg>
          <button class="item" role="menuitemradio" aria-checked="false" style="left:200px;top:362px">TAC</button>
          <button class="item" role="menuitemradio" aria-checked="false" style="left:262px;top:400px">GTAC</button>
          <button class="item" role="menuitemradio" aria-checked="true" style="left:320px;top:412px">RSPC</button>
          <button class="item" role="menuitemradio" aria-checked="false" style="left:378px;top:400px">GSPC</button>
          <button class="item" role="menuitemradio" aria-checked="false" style="left:440px;top:362px">GSLC</button>
        </div>
      </div>
    </div>
    <div class="globe"><p class="said" aria-live="polite">Global Service Centre</p></div>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script>
    // stand each item on the arc, and the section names and ticks on the rail above it
    const cx = 320, cy = 760, at = (r, a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
    document.querySelectorAll('.menu > .item[data-a], .has-sub > .item[data-a]').forEach(el => { const [x, y] = at(616, +el.dataset.a); el.style.left = x + 'px'; el.style.top = y + 'px'; });
    document.querySelectorAll('.sect').forEach(el => { const [x, y] = at(716, +el.dataset.a); el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.rotate = el.dataset.a + 'deg'; });
    document.querySelector('.ticks').innerHTML = [4, 20].map(a => { const [x1, y1] = at(698, a), [x2, y2] = at(724, a); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }).join('');
  </script>
  <script src="week-06-sketch.js?v=2"></script>
</body>
</html>
