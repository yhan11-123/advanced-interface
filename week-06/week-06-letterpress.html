<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Letterpress</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Letterpress: a menu printed on thick cotton card. A serif set in one size, small caps for
     the section, the shortcut set like a folio. Hover runs an ink roller across the row, leaving
     a pale tint; pressing bites the row into the card (an inner shadow, the type goes darker).
     The submenu is a second, smaller card slipped out from behind the first. */
  @import url("https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap");
  :root { --w: 520px; --h: 380px; --card: #f6f1e6; --ink: #22201c; --red: #b8322a; --muted: #8d8475; --font: "EB Garamond", Garamond, Georgia, serif; }
  body { background: #d9d1c1; color: var(--ink); font: 400 17px/1 var(--font); }
  .menu { position: absolute; left: 30px; top: 26px; width: 270px; padding: 14px 10px; background: var(--card);
    border-radius: 3px; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 2px 2px rgba(60,40,10,.18), 0 14px 26px -16px rgba(60,40,10,.5); }
  .item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; height: 34px; padding: 0 10px; overflow: hidden; }
  .item::before { content: ""; position: absolute; inset: 3px 0; background: var(--red); opacity: .1; transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.3, .7, .2, 1); }
  .item:hover::before, .item:focus-visible::before, .has-sub.is-open > .item::before { transform: scaleX(1); }
  .item:focus-visible { outline: none; }
  .item:active, .item.is-picked { box-shadow: inset 0 2px 3px rgba(60, 40, 10, .28), inset 0 -1px 0 rgba(255, 255, 255, .7); color: #000; }
  .item > * { position: relative; }
  .ico { width: 18px; height: 18px; flex: none; color: var(--red); }
  .label { flex: 1; }
  kbd, .end { font-style: italic; font-size: 15px; color: var(--muted); letter-spacing: .02em; }
  .item[aria-disabled="true"] { color: #bdb4a3; }
  .item[aria-disabled="true"]::before { display: none; }
  .item[aria-disabled="true"] kbd { color: #cfc7b8; }
  .rule { height: 0; margin: 10px 10px; border-top: 1px solid var(--ink); opacity: .5; }
  .rule::after { content: "❧"; display: block; width: 24px; margin: -11px auto 0; background: var(--card); text-align: center; font-size: 15px; line-height: 20px; color: var(--red); }
  .sect { padding: 4px 10px 6px; font-variant: small-caps; letter-spacing: .12em; font-size: 15px; color: var(--red); }
  .badge { min-width: 22px; height: 22px; padding: 0 5px; border: 1px solid var(--red); border-radius: 50%; font: italic 14px/20px var(--font); color: var(--red); text-align: center; }
  .submenu { position: absolute; left: calc(100% + 2px); bottom: -12px; width: 180px; padding: 12px 8px; background: #efe7d6; border-radius: 3px;
    box-shadow: 0 2px 2px rgba(60,40,10,.18), 0 14px 26px -16px rgba(60,40,10,.5);
    transform: translateX(-30px) rotate(-1.5deg); opacity: 0; transition: transform .45s cubic-bezier(.2, .8, .2, 1), opacity .2s ease; z-index: -1; }
  .has-sub.is-open > .submenu { transform: translateX(18px) rotate(1deg); opacity: 1; }
  .submenu .ico { visibility: hidden; font-size: 15px; line-height: 18px; text-align: center; }
  .submenu [aria-checked="true"] .ico { visibility: visible; }
  .said { position: absolute; left: 34px; bottom: 6px; font-style: italic; font-size: 15px; color: #6f6656; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="menu" role="menu" aria-label="Type">
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3h5a3 3 0 0 1 0 6H5zM5 9h6a3 3 0 0 1 0 6H5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="label">Bold</span><kbd>⌘B</kbd></button>
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M8 3h6M4 15h6M11 3 7 15" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="label">Italic</span><kbd>⌘I</kbd></button>
      <button class="item" role="menuitem" aria-disabled="true"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 14 7 4l4 10M4.5 10.5h5M12 14V9h3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Small capitals</span><kbd>⇧⌘K</kbd></button>
      <button class="item" role="menuitem"><span class="ico"></span><span class="label">Letterspace</span><kbd>⌥⌘L</kbd></button>
      <div class="rule" role="separator"></div>
      <div class="sect">set &amp; print</div>
      <button class="item" role="menuitem" data-say="Two proofs waiting"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2h7l3 3v11H4z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Proofs</span><span class="badge">2</span></button>
      <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 7V2h10v5M4 13H2V7h14v6h-2M5 11h8v5H5z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Send to press</span><svg class="ico" viewBox="0 0 18 18" aria-hidden="true" style="color: var(--muted)"><path d="M7 4h7v7M14 4l-9 9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      <div class="has-sub">
        <button class="item" role="menuitem"><svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 15 8 3h2l5 12M5 11h8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Typeface</span><span class="end">☞</span></button>
        <div class="submenu" role="menu" aria-label="Typeface">
          <button class="item" role="menuitemradio" aria-checked="true"><span class="ico">✓</span><span class="label">Caslon</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="ico">✓</span><span class="label" style="font-style: italic">Bodoni</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="ico">✓</span><span class="label" style="font-family: Futura, 'Century Gothic', sans-serif; font-size: 15px">Futura</span></button>
        </div>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
</body>
</html>
