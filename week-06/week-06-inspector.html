<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Inspector</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Inspector: after a design tool's property panel. The menu is the Frame Ratio dropdown, and
     it does its job in the panel: picking a preset writes its width and height into the fields
     below and its name into the field. Presets are grouped by device; iPhone opens a submenu of
     models. Quiet and dense, the way a tool you work in all day should be. */
  :root { --w: 640px; --h: 560px; --panel: #232324; --field: #2f2f31; --fg: #ececec; --muted: #8b8b8f; --blue: #7aa7ff; }
  body { background: #161617; color: var(--fg); font: 500 13px/1 ui-sans-serif, -apple-system, "Inter", system-ui, sans-serif; }
  .panel { position: absolute; left: 30px; top: 20px; width: 300px; padding: 14px 16px 18px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px #333; }
  .tabs { display: flex; gap: 20px; padding-bottom: 12px; border-bottom: 1px solid #3a3a3c; font-size: 15px; }
  .tabs span:last-child { color: var(--muted); } .tabs span:first-child { position: relative; } .tabs span:first-child::after { content: ""; position: absolute; left: 0; right: 0; bottom: -13px; height: 2px; background: var(--fg); }
  .aligns { display: flex; justify-content: space-between; padding: 16px 2px; color: #d0d0d0; }
  .aligns i { width: 18px; height: 14px; border: 2px solid currentColor; border-radius: 3px; border-width: 0 0 0 2px; position: relative; }
  .aligns i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
  .prop { display: grid; grid-template-columns: 92px 1fr 1fr; gap: 8px; align-items: center; margin-top: 10px; }
  .prop > span:first-child { color: #cfcfcf; font-size: 14px; }
  .fld { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 8px; background: var(--field); font-size: 14px; }
  .fld i { font-style: normal; color: var(--muted); }
  .fld.wide { grid-column: span 2; justify-content: space-between; }
  .fld.trigger { cursor: pointer; } .fld.trigger[aria-expanded="true"] { box-shadow: inset 0 0 0 1.5px var(--blue); }
  .fld.flash { animation: flash .6s; } @keyframes flash { 30% { background: #3d4a66; } }
  .menu { position: absolute; left: 138px; top: 152px; width: 270px; padding: 6px; border-radius: 10px; background: #2b2b2d; box-shadow: inset 0 0 0 1px #444, 0 18px 34px -12px rgba(0,0,0,.8); transition: opacity .12s, translate .15s; z-index: 2; }
  .menu.is-shut { opacity: 0; translate: 0 -6px; pointer-events: none; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; padding: 0 8px; border-radius: 6px; }
  .item:hover, .item:focus-visible, .has-sub.is-open > .item { background: var(--blue); color: #0d1424; outline: none; }
  .item:hover kbd, .item:hover .dim, .has-sub.is-open > .item .dim, .item:focus-visible .dim, .item:focus-visible kbd { color: #1d2b4a; }
  .item:active, .item.is-picked { background: #9dbdff; }
  .tick { width: 14px; flex: none; visibility: hidden; }
  [aria-checked="true"] > .tick { visibility: visible; }
  .ico { width: 16px; height: 16px; flex: none; }
  .label { flex: 1; }
  .dim, kbd { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .item[aria-disabled="true"] { color: #5d5d61; }
  .item[aria-disabled="true"]:hover { background: none; }
  .item[aria-disabled="true"] .dim { color: #4b4b4f; }
  .rule { height: 1px; margin: 5px 8px; background: #404043; }
  .sect { padding: 7px 8px 4px 32px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .badge { padding: 2px 6px; border-radius: 4px; background: #3d5ba8; color: #dfe8ff; font-size: 10px; font-weight: 700; }
  .submenu { position: absolute; left: calc(100% + 4px); top: -6px; width: 200px; padding: 6px; border-radius: 10px; background: #2b2b2d; box-shadow: inset 0 0 0 1px #444, 0 18px 34px -12px rgba(0,0,0,.8); }
  .said { position: absolute; left: 34px; bottom: 16px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="panel" aria-hidden="false">
      <div class="tabs" aria-hidden="true"><span>Design</span><span>Prototype</span></div>
      <div class="aligns" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="prop"><span>Frame Ratio</span><button class="fld wide trigger" type="button" aria-expanded="true" aria-controls="ratio"><span id="ratio-name">Custom</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
      <div class="prop"><span>Position</span><span class="fld"><i>X</i>412</span><span class="fld"><i>Y</i>212</span></div>
      <div class="prop"><span>Size</span><span class="fld" id="w"><i>W</i><b>1920</b></span><span class="fld" id="h"><i>H</i><b>1080</b></span></div>
      <div class="prop"><span>Rotation</span><span class="fld"><i>°</i>0</span><span></span></div>
      <div class="prop"><span>Radius</span><span class="fld"><i>⌜</i>8</span><span></span></div>
    </div>
    <div class="menu" role="menu" aria-label="Frame ratio" id="ratio">
      <button class="item" role="menuitemradio" aria-checked="true" data-w="1920" data-h="1080" data-name="Custom"><span class="tick">✓</span><span class="label">Custom</span><kbd>⌥C</kbd></button>
      <div class="rule" role="separator"></div>
      <div class="sect">Phone</div>
      <div class="has-sub">
        <button class="item" role="menuitem"><span class="tick">✓</span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="1.5" width="8" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">iPhone</span><span class="dim">›</span></button>
        <div class="submenu" role="menu" aria-label="iPhone">
          <button class="item" role="menuitemradio" aria-checked="false" data-w="393" data-h="852" data-name="iPhone 16"><span class="tick">✓</span><span class="label">iPhone 16</span><span class="dim">393×852</span></button>
          <button class="item" role="menuitemradio" aria-checked="false" data-w="440" data-h="956" data-name="iPhone 16 Pro Max"><span class="tick">✓</span><span class="label">16 Pro Max</span><span class="dim">440×956</span></button>
          <button class="item" role="menuitemradio" aria-checked="false" data-w="375" data-h="667" data-name="iPhone SE"><span class="tick">✓</span><span class="label">iPhone SE</span><span class="dim">375×667</span></button>
        </div>
      </div>
      <button class="item" role="menuitemradio" aria-checked="false" data-w="412" data-h="917" data-name="Android"><span class="tick">✓</span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="1.5" width="8" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 12.5h2" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Android</span><span class="dim">412×917</span></button>
      <div class="sect">Desktop</div>
      <button class="item" role="menuitemradio" aria-checked="false" data-w="1920" data-h="1080" data-name="Desktop"><span class="tick">✓</span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 14h4M8 11.5V14" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Desktop</span><kbd>⌥D</kbd></button>
      <button class="item" role="menuitemradio" aria-checked="false" data-w="1440" data-h="900" data-name="MacBook"><span class="tick">✓</span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1 12.5h14" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">MacBook</span><kbd>⌥M</kbd></button>
      <button class="item" role="menuitemradio" aria-checked="false" data-w="2732" data-h="2048" data-name="Vision Pro" data-say="Vision Pro is new"><span class="tick">✓</span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6c0-1.5 2-2 6-2s6 .5 6 2v3c0 2-1.5 3-3 3-1.3 0-2-1-3-1s-1.7 1-3 1c-1.5 0-3-1-3-3z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="label">Vision Pro</span><span class="badge">NEW</span></button>
      <button class="item" role="menuitemradio" aria-checked="false" aria-disabled="true"><span class="tick">✓</span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3.5" width="8" height="9" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 3.5 6.5 1h3l.5 2.5M6 12.5l.5 2.5h3l.5-2.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span class="label">Watch</span><span class="dim">soon</span></button>
      <div class="rule" role="separator"></div>
      <button class="item" role="menuitem"><span class="tick">✓</span><span class="label">Browse presets</span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3h7v7M13 3 4 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
  <script>
    // the field opens and shuts the menu; a preset writes its name, width and height into the panel
    const menu = document.querySelector('.menu'), trig = document.querySelector('.trigger');
    trig.addEventListener('click', () => { const on = menu.classList.toggle('is-shut') === false; trig.setAttribute('aria-expanded', on); });
    menu.addEventListener('click', e => {
      const it = e.target.closest('[data-w]'); if (!it || it.getAttribute('aria-disabled') === 'true') return;
      menu.querySelectorAll('[role="menuitemradio"]').forEach(r => r.setAttribute('aria-checked', String(r === it)));
      document.getElementById('ratio-name').textContent = it.dataset.name;
      for (const k of ['w', 'h']) { const f = document.getElementById(k); f.querySelector('b').textContent = it.dataset[k]; f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash'); }
    });
  </script>
</body>
</html>
