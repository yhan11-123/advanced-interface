<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; HUD</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* HUD: after a sci-fi desktop skin. The menu is a cyan frame with cut corners; icons sit in
     hexagonal tiles, shortcuts are function keys, the badge is a notched tag. Hover fills the row
     like a meter filling up and lights the tile; pressing flickers it. The submenu hangs off a
     bent conduit to the side, the way the skin wires its panels together. */
  @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap");
  :root { --w: 560px; --h: 440px; --cyan: #3fe0e6; --deep: #04161c; --fg: #c9fbfd; --muted: #3d8d92; --font: "Orbitron", system-ui, sans-serif; }
  body { background: radial-gradient(circle at 80% 30%, rgba(255,255,255,.08), transparent 30%), radial-gradient(60% 60% at 60% 70%, #0f2630, #03080c 70%); color: var(--fg); font: 500 12px/1 var(--font); letter-spacing: .1em; text-transform: uppercase; }
  body::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 20%, #fff, transparent), radial-gradient(1px 1px at 40% 80%, #cff, transparent), radial-gradient(1px 1px at 85% 60%, #fff, transparent); opacity: .6; }
  /* the cut-corner frame is drawn on two layers behind the content, so it clips nothing (the submenu hangs outside it) */
  .frame { position: relative; isolation: isolate; }
  .frame::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--cyan); clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); }
  .frame::after { content: ""; position: absolute; inset: 2px; z-index: -1; background: rgba(4, 22, 28, .94); clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
  .frame > .in { padding: 12px 12px 14px; }
  .menu { position: absolute; left: 34px; top: 24px; width: 270px; }
  .title { display: flex; justify-content: space-between; padding: 2px 4px 10px; font-weight: 700; letter-spacing: .3em; color: var(--cyan); }
  .title span { font: 400 11px/1 "Share Tech Mono", monospace; letter-spacing: .05em; color: var(--muted); }
  .item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 8px 0 4px; }
  .item::before { content: ""; position: absolute; left: 42px; right: 0; top: 7px; bottom: 7px; background: linear-gradient(90deg, rgba(63, 224, 230, .45), rgba(63, 224, 230, .12)); transform: scaleX(0); transform-origin: left; transition: transform .28s steps(7); }
  .item:hover::before, .item:focus-visible::before, .has-sub.is-open > .item::before { transform: scaleX(1); }
  .item:focus-visible { outline: none; }
  .item.is-picked, .item:active { animation: flick .3s steps(2) 2; }
  @keyframes flick { 50% { opacity: .35; } }
  .item > * { position: relative; }
  .hex { display: grid; place-items: center; width: 34px; height: 30px; flex: none; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background: rgba(63, 224, 230, .16); color: var(--cyan); transition: background .15s, color .15s; }
  .hex svg { width: 16px; height: 16px; }
  .item:hover .hex, .item:focus-visible .hex, .has-sub.is-open > .item .hex { background: var(--cyan); color: var(--deep); }
  .label { flex: 1; }
  kbd, .end { font: 400 12px/1 "Share Tech Mono", monospace; color: var(--muted); }
  .item:hover kbd, .item:hover .end { color: var(--fg); }
  .item[aria-disabled="true"] { color: #2c5d61; }
  .item[aria-disabled="true"] .hex { background: rgba(63, 224, 230, .06); color: #2c5d61; }
  .item[aria-disabled="true"]::before { display: none; }
  .item[aria-disabled="true"] .label::after { content: " ▪ locked"; font-size: 9px; }
  .rule { height: 2px; margin: 8px 4px; background: repeating-linear-gradient(90deg, var(--muted) 0 10px, transparent 10px 14px); }
  .sect { padding: 4px 4px 6px; font-size: 10px; letter-spacing: .35em; color: var(--muted); }
  .badge { padding: 3px 7px 3px 9px; background: #ff5a6e; color: #fff; font: 700 11px/1 var(--font); clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px); }
  .submenu { position: absolute; left: calc(100% + 54px); bottom: -40px; width: 170px; opacity: 0; transition: opacity .25s steps(3); }
  .has-sub.is-open > .submenu { opacity: 1; }
  .conduit { position: absolute; right: 100%; bottom: 58px; width: 66px; height: 24px; border: 2px solid var(--cyan); border-left: 0; border-bottom: 0; transform: skewX(30deg); transform-origin: 0 100%; }
  .submenu .hex { width: 28px; height: 24px; }
  .submenu .tick { visibility: hidden; }
  .submenu [aria-checked="true"] .tick { visibility: visible; color: var(--cyan); }
  .clock { position: absolute; right: 30px; top: 30px; font: 700 26px/1 var(--font); color: var(--cyan); letter-spacing: .05em; text-shadow: 0 0 10px rgba(63, 224, 230, .6); }
  .said { position: absolute; right: 30px; top: 64px; font: 400 12px/1 "Share Tech Mono", monospace; color: var(--fg); }
  .said:not(:empty)::before { content: "> "; color: var(--cyan); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="clock" aria-hidden="true">16:02:04</div>
    <p class="said" aria-live="polite"></p>
    <div class="menu frame" role="menu" aria-label="System"><div class="in">
      <div class="title" aria-hidden="true">System <span>GPU 53°C</span></div>
      <button class="item" role="menuitem"><span class="hex"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 9h3l2-5 3 9 2-6 1 2h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span class="label">Monitor</span><kbd>F1</kbd></button>
      <button class="item" role="menuitem"><span class="hex"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="1.6" fill="currentColor"/><path d="M8 6C8 2 11 1 12 3S10 7 8 6zM10 8c4 0 5 3 3 4s-4-2-3-4zM8 10c0 4-3 5-4 3s2-4 4-3zM6 8C2 8 1 5 3 4s4 2 3 4z" fill="currentColor"/></svg></span><span class="label">Fans</span><kbd>F2</kbd></button>
      <button class="item" role="menuitem" aria-disabled="true"><span class="hex"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1 3 9h4l-1 6 6-8H8z" fill="currentColor"/></svg></span><span class="label">Boost</span><kbd>F3</kbd></button>
      <button class="item" role="menuitem"><span class="hex" style="background:none"></span><span class="label">Profiles</span><kbd>F4</kbd></button>
      <div class="rule" role="separator"></div>
      <div class="sect">Network</div>
      <button class="item" role="menuitem" data-say="6 downloads queued"><span class="hex"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v9M4 7l4 4 4-4M2 14h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="label">Downloads</span><span class="badge">06</span></button>
      <button class="item" role="menuitem"><span class="hex"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="2.4" fill="currentColor"/><path d="M8 5.6h6M6 9.2 3 4.2M10 9.2 7 14" stroke="currentColor" stroke-width="1.4"/></svg></span><span class="label">Browser</span><span class="end">⇱</span></button>
      <div class="has-sub">
        <button class="item" role="menuitem"><span class="hex"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v6M4.5 3.5a6 6 0 1 0 7 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="label">Power</span><span class="end">»</span></button>
        <div class="submenu frame" role="menu" aria-label="Power"><span class="conduit" aria-hidden="true"></span><div class="in">
          <button class="item" role="menuitemradio" aria-checked="false"><span class="hex"><span class="tick">◆</span></span><span class="label">Sleep</span></button>
          <button class="item" role="menuitemradio" aria-checked="true"><span class="hex"><span class="tick">◆</span></span><span class="label">Balanced</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="hex"><span class="tick">◆</span></span><span class="label">Turbo</span></button>
        </div></div>
      </div>
    </div></div>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=2"></script>
</body>
</html>
