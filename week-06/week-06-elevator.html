<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 06 sketch &middot; Elevator</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="week-06-sketch.css?v=2" />
  <style>
  /* Elevator: the menu as a brushed-steel call panel. Each item's icon is a round push button,
     sections are engraved plates, shortcuts are engraved beside the label, the badge is a red
     LED counter. Hover warms the button's ring; pressing lights it amber and it stays lit for a
     moment, the way a floor button does. The submenu slides out as a narrower steel strip. */
  @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Share+Tech+Mono&display=swap");
  :root { --w: 520px; --h: 420px; --steel: linear-gradient(90deg, #b9bdc1, #d9dcdf 30%, #c3c7cb 55%, #e1e3e5 75%, #b6babe); --ink: #2b2f33; --etch: #5b6066; --amber: #ffb43d; --font: "Barlow Condensed", "Arial Narrow", sans-serif; }
  body { background: #3a3d41; color: var(--ink); font: 600 16px/1 var(--font); letter-spacing: .04em; text-transform: uppercase; }
  .menu, .submenu { padding: 12px 10px; border-radius: 6px; background: var(--steel); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(0,0,0,.25), 0 16px 28px -14px rgba(0,0,0,.7);
    background-blend-mode: normal; }
  .menu { position: absolute; left: 30px; top: 22px; width: 250px; }
  .screw { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f2f2f2, #8a8f94); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .item { display: flex; align-items: center; gap: 12px; width: 100%; height: 40px; padding: 0 6px; border-radius: 4px; }
  .item:focus-visible { outline: 1px dashed var(--etch); outline-offset: -2px; }
  .btn { position: relative; display: grid; place-items: center; width: 30px; height: 30px; flex: none; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f4f5f6, #a9aeb3 75%);
    box-shadow: 0 0 0 3px #8c9196, 0 0 0 4px rgba(255,255,255,.6), inset 0 -2px 3px rgba(0,0,0,.25); font-size: 13px; color: var(--ink); transition: box-shadow .2s; }
  .btn svg { width: 14px; height: 14px; }
  .item:hover .btn, .item:focus-visible .btn, .has-sub.is-open > .item .btn { box-shadow: 0 0 0 3px #c49a52, 0 0 0 4px rgba(255,255,255,.6), inset 0 -2px 3px rgba(0,0,0,.25); }
  .item:active .btn, .item.is-picked .btn { box-shadow: 0 0 0 3px var(--amber), 0 0 12px 4px rgba(255,180,61,.6), inset 0 2px 3px rgba(0,0,0,.3); color: #7a4a00; }
  .label { flex: 1; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  kbd, .end { font: 400 13px/1 "Share Tech Mono", monospace; color: var(--etch); text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .item[aria-disabled="true"] { color: #8c9196; }
  .item[aria-disabled="true"] .btn { box-shadow: 0 0 0 3px #a3a8ad, inset 0 -2px 3px rgba(0,0,0,.15); color: #9aa0a5; }
  .item[aria-disabled="true"] .label::after { content: " · closed"; font-size: 12px; }
  .plate { margin: 4px 6px 6px; padding: 4px 8px; border-radius: 3px; background: #2f3336; color: #d6d9dc; font-size: 11px; letter-spacing: .3em; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
  .rule { height: 2px; margin: 8px 4px; background: linear-gradient(#9da2a7, #eef0f1); }
  .led { padding: 2px 5px; border-radius: 2px; background: #1b0d0c; color: #ff3b2f; font: 400 15px/1 "Share Tech Mono", monospace; text-shadow: 0 0 6px rgba(255, 59, 47, .8); letter-spacing: .1em; }
  .submenu { position: absolute; left: calc(100% + 16px); bottom: -12px; width: 130px; clip-path: inset(0 100% 0 0); transition: clip-path .45s cubic-bezier(.6, 0, .2, 1); }
  .has-sub.is-open > .submenu { clip-path: inset(0 0 0 0); }
  .submenu [aria-checked="true"] .btn { box-shadow: 0 0 0 3px var(--amber), 0 0 10px 3px rgba(255,180,61,.5), inset 0 2px 3px rgba(0,0,0,.3); color: #7a4a00; }
  .said { position: absolute; right: 30px; bottom: 26px; padding: 6px 10px; border-radius: 3px; background: #120807; color: var(--amber); font: 400 15px/1 "Share Tech Mono", monospace; text-shadow: 0 0 6px rgba(255,180,61,.7); }
  .said:empty { display: none; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="menu" role="menu" aria-label="Floors">
      <span class="screw" style="left:6px;top:6px"></span><span class="screw" style="right:6px;top:6px"></span><span class="screw" style="left:6px;bottom:6px"></span><span class="screw" style="right:6px;bottom:6px"></span>
      <div class="plate" aria-hidden="true">FLOORS</div>
      <button class="item" role="menuitem"><span class="btn">3</span><span class="label">Studio</span><kbd>⌘3</kbd></button>
      <button class="item" role="menuitem"><span class="btn">2</span><span class="label">Gallery</span><kbd>⌘2</kbd></button>
      <button class="item" role="menuitem" aria-disabled="true"><span class="btn">R</span><span class="label">Roof</span><kbd>⌘R</kbd></button>
      <button class="item" role="menuitem"><span class="btn"></span><span class="label">Lobby</span><kbd>⌘L</kbd></button>
      <div class="rule" role="separator"></div>
      <div class="plate" aria-hidden="true">SERVICE</div>
      <button class="item" role="menuitem" data-say="04 WAITING"><span class="btn"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="4.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 13a4.5 4.5 0 0 1 9 0" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span><span class="label">Waiting</span><span class="led">04</span></button>
      <button class="item" role="menuitem"><span class="btn"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2h3l1 3-2 1a7 7 0 0 0 3 3l1-2 3 1v3a1 1 0 0 1-1 1A10 10 0 0 1 2 3a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span><span class="label">Concierge</span><span class="end">↗</span></button>
      <div class="has-sub">
        <button class="item" role="menuitem"><span class="btn">P</span><span class="label">Parking</span><span class="end">▸</span></button>
        <div class="submenu" role="menu" aria-label="Parking">
          <button class="item" role="menuitemradio" aria-checked="false"><span class="btn">P1</span><span class="label">Level 1</span></button>
          <button class="item" role="menuitemradio" aria-checked="true"><span class="btn">P2</span><span class="label">Level 2</span></button>
          <button class="item" role="menuitemradio" aria-checked="false"><span class="btn">P3</span><span class="label">Level 3</span></button>
        </div>
      </div>
    </div>
    <p class="said" aria-live="polite"></p>
  </div>
  <a class="back-pill" href="week-06.html" hidden>&larr; Week 06</a>
  <script src="week-06-sketch.js?v=1"></script>
</body>
</html>
