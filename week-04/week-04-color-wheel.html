<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 04 sketch &middot; Color wheel</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #0b0b0c; --panel: #1f1f21; --line: #2e2e31;
    --fg: #f2f2f2; --muted: #8b8b90; --blue: #3b7cff;
    --font: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); display: grid; place-items: center; -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .panel { width: min(88vw, 360px); padding: 18px 20px; background: var(--panel); border-radius: 22px; display: flex; align-items: center; gap: 14px; }
  .state { position: fixed; right: 12px; top: 10px; font: 10px/1 var(--mono); letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
  .state b { color: var(--fg); font-weight: 500; }
  [role="slider"] { touch-action: none; outline: none; cursor: grab; }
  [role="slider"].is-dragging { cursor: grabbing; }
  [role="slider"]:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  .back-pill { position: fixed; left: 12px; bottom: 12px; font: 12px/1 system-ui, sans-serif; color: #fff; background: rgba(255,255,255,.12); padding: 8px 12px; border-radius: 999px; text-decoration: none; }

  :root { --bg: #000; }
  .wrap { position: relative; width: min(70vmin, 180px); aspect-ratio: 1; margin-top: -14px; }
  .wheel { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0) 72%), conic-gradient(from 0deg, hsl(0 90% 60%), hsl(60 90% 60%), hsl(120 90% 60%), hsl(180 90% 60%), hsl(240 90% 60%), hsl(300 90% 60%), hsl(360 90% 60%)); }
  .hit { position: absolute; inset: -6%; border-radius: 50%; }
  .knob { position: absolute; width: 19%; height: 19%; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); transition: transform .12s; pointer-events: none; }
  .read { position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%); display: flex; align-items: center; gap: 7px; font: 600 13px/1 var(--font); font-variant-numeric: tabular-nums; color: #fff; white-space: nowrap; }
  .read i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .read span { color: #8b8b90; font: 400 11px/1 var(--mono); }
  .hit.is-hover ~ .knob { transform: translate(-50%, -50%) scale(1.06); }
  .hit.is-pressed ~ .knob, .hit.is-dragging ~ .knob { transform: translate(-50%, -50%) scale(.85); }

  </style>
</head>
<body>

  <div class="wrap">
    <div class="wheel"></div>
    <div class="hit" role="slider" tabindex="0" aria-label="Colour"></div>
    <div class="knob"></div>
    <div class="read"><i></i><b></b><span></span></div>
  </div>

  <a class="back-pill" href="week-04.html" hidden>&larr; Week 04</a>
  <script>
  // State readout: rest / hover / pressed / drag, so the three brief states can be seen.
  const stateEl = document.querySelector('.state b');
  function track(el) {
    let hover = false, pressed = false, drag = false;
    const show = () => {
      el.classList.toggle('is-hover', hover && !pressed);
      el.classList.toggle('is-pressed', pressed && !drag);
      el.classList.toggle('is-dragging', drag);
      if (stateEl) stateEl.textContent = drag ? 'drag' : pressed ? 'pressed' : hover ? 'hover' : 'rest';
    };
    el.addEventListener('pointerenter', () => { hover = true; show(); });
    el.addEventListener('pointerleave', () => { hover = false; show(); });
    return {
      down() { pressed = true; drag = false; show(); },
      move() { if (pressed && !drag) { drag = true; show(); } },
      up() { pressed = false; drag = false; show(); },
    };
  }
  // A horizontal slider. opts: min, max, step, value, format(v), render(v, t), [fromPointer(e, rect, v0, x0)]
  function slider(el, opts) {
    const { min, max } = opts; const step = opts.step || 0;
    let v = opts.value, x0 = 0, v0 = 0;
    const st = track(el);
    const snap = n => { n = Math.min(max, Math.max(min, n)); if (step) n = Math.round((n - min) / step) * step + min; return +n.toFixed(4); };
    const set = n => {
      v = snap(n);
      el.setAttribute('aria-valuenow', v);
      el.setAttribute('aria-valuetext', opts.format(v));
      opts.render(v, (v - min) / (max - min));
    };
    const fromX = e => {
      const r = (opts.hit || el).getBoundingClientRect();
      if (opts.relative) return v0 - (e.clientX - x0) / opts.relative;   // px per unit, dragging the track itself
      return min + (e.clientX - r.left) / r.width * (max - min);
    };
    el.setAttribute('aria-valuemin', min); el.setAttribute('aria-valuemax', max);
    el.addEventListener('pointerdown', e => {
      el.setPointerCapture(e.pointerId);
      x0 = e.clientX; v0 = v; st.down();
      if (!opts.relative) set(fromX(e));
    });
    el.addEventListener('pointermove', e => {
      if (!el.hasPointerCapture(e.pointerId)) return;
      if (Math.abs(e.clientX - x0) > 2) st.move();
      set(fromX(e));
    });
    const end = e => { if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId); st.up(); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', e => {
      const k = step || (max - min) / 100, big = (max - min) / 10;
      const map = { ArrowRight: v + k, ArrowUp: v + k, ArrowLeft: v - k, ArrowDown: v - k, PageUp: v + big, PageDown: v - big, Home: min, End: max };
      if (e.key in map) { e.preventDefault(); set(map[e.key]); }
    });
    set(v);
    return { set, get: () => v };
  }
  if (window.top === window) document.querySelector('.back-pill').hidden = false;

  // The knob goes anywhere inside the wheel: angle picks the hue, distance from the centre picks the saturation.
  // Two values at once, so the keyboard splits them: left and right turn the hue, up and down change the saturation.
  const hit = document.querySelector('.hit'), knob = document.querySelector('.knob'), read = document.querySelector('.read');
  const st = track(hit); let h = 300, s = 64;
  const hex = (h, s, l) => { const a = s * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); }; return '#' + f(0) + f(8) + f(4); };
  const set = (nh, ns) => {
    h = ((Math.round(nh) % 360) + 360) % 360; s = Math.round(Math.min(100, Math.max(0, ns)));
    const rad = h * Math.PI / 180, r = s / 100 * 50 * 0.9;   // keep the knob's centre inside the rim
    knob.style.left = (50 + Math.sin(rad) * r) + '%'; knob.style.top = (50 - Math.cos(rad) * r) + '%';
    const L = 100 - s * .4, c = `hsl(${h} ${s * .9}% ${L}%)`, x = hex(h, s * .9 / 100, L / 100).toUpperCase();
    knob.style.background = c; read.querySelector('i').style.background = c;
    read.querySelector('b').textContent = `${h}° · ${s}%`; read.querySelector('span').textContent = x;
    hit.setAttribute('aria-valuenow', h); hit.setAttribute('aria-valuetext', `Hue ${h} degrees, saturation ${s} percent, ${x}`);
  };
  const fromE = e => {
    const r = hit.getBoundingClientRect(), px = e.clientX - (r.left + r.width / 2), py = e.clientY - (r.top + r.height / 2);
    const R = r.width / 2 / 1.12 * 0.9;   // the wheel is the hit area minus its 6% margin
    set(Math.atan2(px, -py) * 180 / Math.PI, Math.hypot(px, py) / R * 100);
  };
  hit.setAttribute('aria-valuemin', 0); hit.setAttribute('aria-valuemax', 359);
  hit.addEventListener('pointerdown', e => { hit.setPointerCapture(e.pointerId); st.down(); fromE(e); });
  hit.addEventListener('pointermove', e => { if (!hit.hasPointerCapture(e.pointerId)) return; st.move(); fromE(e); });
  ['pointerup', 'pointercancel'].forEach(t => hit.addEventListener(t, () => st.up()));
  hit.addEventListener('keydown', e => {
    const m = { ArrowRight: [h + 5, s], ArrowLeft: [h - 5, s], ArrowUp: [h, s + 5], ArrowDown: [h, s - 5], Home: [h, 0], End: [h, 100] };
    if (e.key in m) { e.preventDefault(); set(...m[e.key]); }
  });
  set(h, s);

  </script>
</body>
</html>
