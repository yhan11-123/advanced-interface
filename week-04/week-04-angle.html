<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 04 sketch &middot; Angle</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
  /* A sketch page of its own, so its styles stay in this file. */
  :root {
    --bg: #0b0b0c; --panel: #1f1f21; --line: #2e2e31;
    --fg: #f2f2f2; --muted: #8b8b90; --blue: #3b7cff;
    --font: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); display: grid; place-items: center; -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .panel { width: min(88vw, 360px); padding: 18px 20px; background: var(--panel); border-radius: 22px; display: flex; align-items: center; gap: 14px; }
  .state { position: fixed; right: 12px; top: 10px; font: 10px/1 var(--mono); letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
  .state b { color: var(--fg); font-weight: 500; }
  [role="slider"] { touch-action: none; outline: none; cursor: grab; }
  [role="slider"].is-dragging { cursor: grabbing; }
  [role="slider"]:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  .back-pill { position: fixed; left: 12px; bottom: 12px; font: 12px/1 system-ui, sans-serif; color: #fff; background: rgba(255,255,255,.12); padding: 8px 12px; border-radius: 999px; text-decoration: none; }

  :root { --bg: #ececec; --fg: #1a1a1a; --muted: #8e8e8e; --sun: #fdf79a; color-scheme: light; }
  body { background: var(--bg); }
  .state b { color: var(--fg); }
  .back-pill { color: #fff; background: rgba(0,0,0,.6); }
  svg.fan { width: min(96vw, 420px); height: auto; max-height: 96vh; overflow: visible; }
  .scale { fill: none; stroke: #9a9a9a; stroke-width: 2.5; }
  .tick { stroke: #7a7a7a; stroke-width: 2.5; }
  .tl { fill: var(--muted); font: 11px/1 var(--font); }
  .base { stroke: #b9b9b9; stroke-width: 1.4; stroke-dasharray: 4 4; fill: none; }
  .sector { fill: var(--sun); transition: fill .15s; }
  .line { stroke: var(--fg); stroke-width: 2; }
  .head path, .head circle { fill: none; stroke: #8a8a8a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .pivot { fill: var(--bg); stroke: #8a8a8a; stroke-width: 1.2; }
  .grip rect { fill: #fff; stroke: var(--fg); stroke-width: 2; transition: transform .12s; transform-box: fill-box; transform-origin: center; }
  .grip path { fill: var(--fg); }
  .val { fill: var(--fg); font: 400 30px/1 var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; transition: transform .12s; transform-box: fill-box; transform-origin: left center; }
  .hint { fill: var(--muted); font: 11px/1 var(--font); }
  .fan.is-hover .sector { fill: #fbf27a; }
  .fan.is-hover .grip rect { transform: scale(1.08); }
  .fan.is-pressed .grip rect, .fan.is-dragging .grip rect { transform: scale(1.18); fill: var(--sun); }
  .fan.is-dragging .val { transform: scale(1.12); }
  .fan.is-dragging .sector { fill: #faee5c; }

  </style>
</head>
<body>

  <svg class="fan" viewBox="0 10 320 210" role="slider" tabindex="0" aria-label="HeadUp angle">
    <path class="sector"/>
    <path class="scale"/>
    <g class="ticks"></g>
    <path class="base" d="M44 196 H176"/>
    <line class="line" x1="44" y1="196"/>
    <g class="head" transform="translate(4 178)">
      <path d="M14 30 V22 C6 20 2 13 4 6 C6 0 13 -3 19 -1 C24 1 26 6 25 11 L27 15 L24 16 V20 C24 22 21 23 18 22"/>
      <circle cx="22" cy="8" r="3"/><path d="M19 8 H12"/>
    </g>
    <circle class="pivot" cx="44" cy="196" r="3.2"/>
    <g class="grip"><rect x="-8" y="-12" width="16" height="24" rx="3"/><path d="M-4 -2 L0 -7 L4 -2 Z M-4 2 L0 7 L4 2 Z"/></g>
    <text class="val"></text>
  </svg>

  <p class="state">state <b>rest</b></p>
  <a class="back-pill" href="week-04.html" hidden>&larr; Week 04</a>
  <script>
  // State readout: rest / hover / pressed / drag, so the three brief states can be seen.
  const stateEl = document.querySelector('.state b');
  function track(el) {
    let hover = false, pressed = false, drag = false;
    const show = () => {
      el.classList.toggle('is-hover', hover && !pressed);
      el.classList.toggle('is-pressed', pressed && !drag);
      el.classList.toggle('is-dragging', drag);
      if (stateEl) stateEl.textContent = drag ? 'drag' : pressed ? 'pressed' : hover ? 'hover' : 'rest';
    };
    el.addEventListener('pointerenter', () => { hover = true; show(); });
    el.addEventListener('pointerleave', () => { hover = false; show(); });
    return {
      down() { pressed = true; drag = false; show(); },
      move() { if (pressed && !drag) { drag = true; show(); } },
      up() { pressed = false; drag = false; show(); },
    };
  }
  // A horizontal slider. opts: min, max, step, value, format(v), render(v, t), [fromPointer(e, rect, v0, x0)]
  function slider(el, opts) {
    const { min, max } = opts; const step = opts.step || 0;
    let v = opts.value, x0 = 0, v0 = 0;
    const st = track(el);
    const snap = n => { n = Math.min(max, Math.max(min, n)); if (step) n = Math.round((n - min) / step) * step + min; return +n.toFixed(4); };
    const set = n => {
      v = snap(n);
      el.setAttribute('aria-valuenow', v);
      el.setAttribute('aria-valuetext', opts.format(v));
      opts.render(v, (v - min) / (max - min));
    };
    const fromX = e => {
      const r = (opts.hit || el).getBoundingClientRect();
      if (opts.relative) return v0 - (e.clientX - x0) / opts.relative;   // px per unit, dragging the track itself
      return min + (e.clientX - r.left) / r.width * (max - min);
    };
    el.setAttribute('aria-valuemin', min); el.setAttribute('aria-valuemax', max);
    el.addEventListener('pointerdown', e => {
      el.setPointerCapture(e.pointerId);
      x0 = e.clientX; v0 = v; st.down();
      if (!opts.relative) set(fromX(e));
    });
    el.addEventListener('pointermove', e => {
      if (!el.hasPointerCapture(e.pointerId)) return;
      if (Math.abs(e.clientX - x0) > 2) st.move();
      set(fromX(e));
    });
    const end = e => { if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId); st.up(); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', e => {
      const k = step || (max - min) / 100, big = (max - min) / 10;
      const map = { ArrowRight: v + k, ArrowUp: v + k, ArrowLeft: v - k, ArrowDown: v - k, PageUp: v + big, PageDown: v - big, Home: min, End: max };
      if (e.key in map) { e.preventDefault(); set(map[e.key]); }
    });
    set(v);
    return { set, get: () => v };
  }
  if (window.top === window) document.querySelector('.back-pill').hidden = false;

  // The fan pivots on the eye. The angle line is the slider; the lit sector is where the display sits, up to 70 degrees.
  const fan = document.querySelector('.fan'), CX = 44, CY = 196, R = 168, TOP = 70;
  const P = (deg, r = R) => [CX + Math.cos(deg * Math.PI / 180) * r, CY - Math.sin(deg * Math.PI / 180) * r];
  const [ax, ay] = P(0), [bx, by] = P(TOP);
  fan.querySelector('.scale').setAttribute('d', `M${ax} ${ay} A${R} ${R} 0 0 0 ${bx} ${by}`);
  const ticks = fan.querySelector('.ticks');
  for (let d = 0; d <= 60; d += 10) {
    const [x0, y0] = P(d, R - 9), [x1, y1] = P(d), [tx, ty] = P(d, R - 24);
    ticks.insertAdjacentHTML('beforeend', `<line class="tick" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/><text class="tl" x="${tx}" y="${ty + 4}" text-anchor="middle">${d}°</text>`);
  }
  const st = track(fan); let v = 20;
  const set = n => {
    v = Math.round(Math.min(60, Math.max(0, n)));
    fan.setAttribute('aria-valuenow', v); fan.setAttribute('aria-valuetext', `${v} degrees`);
    const [x, y] = P(v), [sx, sy] = P(TOP);
    fan.querySelector('.sector').setAttribute('d', `M${CX} ${CY} L${x} ${y} A${R} ${R} 0 0 0 ${sx} ${sy} Z`);
    const ln = fan.querySelector('.line'); ln.setAttribute('x2', x); ln.setAttribute('y2', y);
    fan.querySelector('.grip').setAttribute('transform', `translate(${x} ${y}) rotate(${-v})`);
    const [lx, ly] = P(v, R + 18); const t = fan.querySelector('.val'); t.setAttribute('x', lx); t.setAttribute('y', ly + 10); t.textContent = v + '°';
  };
  const fromE = e => {
    const pt = fan.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(fan.getScreenCTM().inverse());
    return Math.atan2(CY - p.y, p.x - CX) * 180 / Math.PI;
  };
  fan.setAttribute('aria-valuemin', 0); fan.setAttribute('aria-valuemax', 60);
  fan.addEventListener('pointerdown', e => { fan.setPointerCapture(e.pointerId); st.down(); set(fromE(e)); });
  fan.addEventListener('pointermove', e => { if (!fan.hasPointerCapture(e.pointerId)) return; st.move(); set(fromE(e)); });
  ['pointerup', 'pointercancel'].forEach(t => fan.addEventListener(t, () => st.up()));
  fan.addEventListener('keydown', e => {
    const m = { ArrowUp: v + 1, ArrowRight: v + 1, ArrowDown: v - 1, ArrowLeft: v - 1, PageUp: v + 10, PageDown: v - 10, Home: 0, End: 60 };
    if (e.key in m) { e.preventDefault(); set(m[e.key]); }
  });
  set(v);

  </script>
</body>
</html>
