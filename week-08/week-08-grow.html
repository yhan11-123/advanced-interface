<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 08 sketch &middot; Grow</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="week-08-sketch.css?v=1" />
  <style>
  /* Grow: after a studio's navigation on pale mint: a row of separate black blocks with barely rounded
     corners (a "GI." mark, About in grey, a client name, a joined block of two sections). Pressed, the
     client block grows, out to both sides and up and down, into a black panel listing the work, its
     neighbours pushed aside, the list arriving line by line.
       Work (primary)      that block: a press grows it into the list of projects and a second press (or
                           Escape) folds it back down, the list leaving first
       About (secondary)   grey words; on hover they whiten and the block draws a breath, widening; a press
                           pinches it narrow
       Contact (tertiary)  an outline block; on hover black drops down inside it like a shutter
       Group               one joined block; the picked section is white, and a thin white bar slides under it */
  :root { --w: 860px; --h: 440px; --mint: #f3faf4; interpolate-size: allow-keywords; }
  body { background: var(--mint); font: 500 18px/1 "Hanken Grotesk", -apple-system, system-ui, sans-serif; color: #fff; }
  .stage { display: grid; place-content: center; gap: 70px; justify-items: center; }
  .row { display: flex; align-items: center; gap: 5px; height: 300px; }
  button:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
  .blk { background: #000; border-radius: 3px; }
  .logo { display: grid; place-items: center; width: 64px; height: 64px; font-weight: 700; }
  .ic { width: 18px; height: 18px; }

  /* Work: grows into a list */
  .work { position: relative; overflow: hidden; width: fit-content; height: 64px; transition: width .55s cubic-bezier(.7, 0, .2, 1), height .55s cubic-bezier(.7, 0, .2, 1) .08s; }
  .work.is-open { width: 250px; height: 290px; transition: width .5s cubic-bezier(.7, 0, .2, 1), height .6s cubic-bezier(.7, 0, .2, 1) .1s; }
  .work .tg { display: flex; min-width: 100%; align-items: center; justify-content: center; gap: 10px; height: 64px; padding: 0 22px; white-space: nowrap; transition: color .3s, height .5s cubic-bezier(.7, 0, .2, 1); }
  .work.is-open .tg { height: 46px; justify-content: flex-start; color: #fff; }
  .work .tg:hover { color: #fff; }
  .work .tg.is-down { color: #9a9a9a; }
  .work ul { margin: 0; padding: 0 22px 18px; list-style: none; font-size: 14px; line-height: 1; color: #8a8a8a; }
  .work li { padding: 5px 0; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s, color .15s; transition-delay: calc((9 - var(--k)) * 12ms); }
  .work.is-open li { opacity: 1; transform: none; transition: opacity .3s, transform .4s var(--glide), color .15s; transition-delay: calc(260ms + var(--k) * 35ms); }
  .work li:hover { color: #fff; }
  .work li.cur { color: #fff; }
  .stage[data-content="icon"] .work:not(.is-open) { width: 64px; }
  .stage[data-content="icon"] .work .tg { padding: 0; }

  /* About: breathes */
  .ab { display: inline-flex; align-items: center; gap: 9px; height: 64px; padding: 0 30px; color: #8c8c8c; transition: color .3s, padding .45s var(--glide); }
  .ab:hover, .ab:focus-visible { color: #fff; padding: 0 40px; }
  .ab.is-down { padding: 0 22px; transition-duration: .12s; }
  .stage[data-content="icon"] .ab, .stage[data-content="icon"] .ab:hover { width: 64px; padding: 0; justify-content: center; }

  /* Contact: a shutter */
  .ctc { position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 9px; height: 64px; padding: 0 28px; border: 1.5px solid #000; border-radius: 3px; color: #000; overflow: hidden; transition: color .25s; }
  .ctc::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #000; transform: scaleY(0); transform-origin: top; transition: transform .4s cubic-bezier(.7, 0, .2, 1); }
  .ctc:hover, .ctc:focus-visible { color: #fff; }
  .ctc:hover::before, .ctc:focus-visible::before { transform: none; }
  .ctc.is-down { transform: translateY(2px); }
  .stage[data-content="icon"] .ctc { width: 64px; padding: 0; justify-content: center; }

  .row button:disabled, .work:has(.tg:disabled) { opacity: .3; }

  /* group: joined block, a bar under the pick */
  .grp { position: relative; display: flex; padding: 0 12px; background: #000; border-radius: 3px; }
  .grp .r { position: relative; display: inline-flex; align-items: center; gap: 9px; height: 64px; padding: 0 16px; color: #7d7d7d; transition: color .3s; }
  .grp .r:hover { color: #cfcfcf; }
  .grp .r[aria-checked="true"] { color: #fff; }
  .grp .r:disabled { color: #3a3a3a; }
  .stage[data-content="icon"] .grp .r { width: 52px; padding: 0; justify-content: center; }
  .bar { position: absolute; left: 0; bottom: 14px; width: 0; height: 2px; background: #fff; transition: left .5s cubic-bezier(.7, 0, .2, 1), width .5s cubic-bezier(.7, 0, .2, 1); }
  </style>
</head>
<body>
  <a class="back-pill" href="week-08.html#ideation" hidden>&larr; Week 08</a>
  <div class="stage" data-content="both">
    <div class="row">
      <div class="blk logo" aria-hidden="true">Gl.</div>
      <button class="blk ab" type="button" data-name="About" data-off><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5M12 8v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="lbl">About</span></button>
      <div class="blk work" id="work">
        <button class="tg" type="button" aria-expanded="false" aria-controls="work-list" data-name="Ariana Grande" data-off><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="lbl">Ariana Grande</span></button>
        <ul id="work-list" aria-label="Projects">
          <li style="--k:0">Savage x Fenty</li><li style="--k:1">Fenty x Puma</li><li style="--k:2">Book of HOV</li><li style="--k:3" class="cur">Ariana Grande</li><li style="--k:4">Swarovski</li><li style="--k:5">Byredo</li><li style="--k:6">Prada Sport</li><li style="--k:7">Moncler</li><li style="--k:8">71 Gin</li>
        </ul>
      </div>
      <button class="ctc" type="button" data-name="Contact" data-off><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="lbl">Contact</span></button>
    </div>
    <div class="grp" role="radiogroup" aria-label="Section">
      <button class="r" type="button" role="radio" aria-checked="true" data-name="Brand Strategy"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="lbl">Brand Strategy</span></button>
      <button class="r" type="button" role="radio" aria-checked="false" data-name="Campaign"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4l12 5V5zM16 9h3v6h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="lbl">Campaign</span></button>
      <button class="r" type="button" role="radio" aria-checked="false" data-name="Film" data-off><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="1.6"/></svg><span class="lbl">Film</span></button>
      <span class="bar" aria-hidden="true"></span>
    </div>
  </div>
  <script src="week-08-sketch.js?v=1"></script>
  <script>
    // Work grows into its list; press again or Escape to fold it back
    const work = document.getElementById('work'), tg = work.querySelector('.tg');
    const set = open => { work.classList.toggle('is-open', open); tg.setAttribute('aria-expanded', String(open)); };
    tg.addEventListener('click', () => set(!work.classList.contains('is-open')));
    addEventListener('keydown', e => { if (e.key === 'Escape' && work.classList.contains('is-open')) { set(false); tg.focus(); } });
    M.stage.addEventListener('off', e => { if (e.detail) set(false); });

    const grp = document.querySelector('.grp'), bar = grp.querySelector('.bar');
    // the bar sits under the picked section's words and slides to the next
    const place = () => { const c = grp.querySelector('[aria-checked=true]'), pad = M.stage.dataset.content === 'icon' ? 14 : 16; bar.style.left = (c.offsetLeft + pad) + 'px'; bar.style.width = (c.offsetWidth - pad * 2) + 'px'; };
    grp.addEventListener('pick', place);
    M.stage.addEventListener('content', () => { const t0 = performance.now(); const loop = t => { place(); if (t - t0 < 800) requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
    bar.style.transition = 'none'; place(); void bar.offsetWidth; bar.style.transition = ''; document.fonts.ready.then(place);
  </script>
</body>
</html>
