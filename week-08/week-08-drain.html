<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 08 sketch &middot; Drain</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&display=swap" />
  <link rel="stylesheet" href="week-08-sketch.css?v=1" />
  <style>
  /* Drain: after a coral disc with a plus cut out of it on flat blue. Pressed, the coral drains out of the
     disc like a clock hand sweeping round, leaving only its ring, while the plus turns and loses its
     upright to become a minus; pressed again, the ring fills back round the same way.
       Add (primary)     the whole button is that disc: a toggle that drains to an outline with a minus
                         (Added) and fills back round to a plus
       Save (secondary)  a soft coral tint; on hover a solid coral bar wipes across it from the left; a
                         press squeezes it
       Skip (tertiary)   coral words led by a dot; on hover the dot runs out under the word into a line;
                         a press makes the line jump
       Group             coral rings; the pick is filled: the old one drains back round while the new one
                         fills round, a beat later */
  @property --sweep { syntax: "<angle>"; inherits: false; initial-value: 360deg; }
  :root { --w: 760px; --h: 420px; --coral: #f85c5c; --blue: #4056b2; }
  body { background: var(--blue); font: 600 18px/1 "Rubik", -apple-system, system-ui, sans-serif; color: var(--coral); }
  .stage { display: grid; place-content: center; gap: 60px; justify-items: center; }
  .row { display: flex; align-items: center; gap: 28px; }
  button:focus-visible { outline: 2.5px solid #fff; outline-offset: 5px; }
  .ic { width: 22px; height: 22px; }

  /* Add: drains and fills like a clock */
  .ad { --sweep: 360deg; display: inline-flex; align-items: center; gap: 10px; height: 64px; padding: 0 30px 0 22px; border-radius: 32px; color: var(--blue);
    background: conic-gradient(var(--coral) var(--sweep), transparent 0); box-shadow: inset 0 0 0 3px var(--coral);
    transition: --sweep .7s cubic-bezier(.6, 0, .3, 1), color .3s .2s, transform var(--snap-t) var(--snap); }
  .ad .ic { width: 26px; height: 26px; }
  .ad .ic path { stroke: currentColor; stroke-width: 4; stroke-linecap: butt; }
  .ad .up { transform-origin: 12px 12px; transition: transform .6s cubic-bezier(.6, 0, .3, 1); }
  .ad[aria-pressed="true"] { --sweep: 0deg; color: var(--coral); }
  .ad[aria-pressed="true"] .up { transform: rotate(90deg) scaleY(0); }
  .ad.is-down { transform: scale(.95); transition: --sweep .7s cubic-bezier(.6, 0, .3, 1), color .3s .2s, transform .1s; }
  .ad:hover { box-shadow: inset 0 0 0 3px var(--coral), 0 0 0 5px rgba(248,92,92,.25); }
  .stage[data-content="icon"] .ad { width: 64px; padding: 0; justify-content: center; }
  .stage[data-content="text"] .ad { padding: 0 30px; }

  /* Save: a bar wipes across */
  .sv { position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 28px; overflow: hidden;
    background: rgba(248,92,92,.22); transition: color .25s, transform var(--snap-t) var(--snap); }
  .sv::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--coral); transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.6, 0, .2, 1); }
  .sv:hover, .sv:focus-visible { color: var(--blue); }
  .sv:hover::before, .sv:focus-visible::before { transform: none; }
  .sv.is-down { transform: scale(.94, 1.04); transition-duration: .1s; }
  .stage[data-content="icon"] .sv { width: 56px; padding: 0; justify-content: center; }

  /* Skip: the dot runs out into a line */
  .sk { position: relative; display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 4px 0 18px; }
  .sk::before { content: ""; position: absolute; left: 2px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 4px; background: var(--coral);
    transition: width .45s cubic-bezier(.6, 0, .2, 1), top .3s cubic-bezier(.6, 0, .2, 1), height .3s; }
  .sk:hover::before, .sk:focus-visible::before { width: calc(100% - 4px); top: calc(100% - 12px); height: 3px; }
  .sk.is-down::before { top: calc(100% - 18px); transition-duration: .1s; }
  .stage[data-content="icon"] .sk { width: 56px; padding: 0; justify-content: center; }
  .stage[data-content="icon"] .sk::before { display: none; }

  .row button:disabled { opacity: .4; }
  .row button:disabled::before { transform: none; display: none; }

  /* group: rings that drain and fill */
  .grp { display: flex; gap: 16px; }
  .grp .r { --sweep: 0deg; display: inline-flex; align-items: center; gap: 9px; height: 54px; padding: 0 22px 0 16px; border-radius: 27px; font-size: 16px; color: var(--coral);
    background: conic-gradient(var(--coral) var(--sweep), transparent 0); box-shadow: inset 0 0 0 2.5px var(--coral);
    transition: --sweep .55s cubic-bezier(.6, 0, .3, 1), color .25s; }
  .grp .r[aria-checked="true"] { --sweep: 360deg; color: var(--blue); transition: --sweep .6s cubic-bezier(.6, 0, .3, 1) .15s, color .25s .35s; }
  .grp .r:hover:not([aria-checked="true"]) { --sweep: 40deg; }
  .grp .r:disabled { opacity: .4; }
  .grp .r .ic { width: 20px; height: 20px; }
  .stage[data-content="icon"] .grp .r { width: 54px; padding: 0; justify-content: center; }
  .stage[data-content="text"] .grp .r { padding: 0 22px; }
  </style>
</head>
<body>
  <a class="back-pill" href="week-08.html#ideation" hidden>&larr; Week 08</a>
  <div class="stage" data-content="both">
    <div class="row">
      <button class="ad" type="button" aria-pressed="false" data-name="Add" data-off><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/><path class="up" d="M12 4v16"/></svg><span class="lbl">Add</span></button>
      <button class="sv" type="button" data-name="Save" data-off><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span class="lbl">Save</span></button>
      <button class="sk" type="button" data-name="Skip" data-off><span class="lbl">Skip</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="grp" role="radiogroup" aria-label="Portion">
      <button class="r" type="button" role="radio" aria-checked="true" data-name="One"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg><span class="lbl">One</span></button>
      <button class="r" type="button" role="radio" aria-checked="false" data-name="Two"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="3.2" fill="currentColor"/><circle cx="16" cy="12" r="3.2" fill="currentColor"/></svg><span class="lbl">Two</span></button>
      <button class="r" type="button" role="radio" aria-checked="false" data-name="Family" data-off><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.8" fill="currentColor"/><circle cx="12" cy="12" r="2.8" fill="currentColor"/><circle cx="18" cy="12" r="2.8" fill="currentColor"/></svg><span class="lbl">Family</span></button>
    </div>
  </div>
  <script src="week-08-sketch.js?v=1"></script>
  <script>
    const ad = document.querySelector('.ad');
    ad.addEventListener('click', () => {
      const on = ad.getAttribute('aria-pressed') !== 'true';
      ad.setAttribute('aria-pressed', String(on));
      ad.querySelector('.lbl').textContent = on ? 'Added' : 'Add'; ad.dataset.name = on ? 'Added' : 'Add';
      if (M.stage.dataset.content === 'icon') ad.setAttribute('aria-label', ad.dataset.name);
    });
  </script>
</body>
</html>
