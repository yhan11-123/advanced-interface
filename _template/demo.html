<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 00 demo</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />
  <style>
    /* This page is the week's experiment. Nothing here can affect any other
       week, because each demo is its own separate page. */
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #111; color: #eee;
    }
    .stage { text-align: center; }
    h1 { font-weight: 600; letter-spacing: -0.02em; }

    .back-pill {
      position: fixed; left: 12px; bottom: 12px; z-index: 9999;
      font: 12px/1 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.65);
      padding: 8px 12px; border-radius: 999px; text-decoration: none;
    }
    .back-pill:hover { background: rgba(0,0,0,.85); }
  </style>
</head>
<body>

  <main class="stage">
    <h1>Week demo</h1>
    <p>Replace this page with the experiment.</p>
  </main>

  <a class="back-pill" href="index.html" hidden>&larr; Back to the week</a>

  <script>
    // Show the back link only when this page is open on its own.
    if (window.self === window.top) {
      document.querySelector('.back-pill').removeAttribute('hidden');
    }
  </script>

</body>
</html>
